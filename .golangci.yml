version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - errchkjson
    - errorlint
    - godoclint
    - godot
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - revive
    - loggercheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
      # Whether a nolint directive is "used" varies with the golangci/gosec
      # version (local vs the dagger go module's pinned image), so unused
      # directives cannot be reported stably across environments.
      allow-unused: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    # Agent worktrees are throwaway checkouts of this same repo. Linting them
    # duplicates every finding, and a worktree deleted between runs leaves the
    # cache pointing at files that no longer exist, which breaks the
    # generated-file filter (see .discobox/hooks/90-review-lint.sh).
    # Matches any agent following the convention (.claude, .codex, .cursor, ...);
    # scoped to dot-directories so a real "worktrees" package is still linted.
    paths:
      - (^|/)\.[^/]+/worktrees/
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Explicit: the common-false-positives preset excludes G115 in newer
      # golangci-lint versions but not in all older ones; pin the behavior so
      # local and containerized (dagger) lint agree regardless of version.
      - text: "G115:"
        linters:
          - gosec
      # The G70x taint-analysis family (path traversal, SSRF, ...) only fires
      # in some gosec versions; excluded for the same cross-version parity
      # reason.
      - text: "G70[0-9]:"
        linters:
          - gosec
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        text: "G306:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - (^|/)\.[^/]+/worktrees/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

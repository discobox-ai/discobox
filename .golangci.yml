version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - errchkjson
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - loggercheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        text: "G306:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

HookStatus:
  type: object
  required: [hook, status, paused, run_count, fail_count, updated_at]
  properties:
    hook:
      $ref: '#/Hook'
    config_hash:
      type: string
    status:
      $ref: '#/Status'
    paused:
      type: boolean
    run_count:
      type: integer
      format: int64
    fail_count:
      type: integer
      format: int64
    last_run_id:
      type: string
    last_error:
      type: string
    updated_at:
      type: string
      format: date-time
Hook:
  type: object
  required: [id, name, type, engine, abs_path, rel_path]
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    type:
      $ref: '#/HookType'
    engine:
      $ref: '#/HookEngine'
    run_as:
      $ref: '#/RunAs'
    blocking:
      type: boolean
    pattern:
      type: string
    ignore:
      type: array
      items:
        type: string
    phase:
      type: string
    subagent:
      type: string
    language_id:
      type: string
    min_severity:
      type: string
    prompt:
      type: string
    abs_path:
      type: string
    rel_path:
      type: string
    has_shebang:
      type: boolean
    executable:
      type: boolean
    extensions:
      type: object
      additionalProperties: true
HookType:
  type: string
  enum: [session, file, pre-commit]
HookEngine:
  type: string
  enum: [script, ai, lsp, builtin]
RunAs:
  type: string
  enum: [user, root]
Status:
  type: string
  enum: [idle, queued, running, success, failure]
Event:
  type: object
  required: [id, type, created_at]
  properties:
    id:
      type: string
    type:
      type: string
    hook_id:
      type: string
    run_id:
      type: string
    message:
      type: string
    details:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time

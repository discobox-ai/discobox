PingResponse:
  type: object
  required: [ok, session_id, version]
  properties:
    ok:
      type: boolean
    session_id:
      type: string
    version:
      type: integer
      format: int64
StatusResponse:
  type: object
  required: [session_id, repo_root, paused, running, queued, hooks, updated_at]
  properties:
    session_id:
      type: string
    repo_root:
      type: string
    paused:
      type: boolean
    running:
      type: boolean
    queued:
      type: integer
    hooks:
      type: array
      items:
        $ref: './model/core.yaml#/HookStatus'
    updated_at:
      type: string
      format: date-time
WaitResponse:
  type: object
  required: [settled, running, queued, pending_changes, pending_snapshot, pending_lsp, hooks, updated_at]
  properties:
    settled:
      type: boolean
    running:
      type: boolean
    queued:
      type: integer
    pending_changes:
      type: boolean
    pending_snapshot:
      type: boolean
    pending_lsp:
      type: boolean
    hooks:
      type: array
      items:
        $ref: './model/core.yaml#/HookStatus'
    updated_at:
      type: string
      format: date-time
HooksResponse:
  type: object
  required: [hooks]
  properties:
    hooks:
      type: array
      items:
        $ref: './model/core.yaml#/HookStatus'
EventsResponse:
  type: object
  required: [events]
  properties:
    events:
      type: array
      items:
        $ref: './model/core.yaml#/Event'
ChangedFile:
  type: object
  required: [path, kind]
  properties:
    path:
      type: string
    kind:
      type: string
Run:
  type: object
  required: [id, hook_id, status, exit_code, started_at]
  properties:
    id:
      type: string
    invocation_id:
      type: string
    hook_id:
      type: string
    status:
      $ref: './model/core.yaml#/Status'
    exit_code:
      type: integer
    changed_files:
      type: array
      items:
        $ref: '#/ChangedFile'
    change_ids:
      type: array
      items:
        type: string
    error:
      type: string
    started_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
ObservedFileChange:
  type: object
  required: [id, path, kind, created_at]
  properties:
    id:
      type: string
    path:
      type: string
    kind:
      type: string
    base_commit:
      type: string
    diff:
      type: string
    created_at:
      type: string
      format: date-time
SnapshotOmission:
  type: object
  required: [path, kind, reason]
  properties:
    path:
      type: string
    kind:
      type: string
    reason:
      type: string
    size_bytes:
      type: integer
      format: int64
    limit_bytes:
      type: integer
      format: int64
WorkspaceSnapshot:
  type: object
  required: [id, patch_bytes, max_file_bytes, created_at]
  properties:
    id:
      type: string
    parent_id:
      type: string
    base_commit:
      type: string
    tree_hash:
      type: string
    patch:
      type: string
    patch_bytes:
      type: integer
      format: int64
    changed_files:
      type: array
      items:
        $ref: '#/ChangedFile'
    omitted_files:
      type: array
      items:
        $ref: '#/SnapshotOmission'
    max_file_bytes:
      type: integer
      format: int64
    observed_change_ids:
      type: array
      items:
        type: string
    created_at:
      type: string
      format: date-time
QueuedHook:
  type: object
  required: [hook_id, position, blocked, created_at, updated_at]
  properties:
    hook_id:
      type: string
    position:
      type: integer
      format: int64
    changed_files:
      type: array
      items:
        $ref: '#/ChangedFile'
    change_ids:
      type: array
      items:
        type: string
    blocked:
      type: boolean
    blocked_by_hook_id:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
Diagnostic:
  type: object
  required: [id, hook_id, path, severity, message, start_line, start_col, end_line, end_col, updated_at]
  properties:
    id:
      type: string
    hook_id:
      type: string
    uri:
      type: string
    path:
      type: string
    severity:
      type: string
    source:
      type: string
    code:
      type: string
    message:
      type: string
    start_line:
      type: integer
    start_col:
      type: integer
    end_line:
      type: integer
    end_col:
      type: integer
    updated_at:
      type: string
      format: date-time
RunsResponse:
  type: object
  required: [runs]
  properties:
    runs:
      type: array
      items:
        $ref: '#/Run'
ChangesResponse:
  type: object
  required: [changes]
  properties:
    changes:
      type: array
      items:
        $ref: '#/ObservedFileChange'
SnapshotsResponse:
  type: object
  required: [snapshots]
  properties:
    snapshots:
      type: array
      items:
        $ref: '#/WorkspaceSnapshot'
QueueResponse:
  type: object
  required: [queue]
  properties:
    queue:
      type: array
      items:
        $ref: '#/QueuedHook'
DiagnosticsResponse:
  type: object
  required: [diagnostics]
  properties:
    diagnostics:
      type: array
      items:
        $ref: '#/Diagnostic'
ExecutionPatchRequest:
  type: object
  required: [paused]
  properties:
    paused:
      type: boolean
ExecutionResponse:
  type: object
  required: [paused]
  properties:
    paused:
      type: boolean
RunRequest:
  type: object
  properties:
    force:
      type: boolean
    phase:
      type: string
RunResponse:
  type: object
  required: [enqueued, hook_id]
  properties:
    enqueued:
      type: boolean
    skipped:
      type: boolean
    reason:
      type: string
    hook_id:
      type: string
OutputResponse:
  type: object
  required: [hook_id, output]
  properties:
    hook_id:
      type: string
    output:
      type: string
ShutdownResponse:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
ErrorResponse:
  type: object
  properties:
    error:
      type: string
    message:
      type: string

# discobox-wire.service on a machine sandbox (ADR 26-11-02-023 §3), which its
# pool places as a drop-in and a container's never does. A machine has no
# config volume: its volumes and sources are mounted from its own
# /.discobox/data and /.discobox/cache wherever its pool placed the bootstrap,
# on every boot, since a machine's mounts do not survive a restart either. A
# failure powers it off, which the pool reports as a stopped sandbox, the way
# it reports an exited container: a machine has no manager to exit, and one
# that booted on without its mounts would start its provider's services on
# the bare paths.
#
# After the roots' own mounts where a driver attached volumes there, so
# nothing is moved onto the disk a volume then covers.
#
# The agent is the sandbox's pin, which may predate mounting a machine's
# volumes: asked whether it mounts them, an agent that does answers at once,
# and one that does not ignores the question and runs its own wire, which on
# a machine either fails -- skipping the unit, as before this drop-in -- or
# does what it did before.
[Unit]
ConditionPathExists=
ConditionPathExists=/etc/discobox/sandbox.json
RequiresMountsFor=/.discobox/data /.discobox/cache
FailureAction=poweroff-force

[Service]
ExecCondition=/opt/discobox/current/features/core/discobox-sandbox-agent wire --can-mount-machine

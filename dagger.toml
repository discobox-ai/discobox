# CI and release graph. Native macOS/Windows workers are explicit stubs.
[modules.pipeline]
source = ".dagger/modules/pipeline"
main = true

[modules.go-sdk]
source = "github.com/dagger/go-sdk@v1.1.0"

[sdks.go]
module = "go-sdk"

[sdks.go.scopes.".dagger/modules/pipeline"]
is-module = true
name = "pipeline"

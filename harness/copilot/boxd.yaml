# The copilot harness image (Dockerfile beside this file) as a boxd machine
# image, for disco-vm (github.com/discobox-ai/vm), built FROM
# sandbox-agent/boxd.yaml. The build context is this directory, as it is for
# the Dockerfile:
#
#   disco-vm --driver boxd build -t discobox/copilot -f harness/copilot/boxd.yaml harness/copilot
#
# The Dockerfile's twin; change the two together. Its label is a file under
# /usr/local/share/discobox/labels, as sandbox-agent/boxd.yaml explains.
from:
  image: discobox/sandbox-agent
shell: ["/bin/bash", "-o", "pipefail", "-c"]
resources:
  cpus: 4
  memory: 16GiB
layers:
  - name: harness
    steps:
      - run: |
          set -eux
          npm install -g @github/copilot
          rm -rf /root/.npm
          install -d -m 0755 /usr/local/libexec/discobox /etc/github-copilot/policy.d
      - copy: {src: ., dst: /var/tmp/discobox-harness}
      - run: |
          set -eux
          s=/var/tmp/discobox-harness
          jq -c . $s/image.json > /usr/local/share/discobox/labels/io.discobox.image.v1
          install -m 0644 $s/agent.conf /usr/local/libexec/discobox/agent.conf
          install -m 0644 $s/hooks.json /etc/github-copilot/policy.d/discobox.json
          install -m 0755 $s/configure.sh /usr/local/libexec/discobox/configure-copilot
          install -m 0755 $s/launch.sh /usr/local/bin/discobox-harness-run
          install -m 0755 $s/prompt.sh /usr/local/bin/discobox-prompt
          rm -rf $s

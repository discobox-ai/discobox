# Codex system configuration layer (/etc/codex/config.toml), baked into the
# harness image. It sits below ${CODEX_HOME}/config.toml, so anything the user
# sets during configure — or inside a sandbox — wins over these defaults.
#
# The sandbox is the isolation boundary, so Codex's own approval prompts and
# inner sandbox would only be guarding a machine that exists to be written to,
# and would stop an unattended run dead. This mirrors the Claude Code image's
# `permissions.defaultMode: bypassPermissions` baseline.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Discobox uses the primary terminal's OSC title as the sandbox display name.
# Codex 0.150+ gives a new thread a provisional title from its first prompt,
# then asynchronously replaces it with a generated title. Activity keeps the
# terminal title visibly current while Codex is working.
[tui]
terminal_title = ["activity", "thread-title"]

# Consolidate useful facts from completed sessions into CODEX_HOME/memories.
# The harness launcher links that directory to the primary source's durable
# data without sharing auth, configuration, sessions, or SQLite state.
[features]
memories = true

[memories]
generate_memories = true
use_memories = true
min_rate_limit_remaining_percent = 0

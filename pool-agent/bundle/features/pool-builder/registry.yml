# Pool build-output registry. This is a store, not a cache: builds push their
# results here and sandboxes pull them back, replacing `--load`'s whole-image
# tarball with a content-addressed transfer (ADR 0030 decision 11).
#
# Caching *upstream* pulls is a different job and belongs to the proxy
# (decision 12), so nothing here is configured as a pull-through mirror —
# proxy mode would also disable push, which is the one thing this must do.
#
# Storage root and listen address are overridden per pool by
# /etc/discobox/registry.env, which pool-agent renders.
version: 0.1
log:
  level: info
  formatter: text
storage:
  filesystem:
    rootdirectory: /var/lib/discobox/registry
  delete:
    enabled: true
  # No blob descriptor cache. The pool agent empties this storage while the
  # registry runs when it clears the pool's caches, and a cached descriptor
  # would go on answering that a deleted blob exists: a push then skips
  # uploading the layer and publishes a manifest naming content that is gone.
  # Every stat goes to the filesystem instead, which on local disk is cheap.
http:
  # The pool's loopback alone: buildkitd pushes here, and a sandbox reaches it
  # only through the registry front its proxy forwards to (ADR 26-10-29-160).
  addr: 127.0.0.1:5000
  # Its clients name it two ways — buildkitd by this address, a sandbox as
  # registry.discobox.internal — so an upload's Location names no host.
  relativeurls: true
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

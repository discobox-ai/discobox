# A Docker pool's builder (ADR 0044) beside its agent: the pool-shared
# BuildKit, the registry its builds push to, the mediator that binds a build to
# the sandbox that asked for it, and discobox-pool-runc. It runs no dockerd:
# the pool's container has its daemon's socket bound in at
# /var/run/docker.sock, which its sandboxes run on, so the base's
# socket-activated one cannot listen.
#
# The build puts the binaries under bin/ (pool-agent/Dockerfile's bundle
# stage): BuildKit's and the registry's from their upstream images, so the set
# stays what those projects ship and test together.
apiVersion: discobox.ai/provision/v1
requires: [pool-agent]
steps:
  - name: link
    run: link.sh
  - name: registry-config
    file: {path: /etc/discobox/registry.yml, source: registry.yml, restart: [discobox-registry.service]}

  - name: unit-buildkitd
    file: {path: /etc/systemd/system/discobox-buildkitd.service, source: systemd/discobox-buildkitd.service, restart: [discobox-buildkitd.service]}
  - name: unit-registry
    file: {path: /etc/systemd/system/discobox-registry.service, source: systemd/discobox-registry.service, restart: [discobox-registry.service]}
  - name: unit-mediator
    file: {path: /etc/systemd/system/discobox-buildkit-mediator.service, source: systemd/discobox-buildkit-mediator.service, restart: [discobox-buildkit-mediator.service]}

  - name: restart
    run: restart.sh
    inputs: [bin]
  - name: units
    systemd:
      enable: [discobox-buildkitd.service, discobox-registry.service, discobox-buildkit-mediator.service]

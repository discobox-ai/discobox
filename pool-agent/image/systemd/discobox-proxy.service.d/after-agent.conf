# Installed only where the agent is a unit (pool-agent/boxd.yaml). A container's
# agent writes the proxy's environment, CA bundle and control key before
# systemd exists; in a machine systemd is up first, so the proxy waits for the
# agent to say it has written them, and does not start when the agent's start
# fails. Stopping or restarting the agent's unit does the same to the proxy.
#
# Requisite, not Requires or BindsTo: either of those asks for the agent to be
# started whenever the proxy is, and the agent's unit starts the proxy, so an
# agent failing before it was ready was started again at once, many times a
# second, around its own RestartSec.
[Unit]
Requisite=discobox-pool-agent.service
PartOf=discobox-pool-agent.service
After=discobox-pool-agent.service

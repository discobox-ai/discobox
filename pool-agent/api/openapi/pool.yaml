components:
    schemas:
        HarnessConfigFile:
            additionalProperties: false
            properties:
                content:
                    type: string
                path:
                    type: string
                createOnly:
                    type: boolean
                template:
                    description: Render file content against the public sandbox configuration before writing
                    type: boolean
            required:
            - path
            - content
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        "$ref": "#/components/schemas/ErrorDetail"
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    "$ref": "#/components/schemas/GitSourceCheckout"
                cacheKey:
                    description: The key of this pool's Git cache a cache-delivered source is delivered into. The source's namespace in it is the sandbox id and the source slug.
                    minLength: 1
                    type: string
                delivery:
                    description: How the source reaches the sandbox. cache is a namespace of this pool's Git cache named by cacheKey, which a client delivers into and the sandbox clones. clone and push are sources delivered before that. clone is fetched by the sandbox from url; push is a bare repository made for the sandbox, which the client pushes into. Defaults to clone.
                    enum:
                    - clone
                    - push
                    - cache
                    type: string
                dataKey:
                    description: Opaque stable key for durable pool-local data shared by sandboxes using this source.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                destination:
                    "$ref": "#/components/schemas/GitSourceDestination"
                kind:
                    enum:
                    - git
                    type: string
                localDirectory:
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                upstreamUrl:
                    description: The source's own remote. A cache-delivered source's checkout has it as origin. A source delivered before that has it as a remote named upstream, and its branch tracks origin, the pool.
                    type: string
                url:
                    format: uri
                    type: string
                workspace:
                    "$ref": "#/components/schemas/GitSourceWorkspace"
            required:
            - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    type: string
                refName:
                    type: string
                refType:
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    type: string
                workingDirectory:
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    type: string
                mode:
                    default: clean
                    enum:
                    - clean
                    - dirty
                    type: string
                snapshotRef:
                    type: string
            type: object
        HarnessSecret:
            additionalProperties: false
            description: A credential the harness declares. The sandbox reads this for delivery alone -- a file-delivered secret must not also be exported as an environment variable.
            properties:
                name:
                    type: string
                required:
                    type: boolean
                oneOfGroup:
                    type: string
                delivery:
                    description: env (default) exports the variable named by name; file withholds that export because the harness reads the credential from an installed file.
                    type: string
            required:
                - name
            type: object
        SentinelRoute:
            additionalProperties: false
            description: Where a secret may be sent (ADR 26-10-02-924). A host covers itself and every host beneath it; a path is a prefix matched on whole segments.
            properties:
                host:
                    type: string
                path:
                    type: string
                useId:
                    description: The use a request on this route is judged against; empty sends it unjudged
                    type: string
            required:
                - host
            type: object
        Gateway:
            additionalProperties: false
            description: One of the sandbox's project's gateways (ADR 26-10-16-470), as proxy/gateway.Route reads it. A request beneath match is forwarded to target, with match's path replaced by target's, once every other policy has judged it as the sandbox sent it.
            properties:
                name:
                    type: string
                match:
                    type: string
                target:
                    type: string
                requestHeaders:
                    $ref: '#/components/schemas/GatewayHeaderModifier'
            required:
                - name
                - match
                - target
            type: object
        GatewayHeaderModifier:
            additionalProperties: false
            description: Headers a gateway removes, then sets, then adds.
            properties:
                remove:
                    items:
                        type: string
                    type: array
                set:
                    items:
                        $ref: '#/components/schemas/GatewayHeader'
                    type: array
                add:
                    items:
                        $ref: '#/components/schemas/GatewayHeader'
                    type: array
            type: object
        GatewayHeader:
            additionalProperties: false
            description: One header a gateway sets or adds. Exactly one of value and env is given; env names a server environment variable the proxy asks the control plane for, never its value.
            properties:
                name:
                    type: string
                value:
                    type: string
                env:
                    type: string
            required:
                - name
            type: object
        HarnessVolume:
            additionalProperties: false
            description: An image-declared path the sandbox-agent wires from a primary volume during boot.
            properties:
                path:
                    type: string
                volume:
                    enum:
                    - data
                    - cache
                    type: string
                scope:
                    description: Who a cache path is shared with. Absent means the sandbox user, which is the safe default; shared puts every sandbox in the pool on one directory and is only valid for cache.
                    enum:
                    - user
                    - shared
                    type: string
                excludeFromExport:
                    description: The path's backing directory stays out of an export. Absent means it travels; only valid for data.
                    type: boolean
                uid:
                    type: string
                gid:
                    type: string
                mode:
                    type: string
            required:
            - path
            - volume
            type: object
        ResolvedHarnessConfig:
            additionalProperties: false
            properties:
                files:
                    items:
                        "$ref": "#/components/schemas/HarnessConfigFile"
                    nullable: true
                    type: array
                configuredFiles:
                    items:
                        "$ref": "#/components/schemas/HarnessConfigFile"
                    nullable: true
                    type: array
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                runCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                relaunchCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                configCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                env:
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
                volumes:
                    items:
                        "$ref": "#/components/schemas/HarnessVolume"
                    nullable: true
                    type: array
                secrets:
                    items:
                        "$ref": "#/components/schemas/HarnessSecret"
                    nullable: true
                    type: array
                additionalGroups:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
            - id
            - name
            type: object
        SandboxConfig:
            additionalProperties: false
            properties:
                harnessConfigId:
                    type: string
                harnessMode:
                    description: What this sandbox exists for, carried through to its sandbox configuration; judge is the project's judge.
                    enum:
                        - run
                        - config
                        - judge
                    type: string
                model:
                    type: string
                modelReasoningLevel:
                    type: string
                modelServiceTier:
                    type: string
                description:
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                git:
                    "$ref": "#/components/schemas/SandboxGitIdentity"
                skills:
                    additionalProperties:
                        "$ref": "#/components/schemas/SandboxSkill"
                    type: object
                skillsSources:
                    description: Directories of skills sources whose skills the sandbox links into the harness's skill directories on its first launch, in order (ADR 26-10-14-294). Each names a sourceCodeReferences key.
                    items:
                        "$ref": "#/components/schemas/SandboxSkillsSource"
                    type: array
                features:
                    description: The repository's features by name, as the client read them from its settings.json; the sandbox provisions every one but those turned off (ADR 26-10-16-423 §4).
                    additionalProperties:
                        "$ref": "#/components/schemas/SandboxFeature"
                    type: object
                image:
                    type: string
                imageDigest:
                    description: Config digest the image must resolve to. The runtime runs this image and replaces a container built from any other, so a moved tag never silently changes a running sandbox.
                    type: string
                start:
                    description: |-
                        Whether creating the container should also bring it up. True for a sandbox being
                        created for the first time, because asking for a sandbox means asking for one that
                        runs. False for a rebuild after the container was lost: recovery restores what
                        exists, and starting is left to whoever actually wants it.
                    type: boolean
                specFingerprint:
                    description: |-
                        Digest of the whole sandbox spec this container must be built from.
                        The runtime records it as a container label and rebuilds any container whose label
                        no longer matches, so image upgrades and every other spec change are one mechanism
                        rather than a growing list of per-field comparisons.
                    type: string
                name:
                    type: string
                prompt:
                    items:
                        type: string
                    type: array
                source:
                    "$ref": "#/components/schemas/GitSource"
                sourceCodeReferences:
                    additionalProperties:
                        "$ref": "#/components/schemas/GitSource"
                    type: object
                user:
                    "$ref": "#/components/schemas/SandboxUser"
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                env:
                    additionalProperties:
                        type: string
                    type: object
                image:
                    type: string
                workingDirectory:
                    type: string
            type: object
        SandboxUser:
            additionalProperties: false
            description: |-
                Run identity and group membership, forwarded to the sandbox unresolved.
                Names and any field the request omitted are resolved inside the sandbox,
                which is the only place its passwd and group files exist.
            properties:
                additionalGroups:
                    description: Supplementary groups, each a group name or a numeric GID.
                    items:
                        type: string
                    type: array
                gid:
                    format: int64
                    type: integer
                groupName:
                    description: Primary group by name. Mutually exclusive with gid.
                    type: string
                homeDirectory:
                    type: string
                name:
                    type: string
                uid:
                    format: int64
                    type: integer
            type: object
        SandboxGitIdentity:
            additionalProperties: false
            description: |-
                Git authorship identity, forwarded to the sandbox verbatim. Authorship, not
                run identity: see SandboxUser for the account a process runs as.
            properties:
                userEmail:
                    type: string
                userName:
                    type: string
            type: object
        SandboxFeature:
            additionalProperties: false
            properties:
                enabled:
                    description: Whether the sandbox provisions the feature.
                    type: boolean
            required:
            - enabled
            type: object
        SandboxSkillsSource:
            additionalProperties: false
            properties:
                directory:
                    description: The directory inside the source's checkout that holds the skills, or . for its root.
                    minLength: 1
                    type: string
                source:
                    description: The sourceCodeReferences key of the skills source.
                    minLength: 1
                    type: string
            required:
            - source
            - directory
            type: object
        SandboxSkill:
            additionalProperties: false
            description: One skill the sandbox was created with, by content, forwarded into its bootstrap verbatim.
            properties:
                files:
                    items:
                        "$ref": "#/components/schemas/SandboxSkillFile"
                    type: array
                skill:
                    type: string
            required:
                - skill
            type: object
        SandboxSkillFile:
            additionalProperties: false
            properties:
                content:
                    format: byte
                    type: string
                executable:
                    type: boolean
                path:
                    type: string
            required:
                - path
                - content
            type: object
        EgressPolicy:
            additionalProperties: false
            description: |-
                A sandbox's effective egress policy (ADR 26-10-01-032), merged by the
                control plane. Unrestricted when denyByDefault is false, and allow is then
                ignored; restricted, the sandbox reaches only the allow entries, so an
                empty list reaches nothing. Entries are domain patterns, IPs, or CIDRs.
            properties:
                allow:
                    items:
                        type: string
                    nullable: true
                    type: array
                denyByDefault:
                    type: boolean
            type: object
        BundlePin:
            additionalProperties: false
            description: A bundle a sandbox is pinned to (ADR 26-10-16-423 §§7, 13), as the asset API addresses it.
            properties:
                kind:
                    description: Which bundle of the sandbox this is. The platform's is the one whose agent layer the pool places in the sandbox before each start.
                    enum:
                    - platform
                    - harness
                    type: string
                name:
                    description: The bundle's name, the last component of its reference's repository, which the server's asset routes and assets.discobox.internal address it by.
                    type: string
                digest:
                    description: The manifest or index digest the sandbox is pinned to.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
            required:
            - kind
            - name
            - digest
            type: object
        PoolSandboxCreateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxCreateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                bundles:
                    description: The bundles the sandbox is pinned to, each by kind. The pool records them, replacing what an earlier create recorded, and assets.discobox.internal answers the sandbox only manifests and blobs they reach. Absent or empty is none.
                    items:
                        $ref: '#/components/schemas/BundlePin'
                    nullable: true
                    type: array
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                egress:
                    "$ref": "#/components/schemas/EgressPolicy"
                    description: The sandbox's effective egress policy, recorded with the pool proxy before the container is built so it is in force from the sandbox's first request. Absent means unrestricted.
                provisionEgress:
                    "$ref": "#/components/schemas/EgressPolicy"
                    description: The egress policy of every level but the sandbox's own -- its project's, its pool's and its harness config's (ADR 26-10-01-032) -- which provisioning the sandbox's platform and harness on no sandbox's behalf runs under, as a snapshot is built (ADR 26-10-16-423 §8). Absent means unrestricted.
                gateways:
                    description: The sandbox's project's gateways (ADR 26-10-16-470), recorded with the pool proxy beside the egress policy. Absent or empty is none.
                    items:
                        $ref: '#/components/schemas/Gateway'
                    nullable: true
                    type: array
                resolvedHarnessConfig:
                    "$ref": "#/components/schemas/ResolvedHarnessConfig"
                sandboxId:
                    type: string
                sentinels:
                    description: Sentinel placeholder values injected into this sandbox. The pool registers them with the proxy so their real secret values are swapped at runtime.
                    items:
                        type: string
                    nullable: true
                    type: array
                sentinelRoutes:
                    description: Routes keyed by stable sentinel, for an injected secret that carries routes (ADR 26-10-02-924). Every request carrying such a sentinel must fall on one, and is judged when the most specific routes it falls on all carry a use.
                    additionalProperties:
                        items:
                            $ref: '#/components/schemas/SentinelRoute'
                        type: array
                    nullable: true
                    type: object
                secretEnv:
                    description: Secret-bound environment variable name to sentinel placeholder value. Delivered to the sandbox through a channel separate from sandbox.json (docs/adr/0012 section 3), independently refreshed as secrets rotate.
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
            required:
            - sandboxId
            - config
            type: object
        PoolSandboxInstance:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxInstance.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                resolvedHarnessConfig:
                    "$ref": "#/components/schemas/ResolvedHarnessConfig"
                runtime:
                    "$ref": "#/components/schemas/PoolSandboxRuntime"
                sandboxId:
                    type: string
            required:
            - sandboxId
            - config
            - runtime
            type: object
        PoolDNSAuditQuery:
            additionalProperties: false
            description: |-
                One DNS query a sandbox asked of its pool, which answered it over the
                sandbox's mTLS channel and audited it beside its HTTP (ADR 0148).
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolDNSAuditQuery.json
                    format: uri
                    readOnly: true
                    type: string
                answers:
                    description: The answers' data -- addresses, and the names aliases and pointers lead to; free-text records are left out
                    items:
                        type: string
                    type: array
                createdAt:
                    description: When the query was asked
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the pool took to answer, in milliseconds
                    format: int64
                    type: integer
                error:
                    description: Why there was no answer, when there was none
                    type: string
                id:
                    description: Audit record ID, written dns_<row>, unique within this pool and ordered by write
                    pattern: ^dns_[0-9]+$
                    type: string
                name:
                    description: The name asked, lowercased and without the trailing dot
                    type: string
                rcode:
                    description: The answer's response code as DNS tools print it (NOERROR, NXDOMAIN, SERVFAIL, ...); empty when there was no answer
                    type: string
                sandboxId:
                    description: Sandbox whose client certificate asked
                    type: string
                type:
                    description: The record type asked for (A, AAAA, ...)
                    type: string
            required:
            - id
            - createdAt
            - sandboxId
            - name
            - type
            - rcode
            - answers
            type: object
        PoolDNSAuditResponse:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolDNSAuditResponse.json
                    format: uri
                    readOnly: true
                    type: string
                queries:
                    description: Matching queries, newest first
                    items:
                        "$ref": "#/components/schemas/PoolDNSAuditQuery"
                    type: array
            required:
            - queries
            type: object
        PoolHTTPAuditExchange:
            additionalProperties: false
            description: |-
                One HTTP exchange the pool proxy audited. The URL, host and
                method are what a sandbox sent; headers and bodies stay on the pool.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolHTTPAuditExchange.json
                    format: uri
                    readOnly: true
                    type: string
                blocked:
                    description: True when the proxy refused the request itself and never sent it -- by its destination policy, by the credential judge, at the discobox API's gate, or because the control plane could not resolve a credential it carries. blockedReason says which, and why.
                    type: boolean
                blockedReason:
                    description: Why the request was refused. It starts with what refused it -- "host denied" for the destination policy, "judge:" for the credential judge, "gate:" for the discobox API's gate, "credential unavailable:" for a credential the control plane could not resolve, "gateway:" for a gateway that could not set its headers -- then the reason.
                    type: string
                cacheHit:
                    description: True when the response came from the pool's response cache
                    type: boolean
                createdAt:
                    description: When the exchange was recorded
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the exchange took, in milliseconds
                    format: int64
                    type: integer
                host:
                    description: Destination host
                    type: string
                id:
                    description: Audit record ID, written http_<row>, unique within this pool and ordered by write
                    pattern: ^http_[0-9]+$
                    type: string
                method:
                    description: HTTP method
                    type: string
                requestBodyBytes:
                    description: Size of the recorded request body
                    format: int64
                    type: integer
                responseBytes:
                    description: Size of the response body
                    format: int64
                    type: integer
                sandboxId:
                    description: Sandbox whose client certificate made the request
                    type: string
                status:
                    description: Response status; zero when no response was received
                    type: integer
                swappedSecretIds:
                    description: Secrets whose values were swapped into this request, by ID, whatever kind of sentinel stood in for them. It is optional because a pool agent older than ADR 26-10-01-240 does not send it, and absent means no secret was named.
                    items:
                        type: string
                    type: array
                swappedUseIds:
                    description: Approved credential uses whose sentinels were swapped into this request
                    items:
                        type: string
                    type: array
                upgrade:
                    description: True for an upgraded (e.g. WebSocket) connection
                    type: boolean
                upgradeType:
                    description: The upgrade protocol
                    type: string
                url:
                    description: Request URL, with any swapped query value left as its sentinel
                    type: string
            required:
            - id
            - createdAt
            - sandboxId
            - method
            - url
            - host
            - status
            - blocked
            - swappedUseIds
            type: object
        PoolHTTPAuditExchangeDetail:
            additionalProperties: false
            description: |-
                One audited HTTP exchange in full: every field the pool proxy's recorder
                wrote about it. Headers are stored already redacted, so a
                credential swapped into a request is never in one. The bodies and the
                upgraded stream themselves stay on the pool and are read through the
                artifact route.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolHTTPAuditExchangeDetail.json
                    format: uri
                    readOnly: true
                    type: string
                appliedHeaders:
                    description: Header names the gateway removed, set, or added; their values are redacted from requestHeaders
                    items:
                        type: string
                    type: array
                appliedPattern:
                    description: The match of the gateway the request fell under (ADR 26-10-16-470)
                    type: string
                appliedRuleId:
                    description: The name of the project gateway the request fell under (ADR 26-10-16-470); url is still what the sandbox sent, and forwardedUrl where the gateway sent it
                    type: string
                forwardedUrl:
                    description: Where the gateway the request fell under sent it (ADR 26-10-16-470); absent when none did
                    type: string
                blocked:
                    description: True when the proxy refused the request itself and never sent it -- by its destination policy, by the credential judge, at the discobox API's gate, or because the control plane could not resolve a credential it carries. blockedReason says which, and why.
                    type: boolean
                blockedReason:
                    description: Why the request was refused. It starts with what refused it -- "host denied" for the destination policy, "judge:" for the credential judge, "gate:" for the discobox API's gate, "credential unavailable:" for a credential the control plane could not resolve, "gateway:" for a gateway that could not set its headers -- then the reason.
                    type: string
                cacheError:
                    description: Why the response cache could not be used
                    type: string
                cacheHit:
                    description: True when the response came from the pool's response cache
                    type: boolean
                cacheKey:
                    description: Key the response cache stored or looked up under
                    type: string
                cacheStored:
                    description: True when the response was written to the cache
                    type: boolean
                createdAt:
                    description: When the exchange happened, stamped as it ended
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the exchange took, in milliseconds
                    format: int64
                    type: integer
                enqueuedAt:
                    description: When the recorder queued the row; its distance from createdAt is the recorder's lag
                    format: date-time
                    type: string
                host:
                    description: Destination host
                    type: string
                id:
                    description: Audit record ID, written http_<row>, unique within this pool and ordered by write
                    pattern: ^http_[0-9]+$
                    type: string
                method:
                    description: HTTP method
                    type: string
                requestBodyBytes:
                    description: Size of the recorded request body
                    format: int64
                    type: integer
                requestBodyError:
                    description: Why the request body was not recorded in full
                    type: string
                requestBodyFormat:
                    description: How the request body was spooled
                    type: string
                requestBodyRecorded:
                    description: True when a request body was spooled and can be read
                    type: boolean
                requestHeaders:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: Request headers as recorded, with sensitive and swapped ones already redacted
                    type: object
                responseBodyError:
                    description: Why the response body was not recorded in full
                    type: string
                responseBodyFormat:
                    description: How the response body was spooled
                    type: string
                responseBodyRecorded:
                    description: True when a response body was spooled and can be read
                    type: boolean
                responseBytes:
                    description: Size of the response body
                    format: int64
                    type: integer
                responseHeaders:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: Response headers as recorded
                    type: object
                sandboxId:
                    description: Sandbox whose client certificate made the request
                    type: string
                status:
                    description: Response status; zero when no response was received
                    type: integer
                streamDroppedBytes:
                    description: Upgraded stream bytes the recorder dropped under load
                    format: int64
                    type: integer
                streamDroppedChunks:
                    description: Upgraded stream chunks the recorder dropped under load
                    format: int64
                    type: integer
                streamFormat:
                    description: How the upgraded stream was spooled
                    type: string
                streamRecorded:
                    description: True when an upgraded stream was spooled and can be read
                    type: boolean
                streamSessionId:
                    description: The upgraded stream's session
                    type: string
                swappedSecretIds:
                    description: Secrets whose values were swapped into this request, by ID, whatever kind of sentinel stood in for them. It is optional because a pool agent older than ADR 26-10-01-240 does not send it, and absent means no secret was named.
                    items:
                        type: string
                    type: array
                swappedUseIds:
                    description: Approved credential uses whose sentinels were swapped into this request
                    items:
                        type: string
                    type: array
                upgrade:
                    description: True for an upgraded (e.g. WebSocket) connection
                    type: boolean
                upgradeC2sBytes:
                    description: Bytes the sandbox sent over the upgraded connection
                    format: int64
                    type: integer
                upgradeS2cBytes:
                    description: Bytes the upstream sent over the upgraded connection
                    format: int64
                    type: integer
                upgradeType:
                    description: The upgrade protocol
                    type: string
                url:
                    description: Request URL, with any swapped query value left as its sentinel
                    type: string
                writtenAt:
                    description: When the recorder wrote the row, which is when it became readable
                    format: date-time
                    type: string
            required:
            - id
            - createdAt
            - sandboxId
            - method
            - url
            - host
            - status
            - blocked
            - swappedUseIds
            - requestHeaders
            - responseHeaders
            - appliedHeaders
            type: object
        PoolHTTPAuditResponse:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolHTTPAuditResponse.json
                    format: uri
                    readOnly: true
                    type: string
                exchanges:
                    description: Matching exchanges, newest first
                    items:
                        "$ref": "#/components/schemas/PoolHTTPAuditExchange"
                    type: array
            required:
            - exchanges
            type: object
        PoolClearCacheResponse:
            additionalProperties: false
            description: |-
                The outcome of clearing the pool's caches. The agent answers only
                once they are empty, so this is a confirmation rather than an
                acceptance.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolClearCacheResponse.json
                    format: uri
                    readOnly: true
                    type: string
                stoppedSandboxIds:
                    description: Sandboxes that were running and were stopped so the caches could be cleared. Nothing is started again afterwards.
                    items:
                        type: string
                    type: array
            required:
                - stoppedSandboxIds
            type: object
        PoolSandboxListResponse:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxListResponse.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    items:
                        "$ref": "#/components/schemas/PoolSandboxInstance"
                    nullable: true
                    type: array
            required:
            - sandboxes
            type: object
        PoolSandboxPowerDownRequest:
            additionalProperties: false
            description: |-
                Asks the pool to power a sandbox down because the sandbox asked for
                it (ADR 26-10-16-337 §5). Unlike stop it is conditional: the pool
                confirms the reason with the sandbox under its power lock first,
                and refuses the instruction when the sandbox no longer confirms it.
            properties:
                reason:
                    description: |-
                        idle when the sandbox reported itself idle, which always
                        stops it; sleep when it reported a sleep request, which a
                        runtime that can freeze freezes and any other stops.
                    enum:
                    - idle
                    - sleep
                    type: string
            required:
            - reason
            type: object
        PoolSandboxPowerDownResult:
            additionalProperties: false
            description: |-
                The power-down was confirmed and carried out. It carries the
                sandbox's earliest pending wake, at which the control plane starts
                it again.
            properties:
                wakeAt:
                    description: When the sandbox asks to be started again. Absent when it has no pending wake.
                    format: date-time
                    type: string
                wake:
                    description: The file name of that wake. Text the sandbox chose.
                    type: string
            type: object
        PoolSandboxOperationAccepted:
            additionalProperties: false
            description: |-
                Acknowledges that a power instruction was accepted. It carries no
                state: what became of the instruction arrives on the agent's
                sandbox state-reporting channel.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxOperationAccepted.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxId:
                    description: Sandbox the instruction was accepted for
                    type: string
            required:
            - sandboxId
            type: object
        PoolSandboxRunning:
            additionalProperties: false
            description: Says the sandbox is running and its agent answers.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxRunning.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxId:
                    description: Sandbox that is running
                    type: string
            required:
            - sandboxId
            type: object
        PoolSandboxOperationRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxOperationRequest.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    type: boolean
            type: object
        PoolSyncRequest:
            additionalProperties: false
            description: The set of pools the control plane knows this host should have. The pool agent reaps the agent-created footprint of any other pool it observes.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSyncRequest.json
                    format: uri
                    readOnly: true
                    type: string
                knownPoolIds:
                    description: IDs of the pools that should exist on this host.
                    items:
                        type: string
                    type: array
            required:
                - knownPoolIds
            type: object
        PoolSandboxUpdateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxUpdateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxUpdateConfig"
                egress:
                    "$ref": "#/components/schemas/EgressPolicy"
                    description: Replacement effective egress policy, recorded with the pool proxy for a sandbox whose container exists; one with no container is answered not found and nothing is recorded, since its create carries the policy. This is how a policy change reaches a sandbox (ADR 26-10-01-032 §5); absent leaves the policy as it is.
                gateways:
                    description: Replacement gateways, sent with egress and recorded the same way (ADR 26-10-16-470 §5); absent leaves them as they are, and an empty list removes them.
                    items:
                        $ref: '#/components/schemas/Gateway'
                    nullable: true
                    type: array
                sentinels:
                    description: Replacement sentinel placeholder set for a running sandbox. The pool re-registers them with the proxy so newly bound secrets resolve without a restart.
                    items:
                        type: string
                    nullable: true
                    type: array
                sentinelRoutes:
                    description: Replacement routes keyed by stable sentinel, sent with sentinels and replacing the sandbox's whole map (ADR 26-10-02-924).
                    additionalProperties:
                        items:
                            $ref: '#/components/schemas/SentinelRoute'
                        type: array
                    nullable: true
                    type: object
                secretEnv:
                    description: Replacement secret-bound environment variable name to sentinel placeholder map for a running sandbox.
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
            type: object
        PoolSandboxPort:
            additionalProperties: false
            properties:
                containerPort:
                    format: int64
                    type: integer
                hostIp:
                    type: string
                hostPort:
                    format: int64
                    type: integer
                protocol:
                    type: string
            required:
            - containerPort
            - hostPort
            - hostIp
            - protocol
            type: object
        PoolSandboxRuntime:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                error:
                    type: string
                image:
                    type: string
                instanceId:
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    type: object
                ports:
                    items:
                        "$ref": "#/components/schemas/PoolSandboxPort"
                    nullable: true
                    type: array
                startedAt:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    type: string
                stoppedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
            - instanceId
            - status
            - image
            - createdAt
            - startedAt
            - stoppedAt
            - error
            - metadata
            - ports
            - env
            type: object
    securitySchemes:
        poolBearerAuth:
            bearerFormat: pool-local API token
            scheme: bearer
            type: http
info:
    title: Discobox Pool Agent
    version: 0.1.0
openapi: 3.0.3
paths:
    "/api/project/{projectId}/pool/{poolId}/sandboxes":
        get:
            operationId: pool-list-sandboxes
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxListResponse"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: List pool sandboxes
            tags:
            - Pool Sandboxes
        post:
            operationId: pool-create-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxCreateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Create pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}":
        delete:
            operationId: pool-delete-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '204':
                    description: |-
                        Confirmed: the container, its proxy material, and the sandbox's durable
                        data tree are all gone. The control plane deletes its row on the strength
                        of this response, so it is returned only once the removal has happened.
                        Keeping a sandbox's data is what archive is for.
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Delete pool sandbox
            tags:
            - Pool Sandboxes
        get:
            operationId: pool-get-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Get pool sandbox
            tags:
            - Pool Sandboxes
        patch:
            operationId: pool-update-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxUpdateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Update pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/archive":
        post:
            description: |-
                Tear the sandbox's runtime down and keep its data: remove the container and its
                proxy material, retain the durable data/config/secrets/sources tree, and mark it
                archived so the volume reaper leaves it alone and nothing starts it on demand. A
                later create against the retained tree unarchives it.
            operationId: pool-archive-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '204':
                    description: Confirmed - the runtime is gone and the data is retained
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Archive pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/ensure-running":
        post:
            operationId: pool-ensure-sandbox-running
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxRunning"
                    description: The sandbox is running and its agent answers
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            description: |-
                Starts the sandbox unless it is already running, and answers once the
                sandbox agent inside it answers. It is what the control plane calls
                before it forwards an action into a sandbox. Unlike the start
                instruction it does not answer for a container that is up while its
                agent is not, and a sandbox already running does not wait on the
                start gate. A sandbox with no container is a 409 of type
                sandbox-no-container, and an archived one a 409 of type
                sandbox-archived.
            summary: Ensure pool sandbox is running
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/start":
        post:
            operationId: pool-start-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '202':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxOperationAccepted"
                    description: Instruction accepted
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Start pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/power-down":
        post:
            description: |-
                Powers a sandbox down on its own request (ADR 26-10-16-337 §5).
                Under the sandbox's power lock the pool asks the sandbox to confirm
                the reason, fresh; a sandbox that is not running or does not
                confirm is refused with a 409 of type sandbox-power-down-refused,
                and nothing changes. A confirmed idle stops the sandbox; a
                confirmed sleep freezes it where the runtime can, which reports
                it suspended, and stops it otherwise.
            operationId: pool-power-down-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxPowerDownRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxPowerDownResult"
                    description: Powered down
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Power a pool sandbox down on its own request
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/suspend":
        post:
            description: |-
                Suspends a running sandbox: freezes it, keeping its memory and
                every process, until a start, or a use that starts it, thaws it
                (ADR 26-10-16-420 §3). It never stops the sandbox instead: a
                runtime that cannot freeze it answers with an error and changes
                nothing. A sandbox already suspended is accepted as it is; one that
                is not running is a 409 of type sandbox-not-running.
            operationId: pool-suspend-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '202':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxOperationAccepted"
                    description: Instruction accepted
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Suspend pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/stop":
        post:
            operationId: pool-stop-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '202':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxOperationAccepted"
                    description: Instruction accepted
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Stop pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/restart":
        post:
            operationId: pool-restart-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '202':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxOperationAccepted"
                    description: Instruction accepted
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Restart pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/cache/clear":
        post:
            operationId: pool-clear-cache
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolClearCacheResponse"
                    description: Cache cleared
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Stop every sandbox on the pool and empty its caches
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/audit/dns":
        get:
            description: |-
                The DNS queries the pool answered for its sandboxes, newest first,
                relayed from the proxy's loopback control API with a token the agent
                signs (ADR 0130 §4, ADR 0148). A request token that names a sandbox
                narrows the read to it, whatever sandboxId says.
            operationId: pool-list-dns-audit
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Only queries asked by this sandbox, which need not still exist
                in: query
                name: sandboxId
                schema:

components:
    schemas:
        HarnessConfigFile:
            additionalProperties: false
            properties:
                content:
                    type: string
                path:
                    type: string
                createOnly:
                    type: boolean
                template:
                    description: Render file content against the public sandbox configuration before writing
                    type: boolean
            required:
            - path
            - content
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        "$ref": "#/components/schemas/ErrorDetail"
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    "$ref": "#/components/schemas/GitSourceCheckout"
                delivery:
                    description: How the source reaches the sandbox. clone fetches from url or localDirectory; push initializes an empty repository for the client to push into. Defaults to clone.
                    enum:
                    - clone
                    - push
                    type: string
                destination:
                    "$ref": "#/components/schemas/GitSourceDestination"
                kind:
                    enum:
                    - git
                    type: string
                localDirectory:
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                url:
                    format: uri
                    type: string
                workspace:
                    "$ref": "#/components/schemas/GitSourceWorkspace"
            required:
            - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    type: string
                refName:
                    type: string
                refType:
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    type: string
                workingDirectory:
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    type: string
                mode:
                    default: clean
                    enum:
                    - clean
                    - dirty
                    type: string
                snapshotRef:
                    type: string
            type: object
        HarnessVolume:
            additionalProperties: false
            description: An image-declared path the sandbox-agent wires from a primary volume during boot.
            properties:
                path:
                    type: string
                volume:
                    enum:
                    - data
                    - cache
                    type: string
                uid:
                    type: string
                gid:
                    type: string
                mode:
                    type: string
            required:
            - path
            - volume
            type: object
        ResolvedHarnessConfig:
            additionalProperties: false
            properties:
                files:
                    items:
                        "$ref": "#/components/schemas/HarnessConfigFile"
                    nullable: true
                    type: array
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                runCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                relaunchCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                configCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                env:
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
                volumes:
                    items:
                        "$ref": "#/components/schemas/HarnessVolume"
                    nullable: true
                    type: array
                additionalGroups:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
            - id
            - name
            type: object
        SandboxConfig:
            additionalProperties: false
            properties:
                harnessConfigId:
                    type: string
                harnessMode:
                    enum:
                        - run
                        - config
                    type: string
                model:
                    type: string
                modelReasoningLevel:
                    type: string
                modelServiceTier:
                    type: string
                cpuVcpus:
                    format: double
                    type: number
                description:
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                image:
                    type: string
                memoryBytes:
                    format: int64
                    type: integer
                name:
                    type: string
                prompt:
                    items:
                        type: string
                    type: array
                source:
                    "$ref": "#/components/schemas/GitSource"
                sourceCodeReferences:
                    additionalProperties:
                        "$ref": "#/components/schemas/GitSource"
                    type: object
                storageBytes:
                    format: int64
                    type: integer
                user:
                    "$ref": "#/components/schemas/SandboxUser"
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                cpuVcpus:
                    format: double
                    type: number
                env:
                    additionalProperties:
                        type: string
                    type: object
                image:
                    type: string
                memoryBytes:
                    format: int64
                    type: integer
                storageBytes:
                    format: int64
                    type: integer
                workingDirectory:
                    type: string
            type: object
        SandboxUser:
            additionalProperties: false
            properties:
                gid:
                    format: int64
                    type: integer
                homeDirectory:
                    type: string
                name:
                    type: string
                uid:
                    format: int64
                    type: integer
            type: object
        PoolSandboxCreateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxCreateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                resolvedHarnessConfig:
                    "$ref": "#/components/schemas/ResolvedHarnessConfig"
                resources:
                    "$ref": "#/components/schemas/PoolSandboxResources"
                sandboxId:
                    type: string
                sentinels:
                    description: Sentinel placeholder values injected into this sandbox. The pool registers them with the proxy so their real secret values are swapped at runtime.
                    items:
                        type: string
                    nullable: true
                    type: array
                secretEnv:
                    description: Secret-bound environment variable name to sentinel placeholder value. Delivered to the sandbox through a channel separate from sandbox.json (docs/adr/0012 section 3), independently refreshed as secrets rotate.
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
            required:
            - sandboxId
            - config
            type: object
        PoolSandboxInstance:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxInstance.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                resolvedHarnessConfig:
                    "$ref": "#/components/schemas/ResolvedHarnessConfig"
                resources:
                    "$ref": "#/components/schemas/PoolSandboxResources"
                runtime:
                    "$ref": "#/components/schemas/PoolSandboxRuntime"
                sandboxId:
                    type: string
            required:
            - sandboxId
            - config
            - runtime
            type: object
        PoolSandboxListResponse:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxListResponse.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    items:
                        "$ref": "#/components/schemas/PoolSandboxInstance"
                    nullable: true
                    type: array
            required:
            - sandboxes
            type: object
        PoolSandboxOperationRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxOperationRequest.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    type: boolean
            type: object
        PoolSyncRequest:
            additionalProperties: false
            description: The set of pools the control plane knows this host should have. The pool agent reaps the agent-created footprint of any other pool it observes.
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSyncRequest.json
                    format: uri
                    readOnly: true
                    type: string
                knownPoolIds:
                    description: IDs of the pools that should exist on this host.
                    items:
                        type: string
                    type: array
            required:
                - knownPoolIds
            type: object
        PoolSandboxUpdateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolSandboxUpdateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxUpdateConfig"
                resources:
                    "$ref": "#/components/schemas/PoolSandboxResources"
                sentinels:
                    description: Replacement sentinel placeholder set for a running sandbox. The pool re-registers them with the proxy so newly bound secrets resolve without a restart.
                    items:
                        type: string
                    nullable: true
                    type: array
                secretEnv:
                    description: Replacement secret-bound environment variable name to sentinel placeholder map for a running sandbox.
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
            type: object
        PoolSandboxPort:
            additionalProperties: false
            properties:
                containerPort:
                    format: int64
                    type: integer
                hostIp:
                    type: string
                hostPort:
                    format: int64
                    type: integer
                protocol:
                    type: string
            required:
            - containerPort
            - hostPort
            - hostIp
            - protocol
            type: object
        PoolSandboxResources:
            additionalProperties: false
            properties:
                cpuCores:
                    format: double
                    type: number
                diskMb:
                    format: int64
                    type: integer
                memoryMb:
                    format: int64
                    type: integer
                timeoutSeconds:
                    format: int64
                    type: integer
            required:
            - memoryMb
            - cpuCores
            - diskMb
            - timeoutSeconds
            type: object
        PoolSandboxRuntime:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                error:
                    type: string
                image:
                    type: string
                instanceId:
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    type: object
                ports:
                    items:
                        "$ref": "#/components/schemas/PoolSandboxPort"
                    nullable: true
                    type: array
                startedAt:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    type: string
                stoppedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
            - instanceId
            - status
            - image
            - createdAt
            - startedAt
            - stoppedAt
            - error
            - metadata
            - ports
            - env
            type: object
    securitySchemes:
        poolBearerAuth:
            bearerFormat: pool-local API token
            scheme: bearer
            type: http
info:
    title: Discobox Pool Agent
    version: 0.1.0
openapi: 3.0.3
paths:
    "/api/project/{projectId}/pool/{poolId}/sandboxes":
        get:
            operationId: pool-list-sandboxes
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxListResponse"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: List pool sandboxes
            tags:
            - Pool Sandboxes
        post:
            operationId: pool-create-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxCreateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Create pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}":
        delete:
            operationId: pool-delete-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '204':
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Delete pool sandbox
            tags:
            - Pool Sandboxes
        get:
            operationId: pool-get-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Get pool sandbox
            tags:
            - Pool Sandboxes
        patch:
            operationId: pool-update-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxUpdateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Update pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/start":
        post:
            operationId: pool-start-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Start pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/sandboxes/{sandboxId}/stop":
        post:
            operationId: pool-stop-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSandboxOperationRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/PoolSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Stop pool sandbox
            tags:
            - Pool Sandboxes
    "/api/project/{projectId}/pool/{poolId}/pool-sync":
        post:
            operationId: pool-sync
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Pool ID
                in: path
                name: poolId
                required: true
                schema:
                    description: Pool ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/PoolSyncRequest"
                required: true
            responses:
                '204':
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   poolBearerAuth: []
            summary: Reconcile the set of pools this host should have, reaping any others
            tags:
            - Pool Sandboxes

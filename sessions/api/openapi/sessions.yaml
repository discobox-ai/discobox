openapi: 3.1.0
info:
  title: Discobox Sessions Daemon API
  version: 0.1.0
  description: Session-scoped coding-agent session daemon API served over HTTP on a Unix domain socket.
servers:
  - url: http://unix
paths:
  /ping:
    get:
      operationId: sessions-ping
      summary: Check daemon reachability and metadata.
      responses:
        '200':
          description: Daemon metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /status:
    get:
      operationId: sessions-status
      summary: Return daemon and coding-agent session status.
      responses:
        '200':
          description: Daemon status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /agents:
    get:
      operationId: sessions-agents
      summary: List supported coding agents and configured commands.
      responses:
        '200':
          description: Supported agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsResponse'
  /sessions:
    get:
      operationId: sessions-list
      summary: List coding-agent sessions.
      responses:
        '200':
          description: Session list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
    post:
      operationId: sessions-create
      summary: Create a coding-agent session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          description: Created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          $ref: '#/components/responses/Error'
  /sessions/{sessionId}/resize:
    post:
      operationId: sessions-resize
      summary: Resize a running coding-agent PTY.
      parameters:
        - $ref: '#/components/parameters/SessionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeRequest'
      responses:
        '200':
          description: Resize accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sessions/{sessionId}/signal:
    post:
      operationId: sessions-signal
      summary: Send a signal to a running coding-agent process.
      parameters:
        - $ref: '#/components/parameters/SessionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: Signal accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sessions/{sessionId}/attach:
    post:
      operationId: sessions-attach
      summary: Upgrade to a framed bidirectional attach stream.
      parameters:
        - $ref: '#/components/parameters/SessionIDPath'
      responses:
        '101':
          description: Switching protocols to discobox-session framed stream.
        '404':
          $ref: '#/components/responses/Error'
  /shutdown:
    post:
      operationId: sessions-shutdown
      summary: Request daemon shutdown.
      responses:
        '200':
          description: Shutdown accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResponse'
components:
  parameters:
    SessionIDPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Agent:
      type: object
      required: [id, name, command]
      properties:
        id:
          type: string
        name:
          type: string
        command:
          type: array
          items:
            type: string
        description:
          type: string
    Session:
      type: object
      required: [id, agentId, command, workdir, running, createdAt]
      properties:
        id:
          type: string
        agentId:
          type: string
        command:
          type: array
          items:
            type: string
        workdir:
          type: string
        pid:
          type: integer
        running:
          type: boolean
        exitCode:
          type: integer
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
    PingResponse:
      type: object
      required: [sessionId, repoRoot, version]
      properties:
        sessionId:
          type: string
        repoRoot:
          type: string
        version:
          type: integer
          format: int64
    StatusResponse:
      type: object
      required: [sessionId, repoRoot, version, sessions]
      properties:
        sessionId:
          type: string
        repoRoot:
          type: string
        version:
          type: integer
          format: int64
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    AgentsResponse:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    SessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    CreateRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
        args:
          type: array
          items:
            type: string
        workdir:
          type: string
        cols:
          type: integer
          minimum: 0
          maximum: 65535
        rows:
          type: integer
          minimum: 0
          maximum: 65535
    CreateResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/Session'
    ResizeRequest:
      type: object
      required: [cols, rows]
      properties:
        cols:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
    SignalRequest:
      type: object
      required: [signal]
      properties:
        signal:
          type: string
    ShutdownResponse:
      type: object
      required: [shutdown]
      properties:
        shutdown:
          type: boolean
    ActionResponse:
      type: object
      properties:
        resized:
          type: boolean
        signaled:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

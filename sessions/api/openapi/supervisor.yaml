openapi: 3.1.0
info:
  title: Discobox Sessions Supervisor API
  version: 0.1.0
  description: Per-session coding-agent supervisor API served over HTTP on a Unix domain socket.
servers:
  - url: http://unix
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: supervisor-status
      summary: Return coding-agent session status from the supervisor.
      responses:
        '200':
          description: Session status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /resize:
    post:
      operationId: supervisor-resize
      summary: Resize the supervised PTY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeRequest'
      responses:
        '200':
          description: Resize accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /signal:
    post:
      operationId: supervisor-signal
      summary: Send a signal to the supervised coding-agent process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: Signal accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /attach:
    post:
      operationId: supervisor-attach
      summary: Upgrade to a framed bidirectional attach stream.
      responses:
        '101':
          description: Switching protocols to discobox-session framed stream.
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Session:
      type: object
      required: [id, agentId, command, workdir, running, createdAt]
      properties:
        id:
          type: string
        agentId:
          type: string
        command:
          type: array
          items:
            type: string
        workdir:
          type: string
        pid:
          type: integer
        running:
          type: boolean
        exitCode:
          type: integer
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
    ResizeRequest:
      type: object
      required: [cols, rows]
      properties:
        cols:
          type: integer
          minimum: 0
          maximum: 65535
        rows:
          type: integer
          minimum: 0
          maximum: 65535
    SignalRequest:
      type: object
      required: [signal]
      properties:
        signal:
          type: string
    ActionResponse:
      type: object
      properties:
        resized:
          type: boolean
        signaled:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

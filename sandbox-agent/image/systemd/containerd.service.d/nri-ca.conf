[Unit]
# Pull discobox-nri-ca up alongside containerd and restart it if it dies,
# without making containerd itself depend on the plugin's success.
# containerd.service itself is never enabled at boot in this image; it starts
# lazily the first time something touches docker.socket, so this unit's
# activation rides that same on-demand chain. See docs/adr/0015 decision 6.
Upholds=discobox-nri-ca.service

[Service]
# Put discobox-runc ahead of the real runc, so every container containerd
# starts gets the sandbox's MITM CA bundles and proxy env injected into its OCI
# spec. This is the `docker run` path: containerd's shim invokes
# `runc create --bundle ...`.
#
# The dockerd unit carries the same drop-in for the `docker build` path, whose
# BuildKit executor invokes runc itself. Both are needed; neither covers the
# other. See the sandbox-agent/runcca package.
#
# PATH, rather than a docker `runtimes` entry in daemon.json, because BuildKit's
# executor ignores default-runtime and resolves runc from PATH.
Environment=PATH=/opt/discobox/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

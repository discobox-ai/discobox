[Unit]
# discobox-render-proxy-env.service derives this file from sandbox.json, which
# requires it to have already run. See that unit and the proxyenv package.
After=discobox-render-proxy-env.service

[Service]
# nix-daemon is the store's only writer: the `nix` a user runs evaluates and
# then hands every substitution and build to this process over
# /nix/var/nix/daemon-socket/socket (NIX_REMOTE=daemon). So the proxy env in
# the user's shell reaches the half of nix that needs no network, and none of
# the half that does — `nix develop` fails with "Could not resolve host:
# cache.nixos.org", the signature of a client that never consulted a proxy at
# all, from a process whose environment the user cannot see.
#
# Socket-activated by nix-daemon.socket, so like dockerd it inherits no
# container env; unlike dockerd it also needs the MITM bundle, which the same
# file carries as SSL_CERT_FILE — nix reads NIX_SSL_CERT_FILE, then
# SSL_CERT_FILE, before falling back to a fixed path list.
#
# The leading `-` makes it optional: a sandbox with no MITM proxy declares no
# proxy-trust vars, so the file is never written and nix-daemon starts
# unchanged.
EnvironmentFile=-/run/discobox/proxy/proxy.env

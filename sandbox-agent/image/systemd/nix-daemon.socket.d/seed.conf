[Unit]
# The vendored unit guards itself with
# `ConditionPathIsReadWrite=/nix/var/nix/daemon-socket`, which assumes the
# store the image installed is still sitting at /nix. It is not: the image
# ships it aside and leaves /nix empty for the pool-shared cache volume to bind
# over (ADR 0075), so the condition fails at boot and the socket is skipped.
# Nothing then creates the socket, so a nix client gets "cannot connect to
# socket at '/nix/var/nix/daemon-socket/socket'" and nothing can ever activate
# the daemon that would pull in the seed.
#
# An empty assignment resets the condition list. The socket is safe to bind on
# an empty /nix: systemd creates a unix socket's parent directories itself,
# with DirectoryMode=. That mkdir is the entire boot cost of keeping the store
# lazy -- the seed itself still waits for a client to connect.
#
# `RequiresMountsFor=/nix/store` needs no reset. It resolves to the mount that
# contains the path, which is the /nix cache bind the boot flow already made,
# and does not require the directory itself to exist.
ConditionPathIsReadWrite=

[Unit]
# Pull the nested-Docker-bridge proxy forwarder up alongside dockerd and
# restart it if it dies, without making dockerd depend on its success.
#
# This replaces the socket-activated, FreeBind pre-bound unit of docs/adr/0015
# decision 7, which only worked because daemon.json pinned a fixed "bip" for
# the forwarder to bind before docker0 existed. That pinned subnet claimed the
# same slice of RFC1918 space in every sandbox at every nesting level; dockerd
# now chooses its own, and the forwarder discovers it.
Upholds=discobox-proxy-bridge-docker.service

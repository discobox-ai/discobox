[Unit]
# Pull the nested-Docker-bridge proxy forwarder up alongside dockerd and
# restart it if it dies, without making dockerd depend on its success.
#
# Not the socket-activated, FreeBind pre-bound unit of docs/adr/0015 decision
# 7: that works only when daemon.json pins a fixed "bip" for the forwarder to
# bind before docker0 exists, and a pinned subnet claims the same slice of
# RFC1918 space in every sandbox at every nesting level. dockerd chooses its
# own (docs/adr/0020 §7), and the forwarder discovers it.
Upholds=discobox-proxy-bridge-docker.service

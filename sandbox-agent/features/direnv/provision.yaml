# direnv on every `cd`, in each shell the box ships: bash's login and
# interactive shells, zsh's, and nushell's (ADR 0138).
apiVersion: discobox.ai/provision/v1
async: true
# zsh's system-wide rc is its package's file, which the hook is added to.
requires: [shells-editors]
commands: [direnv]
steps:
  - name: packages
    packages:
      debian: [direnv]
  - name: profile
    file: {path: /etc/profile.d/sandbox-direnv.sh, source: profile.d/sandbox-direnv.sh}
  - name: nushell
    file: {path: /usr/local/share/nushell/vendor/autoload/discobox-direnv.nu, source: nushell-direnv.nu}
  - name: interactive-shells
    run: hook-shells.sh

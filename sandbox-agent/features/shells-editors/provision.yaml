# The shells a person may prefer (ADR 0138) and the editors and terminal
# tools of a working box: zsh, nushell, tmux and screen; vim, Neovim, and
# fresh, the editor the launcher's tools picker opens. The upstream builds
# are pinned, their version and checksums moving together.
apiVersion: discobox.ai/provision/v1
async: true
commands: [nvim, nu, fresh]
steps:
  - name: packages
    packages:
      debian: [screen, tmux, vim, zsh]
  # Neovim's official stable build: Debian stable holds an older release.
  - name: neovim
    download:
      path: /usr/local/lib/discobox/neovim
      unpack: {strip: 1}
      arch:
        amd64:
          url: https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          sha256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        arm64:
          url: https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-arm64.tar.gz
          sha256: 1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725
  # Nushell's static musl build, for the people whose $SHELL it is (ADR
  # 0138): Debian does not package it.
  - name: nushell
    download:
      path: /usr/local/lib/discobox/nushell
      # nu alone: the plugins beside it in the archive are 200MB nobody runs.
      unpack: {strip: 1, only: [nu]}
      arch:
        amd64:
          url: https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz
          sha256: 8a9722177ddd421eba927b4baae4ae341a4d1c3434504be7b1b17d998bafdd87
        arm64:
          url: https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-aarch64-unknown-linux-musl.tar.gz
          sha256: 86a869f44c2abd37f4a4c215af78c8da058812b76fa131476d28e62fc0262a91
  # fresh (getfresh.dev): its release's static musl build, not its install
  # script, which resolves the release itself and installs under $HOME.
  - name: fresh
    download:
      path: /usr/local/lib/discobox/fresh
      unpack: {strip: 1}
      arch:
        amd64:
          url: https://github.com/sinelaw/fresh/releases/download/v0.5.1/fresh-editor-x86_64-unknown-linux-musl.tar.gz
          sha256: 4dca3c7cbde55541f08e61126aa0f66e9d2c8b2b77d1d723177aeb24db9ca011
        arm64:
          url: https://github.com/sinelaw/fresh/releases/download/v0.5.1/fresh-editor-aarch64-unknown-linux-musl.tar.gz
          sha256: da3fdcb3cf07e5e043fb8c75289fd67f68a06651a37d34687649c591b7608cec
  # Each on the system PATH, and nu a login shell.
  - name: commands
    run: link-commands.sh
  # A first zsh that is usable as it is, rather than its new-user wizard.
  - name: zsh-newuser
    file: {path: /usr/share/zsh/scripts/newuser, source: zsh-newuser}
  # fresh, declared as a tool the CLI lists in `discobox tools` and the
  # launcher's picker, with the defaults it carries in (ADR 0125).
  - name: tool-fresh
    file: {path: /usr/local/share/discobox/tools/20-fresh.sh, source: tools/20-fresh.sh, mode: "0755"}
  - name: tool-fresh-config
    file: {path: /usr/local/share/discobox/tools/fresh/config.jsonc, source: tools/fresh/config.jsonc}
  - name: tool-fresh-live-diff
    file: {path: /usr/local/share/discobox/tools/fresh/live_diff.json, source: tools/fresh/live_diff.json}

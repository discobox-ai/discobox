# The discobox CLI, which a discobox calls the discobox API with through its
# pool, DISCOBOX_SERVER set by the pool (ADR 0140). The build puts the binary
# beside this file.
apiVersion: discobox.ai/provision/v1
async: true
requires: [core]
commands: [discobox]
steps:
  - name: binary
    check: check-cli.sh
    run: link-cli.sh

[Unit]
# The daemon cannot start before there is a store: the image ships its store
# aside at /usr/local/lib/discobox/nix and leaves /nix empty for the
# pool-shared cache volume, so nix-daemon's own ExecStart lives in a path that
# does not exist until the seed has run. See ADR 0075.
Requires=discobox-nix-seed.service
After=discobox-nix-seed.service

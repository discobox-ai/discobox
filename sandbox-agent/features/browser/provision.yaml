# Chromium, the box's browser: what a link opens, trusting the egress CA
# through the system store, with sign-in and the first-run noise turned off.
#
# On Debian it is Debian's Chromium. Ubuntu packages Chromium only as a snap,
# which does not run in a container, so on Ubuntu and what derives from it it
# is the Chrome for Testing build Playwright publishes, pinned, with a launcher
# of its own that behaves as Debian's does.
apiVersion: discobox.ai/provision/v1
commands: [chromium]
steps:
  # dbus-x11 is the session bus Chromium asks for: with nothing to satisfy
  # that, apt picks dbus-user-session, which brings pam_systemd into every
  # login, and the box's logind is masked. On Ubuntu, Chrome for Testing's
  # runtime libraries, as the build's deb.deps names them, under Ubuntu
  # 24.04's names (the t64 ones): it is the oldest Ubuntu this provisions.
  - name: packages
    packages:
      debian: [chromium, chromium-sandbox, dbus-x11, libnss3-tools, p11-kit-modules]
      ubuntu:
        - dbus-x11
        - fonts-liberation
        - libasound2t64
        - libatk-bridge2.0-0t64
        - libatk1.0-0t64
        - libatspi2.0-0t64
        - libcairo2
        - libcups2t64
        - libcurl4t64
        - libdbus-1-3
        - libexpat1
        - libgbm1
        - libglib2.0-0t64
        - libgtk-3-0t64
        - libnspr4
        - libnss3
        - libnss3-tools
        - libpango-1.0-0
        - libudev1
        - libvulkan1
        - libx11-6
        - libxcb1
        - libxcomposite1
        - libxdamage1
        - libxext6
        - libxfixes3
        - libxkbcommon0
        - libxrandr2
        - p11-kit-modules
        - xdg-utils
  # Bumped together: the version, both URLs and both checksums.
  - name: chromium
    when: {distro: [ubuntu]}
    download:
      path: /usr/local/lib/discobox/chromium
      unpack: {strip: 1}
      arch:
        amd64:
          url: https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux64/chrome-linux64.zip
          sha256: 43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79
        arm64:
          url: https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux-arm64/chrome-linux-arm64.zip
          sha256: 910a12fff6170202195f72ef3d353801c7063d301ab80b1f51b77d791fda60ce
  # What the unpacked build needs beside it, put back whenever a new build
  # replaced the directory: the setuid sandbox helper.
  - name: install
    when: {distro: [ubuntu]}
    check: install-check.sh
    run: install.sh
  - name: launcher
    when: {distro: [ubuntu]}
    file: {path: /usr/local/bin/chromium, source: chromium, mode: "0755"}
  - name: desktop-entry
    when: {distro: [ubuntu]}
    file: {path: /usr/share/applications/chromium.desktop, source: chromium.desktop}
  - name: nss-trust
    check: nss-trust-check.sh
    run: nss-trust.sh
  - name: default-browser
    run: default-browser.sh

  # Chromium's own scale, which it otherwise infers twice over.
  - name: flags-scale
    file: {path: /etc/chromium.d/discobox-scale, source: chromium.d/discobox-scale}
  - name: flags-sandbox
    file: {path: /etc/chromium.d/discobox-sandbox, source: chromium.d/discobox-sandbox}
  - name: flags-first-run
    file: {path: /etc/chromium.d/discobox-first-run, source: chromium.d/discobox-first-run}
  # Browser sign-in is turned off by machine policy: it could not work here,
  # since neither build has Google API keys, so there is no sync to sign in
  # to. Debian's Chromium reads policy under /etc/chromium, Chrome for Testing
  # under its own directory in /etc/opt; each is inert to the other.
  - name: policies
    file: {path: /etc/chromium/policies/managed/discobox.json, source: chromium-policies/discobox.json}
  - name: policies-cft
    when: {distro: [ubuntu]}
    file: {path: /etc/opt/chrome_for_testing/policies/managed/discobox.json, source: chromium-policies/discobox.json}
  # Chromium is what a link opens, by the XDG default-applications list. The
  # desktop's own list, Xfce's, says so too.
  - name: mimeapps
    file: {path: /etc/xdg/mimeapps.list, source: mimeapps.list}

[Service]
# The `docker build` half of the runc wrapper. dockerd's embedded BuildKit
# executor invokes runc directly from its own bundles under
# /var/lib/docker/buildkit/executor, bypassing both containerd's runtime
# handler and daemon.json's default-runtime, so putting the wrapper on
# containerd's PATH alone leaves every RUN step untrusted.
#
# Keep in step with containerd.service.d/runc-ca.conf. See the
# sandbox-agent/runcca package.
Environment=PATH=/opt/discobox/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

[Unit]
# discobox-render-proxy-env.service derives this file from sandbox.json, which
# requires it to have already run. See that unit and the proxyenv package.
After=discobox-render-proxy-env.service

[Service]
# dockerd resolves and pulls images itself, in its own process, before any
# container exists — so nothing that injects into a container spec (the runc
# wrapper of docs/adr/0020) can give dockerd proxy access. It is also started by docker.socket activation rather than spawned by
# discobox-sandbox-agent, so it inherits none of the sandbox's proxy env.
# Without this, every image pull inside a sandbox fails to resolve its registry:
# the sandbox has no route off-box, and all egress must cross the pool proxy.
#
# discobox-render-proxy-env.service renders this file from sandbox.json's
# proxy-trust env (proxyenv package) — not pool-agent directly, because
# resolving sandboxconfig.LocalSubnetsToken needs this sandbox's own
# directly-connected networks, which only sandbox-agent can see. The leading
# `-` makes it optional: a sandbox with no MITM proxy declares no proxy-trust
# vars, so the file is never written and dockerd starts unchanged.
EnvironmentFile=-/run/discobox/proxy/proxy.env

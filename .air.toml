root = "."
testdata_dir = "testdata"
tmp_dir = "build"

[build]
  args_bin = []
  entrypoint = "./build/discobot-server"
  cmd = "cd cli && go build -o ../build/discobox ./cmd/discobox && cd ../server && go build -gcflags=\"all=-N -l\" -o ../build/discobot-server ./cmd/discobot-server"
  delay = 1000
  exclude_dir = ["build", "vendor", "testdata", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "./build/discobot-server"
  include_dir = ["api", "apiclient", "apperrors", "cli", "gormdb", "id", "model", "orchestration", "providers", "sandboxprovider", "server", "workerbootstrap"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = [".env"]
  kill_delay = "10m"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

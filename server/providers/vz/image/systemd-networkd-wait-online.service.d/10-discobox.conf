# This unit is deliberately enabled rather than masked.
#
# systemd-networkd-wait-online is the only thing that gives
# network-online.target a meaning under networkd, and docker.service ships
# Wants=/After= that target. While the unit was masked the target was satisfied
# vacuously, so dockerd could start before the DHCP lease landed. This guest
# takes its address, route, *and* resolver from that lease (10-discobox.network),
# so an early dockerd has no resolver, its first registry pull fails, and the
# pool reconcile reports the pool offline over a boot race.
#
# --any waits for the one NAT interface and nothing else. The stock unit waits
# for every networkd-managed link, and in this guest that set grows to include
# docker0 and a bridge per sandbox — interfaces that only exist once dockerd is
# already running, which would deadlock the wait against the service waiting on
# it.
#
# --timeout bounds a guest whose NIC never appears: boot continues and the pull
# fails with a diagnosable error, rather than stalling for the systemd default
# of two minutes first.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30

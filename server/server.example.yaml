# yaml-language-server: $schema=https://raw.githubusercontent.com/discobox-ai/discobox/main/server/config.schema.json
#
# discobox-server configuration reference.
#
# Every setting is listed here, commented out, showing the value it has when
# nothing sets it. Copy this to the path the server reads —
# <XDG config home>/discobox/server.yaml, or wherever DISCOBOX_CONFIG_FILE
# names — and uncomment only what you want to change: deleting the "#" from a
# setting's line leaves correctly indented YAML, at any depth. A nested setting
# needs its parent uncommented too, which is the one place a single deletion is
# not enough. A server with no file at all behaves exactly as one always has.
#
# A server that starts and finds no configuration file rewrites this reference
# beside where that file belongs, so it always matches the server that wrote
# it. Copy it rather than editing it in place.
#
# Every setting can also be set by the environment variable named beside it,
# and the environment wins over this file.
#
# A key this server does not define is a startup failure naming the key. That
# is the point of the file: a misspelled environment variable is silently the
# default instead.
#
# This file is generated from the tags on config.Config by
# `go tool task generate`. Edit the struct, not this.

# Path to a release manifest supplying the runtime image set, including
# built-in harnesses. Overrides individual image settings and disables
# development image synchronization.
# Example: releaseManifest: /opt/discobox/release.json
# Environment: DISCOBOX_RELEASE_MANIFEST
#releaseManifest:

# TCP port for an http:// listen endpoint that does not name one.
# Environment: PORT
#port: 18080

# Endpoints to listen on, from unix:// (npipe:// on Windows),
# http://<host>:<port> and iroh://. Bare unix://, npipe:// and iroh://
# mean this machine's default socket, pipe and iroh identity; an iroh
# listener logs the discobox:// address clients use. Local IPC is added
# when none is named, so the CLI can always reach the server. The
# environment variable takes a comma-separated list.
# Example: listen: [unix://, iroh://, http://127.0.0.1:18080]
# Environment: DISCOBOX_SERVER_LISTEN
#listen:

# What this server calls itself: the name a client registering it is
# offered. Defaults to this machine's hostname.
# Example: name: build-server
# Environment: DISCOBOX_SERVER_NAME
#name:

# Durable server state: the database, the SSH host key, the iroh endpoint
# key, authorized_keys and authorized_ids. Defaults to <XDG data
# home>/discobox.
# Example: dataDir: /var/lib/discobox
# Environment: DISCOBOX_DATA_DIR
#dataDir:

# Operator-edited configuration. Defaults to <XDG config home>/discobox.
# It cannot relocate the configuration file itself, which is found from
# the environment.
# Example: configDir: /etc/discobox
# Environment: DISCOBOX_CONFIG_DIR
#configDir:

# Reproducible data that may be deleted. Defaults to <XDG cache
# home>/discobox.
# Example: cacheDir: /var/cache/discobox
# Environment: DISCOBOX_CACHE_DIR
#cacheDir:

# State that should survive a restart but is not precious. Defaults to
# <XDG state home>/discobox.
# Example: stateDir: /var/lib/discobox/state
# Environment: DISCOBOX_STATE_DIR
#stateDir:

# Database DSN: postgres:// or postgresql:// for PostgreSQL,
# sqlite3:///<path> for SQLite. Defaults to a SQLite file under dataDir.
# Example: databaseDsn: postgres://discobox:password@db.internal:5432/discobox?sslmode=require
# Environment: DATABASE_DSN
#databaseDsn:

# Optional separate DSN for reads, for a deployment with a read replica.
# Same forms as databaseDsn.
# Example: databaseReadDsn: postgres://discobox:password@db-replica.internal:5432/discobox?sslmode=require
# Environment: DATABASE_READ_DSN
#databaseReadDsn:

# Database driver. Detected from databaseDsn when unset.
# Example: databaseDriver: postgres
# Environment: DATABASE_DRIVER
#databaseDriver:

# Base64 of the 32-byte AES key that seals stored secrets; generate one
# with: openssl rand -base64 32. Secrets are stored unsealed when empty.
# Keep it: secrets sealed with a key cannot be read without it.
# Environment: DISCOBOX_ENCRYPTION_KEY
#encryptionKey:

# Never serve the default user, who holds every scope, on any listener.
# Every request must then authenticate: a discobot assertion, an enrolled
# iroh peer, or a pool agent's or sandbox's own credential. The local CLI
# over local IPC or HTTP is refused, and so SSH is reachable only over
# iroh. Health, the API spec, and docs still answer. An enrolled iroh
# peer authenticates as the operator's own client, so the CLI still
# reaches the server over iroh. Requires discobotPublicKey or an iroh
# endpoint in listen.
# Environment: DISCOBOX_AUTH_REQUIRED
#authRequired: false

# Base64 of discobot's Ed25519 public key. When set, a request carrying a
# discobot assertion acts as the person it names, in the project it
# names; discobox keeps no users of its own. Unset, every assertion is
# refused.
# Example: discobotPublicKey: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
# Environment: DISCOBOX_DISCOBOT_PUBLIC_KEY
#discobotPublicKey:

# How often the job dispatcher polls for work.
# Environment: DISPATCHER_POLL_INTERVAL
#dispatcherPollInterval: 1s

# How many sandbox reconcile jobs run at once.
# Environment: SANDBOX_RECONCILE_JOB_CONCURRENCY
#sandboxReconcileJobConcurrency: 4

# The platform bundle every harness's manifest is composed on and every
# discobox applies. Defaults to the one this build ships.
# Example: platformBundle: ghcr.io/discobox-ai/discobox-platform:v0.8.0
# Environment: DISCOBOX_PLATFORM_BUNDLE
#platformBundle:

# Retired, and ignored: no discobox runs an image of its own any more.
# Read with a warning, and refused from the next release; remove it
# rather than moving it to platformBundle, which names a platform bundle
# and not an image.
# Example: defaultSandboxImage: ghcr.io/discobox-ai/discobox-sandbox-agent:v0.8.0
#defaultSandboxImage:

# Retired, and ignored with defaultSandboxImage. Read with a warning, and
# refused from the next release.
# Example: defaultSandboxImageDigest: sha256:4f2a9c1e7b3d8a6f0e5c2b9d7a1f3e8c6b4d2a0f9e7c5b3a1d8f6e4c2b0a9d7e
#defaultSandboxImageDigest:

# Have each project's judge decide whether a command discobox-access runs
# carries out the approved use it names, before a credential is issued
# for it, and whether a discobox may hand a credential on. On by default.
# A project whose default harness runs no model then runs no credentialed
# command unless the server judges with Jev. Off, credentials are issued
# for whatever command asks, with no verdict on record, and no discobox
# hands one on.
# Environment: DISCOBOX_JUDGE_COMMANDS
#judgeCommands: true

# Have each project's judge decide whether each credential-bearing
# request is part of what the credential's approved use allows. Off by
# default. While it is off credentials are resolved for whatever request
# carries them, held only to the host and grant they were approved for.
# Commands are judged by judgeCommands.
# Environment: DISCOBOX_JUDGE_CREDENTIALS
#judgeCredentials: false

# What judges credential use when judgeCommands or judgeCredentials is
# on: auto, jev when jevApiKey is set and harness otherwise; harness, a
# judge discobox per project running the project's default harness; or
# jev, TypeSafe's Jev, asked by this server directly, which requires
# jevApiKey.
# Environment: DISCOBOX_JUDGE_BACKEND
#judgeBackend: "auto"

# TypeSafe API key the server asks Jev with. Setting it makes
# judgeBackend auto choose jev; judgeBackend jev requires it.
# Environment: DISCOBOX_JEV_API_KEY
#jevApiKey:

# The Jev model asked when judgeBackend is jev. A version rather than the
# jev-latest alias, which moves when TypeSafe ships a new one.
# Environment: DISCOBOX_JEV_MODEL
#jevModel: "jev-1.13.0"

# What a jev judge does with a command, request or delegation it is
# unsure about, being neither sure enough to allow it nor sure enough to
# refuse it: harness, ask the project's judge discobox (as judgeBackend
# harness runs one), which then decides, so every project keeps a judge
# discobox for them; or refuse it, and run no judge discobox. Jev's
# allows and the refusals it is sure of are final either way, and an ask
# to be shown a request's body goes back to be answered; with harness,
# the rounds after the judge discobox asked for a body are its to decide
# too.
# Environment: DISCOBOX_JEV_UNSURE
#jevUnsure: "harness"

# How long an archived sandbox is kept before purging, for projects with
# no retention of their own, as a Go duration. Defaults to 24h.
# Example: archiveRetention: 168h
# Environment: DISCOBOX_ARCHIVE_RETENTION
#archiveRetention:

# How long an unused Discobox image is kept on the host Docker daemon.
# The configured value is propagated into pool containers, so one setting
# governs both. A Go duration; defaults to 24h.
# Example: imageRetention: 72h
# Environment: DISCOBOX_IMAGE_RETENTION
#imageRetention:

# Pool agent image the Docker provider runs. Defaults to the released
# image for this build.
# Example: dockerPoolImage: ghcr.io/discobox-ai/discobox-pool-agent:v0.8.0
# Environment: DISCOBOX_DOCKER_POOL_IMAGE
#dockerPoolImage:

# The Docker driver's Debian sandbox base image, which every sandbox
# delivered its platform runs and the sandbox images are built FROM,
# preloaded by a pool, for a provider whose own sandboxBaseImage setting
# names none. Defaults to the released image for this build.
# Example: dockerSandboxBaseImage: ghcr.io/discobox-ai/discobox-sandbox-base:v0.8.0
# Environment: DISCOBOX_DOCKER_SANDBOX_BASE_IMAGE
#dockerSandboxBaseImage:

# OCI image layout that VM guest images are fetched through, and that a
# pool on this machine loads images from before pulling them. The CLI
# names the one it stages a release's images into. Defaults to
# <cacheDir>/images.
# Example: imageCacheDir: /var/cache/discobox/images
# Environment: DISCOBOX_IMAGE_CACHE_DIR
#imageCacheDir:

# Blob store the server serves bundles to pools from, by digest. Every
# blob in it is fetched again when it is missing. Defaults to
# <cacheDir>/assets.
# Example: assetDir: /var/cache/discobox/assets
# Environment: DISCOBOX_ASSET_DIR
#assetDir:

# Directory the overlays of non-Linux sandbox templates are staged in,
# and the only one a harness's file:// manifest reference may name a file
# in. Defaults to <cacheDir>/overlays.
# Example: overlayDir: /var/cache/discobox/overlays
# Environment: DISCOBOX_OVERLAY_DIR
#overlayDir:

# The WSL Containers program to look for on a Windows host, as a name on
# PATH or a full path. Empty looks for the component's own name, wslc.
# Windows only.
# Example: wslcCommand: 'C:\tools\wslc.exe'
# Environment: DISCOBOX_WSLC_COMMAND
#wslcCommand:

# Converge locally built images onto each Docker daemon before it hosts a
# development pool.
# Environment: DISCOBOX_DEV_DOCKER_IMAGE_SYNC
#devImageSync: false

# Path to the manifest listing the images devImageSync converges.
# Required when devImageSync is set.
# Example: devImageManifest: /tmp/discobox-dev-images.json
# Environment: DISCOBOX_DEV_DOCKER_IMAGE_MANIFEST
#devImageManifest:

# Settings for the iroh transport, which is how a server is reached from
# another network without a port, a certificate, or a name.
#iroh:
  # Relay servers to use instead of n0's public ones, which are free and
  # need no configuration but rate-limit traffic, are shared with every
  # other iroh deployment, and carry no uptime guarantee. Running your
  # own means running iroh-relay and listing it here. Clients need the
  # same list (discobox --iroh-relay): an address does not carry the
  # server's relay, so a half-configured pair fails when it tries to
  # connect. Address discovery is separate, still uses n0's public
  # service, and is not configurable yet.
  # Example: relayUrls: [https://relay.example.com]
  # Environment: DISCOBOX_IROH_RELAY_URLS
  #relayUrls:

  # Log the iroh transport as it binds, accepts and refuses: off (the
  # default), error, warn, info, debug, or trace. It also sets the
  # verbosity of iroh's own tracing, which is written to this server's
  # log. The matching client-side setting is discobox --iroh-log.
  # Example: logLevel: debug
  # Environment: DISCOBOX_IROH_LOG
  #logLevel:

# Export OpenTelemetry metrics over OTLP/HTTP, to the collector the
# standard OTEL_EXPORTER_OTLP_ENDPOINT environment variable names, such
# as http://otel-collector:4318. The OTEL_METRICS_EXPORTER=otlp
# environment variable sets this too.
#otelMetricsEnabled: false

# How often metrics are exported. The OTEL_METRIC_EXPORT_INTERVAL
# environment variable sets this too, in milliseconds, as the
# OpenTelemetry specification defines it.
#otelMetricExportInterval: 1s

# What the server keeps on its projects, keyed by default (the default
# user's default project) or a project ID. A project that does not exist
# is skipped with a warning. When default is a project also named by its
# ID, the entry under its ID applies.
# Example: projects: {default: {gateways: {anthropic: {match: 'https://api.anthropic.com/v1', target: 'https://gateway.example.com/anthropic/v1', requestHeaders: {set: [{name: cf-aig-authorization, valueFrom: {env: DISCOBOX_GATEWAY_CF_TOKEN}}]}}}}}
#projects:

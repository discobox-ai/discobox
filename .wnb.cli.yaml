# watchnbuild config for `task dev-wnb:cli` — the parallel of .air.cli.toml.
#
# air needed a long-lived process to supervise, so .air.cli.toml ran
# `sh -c 'echo ...; sleep 2147483647'` as a stand-in. wnb treats an omitted
# run command as a build-only loop, so the placeholder is gone.
#
# watch.paths is an allowlist here (unlike .wnb.yaml) so that editing the
# server does not relink the CLI: this config is usually run alongside
# `task dev-wnb`. The cost is that root files outside these directories —
# go.work, the root go.mod — do not trigger; a manual rebuild covers the rare
# case where that matters.

watch:
  paths: [api, cli, execstream, id, internal, layout, localipc, randomname, sandboxconfig]
  exclude: ["*_test.go"]
  exclude_dirs: [build, node_modules, vendor, testdata]

debounce: 1s

build:
  # No `rm -f build/disco` (air had one): go build replaces the output
  # atomically and leaves the old binary alone when compilation fails, so the
  # rm only ensured a failed build left you with no CLI.
  command: cd cli && go build -o ../build/disco ./cmd/disco
  grace: 2s

# no run: — build-only.

# watchnbuild config for `task dev:cli`.
#
# There is no run command: wnb treats that as a build-only loop, which is all
# the CLI needs.
#
# watch.paths is an allowlist here (unlike .wnb.yaml) so that editing the
# server does not relink the CLI: this config is usually run alongside
# `task dev`. The cost is that root files outside these directories —
# go.work, the root go.mod — do not trigger; a manual rebuild covers the rare
# case where that matters.

watch:
  paths: [api, cli, endpoint, execstream, id, internal, layout, randomname, sandboxconfig]
  exclude: ["*_test.go"]
  exclude_dirs: [build, node_modules, vendor, testdata]

debounce: 1s

build:
  # Nothing removes build/discobox first: go build replaces the output atomically
  # and leaves the old binary in place when compilation fails. sign is a no-op
  # off macOS; on macOS `discobox` runs the server in-process, so it needs the
  # virtualization entitlement on every rebuild (ADR 0066 §5).
  command: >-
    EXE=$(go env GOEXE) &&
    cd cli && go build -o ../build/discobox$EXE ./cmd/discobox &&
    cd .. && go tool task sign SIGN_BINARY=build/discobox$EXE
  grace: 2s

# no run: — build-only.

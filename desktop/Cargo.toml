[package]
name = "discobox-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "discobox desktop: the console as a native app on Rune (ADR 26-11-07-876)."

# The bridge client and the wire's generated types are their own crate, with
# nothing of the window in it: its contract suite drives the client the app
# uses without building the app, which a binary crate's tests cannot reach
# (README.md).
[workspace]
members = ["bridge"]

[[bin]]
name = "discobox-desktop"
path = "src/main.rs"

[dependencies]
discobox-bridge = { path = "bridge" }
# Rune is pre-release: pin a rev of `dev` (it is never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
# Rune's components, for its Markdown: an issue's and its comments' bodies, rendered natively.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", features = ["markdown"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[package]
name = "discobox-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "discobox desktop: the console as a native app on Rune (ADR 26-11-07-876)."

[[bin]]
name = "discobox-desktop"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a rev of `dev` (it is never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
incremental = true

[profile.dev.package."*"]
opt-level = 2

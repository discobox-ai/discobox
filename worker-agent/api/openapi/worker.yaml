components:
    schemas:
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        "$ref": "#/components/schemas/ErrorDetail"
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    "$ref": "#/components/schemas/GitSourceCheckout"
                destination:
                    "$ref": "#/components/schemas/GitSourceDestination"
                kind:
                    enum:
                    - git
                    type: string
                localDirectory:
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                url:
                    format: uri
                    type: string
                workspace:
                    "$ref": "#/components/schemas/GitSourceWorkspace"
            required:
            - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    type: string
                refName:
                    type: string
                refType:
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    type: string
                workingDirectory:
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    type: string
                mode:
                    default: clean
                    enum:
                    - clean
                    - dirty
                    type: string
                snapshotRef:
                    type: string
            type: object
        ResolvedAgentConfig:
            additionalProperties: false
            properties:
                id:
                    type: string
                installCommand:
                    type: string
                name:
                    type: string
                runCommand:
                    type: string
            required:
            - id
            - name
            - runCommand
            type: object
        SandboxAgentConfig:
            additionalProperties: false
            properties:
                id:
                    type: string
                installCommand:
                    type: string
                isDefault:
                    type: boolean
                name:
                    type: string
                runCommand:
                    type: string
            required:
            - id
            - name
            - runCommand
            - isDefault
            type: object
        SandboxConfig:
            additionalProperties: false
            properties:
                agentConfigId:
                    type: string
                agentModel:
                    type: string
                agentModelReasoningLevel:
                    type: string
                agentModelServiceTier:
                    type: string
                cpuVcpus:
                    format: double
                    type: number
                description:
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                image:
                    type: string
                memoryBytes:
                    format: int64
                    type: integer
                name:
                    type: string
                prompt:
                    type: string
                source:
                    "$ref": "#/components/schemas/GitSource"
                sourceCodeReferences:
                    additionalProperties:
                        "$ref": "#/components/schemas/GitSource"
                    type: object
                storageBytes:
                    format: int64
                    type: integer
                user:
                    "$ref": "#/components/schemas/SandboxUser"
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                cpuVcpus:
                    format: double
                    type: number
                env:
                    additionalProperties:
                        type: string
                    type: object
                image:
                    type: string
                memoryBytes:
                    format: int64
                    type: integer
                storageBytes:
                    format: int64
                    type: integer
                workingDirectory:
                    type: string
            type: object
        SandboxUser:
            additionalProperties: false
            properties:
                gid:
                    format: int64
                    type: integer
                homeDirectory:
                    type: string
                name:
                    type: string
                uid:
                    format: int64
                    type: integer
            type: object
        WorkerSandboxCreateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/WorkerSandboxCreateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    items:
                        "$ref": "#/components/schemas/SandboxAgentConfig"
                    nullable: true
                    type: array
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                resolvedAgentConfig:
                    "$ref": "#/components/schemas/ResolvedAgentConfig"
                resources:
                    "$ref": "#/components/schemas/WorkerSandboxResources"
                sandboxId:
                    type: string
            required:
            - sandboxId
            - config
            type: object
        WorkerSandboxInstance:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/WorkerSandboxInstance.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    items:
                        "$ref": "#/components/schemas/SandboxAgentConfig"
                    nullable: true
                    type: array
                config:
                    "$ref": "#/components/schemas/SandboxConfig"
                resolvedAgentConfig:
                    "$ref": "#/components/schemas/ResolvedAgentConfig"
                resources:
                    "$ref": "#/components/schemas/WorkerSandboxResources"
                runtime:
                    "$ref": "#/components/schemas/WorkerSandboxRuntime"
                sandboxId:
                    type: string
            required:
            - sandboxId
            - config
            - runtime
            type: object
        WorkerSandboxListResponse:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/WorkerSandboxListResponse.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    items:
                        "$ref": "#/components/schemas/WorkerSandboxInstance"
                    nullable: true
                    type: array
            required:
            - sandboxes
            type: object
        WorkerSandboxOperationRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/WorkerSandboxOperationRequest.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    type: boolean
            type: object
        WorkerSandboxUpdateRequest:
            additionalProperties: false
            properties:
                "$schema":
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/WorkerSandboxUpdateRequest.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    "$ref": "#/components/schemas/SandboxUpdateConfig"
                resources:
                    "$ref": "#/components/schemas/WorkerSandboxResources"
            type: object
        WorkerSandboxPort:
            additionalProperties: false
            properties:
                containerPort:
                    format: int64
                    type: integer
                hostIp:
                    type: string
                hostPort:
                    format: int64
                    type: integer
                protocol:
                    type: string
            required:
            - containerPort
            - hostPort
            - hostIp
            - protocol
            type: object
        WorkerSandboxResources:
            additionalProperties: false
            properties:
                cpuCores:
                    format: double
                    type: number
                diskMb:
                    format: int64
                    type: integer
                memoryMb:
                    format: int64
                    type: integer
                timeoutSeconds:
                    format: int64
                    type: integer
            required:
            - memoryMb
            - cpuCores
            - diskMb
            - timeoutSeconds
            type: object
        WorkerSandboxRuntime:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                env:
                    additionalProperties:
                        type: string
                    type: object
                error:
                    type: string
                image:
                    type: string
                instanceId:
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    type: object
                ports:
                    items:
                        "$ref": "#/components/schemas/WorkerSandboxPort"
                    nullable: true
                    type: array
                startedAt:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    type: string
                stoppedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
            - instanceId
            - status
            - image
            - createdAt
            - startedAt
            - stoppedAt
            - error
            - metadata
            - ports
            - env
            type: object
    securitySchemes:
        workerBearerAuth:
            bearerFormat: worker-local API token
            scheme: bearer
            type: http
info:
    title: Discobox Worker Agent
    version: 0.1.0
openapi: 3.0.3
paths:
    "/api/project/{projectId}/worker/{workerId}/sandboxes":
        get:
            operationId: worker-list-sandboxes
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxListResponse"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: List worker sandboxes
            tags:
            - Worker Sandboxes
        post:
            operationId: worker-create-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/WorkerSandboxCreateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Create worker sandbox
            tags:
            - Worker Sandboxes
    "/api/project/{projectId}/worker/{workerId}/sandboxes/{sandboxId}":
        delete:
            operationId: worker-delete-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '204':
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Delete worker sandbox
            tags:
            - Worker Sandboxes
        get:
            operationId: worker-get-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Get worker sandbox
            tags:
            - Worker Sandboxes
        patch:
            operationId: worker-update-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/WorkerSandboxUpdateRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Update worker sandbox
            tags:
            - Worker Sandboxes
    "/api/project/{projectId}/worker/{workerId}/sandboxes/{sandboxId}/start":
        post:
            operationId: worker-start-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/WorkerSandboxOperationRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Start worker sandbox
            tags:
            - Worker Sandboxes
    "/api/project/{projectId}/worker/{workerId}/sandboxes/{sandboxId}/stop":
        post:
            operationId: worker-stop-sandbox
            parameters:
            -   description: Project ID
                in: path
                name: projectId
                required: true
                schema:
                    description: Project ID
                    type: string
            -   description: Worker ID
                in: path
                name: workerId
                required: true
                schema:
                    description: Worker ID
                    type: string
            -   description: Sandbox ID
                in: path
                name: sandboxId
                required: true
                schema:
                    description: Sandbox ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            "$ref": "#/components/schemas/WorkerSandboxOperationRequest"
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                "$ref": "#/components/schemas/WorkerSandboxInstance"
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                "$ref": "#/components/schemas/ErrorModel"
                    description: Error
            security:
            -   workerBearerAuth: []
            summary: Stop worker sandbox
            tags:
            - Worker Sandboxes

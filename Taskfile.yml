version: "3"

vars:
  BINARY: build/discobot-server
  MAIN: ./cmd/discobot-server
  CLI_BINARY: build/discobox
  CLI_MAIN: ./cmd/discobox
  PACKAGES: ./...
  UI_DIR: ui
  ELECTRON_DIR: electron

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Compile discobot-server, discobox CLI, UI, and Electron shell
    cmds:
      - task: build:server
      - task: build:cli
      - task: build:ui
      - task: build:electron

  build:server:
    desc: Compile discobot-server
    cmds:
      - go build -o {{.BINARY}} {{.MAIN}}

  build:cli:
    desc: Compile discobox CLI
    cmds:
      - go build -o {{.CLI_BINARY}} {{.CLI_MAIN}}

  build:ui:
    desc: Build the SvelteKit UI
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run build

  build:electron:
    desc: Build the Electron main and preload bundles
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run build

  build:worker-agent-image:
    desc: Build the systemd Docker worker image
    cmds:
      - docker build -f Dockerfile.worker-agent -t discobox-worker-agent:local .

  build:sandbox-agent-image:
    desc: Build the Debian sandbox agent image
    cmds:
      - docker build -f Dockerfile.sandbox-agent -t discobox-sandbox-agent:local .

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobot-server with debugger-friendly flags
    cmds:
      - go build -gcflags="all=-N -l" -o {{.BINARY}} {{.MAIN}}

  debug:
    desc: Build and run discobot-server under Delve
    deps:
      - debug-build
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobot-server
    deps:
      - build:server
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: Run the server and UI dev tasks
    deps:
      - dev:server
      - dev:ui

  dev:server:
    desc: Run discobot-server with Air hot reload and worker-agent image rebuilds
    cmds:
      - |
        bash -c '
        set -euo pipefail
        touch .env
        go run ./cmd/discobox-worker-agent-watch &
        watch_pid=$!
        cleanup() { kill "$watch_pid" 2>/dev/null || true; }
        trap cleanup EXIT INT TERM
        go tool air
        '

  dev:worker-agent-image-watch:
    desc: Rebuild the Docker worker-agent image when its Docker inputs change
    cmds:
      - go run ./cmd/discobox-worker-agent-watch

  dev:ui:
    desc: Run the SvelteKit UI dev server
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run dev --host 0.0.0.0 --port 5173 --strictPort

  dev:electron:
    desc: Run the Discobox Electron shell against the UI dev server
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - |
        bash -c '
        set -euo pipefail
        pnpm --dir {{.UI_DIR}} install --frozen-lockfile
        pnpm --dir {{.UI_DIR}} run dev --host 127.0.0.1 --port 5173 --strictPort &
        ui_pid=$!
        cleanup() { kill "$ui_pid" 2>/dev/null || true; }
        trap cleanup EXIT INT TERM
        sleep 2
        DISCOBOX_UI_DEV_URL=http://127.0.0.1:5173 pnpm --dir {{.ELECTRON_DIR}} run dev
        '

  dev:electron:shell:
    desc: Run only the Discobox Electron shell against an existing UI dev server
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - DISCOBOX_UI_DEV_URL=${DISCOBOX_UI_DEV_URL:-http://127.0.0.1:5173} pnpm --dir {{.ELECTRON_DIR}} run dev

  test:
    desc: Run root module tests
    cmds:
      - go test {{.PACKAGES}}

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - DISCOBOX_DOCKER_INTEGRATION=1 go test ./internal/sandbox/docker -run Integration -count=1 -v

  test:docker:bats:
    desc: Run Docker provider CLI Bats integration test
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats test/bats/docker_cli.bats
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats test/bats/docker_cli.bats
        fi

  test:all:
    desc: Run root and nested module tests
    cmds:
      - go test {{.PACKAGES}}
      - cd gormdb && go test ./...
      - cd orchestration && go test ./...

  check:
    desc: Run static checks
    cmds:
      - go tool golangci-lint run
      - task: check:ui
      - task: check:electron

  check:fix:
    desc: Run static checks and apply safe fixes
    cmds:
      - go tool golangci-lint run --fix
      - task: check:ui:fix
      - task: check:electron:fix

  check:ui:
    desc: Run UI static checks, tests, and dependency audit
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} audit
      - pnpm --dir {{.UI_DIR}} run format:check
      - pnpm --dir {{.UI_DIR}} run lint
      - pnpm --dir {{.UI_DIR}} run check
      - pnpm --dir {{.UI_DIR}} run test:unit

  check:ui:fix:
    desc: Format the UI and apply safe lint fixes
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run format
      - pnpm --dir {{.UI_DIR}} run lint:fix

  check:electron:
    desc: Run Electron static checks
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run format:check
      - pnpm --dir {{.ELECTRON_DIR}} run check

  check:electron:fix:
    desc: Apply safe Electron formatting fixes
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run format

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -rf build build-errors.log {{.UI_DIR}}/.svelte-kit {{.UI_DIR}}/build {{.ELECTRON_DIR}}/dist {{.ELECTRON_DIR}}/release

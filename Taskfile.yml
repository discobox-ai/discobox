    cmds:
      - dagger api call release-assemble --artifacts=build/release/bin {{.CLI_ARGS}} export --path=build/release/assembled

  brew:publish:
    desc: Explicitly publish one formula; prereleases require an explicit override
    cmds:
      - dagger api call brew-publish {{.CLI_ARGS}}

  release:publish:
    desc: Publish verified complete release artifacts
    cmds:
      - dagger api call release-publish --artifacts=build/release/bin {{.CLI_ARGS}}

  winget:manifests:

version: "3"

vars:
  BINARY: build/discobox-server
  SERVER_MAIN: ./cmd/discobox-server
  CLI_BINARY: build/discobox
  CLI_MAIN: ./cmd/discobox
  SESSION_BINARY: build/discobox-session
  SESSIONS_BINARY: build/discobox-sessions
  SESSION_MAIN: ./cmd/discobox-session
  PACKAGES: ./...
  UI_DIR: ui
  ELECTRON_DIR: electron

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Compile discobox-server, discobox CLI, session CLI, UI, and Electron shell
    cmds:
      - task: build:server
      - task: build:cli
      - task: build:session
      - task: build:ui
      - task: build:electron

  build:server:
    desc: Compile discobox-server
    cmds:
      - mkdir -p build
      - cd server && go build -o ../{{.BINARY}} {{.SERVER_MAIN}}

  build:cli:
    desc: Compile discobox CLI
    cmds:
      - mkdir -p build
      - cd cli && go build -o ../{{.CLI_BINARY}} {{.CLI_MAIN}}

  build:session:
    desc: Compile discobox-session CLI
    cmds:
      - mkdir -p build
      - cd sessions && go build -o ../{{.SESSION_BINARY}} {{.SESSION_MAIN}}
      - cp {{.SESSION_BINARY}} {{.SESSIONS_BINARY}}

  build:ui:
    desc: Build the SvelteKit UI
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run build

  build:electron:
    desc: Build the Electron main and preload bundles
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run build

  build:worker-agent-image:
    desc: Build the systemd Docker worker image
    cmds:
      - docker build -f worker-agent/Dockerfile -t discobox-worker-agent:local .

  build:sandbox-agent-image:
    desc: Build the Debian sandbox agent image
    cmds:
      - cd sandbox-agent && docker build -f Dockerfile -t discobox-sandbox-agent:local .

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobox-server with debugger-friendly flags
    cmds:
      - mkdir -p build
      - cd server && go build -gcflags="all=-N -l" -o ../{{.BINARY}} {{.SERVER_MAIN}}

  debug:
    desc: Build and run discobox-server under Delve
    deps:
      - debug-build
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobox-server
    deps:
      - build:server
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: Run the server, UI, Electron shell, Docker image watcher, and Storybook dev tasks
    deps:
      - dev:server
      - dev:ui
      - dev:electron
      - dev:docker-image-watch
      - storybook

  storybook:
    desc: Run Storybook for UI component development
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} exec storybook dev -p 6006 --host 127.0.0.1

  dev:server:
    desc: Run discobox-server with Air hot reload
    cmds:
      - touch .env
      - go tool air

  dev:cli:
    desc: Recompile the discobox CLI with Air hot reload
    cmds:
      - go tool air -c .air.cli.toml

  dev:docker-image-watch:
    desc: Rebuild Docker development images when their Docker inputs change
    cmds:
      - go run ./cmd/discobox-docker-image-watch

  dev:worker-agent-image-watch:
    desc: Alias for dev:docker-image-watch
    cmds:
      - task: dev:docker-image-watch

  dev:ui:
    desc: Run the SvelteKit UI dev server
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run dev --host 127.0.0.1 --port 5173 --strictPort

  dev:electron:
    desc: Run the Discobox Electron shell against an existing UI dev server
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - |
        bash -c '
        set -euo pipefail
        ui_url="${DISCOBOX_UI_DEV_URL:-http://127.0.0.1:5173}"
        echo "Waiting for UI dev server at $ui_url"
        for _ in $(seq 1 60); do
          if curl --max-time 2 -fs "$ui_url" >/dev/null 2>&1; then
            echo "Launching Electron against $ui_url"
            DISCOBOX_UI_DEV_URL="$ui_url" pnpm --dir {{.ELECTRON_DIR}} run dev
            exit $?
          fi
          sleep 1
        done
        echo "UI dev server did not become ready at $ui_url" >&2
        exit 1
        '

  dev:electron:shell:
    desc: Alias for dev:electron
    cmds:
      - task: dev:electron

  test:
    desc: Run root module tests
    cmds:
      - go test {{.PACKAGES}}

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - cd server && DISCOBOX_DOCKER_INTEGRATION=1 go test ./providers/docker -run Integration -count=1 -v

  test:docker:bats:
    desc: Run Docker provider CLI Bats integration test
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats test/bats/docker_cli.bats
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats test/bats/docker_cli.bats
        fi

  test:all:
    desc: Run root and nested module tests
    cmds:
      - go test {{.PACKAGES}}
      - cd cli && go test ./...
      - cd server && go test ./...
      - cd worker-agent && go test ./...
      - cd gormdb && go test ./...
      - cd orchestration && go test ./...
      - cd hooks && go test ./...
      - cd sessions && go test ./...

  check:
    desc: Run static checks
    cmds:
      - go tool golangci-lint run
      - cd cli && "$(go -C .. tool -n golangci-lint)" run
      - cd server && "$(go -C .. tool -n golangci-lint)" run
      - cd worker-agent && "$(go -C .. tool -n golangci-lint)" run
      - cd gormdb && "$(go -C .. tool -n golangci-lint)" run
      - cd orchestration && "$(go -C .. tool -n golangci-lint)" run
      - cd hooks && "$(go -C .. tool -n golangci-lint)" run
      - cd sessions && "$(go -C .. tool -n golangci-lint)" run
      - task: check:ui
      - task: check:electron

  check-hooks:
    desc: Run hooks checks
    cmds:
      - echo 'cd ./hooks; go run ./cmd/discobox-hooks check'
      - cd ./hooks; go run ./cmd/discobox-hooks check

  check:mermaid:
    desc: Validate Mermaid diagrams in Markdown files
    cmds:
      - |
        bash -c '
        set -euo pipefail
        out_dir="$(mktemp -d)"
        trap "rm -rf \"$out_dir\"" EXIT
        python3 - "$out_dir" <<'"'"'PY'"'"'
        from pathlib import Path
        import re
        import sys

        out_dir = Path(sys.argv[1])
        count = 0
        for path in sorted(Path(".").rglob("*.md")):
            if any(part in {".git", "node_modules", "build"} for part in path.parts):
                continue
            text = path.read_text()
            for index, block in enumerate(re.findall(r"```mermaid\n(.*?)\n```", text, flags=re.S), 1):
                count += 1
                name = str(path).replace("/", "_").replace(".", "_") + f"_{index}.mmd"
                (out_dir / name).write_text(block + "\n")
                print(out_dir / name)
        if count == 0:
            print("no Mermaid diagrams found")
        PY
        PUPPETEER_SKIP_DOWNLOAD=true pnpm install --frozen-lockfile --ignore-scripts
        shopt -s nullglob
        for diagram in "$out_dir"/*.mmd; do
            echo "validating ${diagram}"
            PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium} pnpm exec mmdc -i "$diagram" -o "${diagram}.svg" >/dev/null
        done
        '

  check:fix:
    desc: Run static checks and apply safe fixes
    cmds:
      - go tool golangci-lint run --fix
      - cd cli && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd server && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd worker-agent && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd gormdb && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd orchestration && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd hooks && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd sessions && "$(go -C .. tool -n golangci-lint)" run --fix
      - task: check:ui:fix
      - task: check:electron:fix

  check:ui:
    desc: Run UI static checks, tests, and dependency audit
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} audit
      - pnpm --dir {{.UI_DIR}} run format:check
      - pnpm --dir {{.UI_DIR}} run lint
      - pnpm --dir {{.UI_DIR}} run check
      - pnpm --dir {{.UI_DIR}} run test:unit

  check:ui:fix:
    desc: Format the UI and apply safe lint fixes
    cmds:
      - pnpm --dir {{.UI_DIR}} install --frozen-lockfile
      - pnpm --dir {{.UI_DIR}} run format
      - pnpm --dir {{.UI_DIR}} run lint:fix

  check:electron:
    desc: Run Electron static checks
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run format:check
      - pnpm --dir {{.ELECTRON_DIR}} run check

  check:electron:fix:
    desc: Apply safe Electron formatting fixes
    cmds:
      - pnpm --dir {{.ELECTRON_DIR}} install --frozen-lockfile
      - pnpm --dir {{.ELECTRON_DIR}} run format

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}
      - cd sessions && go generate ./...

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -rf build build-errors.log {{.UI_DIR}}/.svelte-kit {{.UI_DIR}}/build {{.ELECTRON_DIR}}/dist {{.ELECTRON_DIR}}/release

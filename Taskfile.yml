version: "3"

vars:
  # What `task dev` adds to the local socket the server always binds. Every
  # build carries the transport (ADR 0067), so this applies everywhere;
  # DISCOBOX_DEV_IROH=0 drops it for anyone who wants the socket alone.
  DEV_LISTEN: '{{if ne .DISCOBOX_DEV_IROH "0"}}iroh://{{end}}'
  # Windows resolves an extensionless name through PATHEXT, so `discobox` there
  # finds `discobox.exe` first. Without the suffix a build lands beside whatever
  # .exe was left by an earlier one, and the shell keeps running the stale
  # binary while the build reports success.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  BINARY: build/discobox-server{{.EXE}}
  SERVER_MAIN: ./cmd/discobox-server
  CLI_BINARY: build/discobox{{.EXE}}
  CLI_MAIN: ./cmd/discobox
  ACCESS_BINARY: build/discobox-access{{.EXE}}
  ACCESS_MAIN: ./cmd/discobox-access
  PACKAGES: ./...
  # Every module go.work uses, as one `go` invocation's packages: one command
  # over all of them schedules their packages together rather than module by
  # module. The list is go.work's; a module added there is added here.
  WORKSPACE_PACKAGES: ./... ./access/... ./cli/... ./pool-agent/... ./sandbox-agent/... ./server/... ./termpane/...
  # Multi-architecture and multi-output builds both need the docker-container
  # driver; the default docker driver supports neither.
  BUILDX_BUILDER: discobox
  LINT_BIN: golangci-lint{{.EXE}}
  DEADCODE_BIN: deadcode{{.EXE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dagger:check:
    desc: Run the complete Dagger check graph
    cmds:
      - dagger check {{.CLI_ARGS}}

  dagger:list:
    desc: List Dagger checks
    cmds:
      - dagger check --list {{.CLI_ARGS}}

  build:
    desc: Build binaries and all local Docker images
    cmds:
      # The guest relay is embedded into the server binary, so it must be
      # cross-compiled before the server is linked.
      - task: build:cp-relay
      - task: build:server
      - task: build:cli
      - task: build:access
      - task: build:images

  build:server:
    desc: Compile discobox-server
    cmds:
      - mkdir -p build
      - cd server && go build -o ../{{.BINARY}} {{.SERVER_MAIN}}
      - task: sign
        vars: { SIGN_BINARY: '{{.BINARY}}' }

  sign:
    desc: Codesign SIGN_BINARY with the Virtualization entitlement (macOS only)
    # Creating a Virtualization.framework VM requires the entitlement, and it
    # only exists on a signed binary, so every rebuild has to be re-signed. This
    # is why `go run` cannot start a macOS server that runs pools. Ad-hoc
    # signing is enough locally; distribution needs Developer ID and
    # notarization. Task skips the whole target off darwin.
    #
    # It takes a binary rather than naming one: the entitlement (ADR 0066 §5)
    # belongs to whatever runs the server, and the server is a separate program
    # (ADR 0099), so discobox-server is the only thing signed.
    platforms: [darwin]
    vars:
      ENTITLEMENTS: server/providers/vz/vz.entitlements
    cmds:
      - |
        set -eu
        if [ -z "{{.SIGN_BINARY}}" ]; then
          echo "sign: SIGN_BINARY is required" >&2
          exit 1
        fi
        codesign --force --sign - --entitlements {{.ENTITLEMENTS}} "{{.SIGN_BINARY}}"

  build:cli:
    desc: Compile discobox CLI
    # No dependency on the server and nothing to sign: the CLI runs the server
    # as a separate program (ADR 0099), so the guest relay and the
    # Virtualization entitlement are build:server's business. `task build`
    # writes both binaries into build/, which is what makes a development CLI
    # find a server with nothing configured.
    deps:
      # The Linux CLI embeds the Windows clipboard helper it runs from WSL.
      - build:clipwatch
    cmds:
      - mkdir -p build
      - rm -f {{.CLI_BINARY}}
      - cd cli && go build -o ../{{.CLI_BINARY}} {{.CLI_MAIN}}


  build:clipwatch:
    desc: Cross-compile the Windows clipboard helper the Linux CLI embeds for WSL
    run: once
    cmds:
      # One per Windows architecture: WSL2 does not emulate, so a Linux CLI
      # runs on a Windows host of its own GOARCH and reads that helper.
      - task: build:clipwatch:arch
        vars: { CLIPWATCH_ARCH: amd64 }
      - task: build:clipwatch:arch
        vars: { CLIPWATCH_ARCH: arm64 }

  build:clipwatch:arch:
    desc: Cross-compile the Windows clipboard helper for one architecture (CLIPWATCH_ARCH=)
    requires:
      vars: [CLIPWATCH_ARCH]
    vars:
      CLIPWATCH_BIN: build/discobox-clipwatch.windows-{{.CLIPWATCH_ARCH}}.exe
      CLIPWATCH_OUT: cli/internal/clipwatch/artifacts/discobox-clipwatch.windows-{{.CLIPWATCH_ARCH}}.exe.gz
    cmds:
      # The artifact is gitignored; without it the CLI still builds, and on WSL
      # the console's clipboard watch reports this task as the one to run.
      # CGO_ENABLED=0 for the reason build:cp-relay gives: a cross-compile with
      # cgo on builds runtime/cgo against the wrong SDK.
      - cd cli && CGO_ENABLED=0 GOOS=windows GOARCH={{.CLIPWATCH_ARCH}} go build -trimpath -ldflags="-s -w" -o ../{{.CLIPWATCH_BIN}} ./cmd/discobox-clipwatch
      - go run ./internal/cmd/discobox-gzip {{.CLIPWATCH_BIN}} {{.CLIPWATCH_OUT}}

  build:access:
    desc: Compile the discobox-access CLI
    cmds:
      - mkdir -p build
      - cd access && go build -o ../{{.ACCESS_BINARY}} {{.ACCESS_MAIN}}

  build:cp-relay:
    desc: Cross-compile the guest control-plane relays embedded in the Windows server
    # Several targets depend on this and the output is the same set for all of
    # them, so one run per invocation is enough.
    run: once
    cmds:
      # One relay per Windows target architecture. WSL2 does not emulate, so a
      # guest is always the host's architecture and the relay a binary needs is
      # decided by what that binary was built for — but one source tree builds
      # both Windows binaries, so both are produced here and the server picks
      # its own by GOARCH at run time.
      - task: build:cp-relay:arch
        vars: { RELAY_ARCH: amd64 }
      - task: build:cp-relay:arch
        vars: { RELAY_ARCH: arm64 }

  build:cp-relay:arch:
    desc: Cross-compile the guest control-plane relay for one architecture (RELAY_ARCH=)
    requires:
      vars: [RELAY_ARCH]
    vars:
      RELAY_BIN: build/discobox-cp-relay.linux-{{.RELAY_ARCH}}
      RELAY_OUT: server/providers/wslc/relay/artifacts/discobox-cp-relay.linux-{{.RELAY_ARCH}}.gz
    cmds:
      # The relay runs inside a pool guest, which has no Go toolchain, so it is
      # cross-compiled here and embedded in the server binary. Stripped and
      # gzipped it costs about 1 MB. The artifact is gitignored; without it the
      # server still builds and only the wslc provider refuses to start.
      # CGO_ENABLED=0 explicitly: cgo is on by default wherever a native
      # toolchain exists, and cross-compiling to linux from a Mac with it on
      # builds runtime/cgo's Linux C against the macOS SDK and fails. The relay
      # runs in a guest with no libc guarantee, so static is what it wants
      # anyway.
      - cd pool-agent && CGO_ENABLED=0 GOOS=linux GOARCH={{.RELAY_ARCH}} go build -trimpath -ldflags="-s -w" -o ../{{.RELAY_BIN}} ./cmd/discobox-cp-relay
      # Compressed by a Go helper rather than gzip(1) and a shell redirect:
      # Windows ships no gzip, Git's is absent from a PowerShell or cmd PATH,
      # and a gzip whose stdout reaches a console refuses to write at all.
      - go run ./internal/cmd/discobox-gzip {{.RELAY_BIN}} {{.RELAY_OUT}}

  build:vm-guest:
    desc: Build the pool VM guest image and stage it where this host's provider finds it
    # Docker is required to *build* a guest image; it is never required to run
    # one. This is the bootstrap of the bootstrap: with no guest published yet,
    # or with local changes to vm-image/, build it here and every pool on this
    # machine picks it up. Delete the directory to go back to the published
    # image.
    #
    # One image serves both backends, so this is one target: the platform only
    # decides which architecture to build and which provider's local directory
    # to stage it into.
    vars:
      GUEST_PLATFORM: '{{.GUEST_PLATFORM | default (printf "linux/%s" (eq OS "darwin" | ternary "arm64" ARCH))}}'
      GUEST_DIR: '{{.GUEST_DIR | default (eq OS "darwin" | ternary "$HOME/Library/Application Support/discobox/vz/guest/local" "${XDG_DATA_HOME:-$HOME/.local/share}/discobox/libkrun/.images/guest/local")}}'
    cmds:
      - task: stage-vm-artifacts
        vars:
          STAGE_DOCKERFILE: vm-image/Dockerfile
          STAGE_PLATFORM: '{{.GUEST_PLATFORM}}'
          STAGE_DIR: '{{.GUEST_DIR}}'
          STAGE_WHAT: guest

  build:vm-kernel:
    desc: Build the libkrun guest kernel and stage it where the libkrun provider finds it
    # Only libkrun needs this, and only libkrun can use it: it is the
    # libkrunfw-patched kernel, which no other hypervisor boots. It compiles
    # Linux, so it is slow the first time and a BuildKit cache hit afterwards —
    # which is exactly why it is not a stage of the guest image.
    platforms: [linux]
    vars:
      KERNEL_DIR: '{{.KERNEL_DIR | default "${XDG_DATA_HOME:-$HOME/.local/share}/discobox/libkrun/.images/kernel/local"}}'
    cmds:
      - task: stage-vm-artifacts
        vars:
          STAGE_DOCKERFILE: vm-image/kernel/Dockerfile
          STAGE_PLATFORM: linux/amd64
          STAGE_DIR: '{{.KERNEL_DIR}}'
          STAGE_WHAT: kernel

  stage-vm-artifacts:
    internal: true
    # A pool may be booting from the destination right now, so the artifacts are
    # built aside and swapped in rather than written in place: a build writing
    # directly would replace a kernel underneath a VM reading it.
    requires:
      vars: [STAGE_DOCKERFILE, STAGE_PLATFORM, STAGE_DIR, STAGE_WHAT]
    cmds:
      - |
        set -eu
        dest="{{.STAGE_DIR}}"
        staging="$(mktemp -d "${TMPDIR:-/tmp}/discobox-vm-{{.STAGE_WHAT}}.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT
        docker build \
          --platform {{.STAGE_PLATFORM}} \
          --file {{.STAGE_DOCKERFILE}} \
          --output "type=local,dest=$staging" \
          .
        mkdir -p "$(dirname "$dest")"
        rm -rf "$dest"
        mv "$staging" "$dest"
        trap - EXIT
        ls -l "$dest"
        echo "staged {{.STAGE_WHAT}} artifacts in $dest; recreate a pool to boot them"

  build:sandbox-base-image:
    desc: Build the Docker driver's Debian sandbox base image, every sandbox container's and every Docker pool's
    vars:
      BASE_IMAGE: '{{.BASE_IMAGE | default "discobox-sandbox-base:local"}}'
    cmds:
      - docker build -f server/providers/dockerworker/sandbox-image/Dockerfile {{if .DISTRO_IMAGE}}--build-arg DISTRO_IMAGE={{.DISTRO_IMAGE}} {{end}}-t {{.BASE_IMAGE}} server/providers/dockerworker/sandbox-image

  build:ubuntu-sandbox-base:
    desc: Build the sandbox base image on Ubuntu 24.04 (discobox-sandbox-base:ubuntu), so a pool pointed at it provisions the features' Ubuntu paths
    # The base image is Debian, so a box on this one is what applies a
    # feature's `ubuntu:` packages and its `when: {distro: [ubuntu]}` steps,
    # which exe.dev's and boxd's Ubuntu machines take. Point a pool at it with
    # DISCOBOX_DOCKER_SANDBOX_BASE_IMAGE. Its own tag, so the watcher-owned
    # :local one does not move.
    cmds:
      - >-
        go tool task build:sandbox-base-image
        DISTRO_IMAGE=public.ecr.aws/docker/library/ubuntu:24.04
        BASE_IMAGE=discobox-sandbox-base:ubuntu

  build:pool-agent-bundle:
    desc: Build the pool bundle, the pool-agent and pool-builder features FROM scratch
    vars:
      POOL_AGENT_BUNDLE: '{{.POOL_AGENT_BUNDLE | default "discobox-pool-agent-bundle:local"}}'
    cmds:
      # The pool bundle, the features that make a box a pool's (ADR
      # 26-10-24-953 §2), and the Dockerfile's one product.
      - docker build -f pool-agent/Dockerfile -t {{.POOL_AGENT_BUNDLE}} .

  build:agent-bundle:
    desc: Build the agent bundle, the sandbox agent alone FROM scratch
    vars:
      AGENT_BUNDLE: '{{.AGENT_BUNDLE | default "discobox-agent:local"}}'
    cmds:
      # What whoever makes a box places in it before the box applies its
      # bundles (ADR 26-10-24-953 §2), by name: one layer, the agent alone.
      - docker build -f sandbox-agent/Dockerfile --target agent -t {{.AGENT_BUNDLE}} .

  build:platform-bundle:
    desc: Build the platform bundle, every platform feature under /features/ FROM scratch
    vars:
      PLATFORM_BUNDLE: '{{.PLATFORM_BUNDLE | default "discobox-platform:local"}}'
    cmds:
      # IMAGE_LAYER_METADATA is the platform's manifest layer, which the server
      # composes under every harness bundle's own (ADR 26-10-16-423 §2).
      # Compacted independently of any harness's image.json: nothing merges
      # manifests at build time.
      - >-
        docker build -f sandbox-agent/Dockerfile --target platform
        --build-arg IMAGE_LAYER_METADATA="$(jq -c . sandbox-agent/image.json)"
        -t {{.PLATFORM_BUNDLE}} .

  build:images:
    desc: Build the sandbox base image, the pool, agent and platform bundles, and every included harness's bundle
    cmds:
      - task: build:sandbox-base-image
      - task: build:pool-agent-bundle
      - task: build:agent-bundle
      - task: build:platform-bundle
      - task: build:harness-bundles

  build:harness-stub-bundle:
    desc: Build the test-only stub harness's bundle (see test/harness-stub/README.md)
    cmds:
      # The bundle is what `harness create --bundle` reads the manifest from,
      # and what a box on the harness applies.
      - |
        set -eu
        docker build -f test/harness-stub/Dockerfile \
          --build-arg "HARNESS_METADATA=$(jq -c . test/harness-stub/image.json)" \
          -t discobox-harness-stub:local test/harness-stub

  build:terminal-latency-bundle:
    desc: Build the deterministic test-only terminal latency harness's bundle
    cmds:
      - |
        set -eu
        docker build -f test/performance/terminal-latency/image/Dockerfile \
          --build-arg "HARNESS_METADATA=$(jq -c . test/performance/terminal-latency/image/image.json)" \
          -t discobox-terminal-latency:local test/performance/terminal-latency/image

  build:harness-bundles:
    desc: Build each included harness's bundle
    cmds:
      - task: build:harness-bundle
        vars: { HARNESS: codex }
      - task: build:harness-bundle
        vars: { HARNESS: claude-code }
      - task: build:harness-bundle
        vars: { HARNESS: opencode }
      - task: build:harness-bundle
        vars: { HARNESS: copilot }
      - task: build:harness-bundle
        vars: { HARNESS: omp }
      - task: build:harness-bundle
        vars: { HARNESS: pi }
      - task: build:harness-bundle
        vars: { HARNESS: shell }

  build:harness-bundle:
    desc: Build one harness's bundle (HARNESS=codex|claude-code|opencode|copilot|omp|pi|shell)
    requires:
      vars: [HARNESS]
    vars:
      # The bundle is what a harness is published as, what a box on it
      # applies, and what a third party builds FROM.
      HARNESS_BUNDLE: '{{default (printf "discobox-harness-%s:local" .HARNESS) .HARNESS_BUNDLE}}'
      HARNESS_DIR: '{{if eq .HARNESS "codex"}}codex-cli{{else}}{{.HARNESS}}{{end}}'
      IMAGE_CONFIG: harness/{{.HARNESS_DIR}}/image.json
    preconditions:
      - sh: test -f harness/{{.HARNESS_DIR}}/Dockerfile
        msg: "unknown harness: {{.HARNESS}}"
      - sh: test -f harness/{{.HARNESS_DIR}}/image.json
        msg: "harness {{.HARNESS}} has no image.json: every harness bundle names the platform API version it runs on"
    cmds:
      # Built as an argv list rather than an interpolated string: a manifest
      # carries descriptions and env values with spaces in them, and an
      # unquoted command substitution would split one into several arguments.
      - |
        set -eu
        docker build -f harness/{{.HARNESS_DIR}}/Dockerfile \
          --build-arg "HARNESS_METADATA=$(jq -c . {{.IMAGE_CONFIG}})" \
          -t {{.HARNESS_BUNDLE}} .

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobox-server with debugger-friendly flags
    cmds:
      - mkdir -p build
      - cd server && go build -gcflags="all=-N -l" -o ../{{.BINARY}} {{.SERVER_MAIN}}

  debug:
    desc: Build and run discobox-server under Delve
    deps:
      - debug-build
    env:
      # See `run` below.
      DISCOBOX_ENV_FILE: .env
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobox-server
    deps:
      - build:server
    env:
      # The server's own default is `.discobox-server.env`, so a discobox-server
      # binary does not load whatever `.env` sits in the directory it was
      # started from. This is the repository's development loop, where `.env` is
      # exactly the file to read: the image watcher writes the development image
      # tags there. Named here, as `.wnb.yaml` names it for `task dev`.
      DISCOBOX_ENV_FILE: .env
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: "Run the server and Docker image watcher (`-- N` shifts the API port by N)"
    deps:
      - dev:server
      - dev:docker-image-watch

  dev:nested-claude-auth:
    desc: "Inside a discobox, configure the running dev server's claude-code harness with this sandbox's own Claude Code login (`-- --test` proves it works first)"
    cmds:
      - scripts/nested-claude-auth.sh {{.CLI_ARGS}}

  dev:released-images:
    desc: Hot-reload local binaries using an existing release manifest (MANIFEST=path)
    requires:
      vars: [MANIFEST]
    env:
      DISCOBOX_RELEASE_MANIFEST: '{{.MANIFEST}}'
    cmds:
      # A subprocess carries this task's environment into the development loop.
      - go tool task dev:server

  dev:released-server:
    desc: Run a manifest's released server using the local CLI (MANIFEST=path)
    requires:
      vars: [MANIFEST]
    deps: [build:cli]
    env:
      DISCOBOX_RELEASE_MANIFEST: '{{.MANIFEST}}'
      DISCOBOX_SERVER_BINARY: ''
    cmds:
      - ./{{.CLI_BINARY}} admin server

  dev:server:
    desc: Run discobox-server with watchnbuild hot reload on the local socket
    deps:
      # The guest relay is embedded into the server binary at compile time, so
      # it has to exist before the first build. Without it a Windows dev server
      # starts fine and then fails every wslc pool with ErrNotBuilt, which reads
      # like a provider bug rather than a missing build step. Hot rebuilds reuse
      # the artifact; rerun `task build:cp-relay` after changing the relay.
      - build:cp-relay
    env:
      # A development server listens where every other server does: the local
      # socket or named pipe, plus iroh. So `./build/discobox` reaches it with
      # no --server and no port to look up, and the dev loop exercises the
      # transport users actually get.
      #
      # No TCP endpoint. It is opt-in everywhere else because it is a
      # machine-wide surface — and on Windows a firewall prompt (server/DESIGN.md
      # "Listen Endpoints") — and defaulting it here made the one configuration
      # nobody ships the only one anybody develops against. Ask for it when a
      # tool needs a URL; the local socket comes along on its own, iroh does not:
      #     DISCOBOX_SERVER_LISTEN=http://127.0.0.1:8080 go tool task dev
      #
      # Overridden from the environment, not from .env, which `.wnb.yaml` has
      # the server load via DISCOBOX_ENV_FILE: godotenv does not replace a
      # variable already set, and these are set here.
      #
      # DEV_LISTEN names iroh://, so the server binds an iroh endpoint and logs
      # the ID to dial it with. Reaching it needs that ID in
      # <data dir>/authorized_ids — `discobox admin peer id` prints the one to add.
      # DISCOBOX_DEV_IROH=0 drops the iroh listener and keeps the socket.
      DISCOBOX_SERVER_LISTEN: '{{.DISCOBOX_SERVER_LISTEN | default .DEV_LISTEN}}'
      # Purge archived discoboxes after minutes rather than the production day.
      # A development tree costs as much disk as a production one and is made
      # and thrown away many times an afternoon, so a day of retention is a day
      # of dead trees. This moves the server-wide default only: a project that
      # set its own --archive-retention still gets it.
      #
      # Set here, so .env cannot raise it: godotenv does not replace a variable
      # that is already set, and here losing that argument costs archived
      # discoboxes that can no longer be unarchived rather than a port. Keep one
      # for longer per project (`discobox admin project update <p>
      # --archive-retention 24h`), or for the whole server on the command line:
      #     DISCOBOX_ARCHIVE_RETENTION=24h go tool task dev
      DISCOBOX_ARCHIVE_RETENTION: '{{.DISCOBOX_ARCHIVE_RETENTION | default "15m"}}'
    cmds:
      - touch .env
      # Through discobox-dev-lock, so a second `task dev` in this checkout says
      # so and stops instead of joining the loop: each server it starts asks the
      # incumbent to shut down, the incumbent's own supervisor restarts it, and
      # the two displace each other every retry interval for as long as both
      # run. See internal/cmd/discobox-dev-lock.
      - go run ./internal/cmd/discobox-dev-lock server go tool watchnbuild

  dev:cli:
    desc: Recompile the discobox CLI with watchnbuild hot reload (see .wnb.cli.yaml)
    deps:
      # Embedded at compile time, like the server's relay; rerun
      # `task build:clipwatch` after changing the helper.
      - build:clipwatch
    cmds:
      - go run ./internal/cmd/discobox-dev-lock cli go tool watchnbuild -config .wnb.cli.yaml

  dev:docker-image-watch:
    desc: Build and continuously rebuild pool, sandbox, and harness development images
    cmds:
      # The watcher runs buildx:builder only in local-build mode (Linux by
      # default). macOS/Windows send build recipes to the pool without Docker.
      - go run ./internal/cmd/discobox-dev-lock docker-image-watch go run ./internal/cmd/discobox-docker-image-watch -bundle-builder {{.BUILDX_BUILDER}}

  dev:pool-agent-image-watch:
    desc: Alias for dev:docker-image-watch
    cmds:
      - task: dev:docker-image-watch

  secret-dump:
    desc: "Dev tool: print a stored secret's cleartext value (usage: go tool task secret-dump -- <secret-id>)"
    cmds:
      - cd server && go run ./cmd/discobox-secret-dump {{.CLI_ARGS}}

  test:
    desc: Run application Go tests in Dagger
    cmds:
      - dagger api call tests

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - cd server && DISCOBOX_DOCKER_INTEGRATION=1 go test ./providers/docker -run Integration -count=1 -v

  test:vz-stress:
    desc: "Churn VSOCK on a real vz guest while probing a Unix listener (macOS). GUEST=<dir with vmlinux, initrd.img, root.ext4>, or NO_VM=1 for the control"
    # Opt-in and bounded: CYCLES (VSOCK connections, default 10000), DURATION
    # (default 30m), WORKERS (default 8). PAUSE (e.g. 90s) pauses the guest
    # through Virtualization.framework mid-churn and reports how far its clock
    # fell behind and how fast it recovered. Failure artifacts land in
    # build/vz-stress. The test boots a VM, so its binary is compiled and signed
    # rather than run through `go test`.
    platforms: [darwin]
    vars:
      TEST_BINARY: build/vzvm-stress.test
      ARTIFACTS: build/vz-stress
    cmds:
      - |
        if [ -z "{{.GUEST}}" ] && [ -z "{{.NO_VM}}" ]; then
          echo "test:vz-stress: GUEST=<guest image directory> or NO_VM=1 is required" >&2
          exit 1
        fi
      - mkdir -p build {{.ARTIFACTS}}
      - cd server && go test -c -o ../{{.TEST_BINARY}} ./providers/vz/internal/vzvm
      - task: sign
        vars: { SIGN_BINARY: '{{.TEST_BINARY}}' }
      - >-
        DISCOBOX_VZ_STRESS_GUEST="{{.GUEST}}"
        DISCOBOX_VZ_STRESS_NO_VM="{{.NO_VM}}"
        DISCOBOX_VZ_STRESS_CYCLES="{{.CYCLES}}"
        DISCOBOX_VZ_STRESS_DURATION="{{.DURATION}}"
        DISCOBOX_VZ_STRESS_WORKERS="{{.WORKERS}}"
        DISCOBOX_VZ_STRESS_PAUSE="{{.PAUSE}}"
        DISCOBOX_VZ_STRESS_ARTIFACTS="$PWD/{{.ARTIFACTS}}"
        ./{{.TEST_BINARY}} -test.run TestVSOCKChurnKeepsUnixListenerServing -test.count=1 -test.v -test.timeout 45m

  test:docker:bats:
    desc: Run Docker-backed CLI Bats integration tests (BATS_SUITE=<path> for one file)
    vars:
      BATS_SUITE: '{{.BATS_SUITE | default "test/bats"}}'
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats {{.BATS_SUITE}}
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats {{.BATS_SUITE}}
        fi

  perf:terminal:
    desc: Measure run/direct-attach terminal latency under output load against task dev
    cmds:
      - test/performance/terminal-latency/run.sh

  eval:judge:
    desc: "Ask a harness's judge about the recorded cases in test/judge-evals and score it (WRAPPER=harness/codex-cli/prompt.sh, RUNS=5; extra flags after --)"
    cmds:
      # It calls a real model through the harness's own wrapper, with this
      # environment's CLI and credentials, so it is never part of test:all.
      - go run ./internal/cmd/discobox-judge-eval -wrapper '{{.WRAPPER | default "harness/claude-code/prompt.sh"}}' -runs {{.RUNS | default "5"}} {{.CLI_ARGS}} test/judge-evals/cases

  eval:judge:jev:
    desc: "Ask Jev about the recorded cases in test/judge-evals the way a server that judges with it does, and score it (needs DISCOBOX_JEV_API_KEY; RUNS=1; extra flags after --)"
    cmds:
      # Jev is calibrated and near-deterministic, so one run per case is the
      # default rather than the five a sampled LLM needs.
      - go run ./internal/cmd/discobox-judge-eval -jev -runs {{.RUNS | default "1"}} {{.CLI_ARGS}} test/judge-evals/cases

  eval:judge:use-cases:
    desc: "Judge the same work under command-list uses and use-case uses, and compare friction and leaks (WRAPPER=, RUNS=3, OUT=build/use-case-evals; extra flags after --)"
    vars:
      OUT: '{{.OUT | default "build/use-case-evals"}}'
    cmds:
      # Like eval:judge it calls a real model. A style's cases failing is the
      # measurement, not an error, so each run is let fail and score.mjs says
      # what it cost.
      - node test/judge-evals/use-cases/generate.mjs {{.OUT}}
      - for: [command, use-case, no-never]
        cmd: go run ./internal/cmd/discobox-judge-eval -wrapper '{{.WRAPPER | default "harness/claude-code/prompt.sh"}}' -runs {{.RUNS | default "3"}} -json {{.OUT}}/{{.ITEM}}.report.json {{.CLI_ARGS}} {{.OUT}}/{{.ITEM}} > {{.OUT}}/{{.ITEM}}.txt || true
      - node test/judge-evals/use-cases/score.mjs {{.OUT}}

  eval:judge:use-cases:authored:
    desc: "Have a headless Claude Code write the uses and policy for each use-case scenario's task with the discobox-access skill, then judge the scenario's work under them (AUTHOR_MODEL=sonnet, RUNS=3, OUT=build/use-case-evals)"
    vars:
      OUT: '{{.OUT | default "build/use-case-evals"}}'
    env:
      # author.sh reads its model from the environment; a task variable is
      # not one until it is mapped here.
      AUTHOR_MODEL: '{{.AUTHOR_MODEL | default "sonnet"}}'
    cmds:
      - test/judge-evals/use-cases/author.sh {{.OUT}}
      - node test/judge-evals/use-cases/generate.mjs {{.OUT}} --authored {{.OUT}}/authored.json
      - go run ./internal/cmd/discobox-judge-eval -wrapper '{{.WRAPPER | default "harness/claude-code/prompt.sh"}}' -runs {{.RUNS | default "3"}} -json {{.OUT}}/authored.report.json {{.CLI_ARGS}} {{.OUT}}/authored > {{.OUT}}/authored.txt || true
      - node test/judge-evals/use-cases/score.mjs {{.OUT}}

  test:e2e:wslc:
    desc: "Run the wslc (Windows) provider e2e tests. Requires: Windows with WSL Containers"
    cmds:
      # These boot a real wslc VM, so they are gated off by default. The gate is
      # recorded here rather than only in the test file, so the suite stays
      # runnable by name instead of being forgotten.
      - cd server && DISCOBOX_WSLC_E2E=1 go test ./providers/wslc -count=1 -v

  test:e2e:docker:
    desc: "Run the pool runtime e2e tests against a local Docker daemon. Requires: dockerd"
    cmds:
      - cd server && DISCOBOX_E2E=1 go test ./providers/poolruntime -count=1 -v

  test:e2e:libkrun:
    desc: "Run the libkrun provider e2e tests. Requires: Linux/KVM, libkrun and passt on the path, plus the DISCOBOX_LIBKRUN_E2E_* variables"
    cmds:
      # Unlike the other suites this one needs artifacts the repository does not
      # build, so it fails loudly listing what is missing rather than skipping
      # silently and looking like a pass. The two directories are what
      # `vm:build` and `vm:build-kernel` write on an amd64 Linux machine:
      # build/vm and build/vm-kernel. Both have to be amd64 — that is the only
      # architecture libkrun boots — and an override directory carries no
      # platform, so nothing downstream can catch an arm64 root filesystem.
      - |
        missing=""
        for v in DISCOBOX_LIBKRUN_E2E_GUEST_DIR DISCOBOX_LIBKRUN_E2E_KERNEL_DIR DISCOBOX_LIBKRUN_E2E_DOCKER; do
          eval "value=\${$v:-}"
          if [ -z "$value" ]; then missing="$missing $v"; fi
        done
        if [ -n "$missing" ]; then
          echo "libkrun e2e needs:$missing" >&2
          exit 1
        fi
        cd server && go test ./providers/libkrun -count=1 -v

  test:e2e:terminal-latency:
    desc: "Run the terminal latency e2e test. Requires: a running `task dev` server"
    cmds:
      - cd cli && DISCOBOX_TERMINAL_LATENCY_E2E=1 go test ./internal/cli -run TerminalLatency -count=1 -v

  test:all:
    desc: Run application Go tests in Dagger
    cmds:
      - dagger api call tests

  check:
    desc: Run Dagger static checks
    cmds:
      - dagger api call static {{.CLI_ARGS}}

  check:deadcode:
    desc: Run the static check graph including deadcode
    cmds:
      - dagger api call static

  check:windows:
    desc: Run the static check graph including Windows cross-typecheck
    cmds:
      - dagger api call static

  check-hooks:
    desc: Run hooks checks
    cmds:
      - go tool discobox-hooks check

  rerun-hooks:
    desc: Re-run failed or never-run hooks
    cmds:
      - go tool discobox-hooks run all

  check:dev-build:
    desc: Print watchnbuild's failure reports from `task dev`, and fail if there are any
    # The rule is not here: scripts/wnb-failure-reports.sh owns it, so this and
    # the hook of the same name run the same check (ADR 0066 §1).
    cmds:
      - scripts/wnb-failure-reports.sh

  check:dockerfile-builds:
    desc: Test-build every Dockerfile (or just the ones passed as CLI arguments)
    # The build rules are not here: each image's own build target owns them, and
    # this dispatches to those. See scripts/dockerfile-test-builds.sh.
    cmds:
      - scripts/dockerfile-test-builds.sh {{.CLI_ARGS}}

  check:dockerfiles:
    desc: Validate Dockerfile source and import coverage
    cmds:
      - dagger api call dockerfiles

  check:dockerfile-deps:
    desc: Validate Dockerfile source and import coverage
    cmds:
      - dagger api call dockerfiles

  check:shell:
    desc: Check shell scripts in the Dagger toolchain
    cmds:
      - dagger api call shell

  check:mermaid:
    desc: Validate Mermaid in the Dagger toolchain
    cmds:
      - dagger api call mermaid

  logo:cells:
    desc: Rebuild the console mark's cell data from its terminal capture
    # The marketing site consumes the output of this and the art in
    # assets/brand; it lives in discobox-ai/site and syncs them with its own
    # `pnpm gen:logo`.
    cmds:
      - node scripts/logo-cells.mjs

  fmt:

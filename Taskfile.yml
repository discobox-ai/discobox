version: "3"

vars:
  BINARY: build/discobot-server
  MAIN: ./cmd/discobot-server
  CLI_BINARY: build/disco2
  CLI_MAIN: ./cmd/disco2
  PACKAGES: ./...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Compile discobot-server and disco2 CLI
    cmds:
      - go build -o {{.BINARY}} {{.MAIN}}
      - go build -o {{.CLI_BINARY}} {{.CLI_MAIN}}

  build:cli:
    desc: Compile disco2 CLI
    cmds:
      - go build -o {{.CLI_BINARY}} {{.CLI_MAIN}}

  build:worker-agent-image:
    desc: Build the systemd Docker VM worker image
    cmds:
      - docker build -f Dockerfile.worker-agent -t disco2-worker-agent:local .

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobot-server with debugger-friendly flags
    cmds:
      - go build -gcflags="all=-N -l" -o {{.BINARY}} {{.MAIN}}

  debug:
    desc: Build and run discobot-server under Delve
    deps:
      - debug-build
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobot-server
    deps:
      - build
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: Run discobot-server with Air hot reload
    cmds:
      - go tool air

  test:
    desc: Run root module tests
    cmds:
      - go test {{.PACKAGES}}

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - DISCO2_DOCKER_INTEGRATION=1 go test ./internal/sandbox/docker -run Integration -count=1 -v

  test:dockervm:bats:
    desc: Run Docker VM provider CLI Bats integration test
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats test/bats/dockervm_cli.bats
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats test/bats/dockervm_cli.bats
        fi

  test:all:
    desc: Run root and nested module tests
    cmds:
      - go test {{.PACKAGES}}
      - cd gormdb && go test ./...
      - cd jobqueue && go test ./...

  check:
    desc: Run static checks
    cmds:
      - go tool golangci-lint run

  check:fix:
    desc: Run static checks and apply safe fixes
    cmds:
      - go tool golangci-lint run --fix

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -rf build build-errors.log

version: "3"

vars:
  # What `task dev` adds to the local socket the server always binds. Every
  # build carries the transport now (ADR 0067), so this applies everywhere;
  # DISCOBOX_DEV_IROH=0 drops it for anyone who wants the socket alone.
  DEV_LISTEN: '{{if ne .DISCOBOX_DEV_IROH "0"}}iroh://{{end}}'
  # Windows resolves an extensionless name through PATHEXT, so `discobox` there
  # finds `discobox.exe` first. Without the suffix a build lands beside whatever
  # .exe was left by an earlier one, and the shell keeps running the stale
  # binary while the build reports success.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  BINARY: build/discobox-server{{.EXE}}
  SERVER_MAIN: ./cmd/discobox-server
  CLI_BINARY: build/discobox{{.EXE}}
  CLI_MAIN: ./cmd/discobox
  ACCESS_BINARY: build/discobox-access{{.EXE}}
  ACCESS_MAIN: ./cmd/discobox-access
  PACKAGES: ./...
  # ghcr.io/<owner>, so a fork publishes into its own namespace instead of the
  # upstream one. Actions knows the owner; elsewhere it comes from the origin
  # remote, and a checkout whose origin is not GitHub leaves this empty rather
  # than guessing. Override with REGISTRY=.
  #
  # Task evaluates this for every invocation, `ci:test` included, so it uses
  # nothing but shell word splitting: a Windows runner has git on PATH but no
  # sed, and reaching for one would fail the whole run before a test starts.
  REGISTRY:
    sh: |
      owner="${GITHUB_REPOSITORY_OWNER:-}"
      if [ -z "$owner" ]; then
        url="$(git remote get-url origin 2>/dev/null)"
        case "$url" in
          git@github.com:*) path="${url#git@github.com:}" ;;
          https://github.com/*) path="${url#https://github.com/}" ;;
          *) path="" ;;
        esac
        owner="${path%%/*}"
      fi
      if [ -n "$owner" ]; then printf 'ghcr.io/%s' "$owner"; fi
  # owner/name of the repository releases are cut from, for the URLs a Homebrew
  # formula points at.
  RELEASE_REPO:
    sh: |
      repo="${GITHUB_REPOSITORY:-}"
      if [ -z "$repo" ]; then
        url="$(git remote get-url origin 2>/dev/null)"
        case "$url" in
          git@github.com:*) repo="${url#git@github.com:}" ;;
          https://github.com/*) repo="${url#https://github.com/}" ;;
        esac
        repo="${repo%.git}"
      fi
      printf %s "$repo"
  # The tag being acted on, in order: `task <target> -- v1.2.3`, RELEASE_TAG=,
  # then the tag a workflow is running for. Resolved once so a tag typed on the
  # command line reaches DOT_RELEASE below as well as the task using it —
  # they disagreeing is how `task brew:publish -- v1.2.3` would quietly decide
  # v1.2.3 was a prerelease.
  # The release tag: `-- v1.2.3` on the command line, else RELEASE_TAG, else the
  # tag the workflow is running from.
  #
  # The last argument that is not a flag, so `-- --prerelease v1.2.3` still
  # names v1.2.3 (see ALLOW_PRERELEASE).
  TAG:
    sh: |
      args="{{.CLI_ARGS}}"
      tag=""
      for word in $args; do
        case "$word" in
          -*) ;;
          *) tag="$word" ;;
        esac
      done
      if [ -z "$tag" ]; then tag="${RELEASE_TAG:-}"; fi
      if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME:-}"; fi
      printf %s "$tag"
  # Publishing a prerelease to a package channel, said out loud: `task
  # brew:publish -- --prerelease v1.2.3-alpha.4`. Nothing automatic sets it,
  # which is the point — an alpha reaches a channel only because somebody typed
  # the flag.
  ALLOW_PRERELEASE:
    sh: |
      args="{{.CLI_ARGS}}"
      for word in $args; do
        case "$word" in
          --prerelease) printf yes ;;
        esac
      done
  # Which Homebrew channel a brew: target acts on: `task brew:publish -- --dev
  # v1.2.3` writes discobox-dev.rb rather than discobox.rb (ADR 0105).
  BREW_DEV:
    sh: |
      args="{{.CLI_ARGS}}"
      for word in $args; do
        case "$word" in
          --dev) printf yes ;;
        esac
      done
  # Whether that tag is a dot release: exactly vMAJOR.MINOR.PATCH.
  # An explicit prerelease (v1.2.3-rc1), a partial tag (v1.2), or anything else
  # is not.
  #
  # This is the *latest* channel's rule, not the stable one (ADR 0105). A dot
  # release moves ghcr's :latest and the discobox-dev formula the moment it is
  # cut; an explicit prerelease exists only under its own tag, reachable by
  # pinning. Whether a release is *stable* is not a property of its tag at all —
  # it is a human clearing the prerelease box on GitHub, later.
  #
  # Computed once because several things ask it and copies of the rule would
  # drift. Pure shell: this is evaluated on every invocation, including on the
  # Windows runner, which has neither sed nor grep.
  DOT_RELEASE:
    sh: |
      tag="{{.TAG}}"
      case "$tag" in
        v*.*.*)
          rest="${tag#v}"
          case "$rest" in
            *[!0-9.]*) ;;
            *)
              major="${rest%%.*}"; tmp="${rest#*.}"
              minor="${tmp%%.*}"; patch="${tmp#*.}"
              case "$patch" in
                *.*|"") ;;
                *) case "$major$minor$patch" in
                     ""|*[!0-9]*) ;;
                     *) printf yes ;;
                   esac ;;
              esac
              ;;
          esac
          ;;
      esac
  # Multi-architecture and multi-output builds both need the docker-container
  # driver; the default docker driver supports neither.
  BUILDX_BUILDER: discobox
  LINT_BIN: golangci-lint{{.EXE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build binaries and all local Docker images
    cmds:
      # The guest relay is embedded into the server binary, so it must be
      # cross-compiled before the server is linked.
      - task: build:cp-relay
      - task: build:server
      - task: build:cli
      - task: build:access
      - task: build:images

  build:server:
    desc: Compile discobox-server
    cmds:
      - mkdir -p build
      - cd server && go build -o ../{{.BINARY}} {{.SERVER_MAIN}}
      - task: sign
        vars: { SIGN_BINARY: '{{.BINARY}}' }

  sign:
    desc: Codesign SIGN_BINARY with the Virtualization entitlement (macOS only)
    # Creating a Virtualization.framework VM requires the entitlement, and it
    # only exists on a signed binary, so every rebuild has to be re-signed. This
    # is why `go run` cannot start a macOS server that runs pools. Ad-hoc
    # signing is enough locally; distribution needs Developer ID and
    # notarization. Task skips the whole target off darwin.
    #
    # It takes a binary rather than naming one, which is what let the rule move
    # when the code did: the CLI ran the server in-process and needed the
    # entitlement for it (ADR 0066 §5), and now that the server is a separate
    # program again (ADR 0099) discobox-server is the only thing signed.
    platforms: [darwin]
    vars:
      ENTITLEMENTS: server/providers/vz/vz.entitlements
    cmds:
      - |
        set -eu
        if [ -z "{{.SIGN_BINARY}}" ]; then
          echo "sign: SIGN_BINARY is required" >&2
          exit 1
        fi
        codesign --force --sign - --entitlements {{.ENTITLEMENTS}} "{{.SIGN_BINARY}}"

  build:cli:
    desc: Compile discobox CLI
    # No dependency on the server and nothing to sign: the CLI runs the server
    # as a separate program (ADR 0099), so the guest relay and the
    # Virtualization entitlement are build:server's business. `task build`
    # writes both binaries into build/, which is what makes a development CLI
    # find a server with nothing configured.
    cmds:
      - mkdir -p build
      - rm -f {{.CLI_BINARY}}
      - cd cli && go build -o ../{{.CLI_BINARY}} {{.CLI_MAIN}}


  build:access:
    desc: Compile the discobox-access CLI
    cmds:
      - mkdir -p build
      - cd access && go build -o ../{{.ACCESS_BINARY}} {{.ACCESS_MAIN}}

  build:cp-relay:
    desc: Cross-compile the guest control-plane relays embedded in the Windows server
    # Several targets depend on this and the output is the same set for all of
    # them, so one run per invocation is enough.
    run: once
    cmds:
      # One relay per Windows target architecture. WSL2 does not emulate, so a
      # guest is always the host's architecture and the relay a binary needs is
      # decided by what that binary was built for — but one source tree builds
      # both Windows binaries, so both are produced here and the server picks
      # its own by GOARCH at run time.
      - task: build:cp-relay:arch
        vars: { RELAY_ARCH: amd64 }
      - task: build:cp-relay:arch
        vars: { RELAY_ARCH: arm64 }

  build:cp-relay:arch:
    desc: Cross-compile the guest control-plane relay for one architecture (RELAY_ARCH=)
    requires:
      vars: [RELAY_ARCH]
    vars:
      RELAY_BIN: build/discobox-cp-relay.linux-{{.RELAY_ARCH}}
      RELAY_OUT: server/providers/wslc/relay/artifacts/discobox-cp-relay.linux-{{.RELAY_ARCH}}.gz
    cmds:
      # The relay runs inside a pool guest, which has no Go toolchain, so it is
      # cross-compiled here and embedded in the server binary. Stripped and
      # gzipped it costs about 1 MB. The artifact is gitignored; without it the
      # server still builds and only the wslc provider refuses to start.
      # CGO_ENABLED=0 explicitly: cgo is on by default wherever a native
      # toolchain exists, and cross-compiling to linux from a Mac with it on
      # builds runtime/cgo's Linux C against the macOS SDK and fails. The relay
      # runs in a guest with no libc guarantee, so static is what it wants
      # anyway.
      - cd pool-agent && CGO_ENABLED=0 GOOS=linux GOARCH={{.RELAY_ARCH}} go build -trimpath -ldflags="-s -w" -o ../{{.RELAY_BIN}} ./cmd/discobox-cp-relay
      # Compressed by a Go helper rather than gzip(1) and a shell redirect:
      # Windows ships no gzip, Git's is absent from a PowerShell or cmd PATH,
      # and a gzip whose stdout reaches a console refuses to write at all.
      - go run ./internal/cmd/discobox-gzip {{.RELAY_BIN}} {{.RELAY_OUT}}

  build:vm-guest:
    desc: Build the pool VM guest image and stage it where this host's provider finds it
    # Docker is required to *build* a guest image; it is never required to run
    # one. This is the bootstrap of the bootstrap: with no guest published yet,
    # or with local changes to vm-image/, build it here and every pool on this
    # machine picks it up. Delete the directory to go back to the published
    # image.
    #
    # One image serves both backends, so this is one target: the platform only
    # decides which architecture to build and which provider's local directory
    # to stage it into.
    vars:
      GUEST_PLATFORM: '{{.GUEST_PLATFORM | default (printf "linux/%s" (eq OS "darwin" | ternary "arm64" ARCH))}}'
      GUEST_DIR: '{{.GUEST_DIR | default (eq OS "darwin" | ternary "$HOME/Library/Application Support/discobox/vz/guest/local" "${XDG_DATA_HOME:-$HOME/.local/share}/discobox/libkrun/.images/guest/local")}}'
    cmds:
      - task: stage-vm-artifacts
        vars:
          STAGE_DOCKERFILE: vm-image/Dockerfile
          STAGE_PLATFORM: '{{.GUEST_PLATFORM}}'
          STAGE_DIR: '{{.GUEST_DIR}}'
          STAGE_WHAT: guest

  build:vm-kernel:
    desc: Build the libkrun guest kernel and stage it where the libkrun provider finds it
    # Only libkrun needs this, and only libkrun can use it: it is the
    # libkrunfw-patched kernel, which no other hypervisor boots. It compiles
    # Linux, so it is slow the first time and a BuildKit cache hit afterwards —
    # which is exactly why it is not a stage of the guest image.
    platforms: [linux]
    vars:
      KERNEL_DIR: '{{.KERNEL_DIR | default "${XDG_DATA_HOME:-$HOME/.local/share}/discobox/libkrun/.images/kernel/local"}}'
    cmds:
      - task: stage-vm-artifacts
        vars:
          STAGE_DOCKERFILE: vm-image/kernel/Dockerfile
          STAGE_PLATFORM: linux/amd64
          STAGE_DIR: '{{.KERNEL_DIR}}'
          STAGE_WHAT: kernel

  stage-vm-artifacts:
    internal: true
    # A pool may be booting from the destination right now, so the artifacts are
    # built aside and swapped in rather than written in place: a build writing
    # directly would replace a kernel underneath a VM reading it.
    requires:
      vars: [STAGE_DOCKERFILE, STAGE_PLATFORM, STAGE_DIR, STAGE_WHAT]
    cmds:
      - |
        set -eu
        dest="{{.STAGE_DIR}}"
        staging="$(mktemp -d "${TMPDIR:-/tmp}/discobox-vm-{{.STAGE_WHAT}}.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT
        docker build \
          --platform {{.STAGE_PLATFORM}} \
          --file {{.STAGE_DOCKERFILE}} \
          --output "type=local,dest=$staging" \
          .
        mkdir -p "$(dirname "$dest")"
        rm -rf "$dest"
        mv "$staging" "$dest"
        trap - EXIT
        ls -l "$dest"
        echo "staged {{.STAGE_WHAT}} artifacts in $dest; recreate a pool to boot them"

  build:base-image:
    desc: Build the shared Debian/Docker/systemd base both agent images build FROM
    vars:
      BASE_IMAGE: '{{.BASE_IMAGE | default "discobox-base:local"}}'
    cmds:
      - docker build -f base-image/Dockerfile -t {{.BASE_IMAGE}} base-image

  build:pool-agent-image:
    desc: Build the systemd Docker pool image
    deps: [build:base-image]
    vars:
      BASE_IMAGE: '{{.BASE_IMAGE | default "discobox-base:local"}}'
      POOL_AGENT_IMAGE: '{{.POOL_AGENT_IMAGE | default "discobox-pool-agent:local"}}'
    cmds:
      - docker build -f pool-agent/Dockerfile --build-arg BASE_IMAGE={{.BASE_IMAGE}} -t {{.POOL_AGENT_IMAGE}} .

  build:sandbox-agent-image:
    desc: Build the Debian sandbox agent image
    deps: [build:base-image]
    vars:
      BASE_IMAGE: '{{.BASE_IMAGE | default "discobox-base:local"}}'
      SANDBOX_AGENT_IMAGE: '{{.SANDBOX_AGENT_IMAGE | default "discobox-sandbox-agent:local"}}'
    cmds:
      # IMAGE_LAYER_METADATA is the manifest layer every image built FROM this
      # one inherits (ADR 0086 §2). Compacted independently of any harness's
      # own image.json: nothing merges manifests at build time.
      - >-
        docker build -f sandbox-agent/Dockerfile
        --build-arg BASE_IMAGE={{.BASE_IMAGE}}
        --build-arg IMAGE_LAYER_METADATA="$(jq -c . sandbox-agent/image.json)"
        -t {{.SANDBOX_AGENT_IMAGE}} .

  build:images:
    desc: Build the shared base, pool, sandbox base, and all included harness images
    cmds:
      - task: build:pool-agent-image
      - task: build:harness-images

  build:harness-stub-image:
    desc: Build the test-only stub harness image (see test/harness-stub/README.md)
    cmds:
      - >-
        docker build -f test/harness-stub/Dockerfile
        --build-arg SANDBOX_AGENT_IMAGE="$(grep -s '^DISCOBOX_DEFAULT_SANDBOX_IMAGE=' .env | cut -d= -f2- | grep . || echo discobox-sandbox-agent:local)"
        --build-arg HARNESS_METADATA="$(jq -c . test/harness-stub/image.json)"
        -t discobox-harness-stub:local test/harness-stub

  build:terminal-latency-image:
    desc: Build the deterministic test-only terminal latency harness image
    cmds:
      - >-
        docker build -f test/performance/terminal-latency/image/Dockerfile
        --build-arg SANDBOX_AGENT_IMAGE="$(grep -s '^DISCOBOX_DEFAULT_SANDBOX_IMAGE=' .env | cut -d= -f2- | grep . || echo discobox-sandbox-agent:local)"
        --build-arg HARNESS_METADATA="$(jq -c . test/performance/terminal-latency/image/image.json)"
        -t discobox-terminal-latency:local test/performance/terminal-latency/image

  build:harness-images:
    desc: Build the sandbox base and one local image for each included harness
    cmds:
      - task: build:sandbox-agent-image
      - task: build:harness-image
        vars: { HARNESS: codex }
      - task: build:harness-image
        vars: { HARNESS: claude-code }
      - task: build:harness-image
        vars: { HARNESS: shell }

  build:harness-image:
    desc: Build one harness-specific sandbox image (HARNESS=codex|claude-code, SANDBOX_AGENT_IMAGE defaults to the local base)
    requires:
      vars: [HARNESS]
    vars:
      SANDBOX_AGENT_IMAGE: '{{default "discobox-sandbox-agent:local" .SANDBOX_AGENT_IMAGE}}'
      HARNESS_IMAGE: '{{default (printf "discobox-harness-%s:local" .HARNESS) .HARNESS_IMAGE}}'
      HARNESS_DIR: '{{if eq .HARNESS "codex"}}codex-cli{{else}}{{.HARNESS}}{{end}}'
      IMAGE_CONFIG: harness/{{.HARNESS_DIR}}/image.json
    preconditions:
      - sh: test -f harness/{{.HARNESS_DIR}}/Dockerfile
        msg: "unknown harness: {{.HARNESS}}"
    cmds:
      # A harness that declares nothing has no image.json and takes no metadata
      # argument: its whole manifest is the base layer it inherits (ADR 0086
      # §2), which is what `shell` is.
      - |
        set -eu
        # Built as an argv list rather than an interpolated string: a manifest
        # carries descriptions and env values with spaces in them, and an
        # unquoted command substitution would split one into several arguments.
        set -- docker build -f harness/{{.HARNESS_DIR}}/Dockerfile \
          --build-arg "SANDBOX_AGENT_IMAGE={{.SANDBOX_AGENT_IMAGE}}"
        if [ -f {{.IMAGE_CONFIG}} ]; then
          set -- "$@" --build-arg "HARNESS_METADATA=$(jq -c . {{.IMAGE_CONFIG}})"
        fi
        exec "$@" -t {{.HARNESS_IMAGE}} harness/{{.HARNESS_DIR}}

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobox-server with debugger-friendly flags
    cmds:
      - mkdir -p build
      - cd server && go build -gcflags="all=-N -l" -o ../{{.BINARY}} {{.SERVER_MAIN}}

  debug:
    desc: Build and run discobox-server under Delve
    deps:
      - debug-build
    env:
      # See `run` below.
      DISCOBOX_ENV_FILE: .env
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobox-server
    deps:
      - build:server
    env:
      # The server's own default is `.discobox-server.env`, so a discobox-server
      # binary does not load whatever `.env` sits in the directory it was
      # started from. This is the repository's development loop, where `.env` is
      # exactly the file to read: the image watcher writes the development image
      # tags there. Named here, as `.wnb.yaml` names it for `task dev`.
      DISCOBOX_ENV_FILE: .env
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: "Run the server and Docker image watcher (`-- N` shifts the API port by N)"
    deps:
      - dev:server
      - dev:docker-image-watch

  dev:server:
    desc: Run discobox-server with watchnbuild hot reload on the local socket
    deps:
      # The guest relay is embedded into the server binary at compile time, so
      # it has to exist before the first build. Without it a Windows dev server
      # starts fine and then fails every wslc pool with ErrNotBuilt, which reads
      # like a provider bug rather than a missing build step. Hot rebuilds reuse
      # the artifact; rerun `task build:cp-relay` after changing the relay.
      - build:cp-relay
    env:
      # A development server listens where every other server does: the local
      # socket or named pipe, plus iroh. So `./build/discobox` reaches it with
      # no --server and no port to look up, and the dev loop exercises the
      # transport users actually get.
      #
      # No TCP endpoint. It is opt-in everywhere else because it is a
      # machine-wide surface — and on Windows a firewall prompt (server/DESIGN.md
      # "Listen Endpoints") — and defaulting it here made the one configuration
      # nobody ships the only one anybody develops against. Ask for it when a
      # tool needs a URL; the local socket comes along on its own, iroh does not:
      #     DISCOBOX_SERVER_LISTEN=http://127.0.0.1:8080 go tool task dev
      #
      # Overridden from the environment, not from .env, which `.wnb.yaml` has
      # the server load via DISCOBOX_ENV_FILE: godotenv does not replace a
      # variable already set, and these are set here.
      #
      # DEV_LISTEN names iroh://, so the server binds an iroh endpoint and logs
      # the ID to dial it with. Reaching it needs that ID in
      # <data dir>/authorized_ids — `discobox admin iroh-id` prints the one to add.
      # DISCOBOX_DEV_IROH=0 drops the iroh listener and keeps the socket.
      DISCOBOX_SERVER_LISTEN: '{{.DISCOBOX_SERVER_LISTEN | default .DEV_LISTEN}}'
      # Purge archived discoboxes after minutes rather than the production day.
      # A development tree costs as much disk as a production one and is made
      # and thrown away many times an afternoon, so a day of retention is a day
      # of dead trees. This moves the server-wide default only: a project that
      # set its own --archive-retention still gets it.
      #
      # Set here, so .env cannot raise it: godotenv does not replace a variable
      # that is already set, and here losing that argument costs archived
      # discoboxes that can no longer be unarchived rather than a port. Keep one
      # for longer per project (`discobox admin project update <p>
      # --archive-retention 24h`), or for the whole server on the command line:
      #     DISCOBOX_ARCHIVE_RETENTION=24h go tool task dev
      DISCOBOX_ARCHIVE_RETENTION: '{{.DISCOBOX_ARCHIVE_RETENTION | default "15m"}}'
    cmds:
      - touch .env
      # Through discobox-dev-lock, so a second `task dev` in this checkout says
      # so and stops instead of joining the loop: each server it starts asks the
      # incumbent to shut down, the incumbent's own supervisor restarts it, and
      # the two displace each other every retry interval for as long as both
      # run. See internal/cmd/discobox-dev-lock.
      - go run ./internal/cmd/discobox-dev-lock server go tool watchnbuild

  dev:cli:
    desc: Recompile the discobox CLI with watchnbuild hot reload (see .wnb.cli.yaml)
    cmds:
      - go run ./internal/cmd/discobox-dev-lock cli go tool watchnbuild -config .wnb.cli.yaml

  dev:docker-image-watch:
    desc: Build and continuously rebuild pool, sandbox, and harness development images
    cmds:
      - go run ./internal/cmd/discobox-dev-lock docker-image-watch go run ./internal/cmd/discobox-docker-image-watch

  dev:pool-agent-image-watch:
    desc: Alias for dev:docker-image-watch
    cmds:
      - task: dev:docker-image-watch

  secret-dump:
    desc: "Dev tool: print a stored secret's cleartext value (usage: go tool task secret-dump -- <secret-id>)"
    cmds:
      - cd server && go run ./cmd/discobox-secret-dump {{.CLI_ARGS}}

  test:
    desc: Run root module tests
    cmds:
      - go test {{.PACKAGES}}

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - cd server && DISCOBOX_DOCKER_INTEGRATION=1 go test ./providers/docker -run Integration -count=1 -v

  test:docker:pool-flow:
    desc: "Run the Docker pool create-flow e2e test. Requires: dockerd"
    # Not test:docker, which is the provider's own integration suite. This is
    # the flow above it — create a pool, run a discobox on it — and it is what
    # the review hook of the same name runs.
    cmds:
      - cd server && DISCOBOX_DOCKER_INTEGRATION=1 go test ./internal/service -run TestDockerProviderPoolCreateFlowE2E -count=1 -v

  test:docker:bats:
    desc: Run Docker-backed CLI Bats integration tests (BATS_SUITE=<path> for one file)
    vars:
      BATS_SUITE: '{{.BATS_SUITE | default "test/bats"}}'
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats {{.BATS_SUITE}}
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats {{.BATS_SUITE}}
        fi

  perf:terminal:
    desc: Measure run/direct-attach terminal latency under output load against task dev
    cmds:
      - test/performance/terminal-latency/run.sh

  test:e2e:wslc:
    desc: "Run the wslc (Windows) provider e2e tests. Requires: Windows with WSL Containers"
    cmds:
      # These boot a real wslc VM, so they are gated off by default. The gate is
      # recorded here rather than only in the test file, so the suite stays
      # runnable by name instead of being forgotten.
      - cd server && DISCOBOX_WSLC_E2E=1 go test ./providers/wslc -count=1 -v

  test:e2e:docker:
    desc: "Run the pool runtime e2e tests against a local Docker daemon. Requires: dockerd"
    cmds:
      - cd server && DISCOBOX_E2E=1 go test ./providers/poolruntime -count=1 -v

  test:e2e:libkrun:
    desc: "Run the libkrun provider e2e tests. Requires: Linux/KVM, libkrun and passt on the path, plus the DISCOBOX_LIBKRUN_E2E_* variables"
    cmds:
      # Unlike the other suites this one needs artifacts the repository does not
      # build, so it fails loudly listing what is missing rather than skipping
      # silently and looking like a pass. The two directories are what
      # `vm:build` and `vm:build-kernel` write on an amd64 Linux machine:
      # build/vm and build/vm-kernel. Both have to be amd64 — that is the only
      # architecture libkrun boots — and an override directory carries no
      # platform, so nothing downstream can catch an arm64 root filesystem.
      - |
        missing=""
        for v in DISCOBOX_LIBKRUN_E2E_GUEST_DIR DISCOBOX_LIBKRUN_E2E_KERNEL_DIR DISCOBOX_LIBKRUN_E2E_POOL_IMAGE DISCOBOX_LIBKRUN_E2E_DOCKER; do
          eval "value=\${$v:-}"
          if [ -z "$value" ]; then missing="$missing $v"; fi
        done
        if [ -n "$missing" ]; then
          echo "libkrun e2e needs:$missing" >&2
          exit 1
        fi
        cd server && go test ./providers/libkrun -count=1 -v

  test:e2e:terminal-latency:
    desc: "Run the terminal latency e2e test. Requires: a running `task dev` server"
    cmds:
      - cd cli && DISCOBOX_TERMINAL_LATENCY_E2E=1 go test ./internal/cli -run TerminalLatency -count=1 -v

  test:all:
    desc: Run root and nested module tests
    cmds:
      - go test {{.PACKAGES}}
      - cd cli && go test ./...
      - cd termpane && go test ./...
      - cd server && go test ./...
      - cd pool-agent && go test ./...
      - cd sandbox-agent && go test ./...
      - cd access && go test ./...

  build:lint-tool:
    desc: Build the golangci-lint binary the per-module checks share
    # `go tool -n` is a dry run: it prints where the binary is or would be
    # without building it, so it only yields a usable path when the linked
    # binary already sits in the build cache. A developer's machine has it from
    # the last run; a fresh CI runner does not, and the printed
    # $TMPDIR/go-build*/b001/exe path is one that nothing ever creates. Building
    # it to a known location depends on no cache state at all.
    run: once
    cmds:
      - mkdir -p build/tools
      - go build -o build/tools/{{.LINT_BIN}} github.com/golangci/golangci-lint/v2/cmd/golangci-lint

  check:
    desc: Run static checks
    deps:
      - build:lint-tool
    cmds:
      - ./build/tools/{{.LINT_BIN}} run
      - cd cli && ../build/tools/{{.LINT_BIN}} run
      - cd termpane && ../build/tools/{{.LINT_BIN}} run
      - cd server && ../build/tools/{{.LINT_BIN}} run
      - cd pool-agent && ../build/tools/{{.LINT_BIN}} run
      - cd sandbox-agent && ../build/tools/{{.LINT_BIN}} run
      - cd access && ../build/tools/{{.LINT_BIN}} run

  check:windows:
    desc: Type-check the whole tree, tests included, for windows/amd64
    # wslc drives WSL by shelling out, so nothing in the tree is cgo or
    # build-tagged for Windows and the whole thing cross-compiles. `go vet`
    # rather than `go build` because it type-checks the test tree too, which is
    # where the Windows-only code paths are exercised (ADR 0066 §4).
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go vet {{.PACKAGES}}
      - cd cli && go vet ./...
      - cd termpane && go vet ./...
      - cd server && go vet ./...
      - cd pool-agent && go vet ./...
      - cd sandbox-agent && go vet ./...

  # The hooks tool lives in discobox-ai/hooks and is consumed here as a Go
  # tool, so there is nothing to build first and nothing pinned by hand: the
  # module graph pins it. It reads .discobox/hooks, which stays in this
  # repository — the hooks are this repository's, the runner is not.
  check-hooks:
    desc: Run hooks checks
    cmds:
      - go tool discobox-hooks check

  rerun-hooks:
    desc: Re-run failed or never-run hooks
    cmds:
      - go tool discobox-hooks run all

  check:dockerfile-builds:
    desc: Test-build every Dockerfile (or just the ones passed as CLI arguments)
    # The build rules are not here: each image's own build target owns them, and
    # this dispatches to those. See scripts/dockerfile-test-builds.sh.
    cmds:
      - scripts/dockerfile-test-builds.sh {{.CLI_ARGS}}

  check:dockerfiles:
    desc: Every path a Dockerfile copies from the build context still exists
    # A Dockerfile breaks from changes made nowhere near it: moving a directory
    # out of this repository leaves `COPY gormdb ./gormdb` naming nothing, and
    # nothing notices. The Discobot hook that builds images only fires when a
    # Dockerfile itself changes, and CI never builds them, so the first thing to
    # find out was a release tag.
    #
    # This is the cheap half of what an image build proves — that the context
    # paths resolve — not a substitute for building.
    cmds:
      - |
        set -eu
        missing=""
        # dockerfile:context. A COPY source is relative to the build context,
        # not to the Dockerfile, and the harness images are the ones built from
        # somewhere other than the repository root.
        for entry in \
          base-image/Dockerfile:base-image \
          pool-agent/Dockerfile:. \
          sandbox-agent/Dockerfile:. \
          vm-image/Dockerfile:. \
          vm-image/kernel/Dockerfile:. \
          harness/claude-code/Dockerfile:harness/claude-code \
          harness/codex-cli/Dockerfile:harness/codex-cli \
          harness/shell/Dockerfile:harness/shell; do
          dockerfile="${entry%:*}"
          context="${entry##*:}"
          # All but the last token of a COPY are sources; --from copies from an
          # earlier stage rather than the context, so it is not ours to check.
          # Collected rather than reported inside a pipeline: a `while` fed by
          # one runs in a subshell, where a non-zero exit goes nowhere.
          for src in $(awk '/^COPY / && !/--from=/ {
                              for (i = 2; i < NF; i++) if ($i !~ /^--/) print $i
                            }' "$dockerfile"); do
            if [ ! -e "$context/$src" ]; then
              missing="$missing$dockerfile: COPY $src: no such path in build context $context
        "
            fi
          done
        done
        if [ -n "$missing" ]; then
          printf '%s' "$missing" >&2
          exit 1
        fi

  check:mermaid:
    desc: Validate Mermaid diagrams in Markdown files
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run check:mermaid

  logo:cells:
    desc: Rebuild the TUI mark's cell data from its terminal capture
    # The marketing site consumes the output of this and the art in
    # assets/brand; it lives in discobox-ai/site and syncs them with its own
    # `pnpm gen:logo`.
    cmds:
      - node scripts/logo-cells.mjs

  check:fix:
    desc: Run static checks and apply safe fixes
    deps:
      - build:lint-tool
    cmds:
      - ./build/tools/{{.LINT_BIN}} run --fix
      - cd cli && ../build/tools/{{.LINT_BIN}} run --fix
      - cd termpane && ../build/tools/{{.LINT_BIN}} run --fix
      - cd server && ../build/tools/{{.LINT_BIN}} run --fix
      - cd pool-agent && ../build/tools/{{.LINT_BIN}} run --fix
      - cd sandbox-agent && ../build/tools/{{.LINT_BIN}} run --fix
      - cd access && ../build/tools/{{.LINT_BIN}} run --fix

  fmt:
    desc: Format every tracked Go source
    cmds:
      - git ls-files -z '*.go' | xargs -0 gofmt -w

  fmt:verify:
    desc: Fail when a tracked Go source is not gofmt-clean
    cmds:
      - |
        set -eu
        unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
        if [ -n "$unformatted" ]; then
          echo "not gofmt-clean (run: go tool task fmt):" >&2
          echo "$unformatted" >&2
          exit 1
        fi

  tidy:
    desc: Tidy every workspace module's go.mod/go.sum
    cmds:
      # The rules are involved enough (workspace vs GOWORK=off resolution) to
      # live in one script the Discobot go.mod hook runs too.
      - scripts/go-mod-tidy.sh

  tidy:verify:
    desc: Fail when a module's go.mod/go.sum is not tidy
    cmds:
      - task: verify:unchanged
        vars: { VERIFY_WHAT: "go.mod/go.sum", VERIFY_TASK: tidy }

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}
      # Nested modules generate their own API surfaces and are not reached by
      # the root pattern.
      - cd pool-agent && go generate ./...
      # The server's configuration schema is generated from config.Config, so
      # a new setting cannot ship without the schema that documents it.
      - cd server && go generate ./...

  generate:verify:
    desc: Fail when a generated file is stale
    # Dagger ran the generators as checks; this is what replaces that
    # (ADR 0066 "Consequences").
    cmds:
      - task: verify:unchanged
        vars: { VERIFY_WHAT: "generated files", VERIFY_TASK: generate }

  verify:unchanged:
    desc: Run VERIFY_TASK and fail if it changed anything tracked
    internal: true
    cmds:
      # Compared against a snapshot rather than against a clean tree: CI always
      # runs this on a fresh checkout, but a developer's tree is usually dirty
      # for unrelated reasons and that must not read as staleness.
      - |
        set -eu
        before="$(git status --porcelain; git --no-pager diff)"
        go tool task {{.VERIFY_TASK}}
        after="$(git status --porcelain; git --no-pager diff)"
        if [ "$before" != "$after" ]; then
          echo "{{.VERIFY_WHAT}} are stale: 'go tool task {{.VERIFY_TASK}}' changed the tree." >&2
          echo "Run it and commit the result." >&2
          git status --porcelain >&2
          exit 1
        fi

  verify:
    desc: Fail when formatting, module files, generated files, or diagrams are stale
    cmds:
      - task: fmt:verify
      - task: tidy:verify
      - task: generate:verify
      - task: check:mermaid

  buildx:builder:
    desc: Create the docker-container buildx builder multi-arch and multi-output builds need
    status:
      - docker buildx inspect {{.BUILDX_BUILDER}} >/dev/null 2>&1
    cmds:
      - docker buildx create --name {{.BUILDX_BUILDER}} --driver docker-container >/dev/null

  ci:check:
    desc: "The static half of CI on Linux: every lint pass plus the windows/amd64 cross type-check"
    cmds:
      - task: check
      - task: check:windows
      - task: check:dockerfiles

  ci:test:
    desc: Run every module's tests the way CI does
    # No Docker and no harness images: the suite that needed them now seeds its
    # harness config directly (ADR 0066 §7's stated end state), so this is
    # test:all and runs identically on Linux, macOS, and Windows.
    cmds:
      - task: test:all

  ci:darwin:
    desc: "The macOS half of CI: static checks plus the native, signed release build"
    platforms: [darwin]
    cmds:
      - task: check
      - task: release:build

  release:build:
    desc: Build this platform's release binaries into build/release/bin
    # Release binaries are built on the platform they target because darwin has
    # to be: cgo, the macOS SDK, and codesigning are all native-only
    # (ADR 0066 §4). Each platform's job contributes its own half.
    cmds:
      - rm -rf build/release/bin
      - task: release:build:linux
      - task: release:build:darwin
      - task: release:verify

  release:build:linux:
    desc: Build the Linux and Windows release binaries
    platforms: [linux]
    cmds:
      - task: release:binary
        vars: { TARGET_OS: linux, TARGET_ARCH: amd64 }
      - task: release:binary
        vars: { TARGET_OS: linux, TARGET_ARCH: arm64 }
      # Nix does not run on Windows and nothing in the tree is cgo or
      # build-tagged for it, so the Windows binary is cross-compiled here. The
      # Windows *tests* still run natively (ADR 0066 §4).
      - task: release:binary
        vars: { TARGET_OS: windows, TARGET_ARCH: amd64 }
      - task: release:binary
        vars: { TARGET_OS: windows, TARGET_ARCH: arm64 }
      - task: release:windows-zip

  release:build:darwin:
    desc: Build and sign the macOS release binary
    platforms: [darwin]
    # darwin/amd64 is not shipped: ADR 0062 defers Intel Macs and
    # assemble-guest-image refuses non-arm64, so an Intel binary would install
    # and then fail at the first pool.
    cmds:
      - task: release:binary
        vars: { TARGET_OS: darwin, TARGET_ARCH: arm64 }

  release:binary:
    desc: Build one platform's release binaries — the CLI and the server it stages (TARGET_OS=, TARGET_ARCH=)
    requires:
      vars: [TARGET_OS, TARGET_ARCH]
    deps:
      # The server embeds the guest relay.
      - build:cp-relay
    vars:
      # The tag the agent images are pinned to, resolved the way release:image
      # and release:publish resolve theirs.
      PIN_TAG:
        sh: |
          tag="{{.TAG}}"
          case "$tag" in
            v*) printf %s "$tag" ;;
            *) printf %s "" ;;
          esac
      EXT: '{{if eq .TARGET_OS "windows"}}.exe{{end}}'
      OUT: build/release/bin/discobox-{{.TARGET_OS}}-{{.TARGET_ARCH}}{{.EXT}}
      # The server is published as its own asset and staged by the CLI on the
      # machine that needs one (ADR 0099). SERVER_NAME is what it is called once
      # staged, which is also what a sibling next to the CLI has to be called;
      # SERVER_OUT is the published asset, whose name says which platform it is
      # for.
      SERVER_NAME: discobox-server{{.EXT}}
      SERVER_OUT: build/release/bin/discobox-server-{{.TARGET_OS}}-{{.TARGET_ARCH}}{{.EXT}}
      # cgo only where the platform's hypervisor bindings need it: Code-Hex/vz
      # on darwin. Everywhere else a static binary is the better artifact.
      CGO: '{{if eq .TARGET_OS "darwin"}}1{{else}}0{{end}}'
      # Every image this release publishes is pinned to the release's own tag:
      # the two agent images, and the registry and tag the three built-in
      # harness images resolve through. They reach the server's link and not the
      # CLI's, because an image is what the server runs and the CLI no longer
      # contains one.
      #
      # Their defaults are :latest and local tags, which is right for a
      # development build and wrong for a shipped one: a binary should run the
      # images it was cut alongside, not whatever :latest has moved to since —
      # and a local tag resolves to nothing at all on a user's machine, which is
      # how a release shipped seeding three harnesses whose images Docker Hub
      # had never heard of. The tag rather than a digest because release:images
      # runs in a parallel job — there is no digest yet at link time — and a
      # release tag never moves.
      #
      # Only when there is a tag to pin to. ci.yml builds the release artifacts
      # on every push to prove they still build, with no tag in sight, and an
      # empty PIN_TAG would bake "discobox-pool-agent:" — a reference no daemon
      # can pull — into a binary that otherwise looks fine.
      SERVER_LDFLAGS: >-
        {{if and .PIN_TAG .REGISTRY}}-X github.com/discobox-ai/discobox/server/providers/dockerworker.DefaultPoolImage={{.REGISTRY}}/discobox-pool-agent:{{.PIN_TAG}}
        -X github.com/discobox-ai/discobox/server/internal/sandbox.DefaultSandboxImageName={{.REGISTRY}}/discobox-sandbox-agent:{{.PIN_TAG}}
        -X github.com/discobox-ai/discobox/harness.ImageRegistry={{.REGISTRY}}
        -X github.com/discobox-ai/discobox/harness.ImageTag={{.PIN_TAG}}{{end}}
      # The ELF interpreter, named rather than inherited.
      #
      # iroh-go reaches its embedded cdylib through purego, which imports dlopen
      # with //go:cgo_import_dynamic — so the linker emits a dynamic executable
      # whatever CGO_ENABLED says, and bakes in the loader path of the machine
      # that built it. Inside `nix develop` that is a /nix/store path present on
      # no user's system, and the binary cannot start anywhere else.
      #
      # A release binary's loader is a property of the target, not of the build
      # host. Safe to name because nothing here needs a versioned glibc symbol:
      # dlopen, dlsym, malloc, abort and pthread_* resolve against any libc.
      # It does mean glibc — a musl system has no loader at this path, and one
      # that dlopens cannot be static instead (ADR 0067 §2's embedded cdylib).
      INTERP: '{{if eq .TARGET_OS "linux"}}{{if eq .TARGET_ARCH "amd64"}}/lib64/ld-linux-x86-64.so.2{{else}}/lib/ld-linux-aarch64.so.1{{end}}{{end}}'
      # Both binaries carry the release version: the CLI prints it, the server
      # answers it on /healthz, and the CLI compares the two to decide whether
      # the running server is older than the one it would start.
      LDFLAGS: -s -w {{if .INTERP}}-I {{.INTERP}}{{end}} {{if .PIN_TAG}}-X github.com/discobox-ai/discobox/version.Version={{.PIN_TAG}}{{end}}
      # A release build autolaunches a server; a development build never does
      # (cli/internal/cli/server_autolaunch_test.go).
      CLI_LDFLAGS: -X github.com/discobox-ai/discobox/cli/internal/cli.serverAutoLaunch=true
    cmds:
      - mkdir -p build/release/bin
      # The server first: the CLI is linked against its digest, so it cannot be
      # built until the file it describes is final.
      - >-
        cd server &&
        GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}} CGO_ENABLED={{.CGO}}
        go build -trimpath -ldflags="{{.LDFLAGS}} {{.SERVER_LDFLAGS}}" -o ../{{.SERVER_OUT}} {{.SERVER_MAIN}}
      # After the link and after stripping, and before the digest is taken:
      # signing rewrites the binary, so nothing may touch it afterwards
      # (ADR 0066 §5). The server is the process that creates a VM, so it is the
      # binary that needs the Virtualization entitlement (ADR 0099).
      - task: sign
        vars: { SIGN_BINARY: '{{.SERVER_OUT}}' }
      # The manifest is generated here rather than in a var because it is a
      # digest of a file this target has only just written, and Task evaluates
      # vars before the first command runs.
      #
      # Only for a tagged build. ci.yml builds the release artifacts on every
      # push to prove they still build, with no tag and so no release to
      # download from; an untagged CLI carries no manifest and falls back to a
      # server binary beside it, which is what a development build does anyway.
      - |
        set -eu
        manifest=""
        if [ -n "{{.PIN_TAG}}" ] && [ -n "{{.RELEASE_REPO}}" ]; then
          manifest="$(go run ./internal/cmd/discobox-server-manifest \
            -version "{{.PIN_TAG}}" -os "{{.TARGET_OS}}" -arch "{{.TARGET_ARCH}}" \
            -base-url "https://github.com/{{.RELEASE_REPO}}/releases/download/{{.PIN_TAG}}" \
            -command "{{.SERVER_NAME}}" \
            -asset "{{.SERVER_NAME}}={{.SERVER_OUT}}")"
        fi
        cd cli && GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}} CGO_ENABLED={{.CGO}} \
          go build -trimpath \
          -ldflags="{{.LDFLAGS}} {{.CLI_LDFLAGS}}${manifest:+ -X github.com/discobox-ai/discobox/serverstage.DefaultManifest=$manifest}" \
          -o "../{{.OUT}}" {{.CLI_MAIN}}

  release:windows-zip:
    desc: Package each Windows binary as the archive winget installs from
    platforms: [linux]
    # winget installs a portable package by symlinking the executable under a
    # command alias — but only where it can, which means an administrator or a
    # machine with Developer Mode on. Everywhere else it falls back to putting
    # the install directory on PATH, and then the command the user gets is
    # whatever the file on disk is called.
    #
    # So the file has to be called discobox.exe, and the release asset is not:
    # renaming it would break every existing download URL and the naming
    # convention the other three binaries share. The archive carries the same
    # binary under the name the command has to have, and is uploaded alongside
    # them for winget alone to consume.
    cmds:
      - |
        set -eu
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        # Whatever Windows binaries were built, rather than a list here that a
        # new architecture would have to be added to twice.
        found=0
        for bin in build/release/bin/discobox-windows-*.exe; do
          [ -e "$bin" ] || continue
          name="$(basename "$bin" .exe)"
          rm -rf "$work/stage" && mkdir "$work/stage"
          cp "$bin" "$work/stage/discobox.exe"
          # Zipped from inside the directory so the archive holds discobox.exe
          # at its root, which is the path the manifest's RelativeFilePath
          # names — the same path for every architecture.
          (cd "$work/stage" && zip -q "$work/$name.zip" discobox.exe)
          mv "$work/$name.zip" build/release/bin/
          found=$((found + 1))
        done
        [ "$found" -gt 0 ] || { echo "release:windows-zip: no Windows binaries were built" >&2; exit 1; }

  release:verify:
    desc: Check that the release binaries in build/release/bin are runnable anywhere
    vars:
      # The tag the binaries should report, resolved the way release:binary
      # resolves the one it links in. Empty for an untagged CI build, which
      # has no version to assert.
      PIN_TAG:
        sh: |
          tag="{{.TAG}}"
          case "$tag" in
            v*) printf %s "$tag" ;;
            *) printf %s "" ;;
          esac
    # A release went green publishing Linux binaries that could not start on any
    # machine but the builder: their ELF interpreter was a /nix/store path.
    # Everything downstream looked healthy — build, checksums, upload — because
    # nothing inspected one.
    #
    # Executing a binary is not enough to catch that, and this is the trap the
    # first version of this check fell into: on the machine that built it the
    # /nix/store loader does exist, so it runs perfectly and proves nothing.
    # The interpreter is therefore checked for every Linux binary, whether or
    # not this host can execute it, and execution is an extra assertion on top
    # for the one it can.
    cmds:
      - |
        set -eu
        [ -d build/release/bin ] || { echo "release:verify: nothing built" >&2; exit 1; }
        host="$(go env GOOS)-$(go env GOARCH)"
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        found=0
        for binary in build/release/bin/*; do
          [ -e "$binary" ] || continue
          name=$(basename "$binary")
          found=$((found + 1))

          # A Windows server reaches its WSL guest through the relay embedded
          # for its own architecture: WSL2 does not emulate, so the guest is
          # always the host's. One built without it installs, launches, and
          # fails at the first pool -- on a machine no Linux or amd64 test run
          # ever touches, which is the same blind spot the interpreter check
          # below exists for.
          # The server binaries only: the relay is embedded in the server (ADR
          # 0099), and release:windows-zip puts a .zip beside each CLI carrying
          # the very same executable, so a looser pattern would both check a
          # binary that does not contain a relay and pair the same one twice --
          # and a .zip's name does not end in .exe, so its architecture would
          # come out as "amd64.zip" and match no relay.
          case "$name" in
            discobox-server-windows-*.exe)
              arch=${name#*-windows-}
              arch=${arch%.exe}
              relay="server/providers/wslc/relay/artifacts/discobox-cp-relay.linux-$arch.gz"
              [ -f "$relay" ] || { echo "$name: no guest relay was built for linux/$arch; add it to build:cp-relay" >&2; exit 1; }
              size=$(wc -c < "$relay")
              [ "$size" -gt 65536 ] || { echo "$name: guest relay for linux/$arch is $size bytes, not a real binary" >&2; exit 1; }
              echo "$name: guest relay linux/$arch ($size bytes)"
              ;;
          esac

          case "$name" in
            *-linux-*)
              interp=$(readelf -p .interp "$binary" 2>/dev/null | sed -n 's/.*\[ *0\] *//p' | tr -d ' ')
              case "$interp" in
                ""|/lib/*|/lib64/*) ;;
                *) echo "$name: interpreter $interp exists only where this was built" >&2; exit 1 ;;
              esac
              echo "$name: interpreter ${interp:-none (static)}"
              ;;
          esac

          case "$name" in
            *-"$host"|*-"$host".exe)
              got=$("$binary" --version) || { echo "$name: cannot execute" >&2; exit 1; }
              echo "$name: $got"
              # And that it is the version this release claims. The linker
              # accepts -X for a symbol that does not exist without a word of
              # complaint, so a moved or renamed version variable would leave
              # every binary reporting a commit hash and nothing would notice.
              if [ -n "{{.PIN_TAG}}" ]; then
                case "$got" in
                  *"{{.PIN_TAG}}"*) ;;
                  *) echo "$name: reports '$got', not {{.PIN_TAG}}: the version ldflag is not reaching the binary" >&2; exit 1 ;;
                esac
              fi

              # And, for the CLI, that it knows where to get a server. The
              # manifest is a base64 blob passed through a shell into -X, and
              # the linker accepts an -X for a symbol that does not exist
              # without a word of complaint, so a release could otherwise ship
              # a CLI that has no server to download and says so only on a
              # user's machine (ADR 0099).
              case "$name" in
                discobox-server-*) ;;
                *)
                  if [ -n "{{.PIN_TAG}}" ]; then
                    "$binary" admin server manifest > "$work/manifest.json" ||
                      { echo "$name: carries no server manifest: the manifest ldflag is not reaching the binary" >&2; exit 1; }
                    grep -q "discobox-server-$host" "$work/manifest.json" ||
                      { echo "$name: its server manifest does not name the $host server asset:" >&2; cat "$work/manifest.json" >&2; exit 1; }
                    echo "$name: stages $(grep -c '"sha256"' "$work/manifest.json") server asset(s) for $host"
                  fi
                  ;;
              esac
              ;;
          esac
        done
        [ "$found" -gt 0 ] || { echo "release:verify: no binaries found" >&2; exit 1; }

  brew:publish:
    desc: Push a Homebrew formula for a tag to the tap (task brew:publish -- [--dev] [--prerelease] TAG)
    # Nothing automatic runs this. The tap updates itself from this repository's
    # public releases (see its update-formula workflow), which is why no token
    # for it is stored here; this is the button for publishing a tag the tap's
    # own rule will not pick up, and for not waiting out its interval.
    #
    # Writing uses the operator's own GitHub credentials through gh, so running
    # it requires being someone who may already write to the tap.
    vars:
      TAP_REPO: '{{.TAP_REPO | default "discobox-ai/homebrew-tap"}}'
      # Which of the tap's two formulae this writes (ADR 0105).
      NAME: '{{if .BREW_DEV}}discobox-dev{{else}}discobox{{end}}'
      FORMULA: '{{.BREW_OUT | default (printf "build/%s.rb" .NAME)}}'
    cmds:
      # Before generating: refusing after downloading a release's assets wastes
      # the download and reads like a failure rather than a decision.
      - |
        set -eu
        tag="{{.TAG}}"
        case "$tag" in
          v*) ;;
          *) echo "brew:publish: expected a v* tag, got '$tag'" >&2; exit 1 ;;
        esac
        # Neither channel serves an explicit prerelease: discobox-dev tracks the
        # newest dot release, not every tag that ever built, and `brew install
        # discobox` should give the version people are meant to run. So a
        # v1.2.3-rc1 reaching either is a decision somebody makes out loud.
        if [ -z "{{.DOT_RELEASE}}" ] && [ -z "{{.ALLOW_PRERELEASE}}" ]; then
          echo "brew:publish: $tag is a prerelease, and neither tap channel serves one." >&2
          echo "Publish it anyway with: task brew:publish -- {{if .BREW_DEV}}--dev {{end}}--prerelease $tag" >&2
          exit 1
        fi
      - task: brew:formula
        vars: { BREW_OUT: '{{.FORMULA}}' }
      - |
        set -eu
        tag="{{.TAG}}"
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        # gh holds the credential; git is told to ask it rather than whatever
        # helper the operator's global config names. Through the environment
        # rather than -c, because the helper value contains spaces and every git
        # command below needs it.
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
        export GIT_CONFIG_KEY_1=credential.helper GIT_CONFIG_VALUE_1='!gh auth git-credential'
        git clone --depth 1 "https://github.com/{{.TAP_REPO}}.git" "$work/tap"
        mkdir -p "$work/tap/Formula"
        cp "{{.FORMULA}}" "$work/tap/Formula/{{.NAME}}.rb"
        # Staged before comparing: git does not track empty directories, so on a
        # tap that has never carried a formula this is an untracked file, and an
        # unstaged diff of one is empty — which once reported a push that never
        # happened.
        git -C "$work/tap" add "Formula/{{.NAME}}.rb"
        if git -C "$work/tap" diff --cached --quiet; then
          echo "the tap already serves {{.NAME}} $tag"
          exit 0
        fi
        git -C "$work/tap" -c user.name="discobox release" -c user.email="noreply@discobox.ai" \
          commit -q -m "{{.NAME}} $tag" -m "Generated by \`task brew:publish\` from the assets $tag uploaded."
        git -C "$work/tap" push -q origin HEAD:main
        echo "the tap now serves {{.NAME}} $tag"
  release:publish:
    desc: Create the GitHub release for RELEASE_TAG and upload build/release/bin
    # Consumes whatever populated build/release/bin, so the fan-out that fills
    # it can be GitHub's matrix or one developer's machine.
    cmds:
      - |
        set -eu
        tag="{{.TAG}}"
        case "$tag" in
          v*) ;;
          *) echo "release:publish: set RELEASE_TAG=v<version> (or run from a v* tag)" >&2; exit 1 ;;
        esac
        if [ -z "$(ls -A build/release/bin 2>/dev/null)" ]; then
          echo "release:publish: build/release/bin is empty; run release:build first" >&2
          exit 1
        fi
        # Every release is created as a prerelease, dot releases included
        # (ADR 0105). Nothing this workflow knows makes a release stable: a tag
        # is a thing that built, and blessing one is a human clearing this box
        # afterwards, which is what feeds `brew install discobox` and winget.
        # Until then GitHub's own "Latest release" header keeps pointing at the
        # last blessed one, which is the right answer for someone landing on the
        # repository.
        gh release view "$tag" >/dev/null 2>&1 ||
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes --prerelease
        gh release upload "$tag" build/release/bin/* --clobber

  release:dot:
    desc: Print yes when the release tag is a dot release, nothing otherwise
    # So a workflow can ask the question the publish targets already ask, rather
    # than a second copy of the rule in YAML — which could not express it
    # anyway, since GitHub expressions have no pattern matching (ADR 0066 §1).
    silent: true
    cmds:
      - printf %s '{{.DOT_RELEASE}}'

  release:require-dot:
    desc: Fail unless the release tag is a dot release
    # The gate on promoting a release to stable (ADR 0105). winget sorts
    # semantic and string versions differently, so a package that publishes both
    # v1.2.3 and 1.2.3-rc1 ends up pinned to whichever comparison wins and the
    # only fix is deleting the odd one out — and a formula named `discobox`
    # serving an rc is the same mistake in the other package manager. Clearing
    # the prerelease box on an rc is a mis-click, not a plan, so it stops here.
    silent: true
    cmds:
      - |
        set -eu
        if [ -z "{{.DOT_RELEASE}}" ]; then
          echo "release:require-dot: {{.TAG}} is not a vMAJOR.MINOR.PATCH tag, so it cannot be promoted to stable" >&2
          exit 1
        fi
        echo "{{.TAG}} is a dot release"

  winget:manifests:
    desc: Write the winget manifests for a released tag to WINGET_OUT
    # The rule lives in scripts/winget-manifests.sh for the same reason the
    # Homebrew one does: nothing about it needs a Go toolchain to reach.
    vars:
      WINGET_OUT: '{{.WINGET_OUT | default "build/winget"}}'
    cmds:
      - scripts/winget-manifests.sh "{{.TAG}}" "{{.RELEASE_REPO}}" "{{.WINGET_OUT}}"

  winget:publish:
    desc: Open the winget-pkgs pull request for a tag (task winget:publish -- [--prerelease] TAG)
    # Run by promote.yml, when a human marks a release stable — never by cutting
    # a tag, because winget is a stable channel and a tag is not yet a stable
    # release (ADR 0105).
    #
    # The asymmetry with brew:publish is not an oversight. The tap is ours and a
    # push to it is the publish; the Windows Package Manager Community
    # Repository is Microsoft's, and every version is a pull request that a
    # validation pipeline runs and a moderator merges. So this opens the request
    # and stops. Somebody watches it land.
    #
    # Writing uses the operator's own GitHub credentials through gh, and the
    # first pull request from an account has to sign Microsoft's CLA, which is
    # a reply on the thread that only a human can make.
    #
    # No clone anywhere: winget-pkgs carries every manifest for every package
    # in it, and the git data API writes a commit without one.
    vars:
      UPSTREAM: '{{.WINGET_REPO | default "microsoft/winget-pkgs"}}'
      MANIFESTS: '{{.WINGET_OUT | default "build/winget"}}'
    cmds:
      # Before generating: refusing after downloading a release's asset wastes
      # the download and reads like a failure rather than a decision.
      - |
        set -eu
        tag="{{.TAG}}"
        case "$tag" in
          v*) ;;
          *) echo "winget:publish: expected a v* tag, got '$tag'" >&2; exit 1 ;;
        esac
        # winget has no notion of a channel: whatever is published is what
        # `winget install discobox` gives everyone. Same rule as the tap, and
        # for the same reason — an alpha goes out only because somebody typed
        # the flag.
        if [ -z "{{.DOT_RELEASE}}" ] && [ -z "{{.ALLOW_PRERELEASE}}" ]; then
          echo "winget:publish: $tag is a prerelease and winget serves one channel." >&2
          echo "Publish it anyway with: task winget:publish -- --prerelease $tag" >&2
          exit 1
        fi
        # Fail on the token here rather than on the first write it cannot make.
        # A token that may read but not write gets all the way through: the
        # fork-existence check is a GET, and so is every lookup against
        # winget-pkgs, which is public and needs no token at all. The first blob
        # POST is where it stops, and GitHub answers an unauthorised write with
        # 404 rather than 403 so as not to confirm the repository exists — so
        # the failure reads as "the fork is missing", which it is not, and the
        # error can never say this for itself.
        #
        # A fine-grained PAT reports no scopes at all, which is the same empty
        # string as a classic token carrying none, and neither can do this.
        scopes="$(gh api -i user 2>/dev/null | tr -d "\r" | sed -n "s/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p")"
        case ",$(printf %s "$scopes" | tr -d " ")," in
          *,repo,*|*,public_repo,*) ;;
          *)
            echo "winget:publish: WINGET_TOKEN may not write to the winget-pkgs fork." >&2
            echo "  scopes reported: ${scopes:-(none, which is also what a fine-grained token reports)}" >&2
            echo "  It must be a classic PAT with public_repo (or repo), owned by the account whose" >&2
            echo "  fork of microsoft/winget-pkgs the pull request comes from." >&2
            exit 1 ;;
        esac
      - task: winget:manifests
        vars: { WINGET_OUT: '{{.MANIFESTS}}' }
      - |
        set -eu
        tag="{{.TAG}}"
        upstream="{{.UPSTREAM}}"

        # Read back out of what was just generated rather than restated here.
        # The identifier and the rule that strips the `v` are the script's to
        # own, and a second copy of either is a second copy that can be wrong.
        installer="$(ls {{.MANIFESTS}}/*.installer.yaml)"
        identifier="$(sed -n 's/^PackageIdentifier: //p' "$installer")"
        version="$(sed -n 's/^PackageVersion: //p' "$installer")"

        # manifests/<publisher's first letter, lowercased>/<publisher>/<package>.
        publisher="${identifier%%.*}"
        package="${identifier#*.}"
        letter="$(printf %s "$publisher" | cut -c1 | tr 'A-Z' 'a-z')"
        package_dir="manifests/$letter/$publisher/$package"

        if gh api "repos/$upstream/contents/$package_dir/$version" >/dev/null 2>&1; then
          echo "winget already serves $version"
          exit 0
        fi

        login="$(gh api user -q .login)"
        fork="$login/winget-pkgs"
        # Idempotent: forking an existing fork says so and succeeds. No
        # --remote: gh rejects the flag outright when a repository argument is
        # given, and adds no remote in that case anyway.
        gh repo fork "$upstream" --clone=false >/dev/null

        # The fork's own master, which is allowed to be thousands of commits
        # behind upstream's. It is a clean ancestor rather than a divergence —
        # nothing ever commits to it — so it is the pull request's merge base
        # and the diff is exactly the files added here. A new version directory
        # cannot conflict with whatever upstream changed meanwhile, so the
        # staleness costs nothing.
        #
        # Two things that do not work, both tried:
        #
        #   `gh repo sync "$fork" --branch master --force`, which used to sit
        #   here, goes through the merge-upstream API. That refuses any incoming
        #   commit touching .github/workflows unless the token carries
        #   `workflow` scope, and winget-pkgs changes its workflows constantly —
        #   so it broke as soon as the fork had any catching up to do. Granting
        #   the scope would buy write access to every workflow in every public
        #   repository the submitting account can reach, to tidy a fork whose
        #   staleness does not matter.
        #
        #   Reading the base from *upstream* instead, to skip the fork's master
        #   entirely, fails further along: a fork shares object storage with its
        #   upstream for reads, but tree creation validates base_tree against
        #   the repository being written, so `POST repos/$fork/git/trees`
        #   answers "base_tree is not a valid tree oid" (422) for a tree only
        #   upstream has.
        base="$(gh api "repos/$fork/git/ref/heads/master" -q .object.sha)"
        base_tree="$(gh api "repos/$fork/git/commits/$base" -q .tree.sha)"

        # The title format the repository's pull request template asks for; the
        # moderation tooling reads it.
        if gh api "repos/$upstream/contents/$package_dir" >/dev/null 2>&1; then
          title="Update: $identifier to $version"
        else
          title="New package: $identifier version $version"
        fi

        tree='[]'
        for manifest in {{.MANIFESTS}}/*.yaml; do
          blob="$(jq -Rs '{content: ., encoding: "utf-8"}' < "$manifest" |
            gh api "repos/$fork/git/blobs" --input - -q .sha)"
          tree="$(printf %s "$tree" | jq \
            --arg path "$package_dir/$version/$(basename "$manifest")" --arg sha "$blob" \
            '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]')"
        done

        new_tree="$(jq -n --arg base "$base_tree" --argjson tree "$tree" \
          '{base_tree: $base, tree: $tree}' |
          gh api "repos/$fork/git/trees" --input - -q .sha)"
        commit="$(jq -n --arg message "$title" --arg tree "$new_tree" --arg parent "$base" \
          '{message: $message, tree: $tree, parents: [$parent]}' |
          gh api "repos/$fork/git/commits" --input - -q .sha)"

        branch="discobox-$version"
        # Force, so a first attempt that failed before the pull request existed
        # can simply be run again.
        jq -n --arg sha "$commit" '{sha: $sha, force: true}' |
          gh api -X PATCH "repos/$fork/git/refs/heads/$branch" --input - >/dev/null 2>&1 ||
          jq -n --arg ref "refs/heads/$branch" --arg sha "$commit" '{ref: $ref, sha: $sha}' |
            gh api "repos/$fork/git/refs" --input - >/dev/null

        existing="$(gh pr list --repo "$upstream" --head "$branch" --state open \
          --json url -q '.[0].url' 2>/dev/null || true)"
        if [ -n "$existing" ]; then
          echo "updated the open pull request: $existing"
          exit 0
        fi

        # Which archives the submission actually offers, read back out of the
        # manifest rather than named here. The installer manifest carries one
        # entry per windows zip the release uploaded, so an architecture added
        # to the build matrix is described correctly without an edit — this
        # body claimed amd64 alone for the whole of v0.3.0, which shipped both.
        archives="$(sed -n 's|.*InstallerUrl: .*/\(discobox-windows-[^/]*\.zip\)$|`\1`|p' "$installer" | paste -sd, - | sed 's/,/, /g')"

        # The manifests are generated from the release's own assets and each
        # archive was read back to check it holds what they declare, but
        # `winget validate` and `winget install --manifest` are Windows-only
        # and did not run. Said in the body rather than left as two ticked
        # boxes that are not true.
        gh pr create --repo "$upstream" --base master --head "$login:$branch" \
          --title "$title" \
          --body "$(printf '%s\n' \
            "Generated by \`task winget:publish\` from the assets $tag uploaded." \
            "" \
            "- Installer: \`$identifier\` $version, portable, from the release's $archives." \
            "- Each checksum is of the asset it names, and every archive was checked to contain \`discobox.exe\`." \
            "- Not validated on Windows: this project releases from Linux and macOS.")"

  brew:refresh:
    desc: Tell the tap to regenerate both formulae from this repository's releases
    # One dispatch, both channels: the tap recomputes discobox-dev from the
    # newest dot release and discobox from the newest release a human has
    # marked stable, and commits whichever actually moved (ADR 0105). So the
    # same call is right after a tag is cut and after a release is blessed, and
    # neither caller has to know which formula it is about to change.
    #
    # This is the *only* thing that updates the tap. It used to poll on a cron;
    # that was deleted deliberately, because a backstop that quietly covers for
    # a broken release step is a backstop that stops anyone noticing the step is
    # broken. If this does not run, the tap does not update, and the release
    # that failed to run it goes red.
    #
    # It needs a credential, and there is no way around that: GITHUB_TOKEN is
    # scoped to the repository it runs in, so nothing minted here can start a
    # workflow in another repository (ADR 0066, and the original reason the tap
    # pulls rather than being pushed to). What this does *not* need is write
    # access: the narrowest token that works is scoped to the tap alone and may
    # only start a workflow already defined there. That is much less than the
    # `contents: write` the push-based design required, and it is why this is
    # worth having and that was not.
    vars:
      TAP_REPO: '{{.TAP_REPO | default "discobox-ai/homebrew-tap"}}'
      TAP_WORKFLOW: '{{.TAP_WORKFLOW | default "update-formula.yml"}}'
    cmds:
      - gh workflow run {{.TAP_WORKFLOW}} --repo {{.TAP_REPO}}
      - echo "asked {{.TAP_REPO}} to update its formula"

  brew:formula:
    desc: Write a Homebrew formula for a released tag to BREW_OUT (task brew:formula -- [--dev] TAG)
    # The rule lives in scripts/brew-formula.sh so the tap's own update workflow
    # runs exactly this, without needing a Go toolchain to reach it — including
    # which of the two formulae it is writing.
    vars:
      NAME: '{{if .BREW_DEV}}discobox-dev{{else}}discobox{{end}}'
      BREW_OUT: '{{.BREW_OUT | default (printf "build/%s.rb" .NAME)}}'
    cmds:
      - scripts/brew-formula.sh {{if .BREW_DEV}}--dev {{end}}"{{.TAG}}" "{{.RELEASE_REPO}}" "{{.BREW_OUT}}"

  release:images:
    desc: Build and push the multi-arch agent and harness images for RELEASE_TAG
    cmds:
      # Strictly first, and not alongside them: both agent images are built FROM
      # this one, and the build cannot pull a tag that is not in the registry
      # yet. It is pushed even though nothing ever runs it, because its children
      # must resolve the same reference at build time for their layers to be the
      # same blobs at pull time.
      - task: release:image
        vars: { IMAGE: base, DOCKERFILE: base-image/Dockerfile, CONTEXT: base-image }
      - task: release:image
        vars:
          IMAGE: pool-agent
          BUILD_ARGS: --build-arg BASE_IMAGE={{.REGISTRY}}/discobox-base:{{.TAG}}
      - task: release:image
        vars:
          IMAGE: sandbox-agent
          # The same build arguments build:sandbox-agent-image passes, with the
          # base image pointing at this release rather than the local tag.
          # IMAGE_LAYER_METADATA is not optional: without it the base layer
          # label is set to the empty string, and every harness image built
          # FROM this one inherits an empty layer that registration rejects as
          # "not built FROM discobox-sandbox-agent" (ADR 0086 §1-2).
          BUILD_ARGS: >-
            --build-arg BASE_IMAGE={{.REGISTRY}}/discobox-base:{{.TAG}}
            --build-arg IMAGE_LAYER_METADATA="$(jq -c . sandbox-agent/image.json)"
      # Strictly after sandbox-agent, and not alongside it: every harness image
      # is built FROM the sandbox agent image this release just pushed, and the
      # build cannot pull a tag that is not in the registry yet.
      #
      # Harness images ship with the release for the same reason the two agent
      # images do. The built-in harness configs a server seeds name these, and
      # their development default is a local tag that resolves to nothing on a
      # user's machine — a released binary that did not publish them seeds three
      # harnesses it cannot run.
      - task: release:harness-image
        vars: { HARNESS: claude-code }
      - task: release:harness-image
        vars: { HARNESS: codex }
      - task: release:harness-image
        vars: { HARNESS: shell }

  release:harness-image:
    desc: Build and push one multi-arch harness image (HARNESS=claude-code|codex|shell)
    requires:
      vars: [HARNESS]
    vars:
      HARNESS_DIR: '{{if eq .HARNESS "codex"}}codex-cli{{else}}{{.HARNESS}}{{end}}'
      # A harness that declares nothing has no image.json and takes no metadata
      # argument: its whole manifest is the base layer it inherits (ADR 0086
      # §2), which is what `shell` is. Same rule as build:harness-image.
      HARNESS_MANIFEST:
        sh: test -f harness/{{if eq .HARNESS "codex"}}codex-cli{{else}}{{.HARNESS}}{{end}}/image.json && echo yes || true
    preconditions:
      - sh: test -f harness/{{.HARNESS_DIR}}/Dockerfile
        msg: "unknown harness: {{.HARNESS}}"
    cmds:
      - task: release:image
        vars:
          IMAGE: harness-{{.HARNESS}}
          DOCKERFILE: harness/{{.HARNESS_DIR}}/Dockerfile
          CONTEXT: harness/{{.HARNESS_DIR}}
          # The same two build arguments build:harness-image passes, with the
          # base image pointing at this release rather than the local tag. The
          # command substitution is left for the shell release:image runs, so a
          # manifest carrying spaces stays one argument.
          BUILD_ARGS: >-
            --build-arg SANDBOX_AGENT_IMAGE={{.REGISTRY}}/discobox-sandbox-agent:{{.TAG}}
            {{if .HARNESS_MANIFEST}}--build-arg HARNESS_METADATA="$(jq -c . harness/{{.HARNESS_DIR}}/image.json)"{{end}}

  release:image:
    desc: Build and push one multi-arch image (IMAGE names it; DOCKERFILE/CONTEXT/BUILD_ARGS override the defaults)
    requires:
      vars: [IMAGE]
    vars:
      PLATFORMS: linux/amd64,linux/arm64
      # The two agent images sit at <name>/Dockerfile and build from the
      # repository root. A harness image overrides all three.
      DOCKERFILE: '{{.DOCKERFILE | default (printf "%s/Dockerfile" .IMAGE)}}'
      CONTEXT: '{{.CONTEXT | default "."}}'
      BUILD_ARGS: '{{.BUILD_ARGS | default ""}}'
    cmds:
      - |
        set -eu
        tag="{{.TAG}}"
        case "$tag" in
          v*) ;;
          *) echo "release:image: set RELEASE_TAG=v<version> (or run from a v* tag)" >&2; exit 1 ;;
        esac
        if [ -z "{{.REGISTRY}}" ]; then
          echo "release:image: could not resolve a registry from the origin remote; pass REGISTRY=ghcr.io/<owner>" >&2
          exit 1
        fi
        ref="{{.REGISTRY}}/discobox-{{.IMAGE}}:$tag"

        # dockerworker.DefaultPoolImage names :latest, so a release that pushes
        # only the version tag leaves that default unresolvable. Every dot
        # release moves it, whether or not anyone later marks it stable: :latest
        # means the newest release, and the CLI pins its own tag anyway, so the
        # only thing reading :latest is something that asked for no version.
        # v1.2.3-rc1 still does not move it — an explicit prerelease is not the
        # newest release, it is one you have to name.
        tags="-t $ref"
        if [ -n "{{.DOT_RELEASE}}" ]; then
          tags="$tags -t {{.REGISTRY}}/discobox-{{.IMAGE}}:latest"
        else
          echo "$tag is an explicit prerelease; not moving :latest" >&2
        fi

        # depot builds each architecture on a native machine, so there is no
        # per-arch fan-out and no manifest list to assemble (ADR 0066 §6).
        if command -v depot >/dev/null 2>&1; then
          depot build --platform {{.PLATFORMS}} -f {{.DOCKERFILE}} {{.BUILD_ARGS}} $tags --push {{.CONTEXT}}
        else
          echo "depot not found; falling back to emulated docker buildx." >&2
          echo "Both Dockerfiles run their Go stage FROM --platform=\$BUILDPLATFORM, so no Go" >&2
          echo "compilation is emulated. Only the Debian runtime stages are: near-free for" >&2
          echo "pool-agent, slow for sandbox-agent's apt, Nix, and language runtime installs." >&2
          # buildx needs both of these for a foreign architecture and says
          # nothing useful when they are missing.
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64 >/dev/null
          go tool task buildx:builder
          docker buildx build --builder {{.BUILDX_BUILDER}} --platform {{.PLATFORMS}} \
            -f {{.DOCKERFILE}} {{.BUILD_ARGS}} $tags --push {{.CONTEXT}}
        fi

  vm:build:
    desc: Build the pool VM's boot artifacts into build/vm (VM_PLATFORM= picks the architecture)
    # The VM image has its own release line (ADR 0062 §3); this is its build
    # step, runnable locally so its verification is too.
    #
    # It defaults to this machine's architecture, not to a fixed one: the guest
    # is built for two now, and the artifacts a developer wants locally are the
    # ones their own hypervisor can boot. CI names the platform explicitly.
    deps:
      - buildx:builder
    vars:
      VM_PLATFORM: '{{.VM_PLATFORM | default (printf "linux/%s" ARCH)}}'
    cmds:
      - rm -rf build/vm
      - >-
        docker buildx build --builder {{.BUILDX_BUILDER}}
        --platform {{.VM_PLATFORM}}
        --file vm-image/Dockerfile
        --output type=local,dest=build/vm
        .

  vm:build-kernel:
    desc: Build the libkrun guest kernel into build/vm-kernel
    deps:
      - buildx:builder
    cmds:
      - rm -rf build/vm-kernel
      - >-
        docker buildx build --builder {{.BUILDX_BUILDER}}
        --platform linux/amd64
        --file vm-image/kernel/Dockerfile
        --output type=local,dest=build/vm-kernel
        .

  vm:verify:
    desc: Verify the built VM artifacts will actually boot
    # A guest that publishes a kernel the hypervisor cannot load, or a root
    # filesystem that will not mount, fails silently: the VM boots to a blank
    # console. Both are cheap to check here and impossible to diagnose from
    # inside a VM that never came up.
    vars:
      VM_PLATFORM: '{{.VM_PLATFORM | default (printf "linux/%s" ARCH)}}'
    cmds:
      - |
        set -eu
        arch="{{.VM_PLATFORM}}"
        arch="${arch#linux/}"
        cd build/vm
        ls -l
        for artifact in initrd.img root.ext4; do
          test -s "$artifact" || { echo "missing or empty: $artifact" >&2; exit 1; }
        done
        # Only arm64 publishes a kernel. amd64 is booted by libkrun, which needs
        # the patched kernel from vm-image/kernel and would not load Debian's;
        # see assemble-guest-image.
        if [ "$arch" = arm64 ]; then
          test -s vmlinux || { echo "missing or empty: vmlinux" >&2; exit 1; }
          # A hypervisor that loads a kernel directly requires an uncompressed
          # arm64 Image, which carries "ARMd" at offset 0x38.
          magic=$(dd if=vmlinux bs=1 skip=56 count=4 status=none)
          test "$magic" = "ARMd" || { echo "vmlinux is not an uncompressed arm64 kernel Image" >&2; exit 1; }
        else
          test ! -e vmlinux || { echo "amd64 published a vmlinux; libkrun boots its own kernel" >&2; exit 1; }
        fi
        dumpe2fs -h root.ext4 | grep -q "Filesystem volume name:   discobox-root"
        # The guest's own name. The Debian base image ships /etc/hostname
        # saying "debuerreotype" and a container never sees it, so this is only
        # ever wrong in the artifact that boots — the one place nothing looks.
        hostname=$(debugfs -R "cat /etc/hostname" root.ext4 2>/dev/null | tr -d '\0\r\n ')
        test "$hostname" = "discobox" || { echo "root.ext4 boots as '$hostname', not discobox" >&2; exit 1; }
        # One guest for every backend, so the network configuration has to be
        # the one both can use: passt and Virtualization.framework's NAT both
        # serve DHCP, and a guest that configured an address by hand would boot
        # on exactly one of them.
        network=$(debugfs -R "cat /etc/systemd/network/10-discobox.network" root.ext4 2>/dev/null)
        echo "$network" | grep -q "DHCP=ipv4" \
          || { echo "root.ext4 does not take its address from DHCP" >&2; exit 1; }
        # And it has to match the interface both backends actually present:
        # virtio-pci is enp0s*, libkrun's virtio-mmio NIC stays eth0.
        echo "$network" | grep -q "Name=.*en\*.*eth\*" \
          || { echo "root.ext4 matches only some of the interface names a backend presents" >&2; exit 1; }
        # systemd-networkd-wait-online is what gives network-online.target a
        # meaning under networkd, and docker.service orders itself after that
        # target. Masked, the target is satisfied vacuously and dockerd races
        # the lease this guest takes its address, route and resolver from. That
        # failure is worse than getting the address wrong: not dead on one
        # backend, but intermittent on both.
        if debugfs -R "stat /etc/systemd/system/systemd-networkd-wait-online.service" root.ext4 2>/dev/null | grep -q "/dev/null"; then
          echo "systemd-networkd-wait-online.service is masked; dockerd will race the DHCP lease" >&2
          exit 1
        fi
        if ! debugfs -R "ls /etc/systemd/system/network-online.target.wants" root.ext4 2>/dev/null | grep -q "systemd-networkd-wait-online.service"; then
          echo "systemd-networkd-wait-online.service is not enabled" >&2
          exit 1
        fi
        echo "VM artifacts verified for $arch (hostname $hostname)"

  vm:verify-kernel:
    desc: Verify the built libkrun kernel is one libkrun can load
    cmds:
      - |
        set -eu
        cd build/vm-kernel
        ls -l
        test -s vmlinux || { echo "missing or empty: vmlinux" >&2; exit 1; }
        # libkrun loads this with KRUN_KERNEL_FORMAT_ELF, so an ELF header is
        # the difference between a VM that boots and one that dies with EINVAL.
        magic=$(dd if=vmlinux bs=4 count=1 status=none | od -An -tx1 | tr -d ' \n')
        test "$magic" = "7f454c46" || { echo "vmlinux is not an ELF image" >&2; exit 1; }
        # Docker's iptables-nft frontend needs these built in, not modular:
        # libkrunfw ships a compact nftables-only kernel and a guest missing
        # them starts every container with no network rules and no error.
        # CONFIG_PACKET is the DHCP client's socket family: the guest takes its
        # address from a lease on every backend (ADR 0101 §2), so a kernel
        # without it boots a guest that runs dockerd and never gets an address.
        for required in CONFIG_PACKET=y CONFIG_NFT_COMPAT=y CONFIG_BRIDGE=y CONFIG_VETH=y CONFIG_OVERLAY_FS=y; do
          grep -qx "$required" kernel.config || { echo "kernel is missing $required" >&2; exit 1; }
        done
        echo "kernel verified"

  vm:publish:
    desc: Push the multi-architecture VM image for VM_TAG and report the digest to pin
    deps:
      - buildx:builder
    cmds:
      - task: vm:push
        vars:
          PUSH_IMAGE: discobox-vm
          PUSH_DOCKERFILE: vm-image/Dockerfile
          PUSH_PLATFORMS: linux/arm64,linux/amd64
          PUSH_FILE: server/providers/guestimage/image.go
          PUSH_CONST: DefaultVMImage

  vm:publish-kernel:
    desc: Push the libkrun guest kernel for VM_TAG and report the digest to pin
    deps:
      - buildx:builder
    cmds:
      - task: vm:push
        vars:
          PUSH_IMAGE: discobox-vm-kernel
          PUSH_DOCKERFILE: vm-image/kernel/Dockerfile
          PUSH_PLATFORMS: linux/amd64
          PUSH_FILE: server/providers/libkrun/provider.go
          PUSH_CONST: DefaultKernelImage

  vm:push:
    internal: true
    requires:
      vars: [PUSH_IMAGE, PUSH_DOCKERFILE, PUSH_PLATFORMS, PUSH_FILE, PUSH_CONST]
    cmds:
      - |
        set -eu
        tag="{{.VM_TAG}}"
        if [ -z "$tag" ]; then
          # A git tag of vm/v1.2.3 carries a slash, which is not a legal Docker
          # tag. The prefix scopes each VM artifact's release line in the git
          # tag namespace; the image tag is the version alone.
          case "${GITHUB_REF_NAME:-}" in
            vm/v*) tag="${GITHUB_REF_NAME#vm/}" ;;
            vm-kernel/v*) tag="${GITHUB_REF_NAME#vm-kernel/}" ;;
          esac
        fi
        case "$tag" in
          v*) ;;
          *) echo "vm:publish: set VM_TAG=v<version> (or run from a vm/v* or vm-kernel/v* tag)" >&2; exit 1 ;;
        esac
        if [ -z "{{.REGISTRY}}" ]; then
          echo "vm:publish: could not resolve a registry from the origin remote; pass REGISTRY=ghcr.io/<owner>" >&2
          exit 1
        fi
        ref="{{.REGISTRY}}/{{.PUSH_IMAGE}}:$tag"
        metadata="build/{{.PUSH_IMAGE}}-push.json"
        # The publish jobs check out fresh and build nothing locally, so
        # nothing has made build/ by the time the builder writes its metadata
        # there. Without this the push itself succeeds and the task still
        # fails, leaving an image published and no digest reported.
        mkdir -p "$(dirname "$metadata")"

        # depot builds each architecture on a native machine, so there is no
        # per-arch fan-out and no manifest list to assemble (ADR 0066 §6). The
        # buildx fallback emulates, which for a build that runs apt and
        # mkfs.ext4 over a whole root filesystem is slow rather than broken.
        if command -v depot >/dev/null 2>&1; then
          depot build --platform {{.PUSH_PLATFORMS}} \
            -f {{.PUSH_DOCKERFILE}} -t "$ref" --push \
            --metadata-file "$metadata" .
        else
          echo "depot not found; falling back to emulated docker buildx." >&2
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64 >/dev/null
          docker buildx build --builder {{.BUILDX_BUILDER}} \
            --platform {{.PUSH_PLATFORMS}} \
            -f {{.PUSH_DOCKERFILE}} -t "$ref" --push \
            --metadata-file "$metadata" .
        fi
        digest="$(jq -r '."containerimage.digest"' "$metadata")"

        # The tag is a convenience; the server pins the digest.
        report() {
          echo "### {{.PUSH_IMAGE}} published"
          echo
          echo 'Pin this in `{{.PUSH_FILE}}`:'
          echo
          echo '```go'
          echo "const {{.PUSH_CONST}} = \"{{.REGISTRY}}/{{.PUSH_IMAGE}}@$digest\""
          echo '```'
        }
        report
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          report >> "$GITHUB_STEP_SUMMARY"
        fi

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -rf build

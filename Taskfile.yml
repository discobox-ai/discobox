version: "3"

vars:
  # The iroh transport's bindings ship linux/amd64 and linux/arm64 only, so the
  # dev build carries the tag there and nowhere else — `task dev` has to work on
  # a Mac (ADR 0053). DISCOBOX_DEV_IROH=0 turns it off where it would apply.
  IROH_TAG: '{{if and (eq OS "linux") (ne .DISCOBOX_DEV_IROH "0")}}-tags=iroh{{end}}'
  BINARY: build/discobox-server
  SERVER_MAIN: ./cmd/discobox-server
  CLI_BINARY: build/disco
  CLI_MAIN: ./cmd/disco
  HOOKS_BINARY: build/discobox-hooks
  HOOKS_MAIN: ./cmd/discobox-hooks
  PACKAGES: ./...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build binaries and all local Docker images
    cmds:
      # The guest relay is embedded into the server binary, so it must be
      # cross-compiled before the server is linked.
      - task: build:cp-relay
      - task: build:server
      - task: build:cli
      - task: build:hooks
      - task: build:images

  build:server:
    desc: Compile discobox-server
    cmds:
      - mkdir -p build
      - cd server && go build -o ../{{.BINARY}} {{.SERVER_MAIN}}

  build:cli:
    desc: Compile disco CLI
    cmds:
      - mkdir -p build
      - rm -f {{.CLI_BINARY}}
      - cd cli && go build -o ../{{.CLI_BINARY}} {{.CLI_MAIN}}

  build:hooks:
    desc: Compile discobox-hooks CLI
    cmds:
      - mkdir -p build
      - cd hooks && go build -o ../{{.HOOKS_BINARY}} {{.HOOKS_MAIN}}

  build:cp-relay:
    desc: Cross-compile the guest control-plane relay embedded in the Windows server
    vars:
      RELAY_OUT: server/providers/wslc/relay/artifacts/discobox-cp-relay.linux-amd64.gz
    cmds:
      # The relay runs inside a pool guest, which has no Go toolchain, so it is
      # cross-compiled here and embedded in the server binary. Stripped and
      # gzipped it costs about 1 MB. The artifact is gitignored; without it the
      # server still builds and only the wslc provider refuses to start.
      - cd pool-agent && GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/discobox-cp-relay ./cmd/discobox-cp-relay
      - gzip -9 -c build/discobox-cp-relay > {{.RELAY_OUT}}
      - 'echo "embedded guest relay is $(wc -c < {{.RELAY_OUT}}) bytes compressed"'

  build:pool-agent-image:
    desc: Build the systemd Docker pool image
    cmds:
      - docker build -f pool-agent/Dockerfile -t discobox-pool-agent:local .

  build:sandbox-agent-image:
    desc: Build the Debian sandbox agent image
    cmds:
      - docker build -f sandbox-agent/Dockerfile -t discobox-sandbox-agent:local .

  build:images:
    desc: Build pool, sandbox base, and all included harness images
    cmds:
      - task: build:pool-agent-image
      - task: build:harness-images

  build:harness-stub-image:
    desc: Build the test-only stub harness image (see test/harness-stub/README.md)
    cmds:
      - >-
        docker build -f test/harness-stub/Dockerfile
        --build-arg SANDBOX_AGENT_IMAGE="$(grep -s '^DISCOBOX_DEFAULT_SANDBOX_IMAGE=' .env | cut -d= -f2- | grep . || echo discobox-sandbox-agent:local)"
        --build-arg HARNESS_METADATA="$(jq -c . test/harness-stub/image.json)"
        -t discobox-harness-stub:local test/harness-stub

  build:terminal-latency-image:
    desc: Build the deterministic test-only terminal latency harness image
    cmds:
      - >-
        docker build -f test/performance/terminal-latency/image/Dockerfile
        --build-arg SANDBOX_AGENT_IMAGE="$(grep -s '^DISCOBOX_DEFAULT_SANDBOX_IMAGE=' .env | cut -d= -f2- | grep . || echo discobox-sandbox-agent:local)"
        --build-arg HARNESS_METADATA="$(jq -c . test/performance/terminal-latency/image/image.json)"
        -t discobox-terminal-latency:local test/performance/terminal-latency/image

  build:harness-images:
    desc: Build the sandbox base and one local image for each included harness
    cmds:
      - task: build:sandbox-agent-image
      - task: build:harness-image
        vars: { HARNESS: codex }
      - task: build:harness-image
        vars: { HARNESS: claude-code }
      - task: build:harness-image
        vars: { HARNESS: shell }

  build:harness-image:
    desc: Build one harness-specific sandbox image (HARNESS=codex|claude-code, SANDBOX_AGENT_IMAGE defaults to the local base)
    requires:
      vars: [HARNESS]
    vars:
      SANDBOX_AGENT_IMAGE: '{{default "discobox-sandbox-agent:local" .SANDBOX_AGENT_IMAGE}}'
      HARNESS_DIR: '{{if eq .HARNESS "codex"}}codex-cli{{else}}{{.HARNESS}}{{end}}'
      IMAGE_CONFIG: harness/{{.HARNESS_DIR}}/image.json
    preconditions:
      - sh: test -f harness/{{.HARNESS_DIR}}/Dockerfile
        msg: "unknown harness: {{.HARNESS}}"
    cmds:
      - >-
        docker build -f harness/{{.HARNESS_DIR}}/Dockerfile
        --build-arg "SANDBOX_AGENT_IMAGE={{.SANDBOX_AGENT_IMAGE}}"
        --build-arg HARNESS_METADATA="$(jq -c . {{.IMAGE_CONFIG}})"
        -t discobox-harness-{{.HARNESS}}:local harness/{{.HARNESS_DIR}}

  compile:
    desc: Alias for build
    cmds:
      - task: build

  debug-build:
    desc: Compile discobox-server with debugger-friendly flags
    cmds:
      - mkdir -p build
      - cd server && go build -gcflags="all=-N -l" -o ../{{.BINARY}} {{.SERVER_MAIN}}

  debug:
    desc: Build and run discobox-server under Delve
    deps:
      - debug-build
    cmds:
      - dlv exec {{.BINARY}}

  run:
    desc: Build and run discobox-server
    deps:
      - build:server
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: Run the server and Docker image watcher development tasks
    deps:
      - dev:server
      - dev:docker-image-watch

  dev:server:
    desc: Run discobox-server with watchnbuild hot reload, HTTP and SSH on loopback
    env:
      # A development server opens both TCP front doors it keeps shut in
      # production, so curling the API and ssh-ing into a sandbox need no setup.
      # They are opt-in normally because each is a machine-wide surface — and on
      # Windows a firewall prompt (server/DESIGN.md "Listen Endpoints"). Bound
      # to loopback here, which is not one.
      #
      # Either can be overridden from the environment:
      #     DISCOBOX_SSH_LISTEN=:22222 go tool task dev
      #
      # Not from .env, though: the server loads that with godotenv, which does
      # not replace a variable already set, and these are set here.
      DISCOBOX_SERVER_LISTEN: '{{.DISCOBOX_SERVER_LISTEN | default "http://127.0.0.1:8080,iroh://"}}'
      DISCOBOX_SSH_LISTEN: '{{.DISCOBOX_SSH_LISTEN | default "127.0.0.1:3222"}}'
      # A development build carries the iroh transport (ADR 0052 §4), so the
      # tagged code path is compiled on every reload. A build tag no pipeline
      # compiles is dead code that still occupies a file. It applies to the CLI
      # too, which .wnb.yaml builds alongside the server, so a disco built here
      # can dial an iroh:// endpoint.
      #
      # DISCOBOX_SERVER_LISTEN above names iroh://, so the server binds an iroh
      # endpoint and logs the ID to dial it with. Reaching it needs that ID in
      # <data dir>/authorized_ids — `disco box iroh-id` prints the one to add.
      #
      # Opt out with DISCOBOX_DEV_IROH=0. Clearing GOFLAGS does not: `default`
      # treats an empty value as unset and substitutes the tag straight back.
      GOFLAGS: '{{.IROH_TAG}}'
    cmds:
      - touch .env
      - go tool watchnbuild

  dev:cli:
    desc: Recompile the disco CLI with watchnbuild hot reload (see .wnb.cli.yaml)
    env:
      # The same iroh build tag dev:server uses, for the same reason: this task
      # is run alongside `task dev`, and a CLI that cannot dial iroh:// while
      # the server can serve it is a confusing pair to debug.
      GOFLAGS: '{{.IROH_TAG}}'
    cmds:
      - go tool watchnbuild -config .wnb.cli.yaml

  dev:docker-image-watch:
    desc: Build and continuously rebuild pool, sandbox, and harness development images
    cmds:
      - go run ./cmd/discobox-docker-image-watch

  dev:pool-agent-image-watch:
    desc: Alias for dev:docker-image-watch
    cmds:
      - task: dev:docker-image-watch

  secret-dump:
    desc: "Dev tool: print a stored secret's cleartext value (usage: go tool task secret-dump -- <secret-id>)"
    cmds:
      - cd server && go run ./cmd/discobox-secret-dump {{.CLI_ARGS}}

  test:
    desc: Run root module tests
    cmds:
      - go test {{.PACKAGES}}

  test:docker:
    desc: Run Docker provider integration tests
    cmds:
      - cd server && DISCOBOX_DOCKER_INTEGRATION=1 go test ./providers/docker -run Integration -count=1 -v

  test:docker:bats:
    desc: Run Docker-backed CLI Bats integration tests (BATS_SUITE=<path> for one file)
    vars:
      BATS_SUITE: '{{.BATS_SUITE | default "test/bats"}}'
    cmds:
      - |
        if command -v bats >/dev/null 2>&1; then
          bats {{.BATS_SUITE}}
        else
          if [ ! -x build/bats/bin/bats ]; then
            rm -rf build/bats-core build/bats
            git clone --depth 1 https://github.com/bats-core/bats-core.git build/bats-core
            ./build/bats-core/install.sh "$PWD/build/bats"
          fi
          build/bats/bin/bats {{.BATS_SUITE}}
        fi

  perf:terminal:
    desc: Measure run/direct-attach terminal latency under output load against task dev
    cmds:
      - test/performance/terminal-latency/run.sh

  test:e2e:wslc:
    desc: "Run the wslc (Windows) provider e2e tests. Requires: Windows with WSL Containers"
    cmds:
      # These boot a real wslc VM, so they are gated off by default. The gate is
      # recorded here rather than only in the test file, so the suite stays
      # runnable by name instead of being forgotten.
      - cd server && DISCOBOX_WSLC_E2E=1 go test ./providers/wslc -count=1 -v

  test:e2e:docker:
    desc: "Run the pool runtime e2e tests against a local Docker daemon. Requires: dockerd"
    cmds:
      - cd server && DISCOBOX_E2E=1 go test ./providers/poolruntime -count=1 -v

  test:e2e:libkrun:
    desc: "Run the libkrun provider e2e tests. Requires: Linux/KVM plus the five DISCOBOX_LIBKRUN_E2E_* variables"
    cmds:
      # Unlike the other suites this one needs artifacts the repository does not
      # build, so it fails loudly listing what is missing rather than skipping
      # silently and looking like a pass.
      - |
        missing=""
        for v in DISCOBOX_LIBKRUN_E2E_LAUNCHER DISCOBOX_LIBKRUN_E2E_KERNEL DISCOBOX_LIBKRUN_E2E_ROOT_IMAGE DISCOBOX_LIBKRUN_E2E_POOL_IMAGE DISCOBOX_LIBKRUN_E2E_DOCKER; do
          eval "value=\${$v:-}"
          if [ -z "$value" ]; then missing="$missing $v"; fi
        done
        if [ -n "$missing" ]; then
          echo "libkrun e2e needs:$missing" >&2
          exit 1
        fi
        cd server && go test ./providers/libkrun -count=1 -v

  test:e2e:terminal-latency:
    desc: "Run the terminal latency e2e test. Requires: a running `task dev` server"
    cmds:
      - cd cli && DISCOBOX_TERMINAL_LATENCY_E2E=1 go test ./internal/cli -run TerminalLatency -count=1 -v

  test:all:
    desc: Run root and nested module tests
    cmds:
      - go test {{.PACKAGES}}
      - cd cli && go test ./...
      - cd termpane && go test ./...
      - cd server && go test ./...
      - cd pool-agent && go test ./...
      - cd gormdb && go test ./...
      - cd hooks && go test ./...
      - cd sandbox-agent && go test ./...
      - task: test:iroh

  test:iroh:
    desc: Run the optional iroh transport's tests (ADR 0052 §4, ADR 0053)
    # Platform-restricted for the same reason as check:iroh.
    platforms: [linux/amd64, linux/arm64]
    env:
      CGO_ENABLED: '1'
    cmds:
      # Same reason as check:iroh: the tagged transport is only exercised if
      # something asks for it by name.
      - go test -tags iroh ./endpoint/...
      - cd cli && go test -tags iroh ./internal/cli/...

  check:
    desc: Run static checks
    cmds:
      - go tool golangci-lint run
      - cd cli && "$(go -C .. tool -n golangci-lint)" run
      - cd termpane && "$(go -C .. tool -n golangci-lint)" run
      - cd server && "$(go -C .. tool -n golangci-lint)" run
      - cd pool-agent && "$(go -C .. tool -n golangci-lint)" run
      - cd gormdb && "$(go -C .. tool -n golangci-lint)" run
      - cd hooks && "$(go -C .. tool -n golangci-lint)" run
      - cd sandbox-agent && "$(go -C .. tool -n golangci-lint)" run
      - task: check:iroh

  check:iroh:
    desc: Static checks for the optional iroh transport (ADR 0052 §4, ADR 0053)
    # The bindings ship linux/amd64 and linux/arm64 only, so this pass is
    # skipped elsewhere rather than failing a macOS or Windows developer's
    # `task check` over a build they cannot produce yet (ADR 0053).
    platforms: [linux/amd64, linux/arm64]
    env:
      CGO_ENABLED: '1'
    cmds:
      # The iroh transport is behind a build tag, so the default run above never
      # compiles it. A build configuration no pipeline checks is code that rots
      # unnoticed, so it gets its own pass rather than being taken on trust.
      - go tool golangci-lint run --build-tags iroh
      - cd cli && "$(go -C .. tool -n golangci-lint)" run --build-tags iroh
      - cd server && "$(go -C .. tool -n golangci-lint)" run --build-tags iroh

  dagger:check:
    desc: Run Dagger workspace checks (Go lint/tests, shellcheck) in containers
    env:
      DAGGER_X_RELEASE: v1.0.0-beta.6
    cmds:
      - dagger check {{.CLI_ARGS}}

  release:stage:
    desc: "Build the release into build/release for local inspection (TAG=vX.Y.Z to override the inferred patch bump)"
    env:
      DAGGER_X_RELEASE: v1.0.0-beta.6
    cmds:
      - dagger call release stage {{if .TAG}}--tag={{.TAG}}{{end}} --output=build/release

  release:push:
    desc: Publish the staged build/release to GitHub (tag, images, release assets)
    env:
      DAGGER_X_RELEASE: v1.0.0-beta.6
    cmds:
      - dagger call release push --staged=build/release --username="$(gh api user -q .login)" --token=cmd:"gh auth token"
      - git fetch origin --tags

  release:
    desc: "Full release: dagger check, then stage+push in one dagger call (TAG=vX.Y.Z to override)"
    env:
      DAGGER_X_RELEASE: v1.0.0-beta.6
    cmds:
      - task: dagger:check
      - dagger call release publish {{if .TAG}}--tag={{.TAG}}{{end}} --username="$(gh api user -q .login)" --token=cmd:"gh auth token"
      - git fetch origin --tags

  check-hooks:
    desc: Run hooks checks
    cmds:
      - echo 'cd ./hooks; go run ./cmd/discobox-hooks check'
      - cd ./hooks; go run ./cmd/discobox-hooks check

  rerun-hooks:
    desc: Re-run failed or never-run hooks
    cmds:
      - echo 'cd ./hooks; go run ./cmd/discobox-hooks run all'
      - cd ./hooks; go run ./cmd/discobox-hooks run all

  check:mermaid:
    desc: Validate Mermaid diagrams in Markdown files
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run check:mermaid

  check:fix:
    desc: Run static checks and apply safe fixes
    cmds:
      - go tool golangci-lint run --fix
      - cd cli && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd termpane && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd server && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd pool-agent && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd gormdb && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd hooks && "$(go -C .. tool -n golangci-lint)" run --fix
      - cd sandbox-agent && "$(go -C .. tool -n golangci-lint)" run --fix

  generate:
    desc: Regenerate generated files
    cmds:
      - go generate {{.PACKAGES}}

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -rf build

root = "."
testdata_dir = "testdata"
tmp_dir = "build"

[build]
  args_bin = []
  entrypoint = "./build/discobox"
  cmd = "cd cli && go build -o ../build/discobox ./cmd/discobox"
  delay = 1000
  exclude_dir = ["build", "vendor", "testdata", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "sh -c 'echo \"discobox CLI rebuilt: ./build/discobox\"; sleep 2147483647'"
  include_dir = ["api", "apiclient", "apperrors", "cli", "id", "model", "sandboxprovider", "workerbootstrap"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = []
  kill_delay = "1s"
  log = "build-errors-cli.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

# The libkrun guest kernel has its own build and its own release line
# (ADR 0101 §3).
#
# It is separate from the guest image workflow because it compiles Linux. The
# two artifacts move on unrelated clocks — this one when libkrunfw or upstream
# does, the guest when Debian or Docker does — and folding them together would
# mean every guest change waiting on a kernel build that nothing in it touched.
#
# It publishes as `discobox-vm-kernel`, linux/amd64 only: it exists because no
# distribution kernel boots under libkrun, and libkrun is the only backend that
# runs this architecture.
name: VM kernel

on:
  push:
    tags:
      - "vm-kernel/v*"
  pull_request:
    paths:
      - "vm-image/kernel/**"
      - ".github/workflows/vm-kernel.yml"
  # Rebuilt on a cadence for upstream security fixes, like the guest. This run
  # only builds; publishing stays tag-driven so a rebuild is still a deliberate
  # release someone pins.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/task
        with:
          target: vm:build-kernel

      - run: nix develop -c go tool task vm:verify-kernel

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vm-kernel/v')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Depot authenticates by OIDC against the trust relationship on its
      # project, which is what mints the token. Without this the CLI has
      # nothing to present and the push fails with "unauthenticated: Invalid
      # token" after both builds have already succeeded.
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: depot/setup-action@v1.7.2
        if: vars.DEPOT_PROJECT_ID != ''
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/task
        with:
          target: vm:publish-kernel

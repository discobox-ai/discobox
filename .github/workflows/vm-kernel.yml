name: VM kernel
on:
  push:
    tags: ['vm-kernel/v*']
  pull_request:
    paths: ['vm-image/kernel/**', '.dagger/**', '.github/workflows/vm-kernel.yml']
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref_type != 'tag'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - run: dagger api call vm-check --kind=kernel
  publish:
    if: github.ref_type == 'tag'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      VM_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - run: >-
          dagger api call vm-publish --kind=kernel
          --version="$VM_TAG" --registry="$REGISTRY" --username="$REGISTRY_USERNAME"
          --password=env:REGISTRY_PASSWORD

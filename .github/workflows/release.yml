name: Release Dry Run

# Releases are performed locally with `task release`, which tags, pushes, and
# publishes with the releaser's own credentials. CI deliberately has no
# permission to publish; this workflow only proves the release artifacts
# (agent images for both platforms, CLI binaries) still build.

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Dagger 1.0 beta: the stable CLI auto-downloads and runs this release.
  DAGGER_X_RELEASE: v1.0.0-beta.6

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.21.7 BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Release dry run (stage without publishing)
        run: dagger call release stage

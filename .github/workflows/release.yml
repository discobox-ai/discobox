name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag
        required: true
      preview:
        description: Build and assemble all platforms without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}
jobs:
  native-inputs:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DAGGER_ENGINE: cloud
      DAGGER_CLOUD_TOKEN: oidc
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - run: dagger api call --repository="$RELEASE_REPOSITORY" native-inputs export --path=build/native-inputs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-native-inputs
          path: build/native-inputs
          if-no-files-found: error
          overwrite: true
  native-macos:
    needs: native-inputs
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-native-inputs
          path: build/native-inputs
      - name: Build, sign, smoke and receipt the exact tagged source
        run: >-
          go run ./internal/cmd/discobox-native-ci -mode build
          -version "$RELEASE_VERSION" -repository "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos-arm64
          path: build/native
          if-no-files-found: error
          overwrite: true
  preview:
    needs: native-macos
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      DAGGER_ENGINE: cloud
      DAGGER_CLOUD_TOKEN: oidc
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-macos-arm64
          path: build/native
      - run: >-
          dagger api call --repository="$RELEASE_REPOSITORY" preview
          --version="$RELEASE_VERSION" --native-artifacts=build/native
          export --path=build/release/preview
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-preview
          path: build/release/preview
          if-no-files-found: error
          overwrite: true
  release:
    needs: native-macos
    if: github.event_name == 'push' || !inputs.preview
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      DAGGER_ENGINE: cloud
      DAGGER_CLOUD_TOKEN: oidc
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USERNAME: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-macos-arm64
          path: build/native
      - name: Validate, assemble and publish through Dagger
        run: >-
          dagger api call --repository="$RELEASE_REPOSITORY" release
          --version="$RELEASE_VERSION" --native-artifacts=build/native
          --username="$REGISTRY_USERNAME" --registry-password=env:REGISTRY_PASSWORD
          --token=env:GH_TOKEN --tap-token=env:TAP_TOKEN

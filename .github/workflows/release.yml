# A release is cut by pushing a v* tag. This workflow decides only where each
# step runs and how artifacts move between jobs; every step is a Taskfile target
# that also runs on a developer's machine (ADR 0066 §1).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true

permissions:
  contents: read

# One group per release tag, a dispatch keyed on the tag it names rather than
# the branch it runs off: false keeps a newer run from cancelling one in
# progress, but a newer run in the same group still replaces one still
# pending, so two releases must never share a group.
concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  # workflow_dispatch runs off a branch, so GITHUB_REF_NAME is not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Refuses the tag before anything is built or pushed when the pinned pool VM
  # guest or kernel predates vm-image/ at the tag. It needs the whole history
  # and every vm/ and vm-kernel/ tag, which a default checkout leaves out.
  vm-pins:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/task
        with:
          target: release:check-vm-pins
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: build/release/notes
          if-no-files-found: error

  # Each platform builds what only it can build, in a job of its own.
  # Linux also cross-compiles the Windows executables (ADR 0066 §4), and signs
  # them as it builds them, before any digest is taken (ADR 26-11-24-185). So
  # this is the one job that holds the Authenticode identity: an OIDC token
  # that only the windows-signing environment's refs can mint, for an Azure
  # identity that can sign with one Trusted Signing profile and nothing else.
  # Without the WINDOWS_SIGNING_* variables, Azure is never asked, and the
  # build ships the Windows executables unsigned and says so.
  binaries-linux:
    needs: vm-pins
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: azure/login@v2.3.0
        if: vars.WINDOWS_SIGNING_ACCOUNT != ''
        with:
          client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.WINDOWS_SIGNING_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/task
        env:
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        with:
          target: release:build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-linux
          path: build/release/bin
          if-no-files-found: error

  # darwin because cgo, the macOS SDK, and codesigning are native-only.
  binaries-darwin:
    needs: vm-pins
    runs-on: depot-macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: release:build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-darwin
          path: build/release/bin
          if-no-files-found: error

  images:
    needs: vm-pins
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Depot authenticates by OIDC against the trust relationship on its
      # project, which is what mints the token. No DEPOT_TOKEN secret is
      # needed, and without this the CLI has nothing to present.
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      # Without a Depot project the Taskfile falls back to emulated buildx,
      # which is correct but slow for sandbox-agent's Ubuntu stage
      # (ADR 0066 §6).
      - uses: depot/setup-action@v1.7.2
        if: vars.DEPOT_PROJECT_ID != ''
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/task
        with:
          target: release:images

  publish:
    needs: [vm-pins, binaries-linux, binaries-darwin, images]
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read only to decide whether the refresh step runs; the step that uses it
      # takes it as its own GH_TOKEN.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      # Both matrix legs land in one directory; release:publish uploads
      # whatever populated it.
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          merge-multiple: true
          path: build/release/bin
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
          path: build/release/notes
      - uses: ./.github/actions/task
        with:
          target: release:publish
      # Nix is installed by the step above. Asked here rather than decided in
      # YAML so the rule stays the Taskfile's (ADR 0066 §1). A dot release joins
      # the beta channel the moment it is cut; an explicit prerelease exists
      # only under its own tag (ADR 0105).
      - id: dot
        run: echo "dot=$(nix develop -c go tool task release:dot)" >> "$GITHUB_OUTPUT"

      # A step here rather than a job of its own, which ADR 0066 §2 allows once
      # Nix is installed: this is one API call, and standing up another runner
      # to make it would cost minutes to save seconds.
      #
      # This feeds `brew install discobox-beta`. It cannot feed
      # `brew install discobox`: what was just published is a prerelease, and
      # the tap builds the stable formula from the newest release a human has
      # marked stable. That is promote.yml's job, later and by hand.
      #
      # Nothing else updates the tap — it has no cron any more — so a missing
      # token is a broken release, not a slow one, and fails here rather than
      # leaving `brew install discobox-beta` on the previous version with nobody
      # aware of it.
      - if: steps.dot.outputs.dot == 'yes' && env.TAP_TOKEN == ''
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN is not set, and nothing else will tell the tap about $RELEASE_TAG"
          exit 1
      - name: Tell the tap to update
        if: steps.dot.outputs.dot == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: nix develop -c go tool task brew:refresh

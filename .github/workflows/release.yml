# A release is cut by pushing a v* tag. This workflow decides only where each
# step runs and how artifacts move between jobs; every step is a Taskfile target
# that also runs on a developer's machine (ADR 0066 §1).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # workflow_dispatch runs off a branch, so GITHUB_REF_NAME is not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Each platform builds what only it can build: darwin because cgo, the macOS
  # SDK, and codesigning are native-only; Linux because it also cross-compiles
  # the Windows binary (ADR 0066 §4).
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: depot-ubuntu-24.04-4
            artifact: linux
          - runs-on: depot-macos-15
            artifact: darwin
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: release:build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-${{ matrix.artifact }}
          path: build/release/bin
          if-no-files-found: error

  images:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Depot authenticates by OIDC against the trust relationship on its
      # project, which is what mints the token. No DEPOT_TOKEN secret is
      # needed, and without this the CLI has nothing to present.
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      # Without a Depot project the Taskfile falls back to emulated buildx,
      # which is correct but slow for sandbox-agent's Debian stage
      # (ADR 0066 §6).
      - uses: depot/setup-action@v1.7.2
        if: vars.DEPOT_PROJECT_ID != ''
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/task
        with:
          target: release:images

  publish:
    needs: [binaries, images]
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read only to decide whether the refresh step runs; the step that uses it
      # takes it as its own GH_TOKEN.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    outputs:
      stable: ${{ steps.stable.outputs.stable }}
    steps:
      - uses: actions/checkout@v6.0.2
      # Both matrix legs land in one directory; release:publish uploads
      # whatever populated it.
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          merge-multiple: true
          path: build/release/bin
      - uses: ./.github/actions/task
        with:
          target: release:publish
      # Nix is installed by the step above. Asked here rather than decided in
      # YAML so the rule stays the Taskfile's (ADR 0066 §1).
      - id: stable
        run: echo "stable=$(nix develop -c go tool task release:stable)" >> "$GITHUB_OUTPUT"

      # A step here rather than a job of its own, which ADR 0066 §2 allows once
      # Nix is installed: this is one API call, and standing up another runner
      # to make it would cost minutes to save seconds. The winget submission
      # earns its own job; this does not.
      #
      # Nothing else updates the tap — it has no cron any more — so a missing
      # token is a broken release, not a slow one, and fails here rather than
      # leaving `brew install discobox` on the previous version with nobody
      # aware of it.
      - if: steps.stable.outputs.stable == 'yes' && env.TAP_TOKEN == ''
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN is not set, and nothing else will tell the tap about $RELEASE_TAG"
          exit 1
      - name: Tell the tap to update
        if: steps.stable.outputs.stable == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: nix develop -c go tool task brew:refresh

  # The winget submission. Unlike the tap, which is ours to push to, the Windows
  # Package Manager Community Repository takes a pull request per version from a
  # fork — so this cannot use GITHUB_TOKEN, which may only write to this
  # repository. WINGET_TOKEN is a classic PAT (fine-grained tokens are not
  # accepted) with `public_repo`, belonging to the account the pull request
  # comes from. That account forks microsoft/winget-pkgs and signs Microsoft's
  # CLA once, on its first pull request, and submits unattended after that.
  #
  # Opening the request is all that is automated. A validation pipeline runs it
  # and a moderator merges it, so a version is pending until someone sees it
  # land.
  winget:
    needs: publish
    # Stable releases only, the same rule winget:publish enforces in a terminal:
    # winget serves one channel, so whatever is published is what
    # `winget install discobox` gives everyone.
    if: needs.publish.outputs.stable == 'yes'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      # Without the token there is nothing to submit with, and nothing else
      # submits — so this fails rather than passing quietly and leaving winget a
      # version behind that only a user would discover.
      - if: env.GH_TOKEN == ''
        run: |
          echo "::error::WINGET_TOKEN is not set, so $RELEASE_TAG was not submitted to winget"
          exit 1
      - uses: ./.github/actions/task
        with:
          target: winget:publish


# The libkrun host runtime has its own build and its own release line
# (ADR 0148 §5): libkrunfw's patched kernel, libkrun, and a static passt,
# built together because the libkrunfw patches are what this libkrun expects
# of its kernel.
#
# It is separate from the guest image workflow because it compiles Linux. The
# two move on unrelated clocks — this one when libkrunfw, libkrun, passt or
# upstream Linux does, the guest when Debian or Docker does — and folding them
# together would mean every guest change waiting on a kernel build that nothing
# in it touched.
#
# It publishes as `discobox-libkrun-runtime`, linux/amd64 only: libkrun is the
# only backend that runs this architecture. No host pulls it directly; the
# image a libkrun pool boots packages it with the guest (vm-krun.yml).
name: libkrun runtime

on:
  push:
    tags:
      - "libkrun-runtime/v*"
  pull_request:
    paths:
      - "vm-image/libkrun/**"
      # The packaging image compiles nothing and is built by vm-krun.yml.
      - "!vm-image/libkrun/package/**"
      - ".github/workflows/libkrun-runtime.yml"
  # Rebuilt on a cadence for upstream security fixes, like the guest. This run
  # only builds; publishing stays tag-driven so a rebuild is still a deliberate
  # release someone pins.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libkrun-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/task
        with:
          target: vm:build-libkrun-runtime

      - run: nix develop -c go tool task vm:verify-libkrun-runtime

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/libkrun-runtime/v')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Depot authenticates by OIDC against the trust relationship on its
      # project, which is what mints the token. Without this the CLI has
      # nothing to present and the push fails with "unauthenticated: Invalid
      # token" after both builds have already succeeded.
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: depot/setup-action@v1.7.2
        if: vars.DEPOT_PROJECT_ID != ''
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/task
        with:
          target: vm:publish-libkrun-runtime

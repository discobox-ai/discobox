name: Promote
on:
  release:
    types: [released, edited, published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing dot release to promote
        required: true
permissions:
  contents: read
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
    env:
      DAGGER_ENGINE: cloud
      DAGGER_CLOUD_TOKEN: oidc
      RELEASE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - run: >-
          dagger api call --repository="$RELEASE_REPOSITORY" promote
          --version="$RELEASE_VERSION" --token=env:GH_TOKEN --tap-token=env:TAP_TOKEN

# Every job body is one Taskfile target (ADR 0066 §1), but `changes`, which
# only decides which of them run. What each target does lives in Taskfile.yml
# and runs the same way in a terminal.
name: CI

# Runners are Depot's. The sizes below match what the GitHub-hosted equivalents
# gave us (4 CPU / 16 GB) rather than Depot's 2-CPU default; raise the suffix to
# -8 or -16 to trade money for wall-clock. Windows is -8: with Depot Cache warm,
# -8 cut its work from 223s on -4 to 165s and -16 was no faster. Depot's
# runners also start every job with GOCACHEPROG pointing Go's build and test
# cache at Depot Cache, which is fetched object by object rather than restored
# and saved whole; see .github/actions/task for when it is turned off, and that
# it caches nothing else.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this run has code to check (scripts/ci-changes.sh). A pull request
  # that changes only docs/ has none: every job below waits on this one, and
  # all but `docs`, which runs the checks that read docs/, are skipped by their
  # `if`. A push to main always has code.
  #
  # The gate fails closed: a run whose `changes` failed runs everything but
  # `docs`, which the rest cover. Without `!cancelled()` a failed `needs` would
  # skip every job, and a skipped job satisfies a required check.
  #
  # Skipped by `if` rather than by `on.pull_request.paths-ignore`, because a
  # job skipped that way reports nothing and a required check waiting on it
  # never resolves, while a job skipped by `if` reports as skipped.
  #
  # Run as a script rather than through .github/actions/task: it needs only git,
  # and every other job of the run waits on it, so it does not pay for Nix and
  # the module download.
  changes:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # The merge commit and its parents: HEAD^1 is the base branch.
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: scripts/ci-changes.sh "$EVENT"

  # The checks that read docs/, on a pull request that changes nothing else.
  # Any other run covers them in verify and test.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:docs

  check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:check

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:test

  codex-trust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: test:codex-trust

  ux-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:ux-smoke
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ux-smoke
          path: |
            build/ux-smoke/*/*.log
            build/ux-smoke/*/*.json
          retention-days: 7

  # The image reaper on both Docker image stores. Every shipped VM pool runs the
  # classic one, which records no arrival for a load or a pull, and no other job
  # has a daemon of that store (ADR 26-11-13-655).
  image-reclaim:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: test:image-reclaim

  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: verify

  # The release artifacts, built on every change rather than only at tag time.
  # The Dagger release module rotted for months precisely because nothing but a
  # tag exercised it (ADR 0066 Context).
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: release:build

  # An arm64 Mac: the vz provider is cgo against Virtualization.framework, and
  # the entitlement it needs can only be applied by /usr/bin/codesign. Nothing
  # on Linux compiles that code, let alone signs it (ADR 0066 §4).
  #
  # Depot's macOS runners are M2 with 8 CPUs, against GitHub's 3-core M1, and
  # come in that one size. The job runs without Nix (ADR 26-11-02-173).
  darwin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:darwin

  # The sandbox agent's tests, on the platform a macOS sandbox's agent runs
  # on. A job of its own so it runs beside ci:darwin's release build rather
  # than after it.
  darwin-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:test:darwin

  # Nix does not run on Windows, so the task action sets up plain Go here
  # instead (ADR 0066 §4). Compiling for Windows is covered by the cross
  # type-check in ci:check; this job exists because the named-pipe transport,
  # wslc's process handling, and ConPTY are code paths no other runner
  # executes.
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: depot-windows-2025-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:test

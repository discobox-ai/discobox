name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pipeline:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dagger/dagger-for-github@v8.4.0
        with:
          version: v1.0.0-beta.21
      - name: Run portable CI
        run: dagger api call --repository="$GITHUB_REPOSITORY" ci export --path=build/ci
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-artifacts
          path: build/ci
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-native-inputs
          path: build/ci/native-inputs
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-windows-amd64
          path: |
            build/ci/discobox-windows-amd64.exe
            build/ci/discobox-server-windows-amd64.exe
          if-no-files-found: error
          overwrite: true
  native-macos:
    needs: pipeline
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ci-native-inputs
          path: build/native-inputs
      - name: Native tests, Darwin lint/vet, signed build and smoke
        run: go run ./internal/cmd/discobox-native-ci -mode check -repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-macos-arm64
          path: build/native
          if-no-files-found: error
          overwrite: true
  native-windows:
    needs: pipeline
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ci-windows-amd64
          path: build/native
      - name: Native Windows tests
        run: go run ./internal/cmd/discobox-native-ci -mode check
      - name: Smoke the exact Dagger-produced executables
        run: go run ./internal/cmd/discobox-native-ci -mode smoke

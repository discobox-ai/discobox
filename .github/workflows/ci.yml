# Every job body is one Taskfile target (ADR 0066 §1). What each target does
# lives in Taskfile.yml and runs the same way in a terminal.
name: CI

# Runners are Depot's. The sizes below match what the GitHub-hosted equivalents
# gave us (4 CPU / 16 GB) rather than Depot's 2-CPU default; raise the suffix to
# -8 or -16 to trade money for wall-clock. Windows is -8: with Depot Cache warm,
# -8 cut its work from 223s on -4 to 165s and -16 was no faster. Depot's
# runners also start every job with GOCACHEPROG pointing Go's build and test
# cache at Depot Cache, which is fetched object by object rather than restored
# and saved whole; see .github/actions/task for when it is turned off, and that
# it caches nothing else.

on:
  pull_request:
  push:
    branches:
      - main
      # The desktop console's integration branch (epic #786). Its pull
      # requests run like any other; this runs the branch itself each time a
      # merge moves it.
      - feature/desktop-console

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:check

  test:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:test

  codex-trust:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: test:codex-trust

  ux-smoke:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:ux-smoke
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ux-smoke
          path: |
            build/ux-smoke/*/*.log
            build/ux-smoke/*/*.json
          retention-days: 7

  verify:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: verify

  # The desktop app (desktop/), its bridge's contract suite included, on Linux
  # only: macOS and Windows run the Go suites as before and do not build it
  # yet. Its devShell adds Rust and the window system's libraries, and Mesa's
  # software Vulkan driver, on which the target renders the app's scenes
  # headless; they are kept as an artifact.
  desktop:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:desktop
          shell: desktop
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: desktop-scenes
          path: build/desktop/*.png
          if-no-files-found: ignore
          retention-days: 7

  # The release artifacts, built on every change rather than only at tag time.
  # The Dagger release module rotted for months precisely because nothing but a
  # tag exercised it (ADR 0066 Context).
  build:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: release:build
          # The Linux desktop app is part of it (release:desktop).
          shell: desktop

  # An arm64 Mac: the vz provider is cgo against Virtualization.framework, and
  # the entitlement it needs can only be applied by /usr/bin/codesign. Nothing
  # on Linux compiles that code, let alone signs it (ADR 0066 §4).
  #
  # Depot's macOS runners are M2 with 8 CPUs, against GitHub's 3-core M1, and
  # come in that one size. The job runs without Nix (ADR 26-11-02-173).
  darwin:
    runs-on: depot-macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:darwin

  # Nix does not run on Windows, so the task action sets up plain Go here
  # instead (ADR 0066 §4). Compiling for Windows is covered by the cross
  # type-check in ci:check; this job exists because the named-pipe transport,
  # wslc's process handling, and ConPTY are code paths no other runner
  # executes.
  windows:
    runs-on: depot-windows-2025-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/task
        with:
          target: ci:test

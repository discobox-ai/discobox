# The pool VM artifacts have their own builds and their own release lines
# (ADR 0062 §3).
#
# They are not cut with the discobox release. The guest image is a Debian
# userland that boots dockerd and two VSOCK helpers, so its inputs change when
# Debian, the kernel, or Docker changes — not when Discobox does. Publishing it
# per discobox tag would push hundreds of megabytes per release and, worse,
# would make a VM fix require a product release and a product release imply a
# new VM image.
#
# There are two artifacts, on two tag lines, because they move on unrelated
# clocks:
#
#   vm/v*         discobox-vm         one guest, linux/arm64 + linux/amd64.
#                                     `vz` boots the arm64 variant and `libkrun`
#                                     the amd64 one, from one Dockerfile.
#   vm-kernel/v*  discobox-vm-kernel  the libkrunfw-patched kernel — a separate
#                                     workflow, because it compiles Linux and
#                                     must not run on a guest change.
#
# "Pool image" is deliberately not used for either — that already means the
# pool-agent container (dockerworker.DefaultPoolImage).
#
# The server pins digests, so every line moves independently in both directions.
name: VM image

on:
  push:
    tags:
      - "vm/v*"
  pull_request:
    paths:
      - "vm-image/**"
      # The kernel is built by vm-kernel.yml and changes on its own clock;
      # nothing under it reaches this build.
      - "!vm-image/kernel/**"
      - "pool-agent/vsock/**"
      - "pool-agent/cmd/discobox-vsock-guest/**"
      - ".github/workflows/vm-image.yml"
  # A VM image release is mostly a distribution snapshot, so it is rebuilt on a
  # cadence even when nothing in this repository changed. This run only builds:
  # publishing stays tag-driven so a security rebuild is still a deliberate
  # release someone pins.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    # One guest image, so one build matrix rather than one job per backend.
    # Native runners, not QEMU: the build installs a kernel, generates an
    # initrd, and runs mkfs.ext4 over the whole root filesystem. Emulating that
    # costs an hour to save nothing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: depot-ubuntu-24.04-arm-4
          - platform: linux/amd64
            runner: depot-ubuntu-24.04-4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/task
        with:
          target: vm:build VM_PLATFORM=${{ matrix.platform }}

      - run: nix develop -c go tool task vm:verify VM_PLATFORM=${{ matrix.platform }}

  publish-guest:
    needs: guest
    if: startsWith(github.ref, 'refs/tags/vm/v')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Depot authenticates by OIDC against the trust relationship on its
      # project, which is what mints the token. Without this the CLI has
      # nothing to present and the push fails with "unauthenticated: Invalid
      # token" after both builds have already succeeded.
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: depot/setup-action@v1.7.2
        if: vars.DEPOT_PROJECT_ID != ''
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # depot builds each architecture on a native machine, so the two-platform
      # push is one command and no manifest list has to be assembled by hand.
      - uses: ./.github/actions/task
        with:
          target: vm:publish

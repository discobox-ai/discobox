# The pool VM image has its own build and its own release line (ADR 0062 §3).
#
# It is not cut with the discobox release. It is a Debian userland that boots
# dockerd and two VSOCK helpers, so its inputs change when Debian, the kernel,
# or Docker changes — not when Discobox does. Publishing it per discobox tag
# would push hundreds of megabytes per release and, worse, would make a VM fix
# require a product release and a product release imply a new VM image.
#
# It is published as `discobox-vm`, with no backend in the name: only `vz` boots
# it today, but libkrun is expected to boot the same artifacts once ADR 0062 §9
# lands. "Pool image" is deliberately not used — that already means the
# pool-agent container (dockerworker.DefaultPoolImage).
#
# The server pins a digest, so the two lines move independently in both
# directions.
name: VM image

on:
  push:
    tags:
      - "vm/v*"
  pull_request:
    paths:
      - "server/providers/vz/image/**"
      - "pool-agent/vsock/**"
      - "pool-agent/cmd/discobox-vsock-guest/**"
      - ".github/workflows/vm-image.yml"
  # A VM image release is mostly a distribution snapshot, so it is rebuilt on a
  # cadence even when nothing in this repository changed. This run only builds:
  # publishing stays tag-driven so a security rebuild is still a deliberate
  # release someone pins.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A native arm64 runner, not QEMU: the build installs an arm64 kernel,
    # generates an initrd, and runs mkfs.ext4 over the whole root filesystem.
    # Emulating that costs an hour to save nothing.
    runs-on: depot-ubuntu-24.04-arm-4
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/task
        with:
          target: vm:build

      - run: nix develop -c go tool task vm:verify

      - uses: docker/login-action@v3.6.0
        if: startsWith(github.ref, 'refs/tags/vm/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs the build to get an image instead of a directory of artifacts.
      # Every stage is a cache hit in the builder vm:build already used, so only
      # the push is new work.
      - run: nix develop -c go tool task vm:publish
        if: startsWith(github.ref, 'refs/tags/vm/v')

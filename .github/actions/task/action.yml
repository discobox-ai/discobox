name: Task
description: Run one Taskfile target in the repository's Nix devShell on Linux, with plain Go on macOS and Windows.

# The whole GitHub Actions layer, in one place (ADR 0066 §2). A job that needs a
# new check gets a Taskfile target and four lines of YAML; nothing about *what*
# the check does lives in this directory.
#
# The one thing this cannot do that ADR 0066 §2 describes is check out the
# repository: a local composite action is only resolvable once the repository is
# already on disk, so every job runs actions/checkout first. A job that needs a
# second target adds a plain `run: nix develop -c go tool task <target>` step on
# Linux, where Nix is installed by then, or `run: go tool task <target>` on macOS
# and Windows. What such a step compiles reaches Depot Cache like the rest.
#
# Nothing is cached here but through Depot Cache: Go's build and test cache and
# golangci-lint's analysis cache are its, fetched per object, and modules come
# from the module proxy each run. An actions/cache of either was a tarball
# restored and saved whole, which on main cost 6-11 minutes a job, and without
# it the jobs measured no slower. The devShell comes from cache.nixos.org.

inputs:
  target:
    description: The Taskfile target to run.
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      if: runner.os == 'Linux'
      uses: cachix/install-nix-action@v31.11.1
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # Only Linux enters the devShell (ADR 26-11-02-173). Nix does not run on
    # Windows, and a macOS job uses nothing of it but a bootstrap Go, so both
    # get go.mod's Go from setup-go instead. Its own cache stays off, for the
    # reason above.
    - name: Install Go
      if: runner.os != 'Linux'
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    # Go's build and test cache is not here: Depot's runners start every job
    # with GOCACHEPROG set to Depot Cache, which Go asks for each compiled
    # package or test result as it needs it and writes new ones to as it makes
    # them. Nothing is downloaded before the target or uploaded after it, and a
    # pull request's results are shared like main's. Nix keeps the environment,
    # so the devShell's go sees it too. This step shows it in the log, and
    # warns on a runner without it, where every build starts cold.
    #
    # Only for a pull request or a push to a branch. Go trusts whatever the
    # cache returns for a key, and a pull request's code can write that cache,
    # so every other run turns it off for the rest of the job and compiles from
    # scratch: a tag's release binaries, images, VM guest and kernel, and a
    # release dispatched by hand, which runs off a branch. Choosing by event,
    # not by which job publishes, keeps a trigger added later off it too.
    #
    # golangci-lint reads its own GOLANGCI_LINT_CACHEPROG, which Depot's Linux
    # runner sets too; the step names it when it is there.
    - name: Choose the Go build cache
      shell: bash
      env:
        SHARED: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
      run: |
        if [ "$RUNNER_OS" != Linux ]; then go=go; else go='nix develop -c go'; fi
        if [ "$SHARED" != true ]; then
          # golangci-lint's cache too: no release job lints today, but one that
          # did would read results a pull request wrote.
          echo "GOCACHEPROG=" >> "$GITHUB_ENV"
          echo "GOLANGCI_LINT_CACHEPROG=" >> "$GITHUB_ENV"
          # Go reads an empty variable as unset and falls back to its go.env
          # settings, so check what Go itself now sees rather than trust it.
          # Assigned first, so a go that fails fails the step, and its last
          # line only, past anything the devShell prints.
          seen=$(GOCACHEPROG= $go env GOCACHEPROG | tail -n 1)
          if [ -n "$seen" ]; then
            echo "::error title=Shared Go cache::GOCACHEPROG is still set from Go's settings file; this run must not read a cache pull requests write."
            exit 1
          fi
          echo "A $GITHUB_EVENT_NAME run of $GITHUB_REF: Depot Cache is off, Go and golangci-lint build from cold local caches."
          exit 0
        fi
        prog=$($go env GOCACHEPROG | tail -n 1)
        if [ -n "$prog" ]; then
          # Its first word only: the rest is the runner's, and could carry a credential.
          echo "Go's build cache is GOCACHEPROG, running ${prog%% *}."
          lint=${GOLANGCI_LINT_CACHEPROG:-}
          if [ -n "$lint" ]; then
            echo "golangci-lint's cache is GOLANGCI_LINT_CACHEPROG, running ${lint%% *}."
          else
            echo "golangci-lint's cache is local to this job."
          fi
        else
          echo "::warning title=No Depot Cache::GOCACHEPROG is unset on this runner, so Go builds from a cold cache. Is Depot Cache's automatic connection on for Actions jobs?"
        fi

    - name: go tool task ${{ inputs.target }}
      if: runner.os == 'Linux'
      shell: bash
      run: nix develop -c go tool task ${{ inputs.target }}

    - name: go tool task ${{ inputs.target }}
      if: runner.os != 'Linux'
      shell: bash
      run: go tool task ${{ inputs.target }}

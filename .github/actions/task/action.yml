name: Task
description: Run one Taskfile target in the repository's Nix devShell (plain Go on Windows).

# The whole GitHub Actions layer, in one place (ADR 0066 §2). A job that needs a
# new check gets a Taskfile target and four lines of YAML; nothing about *what*
# the check does lives in this directory.
#
# The one thing this cannot do that ADR 0066 §2 describes is check out the
# repository: a local composite action is only resolvable once the repository is
# already on disk, so every job runs actions/checkout first. A job that needs a
# second target adds a plain `run: nix develop -c go tool task <target>` step —
# Nix is already installed by then, though not on Windows. What such a step
# compiles reaches Depot Cache like the rest, but the module and lint caches are
# saved by this action's last step, not when the job ends, so what it downloads
# or lints is not kept for the next run.

inputs:
  target:
    description: The Taskfile target to run.
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      if: runner.os != 'Windows'
      uses: cachix/install-nix-action@v31.11.1
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # Nix does not run on Windows (ADR 0066 §4), so there the bootstrap Go comes
    # from setup-go instead, and GOTOOLCHAIN=auto fetches go.mod's from there as
    # it does in the devShell. Its own cache stays off: the step below is the
    # one cache, for every runner, beside Depot Cache.
    - name: Install Go
      if: runner.os == 'Windows'
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    # The devShell itself comes from cache.nixos.org. What Depot Cache does not
    # cover is kept here: the module cache, golangci-lint's analysis cache,
    # which is its own and not Go's, and Windows's build cache, since Depot's
    # Windows runner sets no GOCACHEPROG. That path exists on no other runner.
    #
    # Keyed by commit and saved only from main, so a run starts from the newest
    # main that saved one. A key that stays put until go.sum changes is a hit
    # forever and therefore never saved again, and the lint cache falls a
    # commit further behind main with every push. A run on main saves, whether
    # a push, a schedule, or a dispatch; pull requests and tags only restore:
    # what they would save is scoped to their own ref, where nothing else reads
    # it.
    #
    # actions/cache, which Depot's runners back with Depot Cache too, so it
    # still works on a GitHub-hosted runner, where Linux and macOS lose only
    # the build cache.
    - name: Restore the Go caches
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/AppData/Local/go-build
          ~/go/pkg/mod
          ~/.cache/golangci-lint
          ~/Library/Caches/golangci-lint
        # Keyed by job, not by target: a target name carries a colon, and the
        # jobs are already one-to-one with targets. Separate keys because a
        # cross-compiling job's cache has nothing in common with a native one's.
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          go-${{ runner.os }}-${{ runner.arch }}-

    # Go's build and test cache is not here: Depot's runners start every job
    # with GOCACHEPROG set to Depot Cache, which Go asks for each compiled
    # package or test result as it needs it and writes new ones to as it makes
    # them. Nothing is downloaded before the target or uploaded after it, and a
    # pull request's results are shared like main's. Nix keeps the environment,
    # so the devShell's go sees it too. This step shows it in the log, and warns
    # on a Linux or macOS runner that did not set it, where every build starts
    # cold. Windows never has it, and keeps its build cache in actions/cache.
    #
    # Only for a pull request or a push to a branch. Go trusts whatever the
    # cache returns for a key, and a pull request's code can write that cache,
    # so every other run turns it off for the rest of the job and compiles from
    # scratch: a tag's release binaries, images, VM guest and kernel, and a
    # release dispatched by hand, which runs off a branch. Choosing by event,
    # not by which job publishes, keeps a trigger added later off it too.
    #
    # After the restore, not before: the devShell's go is a bootstrap with
    # GOTOOLCHAIN=auto, so the first go command downloads the toolchain into the
    # module cache, read-only, and the restore then cannot extract over it.
    - name: Choose the Go build cache
      shell: bash
      env:
        SHARED: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then go=go; else go='nix develop -c go'; fi
        if [ "$SHARED" != true ]; then
          echo "GOCACHEPROG=" >> "$GITHUB_ENV"
          # Go reads an empty variable as unset and falls back to its go.env
          # settings, so check what Go itself now sees rather than trust it.
          if [ -n "$(GOCACHEPROG= $go env GOCACHEPROG)" ]; then
            echo "::error title=Shared Go cache::GOCACHEPROG is still set from Go's settings file; this run must not read a cache pull requests write."
            exit 1
          fi
          echo "A $GITHUB_EVENT_NAME run of $GITHUB_REF: Depot Cache is off, Go builds from a cold local cache."
          exit 0
        fi
        prog=$($go env GOCACHEPROG)
        if [ -n "$prog" ]; then
          # Its first word only: the rest is the runner's, and could carry a credential.
          echo "Go's build cache is GOCACHEPROG, running ${prog%% *}."
        elif [ "$RUNNER_OS" = Windows ]; then
          echo "Depot's Windows runner sets no GOCACHEPROG: Go's build cache is the actions/cache one."
        else
          echo "::warning title=No Depot Cache::GOCACHEPROG is unset on this runner, so Go builds from a cold cache. Is Depot Cache's automatic connection on for Actions jobs?"
        fi

    - name: go tool task ${{ inputs.target }}
      if: runner.os != 'Windows'
      shell: bash
      run: nix develop -c go tool task ${{ inputs.target }}

    - name: go tool task ${{ inputs.target }}
      if: runner.os == 'Windows'
      shell: bash
      run: go tool task ${{ inputs.target }}

    # Saved whether or not the target passed: a failing target still leaves the
    # modules it fetched and the analysis it ran behind.
    - name: Save the Go caches
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@v6.1.0
      with:
        path: |
          ~/AppData/Local/go-build
          ~/go/pkg/mod
          ~/.cache/golangci-lint
          ~/Library/Caches/golangci-lint
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}

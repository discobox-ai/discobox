    /api/projects/{projectId}/sandboxes/{sandboxId}/files/content:
        get:
            description: Streams a file's content, or a byte range of it. 404 for a path that does not exist, 409 for a directory.
            operationId: read-sandbox-file
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: The file. Absolute, or relative to the default user's home; a leading `~` is that home.
                  in: query
                  name: path
                  required: true
                  schema:
                    type: string
                - description: The first byte to read.
                  in: query
                  name: offset
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: How many bytes to read at most. Omitted reads to the end.
                  in: query
                  name: length
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                    description: The content.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Read a file in a discobox.
            tags:
                - Sandbox Files
        put:
            description: Writes the request body to a file, replacing what is there. The content lands whole or not at all, and a link is written through to what it points to. A replaced file keeps its permissions. 412 when ifExists refuses (as an If-None-Match does) or ifVersion no longer matches, 409 when the path is a directory, 404 when ifMissing refuses.
            operationId: write-sandbox-file
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: The file. Absolute, or relative to the default user's home; a leading `~` is that home.
                  in: query
                  name: path
                  required: true
                  schema:
                    type: string
                - description: What to do when the file exists. replace, the default, replaces it; fail refuses with 412.
                  in: query
                  name: ifExists
                  schema:
                    enum:
                        - replace
                        - fail
                    type: string
                - description: What to do when the file does not exist. create, the default, creates it; fail refuses with 404.
                  in: query
                  name: ifMissing
                  schema:
                    enum:
                        - create
                        - fail
                    type: string
                - description: Write only when the file is still at this version, from its stat. Anything else, including no file, is 412.
                  in: query
                  name: ifVersion
                  schema:
                    type: string
                - description: Permission bits for a file this creates, set exactly. Omitted, a new file is 0666 (438) less the umask.
                  in: query
                  name: mode
                  schema:
                    format: int64
                    maximum: 4095
                    minimum: 0
                    type: integer
                - description: Create the file's missing parent directories.
                  in: query
                  name: parents
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/octet-stream:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxFileStat'
                    description: The file as written.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Write a file in a discobox.
            tags:
                - Sandbox Files

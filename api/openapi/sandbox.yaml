info:
    description: Generated subset of the canonical Discobox Server REST API implemented inside a sandbox.
    title: Discobox Sandbox Agent REST API
    version: 0.1.0
openapi: 3.1.1
paths:
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-hooks:
        get:
            operationId: list-agent-hooks
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Optional agent terminal runtime ID filter.
                  in: query
                  name: terminalId
                  required: false
                  schema:
                    type: string
                - description: Maximum number of hook records to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentHookLogsResponse'
                    description: Recent agent hook payload logs.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent sandbox agent hook payload logs.
            tags:
                - Agent Hooks
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs:
        get:
            operationId: list-sandbox-execs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecsResponse'
                    description: Sandbox exec list.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List exec runtimes in a sandbox.
            tags:
                - Sandbox Execs
        post:
            operationId: create-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateSandboxExecRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateSandboxExecResponse'
                    description: Created sandbox exec.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Create an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}:
        delete:
            operationId: delete-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: Exec destroyed.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Destroy an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
        get:
            operationId: get-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExec'
                    description: Sandbox exec.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/attach:
        get:
            description: Opens a websocket carrying the framed bidirectional stream for a running sandbox exec. Input frames write to exec stdin, output frames stream process output, and close-input frames close stdin without detaching output.
            operationId: attach-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "101":
                    description: Switching protocols to the framed sandbox exec attach stream.
                    headers:
                        Connection:
                            description: HTTP connection upgrade marker.
                            schema:
                                type: string
                        Upgrade:
                            description: Upgrade protocol name.
                            schema:
                                type: string
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Attach to a sandbox exec stream.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/events:
        get:
            operationId: list-sandbox-exec-events
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
                - description: Maximum number of history items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecEventsResponse'
                    description: Recent exec audit events.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent audit events for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/logs:
        get:
            operationId: list-sandbox-exec-logs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecLogsResponse'

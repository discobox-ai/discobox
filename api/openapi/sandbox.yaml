                    type: string
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Optional harness terminal runtime ID filter.
                  in: query
                  name: terminalId
                  required: false
                  schema:
                    type: string
                - description: Maximum number of hook records to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
                - description: Only hooks from this provider (e.g. claude-code).
                  in: query
                  name: provider
                  required: false
                  schema:
                    type: string
                - description: Only hooks whose own or canonical event name is this (e.g. PreToolUse).
                  in: query
                  name: event
                  required: false
                  schema:
                    type: string
                - description: Only hooks recorded at or after this time.
                  in: query
                  name: since
                  required: false
                  schema:
                    format: date-time
                    type: string
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
                - description: Only hooks recorded at or before this time, for paging back newest first.
                  in: query
                  name: until
                  required: false
                  schema:
                    format: date-time
                    type: string
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00

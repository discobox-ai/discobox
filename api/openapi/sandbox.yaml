info:
    description: Generated subset of the canonical Discobox Server REST API implemented inside a sandbox.
    title: Discobox Sandbox Agent REST API
    version: 0.1.0
openapi: 3.1.1
paths:
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals:
        get:
            operationId: list-agent-terminals
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentTerminalsResponse'
                    description: Agent terminal list.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List agent terminal runtimes in a sandbox.
            tags:
                - Agent Terminals
        post:
            description: Creates an ephemeral terminal/TUI runtime for a coding-agent CLI. When the request is an upgrade request, the sandbox agent creates the terminal and switches protocols to the framed bidirectional attach stream instead of returning JSON.
            operationId: create-agent-terminal
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAgentTerminalRequest'
                required: true
            responses:
                "101":
                    description: Switching protocols to the framed agent terminal attach stream.
                    headers:
                        Connection:
                            description: HTTP connection upgrade marker.
                            schema:
                                type: string
                        Upgrade:
                            description: Upgrade protocol selected by the sandbox agent.
                            schema:
                                type: string
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAgentTerminalResponse'
                    description: Created agent terminal.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Create an agent terminal runtime in a sandbox.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}:
        delete:
            operationId: delete-agent-terminal
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: Agent terminal destroyed.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Destroy an agent terminal runtime in a sandbox.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/attach:
        post:
            description: Upgrades to a framed bidirectional stream for a running agent terminal. Closing the stream detaches from the terminal and does not stop the underlying agent process.
            operationId: attach-agent-terminal
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
            responses:
                "101":
                    description: Switching protocols to the framed agent terminal attach stream.
                    headers:
                        Connection:
                            description: HTTP connection upgrade marker.
                            schema:
                                type: string
                        Upgrade:
                            description: Upgrade protocol selected by the sandbox agent.
                            schema:
                                type: string
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Attach to an agent terminal stream.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/events:
        get:
            operationId: list-agent-terminal-events
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
                - description: Maximum number of history items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentTerminalEventsResponse'
                    description: Recent terminal audit events.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent audit events for an agent terminal.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/logs:
        get:
            operationId: list-agent-terminal-logs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentTerminalLogsResponse'
                    description: Terminal PTY input and output log entries.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List PTY logs for an agent terminal.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/resources:
        get:
            operationId: get-agent-terminal-resources
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourceSnapshot'
                    description: Latest resource snapshot.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get the latest opaque resource snapshot for an agent terminal.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/resources/history:
        get:
            operationId: list-agent-terminal-resource-history
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
                - description: Maximum number of history items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourceHistoryResponse'
                    description: Recent resource snapshots.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent opaque resource snapshots for an agent terminal.
            tags:
                - Agent Terminals
    /api/projects/{projectId}/sandboxes/{sandboxId}/agent-terminals/{terminalId}/resources/stream:
        get:
            operationId: stream-agent-terminal-resources
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Agent terminal runtime ID.
                  in: path
                  name: terminalId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        text/event-stream:
                            schema:
                                type: string
                    description: Server-sent resource snapshot stream.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Stream opaque resource snapshots for an agent terminal.
            tags:
                - Agent Terminals
servers:
    - description: Provider-delegated sandbox endpoint
      url: http://sandbox.local

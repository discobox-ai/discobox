                    type: boolean
                cols:
                    format: int64
                    type: integer
                cursorCol:
                    description: Zero-based cursor column.
                    format: int64
                    type: integer
                cursorRow:
                    description: Zero-based cursor row.
                    format: int64
                    type: integer
                cursorVisible:
                    type: boolean
                exited:
                    description: Whether the program has exited. Its last screen stays readable while the terminal lingers after exit.
                    type: boolean
                lines:
                    description: The visible screen, one string per row, trailing blanks trimmed.
                    items:
                        type: string
                    type: array
                outputAt:
                    description: When the program last wrote output.
                    format: date-time
                    type: string
                rows:
                    format: int64
                    type: integer
                scrollback:
                    description: Lines above the screen, oldest first.
                    items:
                        type: string
                    type: array
                title:
                    description: The window title the program last set.
                    type: string
            required:
                - rows
                - cols
                - cursorRow
                - cursorCol
                - cursorVisible
                - altScreen
                - lines
                - exited
            type: object
        SandboxExecWaitBody:
            additionalProperties: false
            properties:
                timeoutSeconds:
                    description: How long to wait, at most 60 seconds.
                    format: int64
                    maximum: 60
                    minimum: 1
                    type: integer
                until:
                    $ref: '#/components/schemas/SandboxExecWaitUntil'
            required:
                - until
                - timeoutSeconds
            type: object
        SandboxExecWaitResult:
            additionalProperties: false
            properties:
                hook:
                    $ref: '#/components/schemas/HarnessHookLog'
                    description: The hook that ended the wait, when one did.
                outputAt:
                    description: When the program last wrote output.
                    format: date-time
                    type: string
                reason:
                    enum:
                        - hook
                        - quiet
                        - exit
                        - timeout
                    type: string
                resumeAfter:
                    description: Where the next wait resumes, to pass as until.after exactly as given. After a hook, just past that hook; otherwise the point this wait counted from, so a hook recorded while it returned is still found.
                    type: string
            required:
                - reason
                - resumeAfter
            type: object
        SandboxExecWaitUntil:
            additionalProperties: false
            description: The conditions a wait ends on; the first to hold ends it.
            properties:
                after:
                    description: Only hooks recorded after this point count — the resumeAfter a previous wait or input answered with, passed back as given, so nothing recorded between two calls is missed. Absent, only hooks recorded after the wait began.
                    type: string
                exit:
                    description: The exec has ended.
                    type: boolean
                hookEvents:
                    description: Harness hook event names from this terminal, such as Stop and Notification. A name matches either the harness's own event or its canonical (Claude Code) name, so a caller need not know which harness the terminal runs.
                    items:
                        type: string
                    type: array
                quietSeconds:
                    description: Neither output nor input for this many seconds, counted from no earlier than the start of the wait.
                    format: int64
                    minimum: 1
                    type: integer
            type: object
        SandboxExecsResponse:
            additionalProperties: false
            properties:
                execs:
                    items:
                        $ref: '#/components/schemas/SandboxExec'
                    type: array
            required:
                - execs
            type: object
        SandboxMeta:
            additionalProperties: false
            description: A sandbox's description and tags, as the file inside it that holds them says (ADR 0136).
            properties:
                description:
                    description: What the sandbox is for, in the words of whoever wrote it. May run to several lines; a listing shows the first.
                    type: string
                tags:
                    additionalProperties:
                        type: string
                    description: Tags labeling the sandbox, key to value. A tag with an empty value is a plain label.
                    type: object
            required:
                - tags
            type: object
        SandboxService:
            additionalProperties: false
            description: A service the sandbox's primary source declares under .discobox/services, together with the state of the exec running it.
            properties:
                description:
                    description: What the service is for, from the declaration's front matter.
                    type: string
                error:
                    description: Why the last run failed, when it did.
                    type: string
                execId:
                    description: Exec running this service, absent when none ever has. It is durable across restarts, so a client keyed on it keeps its place when the service is restarted.
                    type: string
                exitCode:
                    description: Exit code of the last run when it has ended.
                    format: int64
                    type: integer
                exitedAt:
                    format: date-time
                    type: string
                fileName:
                    description: The declaring file's own name. It orders the listing, which is what the numeric prefix stripped from the ID is for.
                    type: string
                id:
                    description: Stable filename-derived service ID, with any numeric ordering prefix and known extension removed - 10-discobox-api.sh is discobox-api.
                    type: string
                name:
                    description: Display name from the declaration's front matter, defaulted from the filename.
                    type: string
                path:
                    description: Absolute path to the declaring script inside the sandbox.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                ports:
                    description: Ports the declaration says this service serves, in the order it names them - TCP ports, or UDP ones when the declaration states the udp protocol (ADR 0109). A declared port is reported and forwarded whether or not anything observable is listening on it (ADR 0076) - it exists for the ports discovery cannot find, published by a nested container or bound by a socket-activated unit, since discovery only sees sockets the sandbox user owns.
                    items:
                        format: int64
                        type: integer
                    type: array
                problem:
                    description: Why this declaration cannot run - a missing shebang, a missing executable bit, a duplicate ID. A service with a problem is listed rather than dropped, because one that silently fails to appear is indistinguishable from one nobody declared.
                    type: string
                startedAt:
                    format: date-time
                    type: string
                status:
                    description: |
                        Service state, derived from the exec running it. stopped covers both a
                        service that has never run and one stopped on request; exited is a
                        process that ended by itself successfully. Nothing is restarted
                        automatically.
                    enum:
                        - stopped
                        - starting
                        - running
                        - exited
                        - failed
                    type: string
            required:
                - id
                - name
                - status
            type: object
        SandboxServicesResponse:
            additionalProperties: false
            properties:
                services:
                    items:
                        $ref: '#/components/schemas/SandboxService'
                    type: array
            required:
                - services
            type: object
        SandboxTool:
            additionalProperties: false
            description: A tool declared by the sandbox's image under /usr/local/share/discobox/tools or by its primary source under .discobox/tools (ADR 0125). The client merges these with the tools it declares itself and runs the result; the sandbox only lists them.
            properties:
                args:
                    description: Arguments that follow the program or the script.
                    items:
                        type: string
                    type: array
                description:
                    description: What the tool is for.
                    type: string
                env:
                    description: Environment added to the tool's, in NAME=value form.
                    items:
                        type: string
                    type: array
                fileName:
                    description: The declaring file's own name, which orders the listing.
                    type: string
                files:
                    description: Files the tool carries into the sandbox, each copied under the run user's home only where nothing is there already.
                    items:
                        $ref: '#/components/schemas/SandboxToolFile'
                    type: array
                id:
                    description: Stable filename-derived tool ID, with any numeric ordering prefix and known extension removed - 20-fresh.yaml is fresh - unless the declaration states one.
                    type: string
                key:
                    description: The single key the tool asks to answer to in a picker.
                    type: string
                layer:
                    description: Which of the sandbox's directories declared it.
                    enum:
                        - image
                        - source
                    type: string
                name:
                    description: Display name from the declaration, defaulted from the filename.
                    type: string
                path:
                    description: Absolute path to the declaring file inside the sandbox. For a script tool it is what runs.
                    type: string
                problem:
                    description: Why this declaration cannot run. A tool with a problem is listed rather than dropped.
                    type: string
                program:
                    description: The program a .yaml declaration runs.
                    items:
                        type: string
                    type: array
                runs:
                    description: Where the tool runs. A host tool declared by a sandbox is always listed with a problem, because only the client's own layers may put a program on the client's machine.
                    enum:
                        - sandbox
                        - host
                    type: string
                script:
                    description: True when the declaring file is a script and is itself what runs; false for a .yaml declaration, which runs program.
                    type: boolean
            required:
                - id
                - name
                - runs
                - layer
                - fileName
                - script
            type: object
        SandboxToolFile:
            additionalProperties: false
            description: One file a tool carries into the sandbox.
            properties:
                default:
                    description: What the client's local copy starts as, from the file of this name beside the declaration.
                    type: string
                home:
                    description: Where it lands, relative to the run user's home.
                    type: string
                name:
                    description: The file's name, and the name of its local copy on the client.
                    type: string
            required:
                - name
                - home
            type: object
        SandboxToolsResponse:
            additionalProperties: false
            properties:
                tools:
                    items:
                        $ref: '#/components/schemas/SandboxTool'
                    type: array
            required:
                - tools
            type: object
        SandboxUser:
            additionalProperties: false
            description: |-
                Run identity and group membership. Every field is optional; omitting the
                whole object means the image's own user (ADR 0025 §5). On sandbox create
                this defines the sandbox.json default user, and on exec create it
                overrides that user for one exec — the same fields mean the same thing at
                both layers.

                Sandbox create is stricter, because it names the account the sandbox
                creates: a user that gives name or homeDirectory must give uid, and uid
                and gid must each be 0 (root) or within 1000-60000, the range a Linux
                guest gives ordinary accounts. Anything else is refused with 400, never
                clamped (ADR 0141).
            properties:
                additionalGroups:
                    description: |-
                        Supplementary groups, each a group name or a numeric GID, resolved inside
                        the sandbox. All-or-nothing, never merged: omit to inherit the sandbox's
                        groups, or name any to run with exactly those (ADR 0025 §2).
                    items:
                        type: string
                    type: array
                gid:
                    description: Primary group ID to use inside the sandbox. Mutually exclusive with groupName.
                    format: int64
                    type: integer
                groupName:
                    description: |-
                        Primary group name to use inside the sandbox, resolved against the image's
                        /etc/group. Mutually exclusive with gid.
                    type: string
                homeDirectory:
                    description: User home directory to use inside the sandbox
                    type: string
                name:
                    description: Username to use inside the sandbox
                    type: string
                uid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
            type: object
        UpdateSandboxMetaBody:
            additionalProperties: false
            description: A change to a sandbox's meta, applied to the meta file in the sandbox (ADR 0136). What the change does not name is left as it is, including what the sandbox wrote itself.
            properties:
                description:
                    description: Replaces the description. An empty string clears it; omit it to leave the description alone.
                    type: string
                removeTags:
                    description: Tag keys to delete. Naming a key the sandbox does not have is not an error. A key may not be both set and removed.
                    items:
                        type: string
                    type: array
                setTags:
                    additionalProperties:
                        type: string
                    description: Tags to add or overwrite, key to value. An empty value makes a plain label. A key is printable, has no whitespace, and contains neither = nor ,; a value is one line with no ,.
                    type: object
            type: object
info:
    description: Generated subset of the canonical Discobox Server REST API implemented inside a sandbox.
    title: Discobox Sandbox Harness REST API
    version: 0.1.0
openapi: 3.1.1
paths:
    /api/projects/{projectId}/sandboxes/{sandboxId}/exec-events:
        get:
            description: Lifecycle events for every exec in a sandbox (created, started, stopped, attach opened and closed), recorded by the sandbox agent inside the sandbox. They are sandbox-attested (ADR 0130 §2) and read only from a running sandbox; the read never starts one.
            operationId: list-exec-events
            parameters:
                - description: Only the event with this ID, which is how one record is read in full
                  in: query
                  name: id
                  schema:
                    description: Only the event with this ID, which is how one record is read in full
                    type: string
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Only events for this exec.
                  in: query
                  name: execId
                  required: false
                  schema:
                    type: string
                - description: Only events of this type (e.g. exec.started).
                  in: query
                  name: type
                  required: false
                  schema:
                    type: string
                - description: Only events recorded at or after this time.
                  in: query
                  name: since
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: asc returns the earliest matching events at or after since, for reading forward; desc, the default, returns the most recent.
                  in: query
                  name: order
                  required: false
                  schema:
                    default: desc
                    enum:
                        - asc
                        - desc
                    type: string
                - description: Maximum number of events to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecEventsResponse'
                    description: Exec lifecycle events.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List lifecycle events for every exec in a sandbox.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs:
        get:
            operationId: list-sandbox-execs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecsResponse'
                    description: Sandbox exec list.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List exec runtimes in a sandbox.
            tags:
                - Sandbox Execs
        post:
            operationId: create-sandbox-exec
            parameters:
                - description: Wait for the sandbox and its pool to become ready before creating the exec. The control plane consumes this option.
                  in: query
                  name: wait
                  required: false
                  schema:
                    enum:
                        - ready
                    type: string
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateSandboxExecRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateSandboxExecResponse'
                    description: Created sandbox exec.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Create an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}:
        delete:
            operationId: delete-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: Exec destroyed.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Destroy an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
        get:
            operationId: get-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExec'
                    description: Sandbox exec.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get an exec runtime in a sandbox.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/attach:
        get:
            description: Opens a websocket carrying the framed bidirectional stream for a running sandbox exec. Input frames write to exec stdin, output frames stream process output, and close-input frames close stdin without detaching output.
            operationId: attach-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "101":
                    description: Switching protocols to the framed sandbox exec attach stream.
                    headers:
                        Connection:
                            description: HTTP connection upgrade marker.
                            schema:
                                type: string
                        Upgrade:
                            description: Upgrade protocol name.
                            schema:
                                type: string
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Attach to a sandbox exec stream.
            tags:
                - Sandbox Execs
        post:
            description: |-
                Runs a prepared exec to completion in a single request: the request body is written to the exec's
                stdin, stdin is then closed, and the response body is everything the exec emitted, with output and
                error streams interleaved as produced. This is the non-interactive counterpart to the websocket
                attach, for callers that only need to feed a command bytes and read its output; no frame encoding
                is involved.

                The exec must not be started beforehand — this starts it once the attach is connected, since output
                produced before an attach exists is lost. The exit status is not encoded in the response: read it
                from the exec record, which is authoritative.
            operationId: attach-sandbox-exec-once
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/octet-stream:
                        schema:
                            format: binary
                            type: string
                description: Bytes to write to the exec's stdin. May be empty for a command that reads no input.
                required: false
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                    description: The exec ran to completion; the body is its output.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Run a sandbox exec to completion with a one-shot input.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/events:
        get:
            operationId: list-sandbox-exec-events
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
                - description: Maximum number of history items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecEventsResponse'
                    description: Recent exec audit events.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent audit events for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/input:
        post:
            description: Writes text and named keys to the terminal, in order, the way typing into an attach does, and counts as access to it (ADR 0137 §2). Text is delivered as a bracketed paste when the program enabled one. 409 for an exec with no terminal or closed input.
            operationId: send-sandbox-exec-input
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SandboxExecInputBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecInputResult'
                    description: Input written.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Type into a terminal.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/logs:
        get:
            operationId: list-sandbox-exec-logs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecLogsResponse'
                    description: Exec input and output log entries.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List logs for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/resources:
        get:
            operationId: get-sandbox-exec-resources
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourceSnapshot'
                    description: Latest resource snapshot.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get the latest opaque resource snapshot for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/resources/history:
        get:
            operationId: list-sandbox-exec-resource-history
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
                - description: Maximum number of history items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourceHistoryResponse'
                    description: Recent resource snapshots.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent opaque resource snapshots for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/resources/stream:
        get:
            operationId: stream-sandbox-exec-resources
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        text/event-stream:
                            schema:
                                type: string
                    description: Server-sent resource snapshot stream.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Stream opaque resource snapshots for a sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/screen:
        get:
            description: The terminal's screen as text, rendered from the terminal emulator its shim keeps, with recent scrollback on request. Reading it does not attach, resize the terminal, or count as activity (ADR 0137 §1). 409 for an exec with no terminal.
            operationId: get-sandbox-exec-screen
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
                - description: Lines of scrollback above the screen to include, up to what the terminal keeps.
                  in: query
                  name: scrollback
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecScreen'
                    description: The terminal's screen.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Read a terminal's screen as text.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/start:
        post:
            description: Starts a prepared sandbox exec after any desired attach stream has connected.
            operationId: start-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExec'
                    description: Started sandbox exec.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Start a prepared sandbox exec.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/execs/{execId}/wait:
        post:
            description: Blocks until one of the given conditions holds — a named harness hook event from this terminal, no output for a while, or the exec's exit — or the timeout, at most 60 seconds, passes (ADR 0137 §3). Every answer carries resumeAfter; a caller waiting longer asks again with it as until.after, so nothing recorded between two calls is missed.
            operationId: wait-sandbox-exec
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Sandbox exec runtime ID.
                  in: path
                  name: execId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SandboxExecWaitBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecWaitResult'
                    description: What the wait ended on.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Wait for something to happen in a terminal.
            tags:
                - Sandbox Execs
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-hooks:
        get:
            operationId: list-harness-hooks
            parameters:
                - description: Only the hook record with this ID, which is how one record is read in full
                  in: query
                  name: id
                  schema:
                    description: Only the hook record with this ID, which is how one record is read in full
                    type: string
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Optional harness terminal runtime ID filter.
                  in: query
                  name: terminalId
                  required: false
                  schema:
                    type: string
                - description: Maximum number of hook records to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
                - description: Only hooks from this provider (e.g. claude-code).
                  in: query
                  name: provider
                  required: false
                  schema:
                    type: string
                - description: Only hooks whose own or canonical event name is this (e.g. PreToolUse).
                  in: query
                  name: event
                  required: false
                  schema:
                    type: string
                - description: Only hooks recorded at or after this time.
                  in: query
                  name: since
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: asc returns the earliest matching hooks at or after since, for reading forward; desc, the default, returns the most recent.
                  in: query
                  name: order
                  required: false
                  schema:
                    default: desc
                    enum:
                        - asc
                        - desc
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessHookLogsResponse'
                    description: Recent harness hook payload logs.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List recent sandbox harness hook payload logs.
            tags:
                - Harness Hooks
    /api/projects/{projectId}/sandboxes/{sandboxId}/judge:
        post:
            description: Puts one judging job to this discobox's harness and returns what it answered (ADR 0141). Only a discobox in judge mode answers, and only a token carrying judge:run may ask. The caller supplies evidence and the approved use; the prompt, the schema, the model role and the tools restriction are the judge runtime's own. Each ask is a fresh run with nothing carried over from the last, and one is answered at a time.
            operationId: judge-sandbox
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/JudgeJob'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JudgeAnswer'
                    description: 'What the judge answered: a decision, or what it needs to be shown.'
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Put one judging job to this discobox's harness.
            tags:
                - Sandbox Judge
    /api/projects/{projectId}/sandboxes/{sandboxId}/meta:
        patch:
            description: Applies a change to the sandbox's meta file, ~/.discobox/meta.json under the sandbox user's home, and returns what it holds afterwards. The file is read, changed and replaced in one step, so what the sandbox wrote itself and this change does not name is kept. A meta file that is not valid is refused rather than overwritten (ADR 0136).
            operationId: update-sandbox-agent-meta
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateSandboxMetaBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxAgentMeta'
                    description: The sandbox's meta after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Change the description or tags in the sandbox's meta file.
            tags:
                - Sandbox Meta
    /api/projects/{projectId}/sandboxes/{sandboxId}/services:
        get:
            description: Lists the services declared under .discobox/services in the sandbox's primary source, each with the state of the exec running it. Declarations are re-read on every request, so a service file added or edited while the sandbox is up appears immediately.
            operationId: list-sandbox-services
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxServicesResponse'
                    description: Declared services in the sandbox.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List declared services in a sandbox.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}:
        get:
            operationId: get-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: Declared service.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get a declared service in a sandbox.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/logs:
        get:
            description: Returns the transcript of the service's current or last run. A service that has never run has an empty transcript rather than an error.
            operationId: list-sandbox-service-logs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecLogsResponse'
                    description: Service output log entries.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List logs for a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/restart:
        post:
            description: Stops the service if it is running and starts it again under the same exec ID. A service that is not running is simply started.
            operationId: restart-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Restart a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/start:
        post:
            description: Starts the service, or returns it unchanged when it is already running. A service that has run before is relaunched under its existing exec ID rather than given a new one.
            operationId: start-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Start a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/stop:
        post:
            description: Ends the service's run and keeps its record, so its output is still readable and starting it again resumes the same exec identity.
            operationId: stop-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Stop a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/status:
        get:
            operationId: get-sandbox-agent-status
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxAgentStatusResponse'
                    description: Sandbox-agent-reported git, harness session, and connection status.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get sandbox-agent-reported status (git status, harness session state, active connections).
            tags:
                - Sandbox Status
    /api/projects/{projectId}/sandboxes/{sandboxId}/tools:
        get:
            description: Lists the tools the sandbox's image and primary source declare, in filename order within each. Declarations are re-read on every request.
            operationId: list-sandbox-tools
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxToolsResponse'
                    description: Tools declared in the sandbox.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List declared tools in a sandbox.
            tags:
                - Sandbox Tools
servers:
    - description: Provider-delegated sandbox endpoint
      url: http://sandbox.local

    /api/projects/{projectId}/sandboxes/{sandboxId}/runtime-config:
        get:
            description: Returns the runtime-config document the sandbox last applied - what the pool has told it it is (ADR 0126 §3). Only a token carrying the pool-only runtime-config scope may read it.
            operationId: get-sandbox-runtime-config
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxRuntimeConfig'
                    description: The document the sandbox applied.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response. 404 when the sandbox has applied none.
            summary: Get the runtime-config document the sandbox has applied.
            tags:
                - Sandbox Runtime Config
        put:
            description: Delivers the pool's whole view of the sandbox as one revisioned document, which the sandbox applies atomically and keeps (ADR 0126 §3). A newer revision is applied; an older one is ignored and the document the sandbox holds is returned; the same revision is a retry when the document matches and a 409 when it does not. A document that fails validation (422) or cannot be written whole changes nothing. The applied revision is also reported on the sandbox's status. Only a token carrying the pool-only runtime-config scope may deliver one.
            operationId: put-sandbox-runtime-config
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SandboxRuntimeConfig'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxRuntimeConfig'
                    description: The document the sandbox now holds, which is the one delivered unless that one was older.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Deliver the sandbox's runtime-config document.
            tags:
                - Sandbox Runtime Config
    /api/projects/{projectId}/sandboxes/{sandboxId}/services:
        get:
            description: Lists the services declared under .discobox/services in the sandbox's primary source, each with the state of the exec running it. Declarations are re-read on every request, so a service file added or edited while the sandbox is up appears immediately.
            operationId: list-sandbox-services
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxServicesResponse'
                    description: Declared services in the sandbox.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List declared services in a sandbox.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}:
        get:
            operationId: get-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: Declared service.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Get a declared service in a sandbox.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/logs:
        get:
            description: Returns the transcript of the service's current or last run. A service that has never run has an empty transcript rather than an error.
            operationId: list-sandbox-service-logs
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxExecLogsResponse'
                    description: Service output log entries.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: List logs for a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/restart:
        post:
            description: Stops the service if it is running and starts it again under the same exec ID. A service that is not running is simply started.
            operationId: restart-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Restart a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/start:
        post:
            description: Starts the service, or returns it unchanged when it is already running. A service that has run before is relaunched under its existing exec ID rather than given a new one.
            operationId: start-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Start a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/services/{serviceId}/stop:
        post:
            description: Ends the service's run and keeps its record, so its output is still readable and starting it again resumes the same exec identity.
            operationId: stop-sandbox-service
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: Service ID, as declared under .discobox/services.
                  in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxService'
                    description: The service after the change.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Stop a sandbox service.
            tags:
                - Sandbox Services
    /api/projects/{projectId}/sandboxes/{sandboxId}/sources:
        get:
            description: Reports how far each source the applied runtime-config document names has converged onto its target (ADR 0126 §4) - the same states the status poll carries, for the pool to wait on while it settles a create rather than on the poll's interval. Empty until a document has been applied. Only a token carrying the pool-only runtime-config scope may read it.
            operationId: get-sandbox-source-states
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxSourceStates'
                    description: Each source's convergence, in the document's order.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Read how far each source has converged.
            tags:
                - Sandbox Runtime Config
    /api/projects/{projectId}/sandboxes/{sandboxId}/sources/{slug}/project-layer:
        get:
            description: Reads a materialized source's project layer (.discobox/settings.json in its working tree, or .discobox/project.json in a repository without one), which the pool reads to settle the sandbox's final spec before it marks the source delivered (ADR 0055, ADR 0126 §4, ADR 26-10-16-423 §11). 404 when no applied runtime-config document names the source, 409 while the sandbox has not materialized it, 422 when the file does not decode or the repository holds settings.json beside a file it replaces. Only a token carrying the pool-only runtime-config scope may read it.
            operationId: get-sandbox-source-project-layer
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
                - description: The source's slug in the runtime-config document.
                  in: path
                  name: slug
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxSourceProjectLayer'
                    description: The source's project layer, or none.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Read a materialized source's project layer.
            tags:
                - Sandbox Runtime Config

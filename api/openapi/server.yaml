components:
    schemas:
        AgentConfig:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AgentConfig.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                files:
                    description: Files to write into the agent's home directory when the agent is installed
                    items:
                        $ref: '#/components/schemas/AgentConfigFile'
                    nullable: true
                    type: array
                id:
                    description: Stable agent config ID
                    type: string
                installCommand:
                    description: Argv used to install the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
                name:
                    description: Agent config name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                runCommand:
                    description: Argv used to run the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    type: array
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - runCommand
                - createdAt
                - updatedAt
            type: object
        AgentConfigDefinition:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AgentConfigDefinition.json
                    format: uri
                    readOnly: true
                    type: string
                description:
                    description: Agent config definition description
                    type: string
                files:
                    description: Files to write into the agent's home directory when the agent is installed
                    items:
                        $ref: '#/components/schemas/AgentConfigFile'
                    nullable: true
                    type: array
                id:
                    description: Stable definition ID
                    type: string
                installCommand:
                    description: Argv used to install the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
                name:
                    description: Agent config definition name
                    maxLength: 200
                    type: string
                runCommand:
                    description: Argv used to run the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    type: array
            required:
                - id
                - name
                - runCommand
            type: object
        AgentConfigFile:
            additionalProperties: false
            description: A file to write into an agent's home directory when the agent is installed.
            properties:
                content:
                    description: File content to write
                    type: string
                path:
                    description: File path relative to the agent's home directory
                    type: string
            required:
                - path
                - content
            type: object
        CompleteEvent:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
            type: object
        ConnectedEvent:
            additionalProperties: false
            properties:
                projectId:
                    type: string
            required:
                - projectId
            type: object
        CreateAgentConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateAgentConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                definitionId:
                    description: Agent config definition ID to use as defaults
                    type: string
                files:
                    description: Files to write into the agent's home directory when the agent is installed. Defaults to the definition files when definitionId is provided.
                    items:
                        $ref: '#/components/schemas/AgentConfigFile'
                    nullable: true
                    type: array
                installCommand:
                    description: Argv used to install the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
                name:
                    description: Agent config name. Defaults to the definition name when definitionId is provided.
                    maxLength: 200
                    type: string
                runCommand:
                    description: Argv used to run the agent. Defaults to the definition run command when definitionId is provided. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
            type: object
        CreateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentName:
                    description: Agent config name to resolve at create time
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxCreateConfig'
                    description: Desired sandbox configuration.
                providerInstanceId:
                    description: Sandbox provider instance ID
                    type: string
            required:
                - config
            type: object
        CreateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                type:
                    description: Provider type
                    type: string
            required:
                - type
                - name
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        AgentTerminal:
            additionalProperties: false
            properties:
                id:
                    description: Agent terminal runtime ID.
                    type: string
                agentId:
                    description: Coding agent CLI selected for the terminal.
                    type: string
                status:
                    description: Current observed terminal runtime status.
                    enum:
                        - starting
                        - running
                        - exited
                        - failed
                        - lost
                    type: string
                command:
                    description: Command used to launch the coding-agent CLI.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the terminal process.
                    type: string
                unit:
                    description: Systemd unit or scope name when known.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                exitCode:
                    description: Process exit code when the terminal has exited.
                    format: int64
                    type: integer
                error:
                    description: Runtime error detail when the terminal failed.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                startedAt:
                    format: date-time
                    type: string
                exitedAt:
                    format: date-time
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: Sandbox-agent-owned terminal metadata.
                    type: object
            required:
                - id
                - status
                - command
                - workdir
                - createdAt
            type: object
        AgentTerminalEvent:
            additionalProperties: false
            properties:
                id:
                    description: Event ID.
                    type: string
                terminalId:
                    description: Agent terminal runtime ID.
                    type: string
                type:
                    description: Event type.
                    type: string
                message:
                    description: Human-readable event message.
                    type: string
                details:
                    description: Opaque event details.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - type
                - createdAt
            type: object
        AgentTerminalEventsResponse:
            additionalProperties: false
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/AgentTerminalEvent'
                    type: array
            required:
                - events
            type: object
        AgentTerminalLogEntry:
            additionalProperties: false
            properties:
                timestamp:
                    description: Time this PTY input or output chunk was observed.
                    format: date-time
                    type: string
                stream:
                    description: PTY direction for this chunk.
                    enum:
                        - input
                        - output
                    type: string
                data:
                    description: Base64-encoded raw PTY bytes.
                    format: byte
                    type: string
            required:
                - timestamp
                - stream
                - data
            type: object
        AgentTerminalLogsResponse:
            additionalProperties: false
            properties:
                entries:
                    items:
                        $ref: '#/components/schemas/AgentTerminalLogEntry'
                    type: array
            required:
                - entries
            type: object
        AgentHookLog:
            additionalProperties: false
            properties:
                id:
                    description: Hook log ID.
                    type: string
                terminalId:
                    description: Agent terminal runtime ID that emitted the hook.
                    type: string
                provider:
                    description: Agent hook provider.
                    type: string
                event:
                    description: Provider-specific hook event name.
                    type: string
                payload:
                    description: Raw provider hook payload.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - provider
                - event
                - payload
                - createdAt
            type: object
        AgentHookLogsResponse:
            additionalProperties: false
            properties:
                hooks:
                    items:
                        $ref: '#/components/schemas/AgentHookLog'
                    type: array
            required:
                - hooks
            type: object
        AgentTerminalsResponse:
            additionalProperties: false
            properties:
                terminals:
                    items:
                        $ref: '#/components/schemas/AgentTerminal'
                    type: array
            required:
                - terminals
            type: object
        SandboxExec:
            additionalProperties: false
            properties:
                id:
                    description: Sandbox exec runtime ID.
                    type: string
                status:
                    description: Current observed exec runtime status.
                    enum:
                        - starting
                        - running
                        - exited
                        - failed
                        - lost
                    type: string
                command:
                    description: Command argv executed in the sandbox.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Whether the exec process was started with a PTY.
                    type: boolean
                unit:
                    description: Systemd unit or scope name when known.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                exitCode:
                    description: Process exit code when the exec has exited.
                    format: int64
                    type: integer
                error:
                    description: Runtime error detail when the exec failed.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                startedAt:
                    format: date-time
                    type: string
                exitedAt:
                    format: date-time
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied exec metadata.
                    type: object
            required:
                - id
                - status
                - command
                - workdir
                - tty
                - createdAt
            type: object
        SandboxExecLogEntry:
            additionalProperties: false
            properties:
                timestamp:
                    description: Time this exec stream chunk was observed.
                    format: date-time
                    type: string
                stream:
                    description: Exec stream this chunk came from.
                    enum:
                        - input
                        - output
                        - stdout
                        - stderr
                    type: string
                data:
                    description: Base64-encoded raw stream bytes.
                    format: byte
                    type: string
            required:
                - timestamp
                - stream
                - data
            type: object
        SandboxExecLogsResponse:
            additionalProperties: false
            properties:
                entries:
                    items:
                        $ref: '#/components/schemas/SandboxExecLogEntry'
                    type: array
            required:
                - entries
            type: object
        SandboxExecsResponse:
            additionalProperties: false
            properties:
                execs:
                    items:
                        $ref: '#/components/schemas/SandboxExec'
                    type: array
            required:
                - execs
            type: object
        CreateSandboxExecRequest:
            additionalProperties: false
            properties:
                command:
                    description: Command argv to execute in the sandbox.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Allocate a PTY for the exec process.
                    type: boolean
                cols:
                    description: Initial PTY columns when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                rows:
                    description: Initial PTY rows when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied metadata to associate with the exec.
                    type: object
            required:
                - command
            type: object
        CreateSandboxExecResponse:
            additionalProperties: false
            properties:
                exec:
                    $ref: '#/components/schemas/SandboxExec'
            required:
                - exec
            type: object
        CreateAgentTerminalRequest:
            additionalProperties: false
            properties:
                agentId:
                    description: Coding agent CLI to start. Defaults to the sandbox configured agent when omitted.
                    type: string
                args:
                    description: Additional command arguments for the coding-agent CLI.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the terminal process.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the terminal process.
                    type: object
                cols:
                    description: Initial PTY columns when a PTY is allocated.
                    maximum: 65535
                    minimum: 0
                    type: integer
                rows:
                    description: Initial PTY rows when a PTY is allocated.
                    maximum: 65535
                    minimum: 0
                    type: integer
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied metadata to associate with the terminal.
                    type: object
            type: object
        CreateAgentTerminalResponse:
            additionalProperties: false
            properties:
                terminal:
                    $ref: '#/components/schemas/AgentTerminal'
            required:
                - terminal
            type: object
        ErrorResponse:
            additionalProperties: false
            properties:
                error:
                    description: Human-readable error message.
                    type: string
            required:
                - error
            type: object
        ResourceHistoryResponse:
            additionalProperties: false
            properties:
                snapshots:
                    items:
                        $ref: '#/components/schemas/ResourceSnapshot'
                    type: array
            required:
                - snapshots
            type: object
        ResourceSnapshot:
            additionalProperties: false
            properties:
                terminalId:
                    description: Agent terminal runtime ID.
                    type: string
                sampledAt:
                    description: Time when the snapshot was collected.
                    format: date-time
                    type: string
                source:
                    description: Resource collector source.
                    type: string
                data:
                    description: Opaque OS, cgroup, systemd, and process resource dump.
            required:
                - terminalId
                - sampledAt
                - source
                - data
            type: object
        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    $ref: '#/components/schemas/GitSourceCheckout'
                    description: Immutable checkout target and optional user-facing ref identity
                destination:
                    $ref: '#/components/schemas/GitSourceDestination'
                    description: Sandbox destination paths for this source
                kind:
                    description: Source kind. Currently only git is supported.
                    enum:
                        - git
                    type: string
                localDirectory:
                    description: Absolute local Git repository directory accessible to the worker
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                url:
                    description: Remote Git source URL
                    format: uri
                    type: string
                workspace:
                    $ref: '#/components/schemas/GitSourceWorkspace'
                    description: Workspace materialization mode for this source
            required:
                - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    description: Immutable commit SHA to materialize
                    type: string
                refName:
                    description: User-facing branch, tag, or ref name to recreate in the sandbox
                    type: string
                refType:
                    description: User-facing ref type, such as branch, tag, or commit
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    description: Directory where this source should be placed inside the sandbox
                    type: string
                workingDirectory:
                    description: Working directory inside the sandbox for this source
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    description: Commit to checkout before applying dirty workspace snapshot changes
                    type: string
                mode:
                    default: clean
                    description: Whether to materialize a clean checkout or restore dirty workspace changes
                    enum:
                        - clean
                        - dirty
                    type: string
                snapshotRef:
                    description: Discobox-owned hidden Git ref containing dirty workspace snapshot data
                    type: string
            type: object
        ListAgentConfigDefinitionsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListAgentConfigDefinitionsBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigDefinitions:
                    description: Agent config definitions
                    items:
                        $ref: '#/components/schemas/AgentConfigDefinition'
                    nullable: true
                    type: array
            required:
                - agentConfigDefinitions
            type: object
        ListAgentConfigsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListAgentConfigsBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    description: Agent configs
                    items:
                        $ref: '#/components/schemas/AgentConfig'
                    nullable: true
                    type: array
            required:
                - agentConfigs
            type: object
        ListProjectsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListProjectsBody.json
                    format: uri
                    readOnly: true
                    type: string
                projects:
                    description: Projects
                    items:
                        $ref: '#/components/schemas/Project'
                    nullable: true
                    type: array
            required:
                - projects
            type: object
        ListSandboxProviderCatalogBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderCatalogBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider catalog items
                    items:
                        $ref: '#/components/schemas/SandboxProviderCatalogItem'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxProviderInstancesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderInstancesBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider instances
                    items:
                        $ref: '#/components/schemas/SandboxProviderInstance'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxesBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    description: Sandboxes
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
            required:
                - sandboxes
            type: object
        ListWorkersBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListWorkersBody.json
                    format: uri
                    readOnly: true
                    type: string
                workers:
                    description: Workers
                    items:
                        $ref: '#/components/schemas/Worker'
                    nullable: true
                    type: array
            required:
                - workers
            type: object
        Job:
            additionalProperties: false
            properties:
                id:
                    description: Stable job ID
                    type: string
                type:
                    description: Job executor type
                    type: string
                status:
                    description: Persisted job lifecycle state
                    enum:
                        - pending
                        - backoff
                        - running
                        - completed
                        - failed
                        - canceled
                    type: string
                attempts:
                    description: Number of execution attempts
                    type: integer
                maxAttempts:
                    description: Maximum execution attempts before failure
                    type: integer
                error:
                    description: Latest execution or dispatch error
                    type: string
                message:
                    description: Human-readable execution result or operator note
                    type: string
                metadata:
                    description: Structured execution result metadata
                workerId:
                    description: Dispatcher worker that claimed the current or last attempt
                    type: string
                resourceType:
                    description: Resource type this job acts on
                    type: string
                resourceId:
                    description: Resource ID this job acts on
                    type: string
                scheduledAt:
                    description: Earliest time the job may run
                    format: date-time
                    type: string
                startedAt:
                    description: Time the current or last attempt started
                    format: date-time
                    type: string
                completedAt:
                    description: Time the job reached a terminal state
                    format: date-time
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - type
                - status
                - attempts
                - maxAttempts
                - resourceType
                - resourceId
                - scheduledAt
                - createdAt
                - updatedAt
            type: object
        ListJobsBody:
            additionalProperties: false
            properties:
                jobs:
                    items:
                        $ref: '#/components/schemas/Job'
                    type: array
            required:
                - jobs
            type: object
        Project:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Project.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    description: Agent configurations
                    items:
                        $ref: '#/components/schemas/AgentConfig'
                    nullable: true
                    type: array
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                default:
                    description: Whether this is the user's default project
                    type: boolean
                defaultSandboxProviderId:
                    description: Default sandbox provider instance ID
                    type: string
                defaultAgentConfigId:
                    description: Default agent config ID
                    type: string
                id:
                    description: Stable project ID
                    type: string
                members:
                    description: Project members
                    items:
                        $ref: '#/components/schemas/ProjectMember'
                    nullable: true
                    type: array
                name:
                    description: Project display name
                    maxLength: 200
                    type: string
                owner:
                    $ref: '#/components/schemas/User'
                    description: Project owner
                ownerUserId:
                    description: Owning user ID
                    type: string
                sandboxProviderInstances:
                    description: Sandbox provider instances
                    items:
                        $ref: '#/components/schemas/SandboxProviderInstance'
                    nullable: true
                    type: array
                sandboxes:
                    description: Project sandboxes
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
                slug:
                    description: URL-safe project slug
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - ownerUserId
                - name
                - slug
                - default
                - createdAt
                - updatedAt
            type: object
        ProjectMember:
            additionalProperties: false
            properties:
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                projectId:
                    description: Project ID
                    type: string
                role:
                    description: Project role
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                userId:
                    description: User ID
                    type: string
            required:
                - projectId
                - userId
                - role
                - createdAt
                - updatedAt
            type: object
        ProviderConfigField:
            additionalProperties: false
            properties:
                advanced:
                    type: boolean
                credentialAuthType:
                    type: string
                credentialProvider:
                    type: string
                description:
                    type: string

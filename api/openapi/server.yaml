                    type: object
                skillsSources:
                    description: The directories of skills sources whose skills the sandbox links into the harness's skill directories on its first launch, in the order given, after the skills given as content. A later directory wins over an earlier one, and any linked skill over a copied skill, on a skill's name. Each names a sourceCodeReferences entry whose purpose is skills, and each such entry is named at least once.
                    items:
                        $ref: '#/components/schemas/SandboxSkillsSource'
                    type: array
                features:
                    additionalProperties:
                        $ref: '#/components/schemas/SandboxFeature'
                    description: The repository's features by name, from its .discobox/settings.json. The sandbox provisions every feature but those whose enabled is false; a feature the harness requires cannot be turned off unless the box already has a usable one. Fixed at create.
                    type: object
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
                prompt:
                    description: Prompt the harness should run, passed as argv to preserve the caller's exact tokens.
                    items:
                        type: string
                    type: array
                secrets:
                    description: Secrets to inject into the sandbox as sentinel placeholders that the proxy resolves to real values at runtime.

                    description: Whether the pool host is alive and healthy
                    type: boolean
                schedulable:
                    description: Whether the pool accepts new sandboxes
                    type: boolean
                degraded:
                    description: Whether the pool should be used only as fallback capacity
                    type: boolean
                imagesStaged:
                    description: Whether the images a sandbox might run are staged on this host. A condition, not a health state — an unstaged pool is still active and schedulable.
                    type: boolean
                imageStage:
                    $ref: '#/components/schemas/PoolImageStage'
                imageStagedAt:
                    description: When imageStage was last written
                    format: date-time
                    type: string
                provisionProgress:
                    $ref: '#/components/schemas/PoolProvisionProgress'
                provisionProgressAt:
                    description: When provisionProgress was observed
                    format: date-time
                    type: string
                availableCpuVcpus:
                    description: Agent-reported available CPU capacity in vCPUs
                    format: double
                    type: number
                availableMemoryBytes:
                    description: Agent-reported available memory capacity in bytes
                    format: int64
                    type: integer
                availableStorageBytes:
                    description: Agent-reported available storage capacity in bytes
                    format: int64
                    type: integer
                conditions:
                    description: Opaque agent-reported condition details for display
                resources:
                    additionalProperties: true
                    description: |
                        What this pool is consuming as of its last resource report (see
                        PoolResourceReport for the shape). Telemetry, not a scheduling input -
                        placement reads the available* fields above.

                        Carried as an open object on purpose. It is written by whatever agent
                        version a pool happens to be running, so a server that validated it
                        strictly would fail every read of the pool during a rolling upgrade,
                        for a field nothing schedules on. A reader decodes it into
                        PoolResourceReport and treats a decode failure as "not reported yet",
                        which the next report heals.
                    nullable: true
                    type: object
                resourcesReportedAt:
                    description: When resources was reported
                    format: date-time
                    type: string
                desiredState:
                    description: Requested existence, the same vocabulary every orchestrated resource uses (ADR 0017 §2)
                    enum:
                        - present
                        - deleted
                    type: string
                state:
                    description: Observed pool state
                    enum:
                        - pending
                        - registering
                        - active
                        - offline
                        - failed
                        - deleted
                    type: string
                stateChangedAt:
                    description: When state last changed to its current value
                    format: date-time
                    type: string
                generation:
                    description: Latest spec generation
                    format: int64
                    type: integer
                observedGeneration:
                    description: Latest generation the reconciler has finished acting on
                    format: int64
                    type: integer
                errorMessage:
                    description: Latest error message
                    type: string
                keyType:
                    description: Pool agent key type
                    type: string
                publicKey:
                    description: Pool agent public key
                    type: string
                registeredAt:
                    description: Registration timestamp
                    format: date-time
                    type: string
                lastSeenAt:
                    description: Last heartbeat timestamp
                    format: date-time
                    type: string
                revokedAt:
                    description: Revocation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - providerInstanceId
                - cpuVcpus
                - memoryBytes
                - storageBytes
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
                - desiredState
                - state
                - generation
                - observedGeneration
                - createdAt
                - updatedAt
            type: object

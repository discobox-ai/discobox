            properties:
                command:
                    description: Command argv to execute in the sandbox. Mutually exclusive with harnessId and shell.
                    items:
                        type: string
                    type: array
                shell:
                    description: Run the run user's login shell instead of a command. The sandbox resolves which shell that is from the user's passwd entry. For an interactive shell (no shellCommandLine), a `DISCOBOX_SHELL` entry in env names the shell the client's user prefers, as a path or a name; the sandbox runs it instead when it has it, looked up after the login profile and the working directory's .envrc have loaded. Mutually exclusive with command and harnessId.
                    type: boolean
                shellCommandLine:
                    description: When shell is set, run the resolved login shell with `-lc <shellCommandLine>` instead of an interactive login shell. Ignored unless shell is set.
                    type: string
                harnessId:
                    description: Harness CLI to start in terminal mode. Defaults to the sandbox configured harness when omitted. Mutually exclusive with command and shell.
                    type: string
                args:
                    description: Additional command arguments appended to the resolved harness command in terminal mode.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process. Defaults to the sandbox's primary source directory. A leading `~` or `~/` is expanded against the run user's home directory inside the sandbox.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Allocate a PTY for the exec process.
                    type: boolean
                cols:
                    description: Initial PTY columns when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                rows:
                    description: Initial PTY rows when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied metadata to associate with the exec.
                    type: object
            type: object

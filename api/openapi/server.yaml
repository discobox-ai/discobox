                    type: string
                maxBindingTTLSeconds:
                    description: Longest a binding of this secret may last, in seconds, and the lifetime one takes when nobody names one; 0 lets bindings never lapse
                    format: int64
                    minimum: 0
                    type: integer
                refreshCommand:
                    description: A command a person's client may run to produce a new value, as an argument vector run without a shell (ADR 26-09-25-122). The server stores and shows it and never runs it. Token secrets only; setting one without ttlSeconds gives the token 300s. An empty array removes it.
                    items:
                        type: string
                    nullable: true
                    type: array
                ttlSeconds:
                    description: How long a value is good for after it is written, in seconds; 0 never goes stale. Token secrets only.
                    format: int64
                    type: integer
                routes:
                    description: Where the credential may be sent, whoever holds it (ADR 26-10-02-924). Every request it is sent in must fall on one; the most specific route covering it decides, and a blocked one refuses. Set replaces them; an empty array removes them, and the credential is then sent nowhere.
                    items:
                        $ref: '#/components/schemas/SecretRouteInput'
                    nullable: true
                    type: array
                valueExpiresAt:
                    description: When this value goes stale, for a value that knows its own lifetime; overrides ttlSeconds for this value only. Token secrets only, and only with a value.
                    format: date-time
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            type: object
        StartSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StartSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force start if the provider supports it
                    type: boolean
            type: object
        StopSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StopSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force stop if the provider supports it
                    type: boolean
            type: object
        SuspendSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SuspendSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
            type: object
        StreamErrorEvent:
            additionalProperties: false
            properties:
                error:
                    type: string
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
                - error
            type: object
        UpdateHarnessConfigBody:
            additionalProperties: false
            required: [revision]
            properties:
                revision:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Revision the caller read before editing. A stale revision returns 409.
                egress:
                    $ref: '#/components/schemas/EgressPolicy'
                    description: Replaces the harness config's egress policy level. Every live discobox on the harness converges onto the result.
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateHarnessConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                configuredFiles:
                    description: Configure-flow files to write into the harness's home directory, replacing the current set
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                files:
                    description: Files to write into the harness's home directory when the harness is installed
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                bundle:
                    description: Registers the harness bundle the config's manifest is read from, re-snapshotting the manifest from it. How a harness registered before bundles gets one.
                    type: string
                name:
                    description: Harness config name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxUpdateConfig'
                    description: Desired sandbox configuration changes.
                discoboxApi:
                    description: Set or clear whether the discobox may call the discobox API through its pool (ADR 26-10-27-880 §9). A person's to change.
                    type: boolean
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                harness:
                    description: Harness selector (slug, name or ID), resolved in this sandbox's project. Mutually exclusive with harnessConfigId. A different harness requires a stopped sandbox.
                    minLength: 1
                    type: string
                harnessConfigId:
                    description: Explicit harness config ID in this sandbox's project. Mutually exclusive with harness. A different harness requires a stopped sandbox.
                    minLength: 1
                    type: string
                egress:
                    $ref: '#/components/schemas/EgressPolicy'
                    description: Replaces the discobox's own egress policy level.
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
            type: object
        UpdatePoolStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdatePoolStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                availableCpuVcpus:
                    format: double
                    type: number
                availableMemoryBytes:
                    format: int64
                    type: integer
                availableStorageBytes:
                    format: int64
                    type: integer
                conditions: {}
                degraded:
                    type: boolean
                imageKind:
                    description: The kind of image the pool runs, oci or vm/<driver>, declared on every report beside the platform. An agent from before image kinds sends none, and runs OCI images, which is what is recorded for it.
                    pattern: ^(oci|vm/[a-z0-9]+)$
                    type: string
                platform:
                    description: The one platform the pool hosts, as os/arch. Declared on every report, because an agent whose key survives a restart does not register again. An agent from before platforms sends none, and its pool keeps the platform recorded for it.
                    pattern: ^[a-z0-9]+/[a-z0-9]+$
                    type: string
                ready:
                    type: boolean
                schedulable:
                    type: boolean
            required:
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
            type: object
        ReportPoolSandboxStatesBody:
            additionalProperties: false
            description: |-
                A batch of sandbox state observations from the pool agent hosting them.
                State is reported, never requested: the control plane records what the agent saw and
                never asks it to make a sandbox running.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ReportPoolSandboxStatesBody.json
                    format: uri
                    readOnly: true
                    type: string
                bootId:
                    description: |-
                        Identifies this run of the pool agent. Sequence numbers are only comparable within
                        one boot, because a restarted agent counts from zero again.
                    type: string
                complete:
                    description: |-
                        True when the batch is the periodic full sync: the reports are every sandbox the
                        agent hosts, so a sandbox the control plane believes is on this pool and that the
                        batch omits no longer has a container. A batch that is not complete is a transition
                        delta and says nothing about sandboxes it does not mention.
                    type: boolean
                reportedAt:
                    description: When the agent observed these states
                    format: date-time
                    type: string
                sequence:
                    description: Monotonic counter within bootId, so a delayed delta cannot overwrite a newer sync
                    format: int64
                    type: integer
                progress:
                    description: |-
                        Provisioning progress on sandboxes this agent hosts: work that is underway and has
                        no state transition to announce it, an image pull above all. It is
                        always a delta and is unaffected by `complete`, which describes `states` only.
                    items:
                        $ref: '#/components/schemas/PoolSandboxProgress'
                    type: array
                states:
                    description: The observed sandbox states
                    items:
                        $ref: '#/components/schemas/PoolSandboxState'
                    type: array
            required:
                - bootId
                - sequence
                - reportedAt
                - complete
                - states
            type: object
        SandboxProvisionPhase:
            description: |-
                What a provisioning sandbox is being made to do right now, named for a client that
                is waiting to attach and wants to know what it is waiting for. It is an
                observation and never a state: it decides nothing, and it is history the moment the
                phase ends. pulling_image carries image byte counts. fetching_source reports the
                pool fetching a remote into its cache; materializing_source reports the sandbox
                checking out a source. Both Git phases carry clone progress.
            enum:
                - pulling_image
                - preparing_volumes
                - fetching_source
                - materializing_source
                - creating_container
                - starting_container
                - waiting_for_agent
            type: string
        SandboxProvisionProgress:
            additionalProperties: false
            description: |-
                Work underway on a sandbox that has no state transition to announce it, reported by
                the hosting pool-agent. A client waiting to attach reads this to say what
                it is waiting for. The phase always says what is happening; pull and clone refine the
                phases that can report how far in they are, because an image pull and a clone of
                a large remote are the longest things an attach waits behind. The pool restates
                materializing_source with each read of the clone, so the phase stays fresh for the
                whole of a long one.
            properties:
                phase:
                    $ref: '#/components/schemas/SandboxProvisionPhase'
                pull:
                    $ref: '#/components/schemas/SandboxPullProgress'
                clone:
                    $ref: '#/components/schemas/SandboxCloneProgress'
            required:
                - phase
            type: object
        SandboxCloneProgress:
            additionalProperties: false
            description: |-
                Git transfer progress: fetching_source carries the pool fetch counts, while
                materializing_source carries the sandbox clone counts read by the pool.
                Only source is certain: a sandbox whose agent predates
                reporting clone progress, or a clone git has said nothing about yet, has no stage.
            properties:
                source:
                    description: What is being cloned, for a person to read - a remote's host and path, or a local checkout's directory name
                    type: string
                stage:
                    $ref: '#/components/schemas/CloneProgressStage'
                objects:
                    description: Objects (deltas, when resolving) done so far in this stage
                    format: int64
                    type: integer
                objectsTotal:
                    description: Objects (deltas, when resolving) this stage has to do, zero while the remote has not said
                    format: int64
                    type: integer
                bytes:
                    description: Bytes received so far, as git counts them
                    format: int64
                    type: integer
            required:
                - source
            type: object
        PoolProvisionPhase:
            description: |-
                What a pool host is being made to do right now, named for a client whose sandbox is
                waiting for a pool to take it and wants to know what it is waiting for.
                It is the pool-shaped twin of SandboxProvisionPhase: an observation, never a state,
                and history the moment the phase ends.

                The work is the driver's, so the phases are the driver's: a VM backend fetches a
                disk image and boots a machine before any of it can run containers, and those are
                the minutes a first pool start is actually spent in. The two image phases carry
                pull byte counts; the rest are named work with no denominator to report.

                syncing_development_images appears only on a server running development images:
                it is the build of the pool, sandbox-base, and harness images on the pool's own
                Docker, which on a VM backend is where a cold start spends its second stretch of
                minutes, after the machine is up and before its agent exists to start.

                preloading_images loads locally cached sandbox images before starting the pool
                agent. Placement stays closed until startup completes. Byte counts continue to
                be reported while Docker extracts the image.

                loading_pool_image is pulling_pool_image's twin when the image is read from the
                image cache the CLI staged on the server's machine: the same byte counts,
                read from disk rather than a registry.
            enum:
                - fetching_vm_image
                - starting_vm
                - waiting_for_docker
                - syncing_development_images
                - pulling_pool_image
                - loading_pool_image
                - starting_pool_agent
                - waiting_for_pool_agent
                - preloading_images
            type: string
        PoolHostCredential:
            description: A credential of its provider's that the pool's host holds (ADR 26-10-23-551 §4), shown so a pool whose host can reach the provider's account says how far. Never its secret.
            properties:
                key:
                    description: "The provisioning key the host holds: issued, a key the provider's driver issued for this pool, which expires and is renewed and revoked by discobox; or provider, the provider's own key, delivered because its configuration opts in, which discobox never expires, renews or revokes. Absent when it holds none."
                    enum: [issued, provider]
                    type: string
                scope:
                    description: What the key reaches, as the driver says (account, org, project). Absent where it cannot tell.
                    type: string
                keyId:
                    description: The driver's ID for an issued key.
                    type: string
                expiresAt:
                    description: When an issued key expires. discobox places a new one by half its life.
                    format: date-time
                    type: string
                machineToken:
                    description: The host also carries a credential its driver gives every machine that is not isolated (boxd's in-VM token, which acts on the org as the provider's user). discobox sets no expiry on it and never renews or revokes it.
                    type: boolean
            type: object
        PoolProvisionProgress:
            additionalProperties: false
            description: |-
                Work underway on a pool host that has no state transition to announce it, reported
                by the provider driver doing it. A client waiting for a pool to take its sandbox
                reads this to say what it is waiting for.

                pull is the same shape a sandbox reports, and deliberately the same schema: an image
                pull is an image pull, a client renders both on one line the same way, and two
                shapes for it would be two renderers that drift.
            properties:
                phase:
                    $ref: '#/components/schemas/PoolProvisionPhase'
                pull:
                    $ref: '#/components/schemas/SandboxPullProgress'
            required:
                - phase
            type: object
        SandboxPullProgress:
            additionalProperties: false
            description: |-
                An image pull as a status line wants it. Both totals grow while the manifest is
                walked, so current/total is a ratio at a moment rather than progress toward a fixed
                target: a client must not render it as a bar that can only move forward.
            properties:
                current:
                    description: Bytes downloaded so far, across the layers reported
                    format: int64
                    type: integer
                done:
                    description: True on the final report for a pull that finished
                    type: boolean
                extracted:
                    description: For an image loaded from the image cache, bytes of its layers the daemon has extracted into its store after reading them, counting layers it already held
                    format: int64
                    type: integer
                image:
                    description: Image reference being pulled
                    type: string
                layers:
                    description: Layers heard about so far, which grows as the manifest is walked
                    type: integer
                layersComplete:
                    description: Layers fully pulled, including layers already present on the host
                    type: integer
                layersExtracted:
                    description: For an image loaded from the image cache, layers the daemon has extracted into its store, counting layers it already held
                    type: integer
                total:
                    description: Total bytes of the layers whose size has been reported
                    format: int64
                    type: integer
            required:
                - image
            type: object
        PoolSandboxProvisionPhase:
            description: |-
                What the pool agent is doing to a sandbox right now. It is the agent-facing twin of
                SandboxProvisionPhase and must carry the same values; the two are separate schemas
                because they are separate contracts, and a test pins them to each other.
            enum:
                - pulling_image
                - preparing_volumes
                - fetching_source
                - materializing_source
                - creating_container
                - starting_container
                - waiting_for_agent
            type: string
        PoolSandboxProgress:
            additionalProperties: false
            description: |-
                Progress on one sandbox that is being provisioned. It is deliberately not a
                PoolSandboxState: a state observation always carries an observed state, and progress
                has none to report.
            properties:
                phase:
                    $ref: '#/components/schemas/PoolSandboxProvisionPhase'
                pull:
                    $ref: '#/components/schemas/PoolSandboxPullProgress'
                clone:
                    $ref: '#/components/schemas/PoolSandboxCloneProgress'
                sandboxId:
                    description: Sandbox the progress is about
                    type: string
            required:
                - sandboxId
                - phase
            type: object
        PoolSandboxPullProgress:
            additionalProperties: false
            description: |-
                An image pull as a status line wants it rather than as the daemon reports it. Both
                totals grow while the manifest is walked, so current/total is a ratio at a moment
                rather than progress toward a fixed target.
            properties:
                current:
                    description: Bytes downloaded so far, across the layers reported
                    format: int64
                    type: integer
                done:
                    description: True on the final report for a pull that finished
                    type: boolean
                image:
                    description: Image reference being pulled
                    type: string
                layers:
                    description: Layers heard about so far, which grows as the manifest is walked
                    type: integer
                layersComplete:
                    description: Layers fully pulled, including layers already present on the host
                    type: integer
                total:
                    description: Total bytes of the layers whose size has been reported
                    format: int64
                    type: integer
            required:
                - image
            type: object
        PoolSandboxCloneProgress:
            additionalProperties: false
            description: The agent-facing twin of SandboxCloneProgress, refining fetching_source or materializing_source with Git transfer progress.
            properties:
                source:
                    description: What is being cloned, for a person to read - a remote's host and path, or a local checkout's directory name
                    type: string
                stage:
                    $ref: '#/components/schemas/CloneProgressStage'
                objects:
                    description: Objects (deltas, when resolving) done so far in this stage
                    format: int64
                    type: integer
                objectsTotal:
                    description: Objects (deltas, when resolving) this stage has to do, zero while the remote has not said
                    format: int64
                    type: integer
                bytes:
                    description: Bytes received so far, as git counts them
                    format: int64
                    type: integer
            required:
                - source
            type: object
        PoolSandboxState:
            additionalProperties: false
            properties:
                sandboxId:
                    description: Sandbox the observation is about
                    type: string
                state:
                    description: |-
                        Observed runtime state. There is no `failed` here: a container that has exited looks
                        the same whether it was stopped deliberately or died, so failure is a judgement about
                        an operation rather than something the runtime can observe. For the
                        same reason a report carries no error message — why an operation failed is the
                        reconciler's verdict, and it owns the field that records one.
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                        - suspended
                    type: string
            required:
                - sandboxId
                - state
            type: object
        SandboxInventoryEntry:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                digest:
                    description: Digest of the sandbox's inventory at observedAt.
                    type: string
                observedAt:
                    format: date-time
                    type: string
                inventory:
                    additionalProperties: true
                    description: Opaque sandbox-agent inventory (see SandboxAgentInventory), relayed unmodified by pool-agent. Omitted when the pool agent has already delivered the inventory with this digest.
                    type: object
            required:
                - sandboxId
                - digest
                - observedAt
            type: object
        ReportSandboxInventoriesBody:
            additionalProperties: false
            properties:
                sandboxes:
                    description: One entry for each sandbox whose inventory this pool agent read this tick.
                    items:
                        $ref: '#/components/schemas/SandboxInventoryEntry'
                    type: array
            required:
                - sandboxes
            type: object
        ReportSandboxInventoriesResponseBody:
            additionalProperties: false
            properties:
                wanted:
                    description: Sandboxes reported by digest alone whose inventory the control plane does not hold under that digest. The pool agent sends each in full on its next report.
                    items:
                        type: string
                    type: array
            required:
                - wanted
            type: object
        SandboxAgentStatusEntry:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                status:
                    additionalProperties: true
                    description: Opaque sandbox-agent status payload (see SandboxAgentStatusResponse), relayed unmodified by pool-agent.
                    type: object
                observedAt:
                    format: date-time
                    type: string
            required:
                - sandboxId
                - status
                - observedAt
            type: object
        ReportSandboxAgentStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ReportSandboxAgentStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    description: Status reports for sandboxes this pool agent successfully polled this tick. Sandboxes that failed to poll are omitted, not reported as stale.
                    items:
                        $ref: '#/components/schemas/SandboxAgentStatusEntry'
                    type: array
            required:
                - sandboxes
            type: object
        MintSandboxAgentStatusTokensBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/MintSandboxAgentStatusTokensBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxIds:
                    description: Sandbox IDs this pool agent currently hosts and wants a status-read token for
                    items:
                        type: string
                    type: array
            required:
                - sandboxIds
            type: object
        SandboxAgentStatusToken:
            additionalProperties: false
            properties:
                expiresAt:
                    description: When this token expires
                    format: date-time
                    type: string
                sandboxId:
                    type: string
                token:
                    description: Bearer token scoped to status:read only, for calling this sandbox's status endpoint
                    type: string
            required:
                - sandboxId
                - token
                - expiresAt
            type: object
        PoolHeldSandboxesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PoolHeldSandboxesBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxIds:
                    description: Every sandbox on this pool that still has a row, in any state, including archived, failed, and mid-delete
                    items:
                        type: string
                    type: array
            required:
                - sandboxIds
            type: object
        MintSandboxAgentStatusTokensResponseBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/MintSandboxAgentStatusTokensResponseBody.json
                    format: uri
                    readOnly: true
                    type: string
                tokens:
                    items:
                        $ref: '#/components/schemas/SandboxAgentStatusToken'
                    type: array
            required:
                - tokens
            type: object
        User:
            additionalProperties: false
            properties:
                avatarUrl:
                    description: Avatar image URL
                    format: uri
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                email:
                    description: User email address
                    format: email
                    type: string
                id:
                    description: Stable user ID
                    type: string
                name:
                    description: Display name
                    type: string
                provider:
                    description: Authentication provider
                    type: string
                subject:
                    description: Provider subject identifier
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - email
                - provider
                - subject
                - createdAt
                - updatedAt
            type: object
        CreateProjectSkillsSourceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateProjectSkillsSourceBody.json
                    format: uri
                    readOnly: true
                    type: string
                directory:
                    description: The directory inside the repository that holds the skills, relative and slash-separated, or . for the root, which is also what an absent value means. Each immediate subdirectory holding a SKILL.md is one skill.
                    type: string
                ref:
                    description: The branch, tag or commit to check out. Absent checks out the repository's default branch.
                    type: string
                url:
                    description: The skills repository's remote Git URL.
                    type: string
            required:
                - url
            type: object
        ListProjectSkillsSourcesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListProjectSkillsSourcesBody.json
                    format: uri
                    readOnly: true
                    type: string
                skillsSources:
                    description: The project's skills repositories, in the order they were added, which is the order a creating client adds them in.
                    items:
                        $ref: '#/components/schemas/ProjectSkillsSource'
                    type: array
            required:
                - skillsSources
            type: object
        ProjectGateway:
            additionalProperties: false
            description: A gateway every discobox of the project is routed through (ADR 26-10-16-470). A request beneath match goes to target instead, with match's path replaced by target's and the rest of the path and the query kept, once every other policy has decided on it as the discobox sent it. The pool proxy applies it; the discobox cannot see or bypass it.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ProjectGateway.json
                    format: uri
                    readOnly: true
                    type: string
                name:
                    description: The gateway's name, unique in the project; a DNS label
                    type: string
                projectId:
                    description: Project ID
                    type: string
                match:
                    description: The requests it routes, as an http(s) URL of an origin and a path prefix, matched on whole path segments; the longest match wins
                    example: https://api.anthropic.com/v1
                    type: string
                target:
                    description: Where they go, as an http(s) URL of an origin and a path that replaces match's
                    example: https://gateway.example.com/anthropic/v1
                    type: string
                requestHeaders:
                    $ref: '#/components/schemas/GatewayHeaderModifier'
                managedBy:
                    description: 'What keeps the gateway: api, written through these routes, or config, kept by the server configuration file, which refuses a put or delete of it and a put of another gateway with its match (ADR 26-10-17-271 §3)'
                    enum:
                        - api
                        - config
                    type: string
                createdBy:
                    description: Principal ID that first wrote the gateway
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - name
                - projectId
                - match
                - target
                - requestHeaders
                - managedBy
                - createdAt
                - updatedAt
            type: object
        PutProjectGatewayBody:
            additionalProperties: false
            description: 'A gateway as a whole, which replaces any gateway of the same name (ADR 26-10-16-470). A header here takes a written value: a value from the server''s environment is set only in the server configuration file, and so is a gateway that file keeps (ADR 26-10-17-271 §3).'
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/PutProjectGatewayBody.json
                    format: uri
                    readOnly: true
                    type: string
                match:
                    description: The requests it routes, as an http(s) URL of an origin and a path prefix, matched on whole path segments. No user, query, or fragment; no other gateway of the project may have the same match.
                    example: https://api.anthropic.com/v1
                    type: string
                target:
                    description: Where they go, as an http(s) URL of an origin and a path that replaces match's. No user, query, or fragment.
                    example: https://gateway.example.com/anthropic/v1
                    type: string
                requestHeaders:
                    $ref: '#/components/schemas/PutGatewayHeaderModifier'
            required:
                - match
                - target
            type: object
        PutGatewayHeaderModifier:
            additionalProperties: false
            description: The headers a gateway put through the API changes, as GatewayHeaderModifier, each with a written value (ADR 26-10-17-271 §3).
            properties:
                remove:
                    description: Header names to remove
                    items:
                        type: string
                    type: array
                set:
                    description: Headers to set, replacing any value the request has
                    items:
                        $ref: '#/components/schemas/PutGatewayHeader'
                    type: array
                add:
                    description: Headers to add beside any value the request has
                    items:
                        $ref: '#/components/schemas/PutGatewayHeader'
                    type: array
            type: object
        PutGatewayHeader:
            additionalProperties: false
            description: One header a gateway put through the API sets or adds.
            properties:
                name:
                    description: Header name
                    type: string
                value:
                    description: The header's value
                    type: string
            required:
                - name
                - value
            type: object
        GatewayHeaderModifier:
            additionalProperties: false
            description: The headers a gateway changes on each request it routes, in this order -- remove, then set (replacing any value the discobox sent), then add (appending). Hop-by-hop headers and Host may not be named. Every header named here is redacted from the audit trail.
            properties:
                remove:
                    description: Header names to remove
                    items:
                        type: string
                    type: array
                set:
                    description: Headers to set, replacing any value the request has
                    items:
                        $ref: '#/components/schemas/GatewayHeader'
                    type: array
                add:
                    description: Headers to add beside any value the request has
                    items:
                        $ref: '#/components/schemas/GatewayHeader'
                    type: array
            type: object
        GatewayHeader:
            additionalProperties: false
            description: One header a gateway sets or adds, with exactly one of value or valueFrom.
            properties:
                name:
                    description: Header name
                    type: string
                value:
                    description: The header's value
                    type: string
                valueFrom:
                    $ref: '#/components/schemas/GatewayHeaderValueSource'
            required:
                - name
            type: object
        GatewayHeaderValueSource:
            additionalProperties: false
            description: Where a header's value comes from when it is not written in the gateway. Only a gateway the server configuration file keeps has one (ADR 26-10-17-271 §3).
            properties:
                env:
                    description: An environment variable of the Discobox server, named DISCOBOX_GATEWAY_<NAME>. The pool's proxy asks the server for its value when a request needs it and keeps it for five minutes; the value is never stored, listed, or sent to a discobox. A request whose variable the server does not set is refused with 502.
                    example: DISCOBOX_GATEWAY_CF_TOKEN
                    type: string
            required:
                - env
            type: object
        ListProjectGatewaysBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListProjectGatewaysBody.json
                    format: uri
                    readOnly: true
                    type: string
                gateways:
                    description: The project's gateways, by name
                    items:
                        $ref: '#/components/schemas/ProjectGateway'
                    type: array
            required:
                - gateways
            type: object
        ResolveGatewayHeadersBody:
            additionalProperties: false
            description: Worker request for the server environment values a sandbox's gateway sets headers from (ADR 26-10-16-470 §4).
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ResolveGatewayHeadersBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxId:
                    description: Sandbox whose request the gateway routes
                    type: string
                gateway:
                    description: The gateway's name
                    type: string
                env:
                    description: The variables to resolve; each must be one the gateway takes a header from
                    items:
                        type: string
                    type: array
            required:
                - sandboxId
                - gateway
                - env
            type: object
        ResolveGatewayHeadersResponse:
            additionalProperties: false
            description: The values of the variables asked for. One the server's environment does not set is absent.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ResolveGatewayHeadersResponse.json
                    format: uri
                    readOnly: true
                    type: string
                values:
                    additionalProperties:
                        type: string
                    description: Value by variable name
                    type: object
            required:
                - values
            type: object
        ProjectSkillsSource:
            additionalProperties: false
            description: A skills repository every discobox of the project is created with. The creating client reads the project's list and adds each entry to the create request as a --skills URL[@REF][//PATH] would be, ahead of its own, so a discobox holds a copy made at create.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ProjectSkillsSource.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    description: Principal ID that added the entry
                    type: string
                directory:
                    description: The directory inside the repository that holds the skills, relative and slash-separated, or . for the root.
                    type: string
                id:
                    description: Stable skills source ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                ref:
                    description: The branch, tag or commit to check out; absent for the repository's default branch.
                    type: string
                url:
                    description: The skills repository's remote Git URL.
                    type: string
            required:
                - id
                - projectId
                - url
                - directory
                - createdAt
            type: object
        CreateSSHKeyBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSSHKeyBody.json
                    format: uri
                    readOnly: true
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                publicKey:
                    description: An authorized_keys(5) public key line
                    type: string
            required:
                - publicKey
            type: object
        Peer:
            additionalProperties: false
            description: A machine permitted to connect to this server. It authenticates as the server's default user and is not scoped to a project.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Peer.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                id:
                    description: Peer ID
                    type: string
                name:
                    description: Optional label for the enrollment
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - createdAt
                - updatedAt
            type: object
        CreatePeerBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreatePeerBody.json
                    format: uri
                    readOnly: true
                    type: string
                peerId:
                    description: The peer's ID, as `discobox admin peer id` prints it. It is an address rather than a secret; enrolling it is what grants access.
                    type: string
                name:
                    description: Optional label for the enrollment
                    type: string
            required:
                - peerId
            type: object
        ListPeersBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListPeersBody.json
                    format: uri
                    readOnly: true
                    type: string
                peers:
                    items:
                        $ref: '#/components/schemas/Peer'
                    type: array
            required:
                - peers
            type: object
        ServerPeer:
            additionalProperties: false
            description: This server's own peer identity, which every server has whatever it listens on. It is the value a client dials as `discobox://<peer-id>` when the server listens for peers, and the identity a client records for it otherwise.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ServerPeer.json
                    format: uri
                    readOnly: true
                    type: string
                irohListener:
                    $ref: '#/components/schemas/IrohListener'
                peerId:
                    description: This server's peer ID. Absent only on a server from before every server had one.
                    type: string
            type: object
        ServerInfo:
            additionalProperties: false
            description: What this server calls itself. A client registering this server offers the name as the one to register it under; nothing else depends on it, and two servers may share one.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ServerInfo.json
                    format: uri
                    readOnly: true
                    type: string
                name:
                    description: This server's name, from its `name` setting, which defaults to its hostname. Absent when neither is set.
                    type: string
            type: object
        IrohListener:
            additionalProperties: false
            description: What this server's iroh listener is doing right now, as opposed to who it is. A listener that has lost its relay leaves the process up, its socket answering and /healthz reporting ready, while every client dialing its peer ID times out; this is what makes that visible to an operator who can reach the server by any other transport. Absent on a server that does not listen for peers, and on one whose listener has not been read yet.
            properties:
                directAddrs:
                    description: The addresses this listener believes peers can reach it at.
                    items:
                        type: string
                    type: array
                homeRelay:
                    description: The relay this listener is reachable through. Absent when it has none.
                    type: string
                online:
                    description: Whether the listener has a relay right now. Without one it is reachable only from networks that can route to its sockets directly, which is a working deployment and a completely different one from what its address implies.
                    type: boolean
                since:
                    description: When `online` last changed, so a reader can tell how long a listener has been off its relay rather than only that it is.
                    format: date-time
                    type: string
                sockets:
                    description: The local UDP addresses the listener is bound to.
                    items:
                        type: string
                    type: array
            required:
                - online
            type: object
        ListSSHKeysBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSSHKeysBody.json
                    format: uri
                    readOnly: true
                    type: string
                sshKeys:
                    items:
                        $ref: '#/components/schemas/SSHKey'
                    type: array
            required:
                - sshKeys
            type: object
        SSHKey:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHKey.json
                    format: uri
                    readOnly: true
                    type: string
                comment:
                    description: Trailing comment from the public key line
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    description: Principal ID that enrolled this key
                    type: string
                fingerprint:
                    description: SHA256 fingerprint of the public key
                    type: string
                id:
                    description: Stable SSH key ID
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                projectId:
                    description: Project ID
                    type: string
                publicKey:
                    description: Normalized authorized_keys(5) public key line (type and base64 blob only)
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - publicKey
                - fingerprint
                - createdAt
                - updatedAt
            type: object
        SSHIngress:
            additionalProperties: false
            description: What an SSH client needs to verify this server. There is no address to discover; SSH reaches the server over the same endpoint every other request uses, so the host key is the whole document.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHIngress.json
                    format: uri
                    readOnly: true
                    type: string
                hostKey:
                    description: The server's SSH host public key as an authorized_keys(5)-shaped "type base64" line, for a known_hosts entry.
                    type: string
            required:
                - hostKey
            type: object
        ApprovalRequest:
            additionalProperties: false
            description: One item in a project's approval inbox (ADR 0149 §7). Exactly one of credential, trust or refresh is set, as kind says. A credential or trust request is answered on its own resource's approve and deny routes; a refresh by writing the secret's value, or dismissing it.
            properties:
                credential:
                    $ref: '#/components/schemas/SecretRequest'
                kind:
                    description: Which kind of ask this is
                    enum:
                        - credential
                        - trust
                        - refresh
                    type: string
                refresh:
                    $ref: '#/components/schemas/SecretRefreshRequest'
                trust:
                    $ref: '#/components/schemas/HostTrustRequest'
            required:
                - kind
            type: object
        ListApprovalRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListApprovalRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                approvalRequests:
                    items:
                        $ref: '#/components/schemas/ApprovalRequest'
                    type: array
            required:
                - approvalRequests
            type: object
        ObservedCertificate:
            additionalProperties: false
            description: One certificate a host presented to the pool's egress, as a person reads it to decide whether to trust the host. Public material only.
            properties:
                dnsNames:
                    description: DNS names the certificate is valid for
                    items:
                        type: string
                    nullable: true
                    type: array
                ips:
                    description: IP addresses the certificate is valid for
                    items:
                        type: string
                    nullable: true
                    type: array
                isCA:
                    description: Whether the certificate is a CA
                    type: boolean
                issuer:
                    description: Issuer distinguished name
                    type: string
                notAfter:
                    description: End of the validity window
                    format: date-time
                    type: string
                notBefore:
                    description: Start of the validity window
                    format: date-time
                    type: string
                pem:
                    description: The certificate, PEM-encoded
                    type: string
                selfSigned:
                    description: Whether the certificate is signed by its own key
                    type: boolean
                sha256:
                    description: Hex SHA-256 of the certificate's DER, what a ca pin names
                    type: string
                spkiSha256:
                    description: Hex SHA-256 of its SubjectPublicKeyInfo, what a leaf-spki pin names
                    type: string
                subject:
                    description: Subject distinguished name
                    type: string
            required:
                - subject
                - issuer
                - notBefore
                - notAfter
                - sha256
                - spkiSha256
                - pem
            type: object
        TrustPin:
            additionalProperties: false
            description: The certificate a host trust verifies the host against. ca pins a CA the chain must verify to, with the name checked as usual; leaf-spki pins the server certificate's public key exactly, for a chain that carries no CA.
            properties:
                kind:
                    description: What is pinned
                    enum:
                        - ca
                        - leaf-spki
                    type: string
                sha256:
                    description: Hex SHA-256 of the pinned CA's DER, or of the leaf's SubjectPublicKeyInfo
                    type: string
            required:
                - kind
                - sha256
            type: object
        HostTrustRequest:
            additionalProperties: false
            description: An agent's ask to trust a host whose certificate the pool's egress refuses, for its own sandbox (ADR 0149).
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HostTrustRequest.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                grantTTLSeconds:
                    description: How long the agent asked the trust to last, in seconds; absent when it named nothing in particular
                    format: int64
                    type: integer
                host:
                    description: The endpoint to trust, host:port
                    type: string
                id:
                    description: Stable request ID
                    type: string
                justification:
                    description: Why the agent says it needs to reach the host
                    type: string
                observedChain:
                    description: The chain the pool's egress was shown, leaf first
                    items:
                        $ref: '#/components/schemas/ObservedCertificate'
                    nullable: true
                    type: array
                projectId:
                    description: Project ID
                    type: string
                requestedBy:
                    description: Principal ID of the requestor
                    type: string
                sandboxId:
                    description: Sandbox the trust is asked for
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - approved
                        - denied
                    type: string
                suppliedCA:
                    $ref: '#/components/schemas/ObservedCertificate'
                trustId:
                    description: Host trust that satisfied this request; set when approved
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - sandboxId
                - host
                - status
                - requestedBy
                - createdAt
                - updatedAt
            type: object
        ListTrustRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListTrustRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                trustRequests:
                    items:
                        $ref: '#/components/schemas/HostTrustRequest'
                    type: array
            required:
                - trustRequests
            type: object
        ApproveTrustRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ApproveTrustRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: How long the trust lasts, in seconds, from 1 to 2592000 (thirty days). Defaults to what the agent asked for, or an hour when it asked for nothing in particular. A trust always lapses.
                    format: int64
                    type: integer
                pin:
                    $ref: '#/components/schemas/TrustPin'
            type: object
        HostTrust:
            additionalProperties: false
            description: A host one sandbox trusts by a pin (ADR 0149). The pin makes that certificate acceptable for this endpoint alone; it decides nothing about the requests sent there (ADR 26-10-27-880 §10).
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HostTrust.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                expiresAt:
                    description: When the trust lapses
                    format: date-time
                    type: string
                grantedBy:
                    description: Principal ID of the approver
                    type: string
                host:
                    description: The trusted endpoint, host:port
                    type: string
                id:
                    description: Stable host trust ID
                    type: string
                pin:
                    $ref: '#/components/schemas/TrustPin'
                pinPem:
                    description: The pinned CA, PEM-encoded; absent for a leaf-spki pin
                    type: string
                projectId:
                    description: Project ID
                    type: string
                requestId:
                    description: Trust request the trust was approved from
                    type: string
                sandboxId:
                    description: The one sandbox that trusts the host
                    type: string
            required:
                - id
                - projectId
                - sandboxId
                - host
                - pin
                - expiresAt
                - grantedBy
                - createdAt
            type: object
        ListHostTrustsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListHostTrustsBody.json
                    format: uri
                    readOnly: true
                    type: string
                hostTrusts:
                    items:
                        $ref: '#/components/schemas/HostTrust'
                    type: array
            required:
                - hostTrusts
            type: object
        CreateSandboxTrustRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxTrustRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: How long the agent asks the trust to last, in seconds, from 1 to 2592000; omit to ask for nothing in particular
                    format: int64
                    type: integer
                host:
                    description: The endpoint to trust, host:port
                    type: string
                justification:
                    description: Why the agent says it needs to reach the host
                    type: string
                observedChain:
                    description: The chain the pool's egress was shown when it connected to the host, leaf first
                    items:
                        $ref: '#/components/schemas/ObservedCertificate'
                    type: array
                sandboxId:
                    description: Sandbox asking for the trust
                    type: string
                suppliedCA:
                    $ref: '#/components/schemas/ObservedCertificate'
            required:
                - sandboxId
                - host
                - observedChain
            type: object
        SandboxTrustRequestStatus:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxTrustRequestStatus.json
                    format: uri
                    readOnly: true
                    type: string
                host:
                    description: The endpoint asked for, host:port
                    type: string
                pin:
                    $ref: '#/components/schemas/TrustPin'
                requestId:
                    description: Request ID to poll
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - granted
                        - denied
                    type: string
            required:
                - requestId
                - status
                - host
            type: object
info:
    title: Discobox Sandbox Manager
    version: 0.1.0
openapi: 3.1.1
paths:
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-config-changes:
        get:
            operationId: get-sandbox-harness-config-changes
            summary: Get sandbox harness config changes.
            tags: [Harness Config Save Back]
            x-sandbox-agent: true
            parameters:
                - in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                200:
                    description: Result.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfigChanges'
                default:
                    description: Error response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-config-changes/save:
        post:
            operationId: save-sandbox-harness-config-changes
            summary: Save sandbox harness config changes.
            tags: [Harness Config Save Back]
            parameters:
                - in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HarnessConfigCandidateRequest'
            responses:
                200:
                    description: Result.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfigSaveResult'
                default:
                    description: Error response.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-config-changes/reconsider:
        post:
            operationId: reconsider-sandbox-harness-config-changes
            summary: Reconsider sandbox harness config changes.
            tags: [Harness Config Save Back]
            parameters:
                - in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HarnessConfigSelection'
            responses:
                200:
                    description: Result.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfigChanges'
                default:
                    description: Error response.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-config-changes/discard:
        post:
            operationId: discard-sandbox-harness-config-changes
            summary: Discard sandbox harness config changes.
            tags: [Harness Config Save Back]
            x-sandbox-agent: true
            parameters:
                - in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HarnessConfigCandidateRequest'
            responses:
                200:
                    description: Result.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfigChanges'
                default:
                    description: Error response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /api/projects/{projectId}/sandboxes/{sandboxId}/harness-config-capture:
        post:
            operationId: capture-sandbox-harness-config
            summary: Capture sandbox harness config.
            tags: [Harness Config Save Back]
            x-sandbox-agent: true

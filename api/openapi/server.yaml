    /projects/{projectId}/sandboxes/{sandboxId}/repair:
        post:
            operationId: repair-sandbox
            description: Rebuild the sandbox in place, on its harness config's current image, and start it. The container and disposable runtime state are torn down, the container is recreated against the durable data that was kept, and a start is issued - one operation for the archive-unarchive-start sequence. The rebuild always lands on the image the harness config resolves to now, so a repair is an upgrade as well; unlike upgrade, having nothing newer to move to is not an error here. Recording the repair intent also clears a settled failure, so this is the way out of an error state. The rebuild is driven in the request; a request that dies leaves the intent recorded and the rebuild converging in the background, stopped, starting on first use. Conflicts if the sandbox is archived or being deleted.

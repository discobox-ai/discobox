        SandboxSecretInput:
            additionalProperties: false
            description: An inline secret for the new sandbox. Its value becomes a project-managed anonymous secret, routed to host when one is given and to `*` otherwise (ADR 26-10-27-939), bound to the sandbox in env. An existing secret is bound through bindings instead.
            properties:

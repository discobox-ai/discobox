        CreateSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                host:
                    description: Optional host hint used to match a secret (e.g. github.com)
                    type: string
                type:
                    description: Secret type being requested
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
            required:
                - type

    /projects/{projectId}/sandboxes/{sandboxId}/purge:
        post:
            operationId: purge-sandbox
            description: Destroy the sandbox and its data. Unlike every other existence change this is synchronous - the request does not return success until the pool agent has confirmed the container and the sandbox's data are both gone, because a 202 would be a promise the server could not later verify against a row it had just deleted (ADR 0022 §3). A failure leaves the delete intent recorded, so it converges in the background regardless.
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Sandbox ID
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    description: Sandbox ID
                    type: string
            responses:
                204:
                    description: Confirmed - the sandbox and its data are gone
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Purge a sandbox and its data
            tags:
                - Sandboxes

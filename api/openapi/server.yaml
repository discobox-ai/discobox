        ListSecretRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretRequests:
                    items:
                        $ref: '#/components/schemas/SecretRequest'

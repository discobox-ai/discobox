            required:
                - secretRequests
            type: object
        ListSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    items:
                        $ref: '#/components/schemas/Secret'
                    type: array
            required:
                - secrets
            type: object
        Secret:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Secret.json
                    format: uri
                    readOnly: true
                    type: string
                anonymous:
                    description: Sandbox-managed secret created from an inline value; referenced only by ID
                    type: boolean
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                format:
                    description: Generative format template describing the credential shape; used to mint sentinel placeholders
                    type: string
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                id:
                    description: Stable secret ID
                    type: string
                name:
                    description: Secret name
                    type: string
                projectId:
                    description: Project ID
                    type: string
                type:
                    description: Secret type
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - type
                - defaultGrantTTLSeconds
                - createdAt
                - updatedAt
            type: object
        SecretGrant:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretGrant.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                expiresAt:
                    description: Expiry time; empty never expires
                    format: date-time
                    type: string
                grantedAt:
                    description: When the grant was created
                    format: date-time
                    type: string
                grantedBy:
                    description: Principal ID that created the grant
                    type: string
                host:
                    description: Host the grant is limited to; empty matches any host
                    type: string
                id:
                    description: Stable grant ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against
                    type: string
                secretId:
                    description: Granted secret ID
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - secretId
                - scope
                - scopeKey
                - grantedAt
                - createdAt
                - updatedAt
            type: object
        ListSecretGrantsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretGrantsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretGrants:
                    items:
                        $ref: '#/components/schemas/SecretGrant'
                    type: array
            required:
                - secretGrants
            type: object
        SecretRequest:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretRequest.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                grantId:
                    description: Grant that satisfied this request; set when approved
                    type: string
                host:
                    description: Host hint provided at request time
                    type: string
                id:
                    description: Stable request ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                requestedBy:
                    description: Principal ID of the requestor
                    type: string
                sandboxId:
                    description: Sandbox that owns the sentinel, for sandbox-originated requests
                    type: string
                secretId:
                    description: Matched secret ID; set when approved
                    type: string
                status:
                    description: Request status
                    enum:

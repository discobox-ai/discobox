        ListSandboxCredentialsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxCredentialsResponse.json
                    format: uri
                    readOnly: true
                    type: string
                credentials:
                    items:
                        $ref: '#/components/schemas/SandboxCredential'
                    type: array
            required:

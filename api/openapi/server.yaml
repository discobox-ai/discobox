                    description: User home directory to use inside the sandbox
                    type: string
                name:
                    description: Username to use inside the sandbox
                    type: string
                uid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
            type: object
        SandboxProviderCatalogItem:
            additionalProperties: false
            properties:
                available:
                    description: Whether provider is available
                    type: boolean
                builtIn:
                    description: Whether provider is built in
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/ProviderStatus'
                    description: Provider capabilities/status
                configFields:
                    description: Provider config fields
                    items:
                        $ref: '#/components/schemas/ProviderConfigField'
                    nullable: true
                    type: array
                description:
                    description: Provider description
                    type: string
                icon:
                    description: Provider icon
                    type: string
                id:
                    description: Provider type ID
                    type: string
                name:
                    description: Provider display name
                    type: string
            required:
                - id
                - name
                - available
                - builtIn
                - capabilities
            type: object
        SandboxProviderInstance:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxProviderInstance.json
                    format: uri
                    readOnly: true
                    type: string
                builtIn:
                    description: Whether this provider is built in
                    type: boolean
                config:
                    description: Non-secret provider configuration
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                id:
                    description: Stable provider instance ID
                    type: string
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                pools:
                    description: Pools backed by this provider instance
                    items:
                        $ref: '#/components/schemas/Pool'
                    nullable: true
                    type: array
                type:
                    description: Provider type
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - type
                - name
                - builtIn
                - disabled
                - createdAt
                - updatedAt
            type: object
        AssignSandboxHarnessSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AssignSandboxHarnessSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfigId:
                    description: Harness config whose bound secrets should be assigned to the sandbox for a per-invocation run.
                    type: string
            required:
                - harnessConfigId
            type: object
        SandboxHarnessSecretsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxHarnessSecretsResponse.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    additionalProperties:
                        type: string
                    description: Environment variable name to sentinel placeholder. Inject these into the exec/terminal environment; the proxy swaps them for real values on egress.
                    type: object
            required:
                - secrets
            type: object
        ApproveSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ApproveSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; overrides the secret's default
                    format: int64
                    type: integer
                scope:
                    description: How widely the minted grant applies. Defaults to sandbox for sandbox-originated requests, otherwise project.
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                secretId:
                    description: Secret ID selected by the approver
                    type: string
            required:
                - secretId
            type: object
        CreateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                type:
                    description: Secret type
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            required:
                - name
                - type
                - value
            type: object
        CreateSecretGrantBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretGrantBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; defaults to the secret's default. 0 never expires.
                    format: int64
                    type: integer
                host:
                    description: Host the grant is limited to; empty matches any host and defaults to the secret's host
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against (sandbox ID or harness config ID). Defaults to the project ID for project scope.
                    type: string
                secretId:
                    description: Secret ID to grant
                    type: string
            required:
                - secretId
                - scope
            type: object
        CreateSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                host:
                    description: Optional host hint used to match a secret (e.g. github.com)
                    type: string
                type:
                    description: Secret type being requested
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
            required:
                - type
            type: object
        ListSecretRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretRequests:
                    items:
                        $ref: '#/components/schemas/SecretRequest'
                    type: array
            required:
                - secretRequests
            type: object
        ListSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    items:
                        $ref: '#/components/schemas/Secret'
                    type: array
            required:
                - secrets
            type: object
        Secret:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Secret.json
                    format: uri
                    readOnly: true
                    type: string
                anonymous:
                    description: Sandbox-managed secret created from an inline value; referenced only by ID
                    type: boolean
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                format:
                    description: Generative format template describing the credential shape; used to mint sentinel placeholders
                    type: string
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                id:
                    description: Stable secret ID
                    type: string
                name:
                    description: Secret name
                    type: string
                projectId:
                    description: Project ID
                    type: string
                type:
                    description: Secret type
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - type
                - defaultGrantTTLSeconds
                - createdAt
                - updatedAt
            type: object
        SecretGrant:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretGrant.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                expiresAt:
                    description: Expiry time; empty never expires
                    format: date-time
                    type: string
                grantedAt:
                    description: When the grant was created
                    format: date-time
                    type: string
                grantedBy:
                    description: Principal ID that created the grant
                    type: string
                host:
                    description: Host the grant is limited to; empty matches any host
                    type: string
                id:
                    description: Stable grant ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against
                    type: string
                secretId:
                    description: Granted secret ID
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - secretId
                - scope
                - scopeKey
                - grantedAt
                - createdAt
                - updatedAt
            type: object
        ListSecretGrantsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretGrantsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretGrants:
                    items:
                        $ref: '#/components/schemas/SecretGrant'
                    type: array
            required:
                - secretGrants
            type: object
        SecretRequest:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretRequest.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                grantId:
                    description: Grant that satisfied this request; set when approved
                    type: string
                host:
                    description: Host hint provided at request time
                    type: string
                id:
                    description: Stable request ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                requestedBy:
                    description: Principal ID of the requestor
                    type: string
                sandboxId:
                    description: Sandbox that owns the sentinel, for sandbox-originated requests
                    type: string
                secretId:
                    description: Matched secret ID; set when approved
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - approved
                        - denied
                    type: string
                type:
                    description: Secret type requested
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - requestedBy
                - type
                - status
                - createdAt
                - updatedAt
            type: object
        SecretValue:
            additionalProperties: false
            description: Type-specific secret value. Fields populated depend on the secret type.
            properties:
                passphrase:
                    description: SSH key passphrase (type=ssh)
                    type: string
                password:
                    description: Git credential password (type=git)
                    type: string
                privateKey:
                    description: SSH private key PEM (type=ssh)
                    type: string
                token:
                    description: Bearer token (type=bearer)
                    type: string
                username:
                    description: Git credential username (type=git)
                    type: string
            type: object
        UpdateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            type: object
        StartSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StartSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force start if the provider supports it
                    type: boolean
            type: object
        StopSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StopSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force stop if the provider supports it
                    type: boolean
            type: object
        StreamErrorEvent:
            additionalProperties: false
            properties:
                error:
                    type: string
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
                - error
            type: object
        UpdateHarnessConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateHarnessConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                files:
                    description: Files to write into the harness's home directory when the harness is installed
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                name:
                    description: Harness config name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxUpdateConfig'
                    description: Desired sandbox configuration changes.
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
            type: object
        UpdatePoolStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdatePoolStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                availableCpuVcpus:
                    format: double
                    type: number
                availableMemoryBytes:
                    format: int64
                    type: integer
                availableStorageBytes:
                    format: int64
                    type: integer
                conditions: {}
                degraded:
                    type: boolean
                ready:
                    type: boolean
                schedulable:
                    type: boolean
            required:
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
            type: object
        ReportPoolSandboxRemovedBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ReportPoolSandboxRemovedBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxId:
                    description: Sandbox whose pool-local runtime was removed outside control-plane reconciliation
                    type: string
            required:
                - sandboxId
            type: object
        User:
            additionalProperties: false
            properties:
                avatarUrl:
                    description: Avatar image URL
                    format: uri
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                email:
                    description: User email address
                    format: email
                    type: string
                id:
                    description: Stable user ID
                    type: string
                name:
                    description: Display name
                    type: string
                provider:
                    description: Authentication provider
                    type: string
                subject:
                    description: Provider subject identifier
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - email
                - provider
                - subject
                - createdAt
                - updatedAt
            type: object
info:
    title: Discobox Sandbox Manager
    version: 0.1.0
openapi: 3.1.1
paths:
    /projects/{projectId}/jobs:
        get:
            operationId: list-jobs
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListJobsBody'
                    description: Jobs
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List jobs for a project
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}:
        get:
            operationId: get-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get a job
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}/force:
        post:
            operationId: force-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Force a pending or backoff job to run immediately
            tags:
                - jobs
    /api/pools/register:
        post:
            operationId: register-pool
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterPoolBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterPoolResponseBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Register a bootstrapped pool agent
            tags:
                - Pools
    /api/pools/{poolId}/status:
        post:
            operationId: update-pool-status
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePoolStatusBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pool'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Update pool status
            tags:
                - Pools
    /api/pools/{poolId}/sandbox-removed:
        post:
            operationId: report-pool-sandbox-removed
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReportPoolSandboxRemovedBody'
                required: true
            responses:
                204:
                    description: Sandbox removal accepted or already superseded
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Report a pool-local sandbox runtime removed outside reconciliation
            tags:
                - Pools
    /api/pools/{poolId}/resolve-sandbox-secret:
        post:
            operationId: resolve-sandbox-secret
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer worker assertion with the secret:resolve scope
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer worker assertion with the secret:resolve scope
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveSandboxSecretBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveSandboxSecretResponse'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Resolve a sandbox sentinel secret
            tags:
                - Pools
    /projects:
        get:
            operationId: list-projects
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListProjectsBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List projects
            tags:
                - Projects
    /projects/{projectId}:
        get:
            operationId: get-project
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Project'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get a project
            tags:
                - Projects
    /projects/{projectId}/harness-configs:
        get:
            operationId: list-harness-configs
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListHarnessConfigsBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List harness configs
            tags:
                - Harness Configs
        post:
            operationId: create-harness-config
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateHarnessConfigBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfig'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Create a harness config
            tags:
                - Harness Configs
    /projects/{projectId}/harness-configs/{harnessConfigId}:
        delete:
            operationId: delete-harness-config
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Harness config ID
                  in: path
                  name: harnessConfigId
                  required: true
                  schema:
                    description: Harness config ID
                    type: string
            responses:
                204:
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Delete a harness config
            tags:
                - Harness Configs
        get:

            type: object
        SandboxRuntime:
            additionalProperties: false
            properties:
                agentStatus:
                    additionalProperties: true
                    description: Latest sandbox-agent-reported git/session/connection status, pushed periodically by the hosting pool-agent
                    nullable: true
                    type: object
                agentStatusObservedAt:
                    description: When agentStatus was observed by sandbox-agent
                    format: date-time
                    type: string
                appliedCommits:
                    description: History of successful disco apply runs that landed this sandbox's commits on a host, most recent last. Client-reported; append-only.
                    items:
                        $ref: '#/components/schemas/AppliedSourceCommit'
                    nullable: true
                    type: array
                desiredState:
                    description: |-
                        Requested existence. Power state is not requested: whether a sandbox is running is
                        observed and reported by its runtime, never asked for by the control plane
                        (ADR 0017 §9). Archived is a third form of existence — as data, with no
                        container — not a power state (ADR 0022 §1).
                    enum:
                        - present
                        - archived
                        - deleted
                    type: string
                displayState:
                    description: User-facing lifecycle state, derived from the observed state plus whether the existence generations agree
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                        - archiving
                        - archived
                        - deleting
                        - deleted
                        - error
                    readOnly: true
                    type: string
                errorMessage:
                    description: Error from the generation currently recorded in observedGeneration. Cleared by every accepted intent.
                    type: string
                generation:
                    description: Latest spec generation
                    format: int64
                    type: integer
                lastActiveAt:
                    description: Last observed activity timestamp
                    format: date-time
                    type: string
                observedGeneration:
                    description: Latest generation the reconciler has finished acting on
                    format: int64
                    type: integer
                state:
                    description: Observed state. The transitional values are reported by the pool agent, which is the only component that can see them.
                    enum:
                        - pending
                        - awaiting_source
                        - starting
                        - running
                        - stopping
                        - stopped
                        - archived
                        - deleted
                        - failed
                    type: string
                stateChangedAt:
                    description: When state last changed to its current value
                    format: date-time
                    type: string
                stateReportedAt:
                    description: |-
                        When the hosting pool agent last reported this sandbox's state. A state whose report
                        is old is a state nobody has confirmed recently.
                    format: date-time
                    type: string
                upgrade:
                    "$ref": "#/components/schemas/SandboxUpgrade"
            required:
                - desiredState
                - state
                - generation
                - observedGeneration
            type: object

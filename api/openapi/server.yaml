                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - type
                - autoApprove
                - defaultGrantTTLSeconds
                - createdAt
                - updatedAt
            type: object
        SecretRequest:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretRequest.json
                    format: uri
                    readOnly: true
                    type: string
                approvedBy:
                    description: ID of the user or "auto" if auto-approved
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                expiresAt:
                    description: Grant expiry time; set when approved
                    format: date-time
                    type: string
                grantedAt:
                    description: Approval timestamp
                    format: date-time
                    type: string
                host:
                    description: Host hint provided at request time
                    type: string
                id:
                    description: Stable request ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                requestedBy:
                    description: Principal ID of the requestor
                    type: string
                secretId:
                    description: Matched secret ID; set when approved
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - approved
                        - denied
                    type: string
                type:
                    description: Secret type requested
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            required:
                - id
                - projectId
                - requestedBy
                - type
                - status
                - createdAt
                - updatedAt
            type: object
        SecretValue:
            additionalProperties: false
            description: Type-specific secret value. Fields populated depend on the secret type.
            properties:
                passphrase:
                    description: SSH key passphrase (type=ssh)
                    type: string
                password:
                    description: Git credential password (type=git)
                    type: string
                privateKey:
                    description: SSH private key PEM (type=ssh)
                    type: string
                token:
                    description: Bearer token (type=bearer)
                    type: string
                username:
                    description: Git credential username (type=git)
                    type: string
            type: object
        UpdateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                autoApprove:
                    description: Automatically approve requests for this secret
                    type: boolean
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            type: object
        StartSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StartSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force start if the provider supports it
                    type: boolean
            type: object
        StopSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StopSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force stop if the provider supports it
                    type: boolean
            type: object
        StreamErrorEvent:
            additionalProperties: false
            properties:
                error:
                    type: string
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
                - error
            type: object
        UpdateAgentConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateAgentConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                files:
                    description: Files to write into the agent's home directory when the agent is installed
                    items:
                        $ref: '#/components/schemas/AgentConfigFile'
                    nullable: true
                    type: array
                installCommand:
                    description: Argv used to install the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
                name:
                    description: Agent config name
                    maxLength: 200
                    type: string
                runCommand:
                    description: Argv used to run the agent. Not run through a shell; use ["sh", "-c", "..."] for shell semantics.
                    items:
                        type: string
                    nullable: true
                    type: array
            type: object
        UpdateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxUpdateConfig'
                    description: Desired sandbox configuration changes.
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
            type: object
        UpdateWorkerStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateWorkerStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                availableCpuVcpus:
                    format: double
                    type: number
                availableMemoryBytes:
                    format: int64
                    type: integer
                availableStorageBytes:
                    format: int64
                    type: integer
                conditions: {}
                degraded:
                    type: boolean
                ready:
                    type: boolean
                schedulable:
                    type: boolean
            required:
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
            type: object
        User:
            additionalProperties: false
            properties:
                avatarUrl:
                    description: Avatar image URL
                    format: uri
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                email:
                    description: User email address
                    format: email
                    type: string
                id:
                    description: Stable user ID
                    type: string
                name:
                    description: Display name
                    type: string
                provider:
                    description: Authentication provider
                    type: string
                subject:
                    description: Provider subject identifier
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - email
                - provider
                - subject
                - createdAt
                - updatedAt
            type: object
        Worker:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Worker.json
                    format: uri
                    readOnly: true
                    type: string
                activeOperation:
                    description: Current queued or running operation
                    enum:
                        - create
                        - start
                        - stop
                        - restart
                        - delete
                    type: string
                availableCpuVcpus:
                    description: Worker-reported available CPU capacity in vCPUs
                    format: double
                    type: number
                availableMemoryBytes:
                    description: Worker-reported available memory capacity in bytes
                    format: int64
                    type: integer
                availableStorageBytes:
                    description: Worker-reported available storage capacity in bytes
                    format: int64
                    type: integer
                conditions:
                    description: Opaque worker-reported condition details for display
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                degraded:
                    description: Whether the worker should be used only as fallback capacity
                    type: boolean
                desiredState:
                    description: Requested worker state
                    enum:
                        - active
                        - drained
                        - deleted
                    type: string
                errorMessage:
                    description: Latest error message
                    type: string
                generation:
                    description: Latest desired-state generation
                    format: int64
                    type: integer
                id:
                    description: Stable worker ID
                    type: string
                identity:
                    description: Worker identity
                    type: string
                keyType:
                    description: Worker key type
                    type: string
                lastJobId:
                    description: Most recent lifecycle job ID
                    type: string
                lastOperationStatus:
                    description: Status of the most recent operation
                    enum:
                        - pending
                        - running
                        - success
                        - failed
                    type: string
                lastSeenAt:
                    description: Last heartbeat timestamp
                    format: date-time
                    type: string
                observedGeneration:
                    description: Latest generation fully observed by reconciliation
                    format: int64
                    type: integer
                phase:
                    description: Observed lifecycle phase
                    enum:
                        - pending
                        - launching
                        - registering
                        - active
                        - draining
                        - offline
                        - deleted
                        - failed
                    type: string
                projectId:
                    description: Project ID
                    type: string
                providerInstance:
                    $ref: '#/components/schemas/SandboxProviderInstance'
                    description: Sandbox provider instance
                providerInstanceId:
                    description: Sandbox provider instance ID
                    type: string
                publicKey:
                    description: Worker public key
                    type: string
                ready:
                    description: Whether the worker is alive and healthy
                    type: boolean
                registeredAt:
                    description: Registration timestamp
                    format: date-time
                    type: string
                revokedAt:
                    description: Revocation timestamp
                    format: date-time
                    type: string
                schedulable:
                    description: Whether the worker is willing to pull new work
                    type: boolean
                statusMessage:
                    description: Human-readable status detail
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - providerInstanceId
                - identity
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
                - createdAt
                - updatedAt
                - desiredState
                - phase
                - lastOperationStatus
                - generation
                - observedGeneration
            type: object
info:
    title: Discobox Sandbox Manager
    version: 0.1.0
openapi: 3.1.1
paths:
    /projects/{projectId}/jobs:
        get:
            operationId: list-jobs
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListJobsBody'
                    description: Jobs
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List jobs for a project
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}:
        get:
            operationId: get-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get a job
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}/force:
        post:
            operationId: force-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Force a pending or backoff job to run immediately
            tags:
                - jobs
    /agent-config-definitions:
        get:
            operationId: list-agent-config-definitions
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAgentConfigDefinitionsBody'

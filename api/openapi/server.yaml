            x-sandbox-agent: true
    /projects/{projectId}/stream/sse:
        get:
            description: Subscribes to one project stream using query parameters. Reconnecting clients may receive current resource data before live detail events, or opt out with history=false.
            operationId: subscribe-project-stream-sse
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Stream name
                  explode: false
                  in: query
                  name: stream
                  schema:
                    default: sandbox
                    description: Stream name
                    enum:
                        - sandbox
                    type: string
                - description: Sandbox ID to stream; defaults to all sandboxes
                  explode: false
                  in: query
                  name: sandboxId
                  schema:
                    description: Sandbox ID to stream; defaults to all sandboxes
                    type: string
                - description: Return after current resource data instead of waiting for live events
                  explode: false
                  in: query
                  name: listOnly
                  schema:
                    description: Return after current resource data instead of waiting for live events
                    type: boolean
                - description: Send current resource data before live changes; defaults to true
                  explode: false
                  in: query
                  name: history
                  schema:
                    default: true
                    description: Send current resource data before live changes; defaults to true
                    type: boolean
            responses:
                200:
                    content:
                        text/event-stream:
                            schema:
                                description: Each oneOf object in the array represents one possible SSE message. Current resource data may be followed by live detail events from connection time onward.
                                items:
                                    oneOf:
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/CompleteEvent'
                                            event:
                                                const: complete
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event complete
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/ConnectedEvent'
                                            event:
                                                const: connected
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event connected
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/StreamErrorEvent'
                                            event:
                                                const: error
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event error
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/ResourceListFinishEvent'
                                            event:
                                                const: list-end
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event list-end
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/ResourceListStartEvent'
                                            event:
                                                const: list-start
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event list-start
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/ResourceChangedEvent'
                                            event:
                                                const: resource.changed
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event resource.changed
                                          type: object
                                        - properties:
                                            data:
                                                $ref: '#/components/schemas/ResourceListedEvent'
                                            event:
                                                const: resource.listed
                                                description: The event name.
                                                type: string
                                          required:
                                            - event
                                            - data
                                          title: Event resource.listed
                                          type: object
                                title: Server Sent Events
                                type: array
                    description: OK
                422:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Unprocessable Entity
                500:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Internal Server Error
                503:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Service Unavailable
            summary: Subscribe to a static project event stream using SSE
            tags:
                - Project Streams

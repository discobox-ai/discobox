    /projects/{projectId}/audit/dns:
        get:
            description: The DNS queries the project's pools answered for their sandboxes, newest first, read from each pool through its agent and merged the way the HTTP audit is (ADR 0130 §§1, 4; ADR 0148). A pool that does not answer is listed in unavailablePools rather than dropped.
            operationId: list-dns-audit
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Only queries asked by this sandbox, which need not still exist
                  in: query
                  name: sandboxId
                  schema:
                    description: Only queries asked by this sandbox, which need not still exist
                    type: string
                - description: Only queries answered by this pool
                  in: query
                  name: poolId
                  schema:
                    description: Only queries answered by this pool
                    type: string
                - description: Only queries for this name
                  in: query
                  name: name
                  schema:
                    description: Only queries for this name
                    type: string
                - description: Only the query with this record ID, which is only unique within a pool
                  in: query
                  name: id
                  schema:
                    description: Only the query with this record ID, which is only unique within a pool
                    pattern: ^dns_[0-9]+$
                    type: string
                - description: Only queries asked at or after this time
                  in: query
                  name: since
                  schema:
                    description: Only queries asked at or after this time
                    format: date-time
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
                    type: string
                - description: Only queries asked at or before this time, for paging back newest first
                  in: query
                  name: until
                  schema:
                    description: Only queries asked at or before this time, for paging back newest first
                    format: date-time
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
                    type: string
                - description: Maximum number of queries to return.
                  in: query
                  name: limit
                  schema:
                    default: 100
                    maximum: 1000
                    minimum: 1
                    type: integer
                - description: 'Read forward from a cursor instead of a time, one per pool, as poolId:dns_<row>. A pool named here is read in write order after that record; a pool not named is read by since.'
                  explode: true
                  in: query
                  name: after
                  schema:
                    items:
                      pattern: ^[A-Za-z0-9_-]+:dns_[0-9]+$
                      type: string
                    maxItems: 100
                    type: array
                  style: form
                - description: asc returns the oldest matches first, for reading forward from a since bound; desc, the default, the newest first
                  in: query
                  name: order
                  schema:
                    default: desc
                    description: asc returns the oldest matches first, for reading forward from a since bound; desc, the default, the newest first
                    enum:
                        - asc
                        - desc
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDNSAuditBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List audited DNS queries
            tags:
                - Pools
    /projects/{projectId}/audit/http:
        get:
            description: The HTTP exchanges the project's pool proxies audited, newest first, read from each pool through its agent and merged. Project-scoped because a purged sandbox's exchanges stay on its pool for the audit retention window after the record of which pool that was is gone. A pool that does not answer is listed in unavailablePools rather than dropped.
            operationId: list-http-audit
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Only exchanges made by this sandbox, which need not still exist
                  in: query
                  name: sandboxId
                  schema:
                    description: Only exchanges made by this sandbox, which need not still exist
                    type: string
                - description: Only exchanges recorded by this pool
                  in: query
                  name: poolId
                  schema:
                    description: Only exchanges recorded by this pool
                    type: string
                - description: Only exchanges to this host
                  in: query
                  name: host
                  schema:
                    description: Only exchanges to this host
                    type: string
                - description: Only exchanges recorded at or after this time
                  in: query
                  name: since
                  schema:
                    description: Only exchanges recorded at or after this time
                    format: date-time
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
                    type: string
                - description: Only exchanges recorded at or before this time, for paging back newest first
                  in: query
                  name: until
                  schema:
                    description: Only exchanges recorded at or before this time, for paging back newest first
                    format: date-time
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
                    type: string
                - description: Maximum number of exchanges to return.
                  in: query
                  name: limit
                  schema:
                    default: 100
                    maximum: 1000
                    minimum: 1
                    type: integer
                - description: 'Read forward from a cursor instead of a time, one per pool, as poolId:http_<row>. A pool named here is read in write order after that record; a pool not named is read by since.'
                  explode: true
                  in: query
                  name: after
                  schema:
                    items:
                      pattern: ^[A-Za-z0-9_-]+:http_[0-9]+$
                      type: string
                    maxItems: 100
                    type: array
                  style: form
                - description: Only exchanges whose response status is at least this
                  in: query
                  name: minStatus
                  schema:
                    description: Only exchanges whose response status is at least this
                    maximum: 599
                    minimum: 0
                    type: integer
                - description: Only exchanges whose response status is at most this
                  in: query
                  name: maxStatus
                  schema:
                    description: Only exchanges whose response status is at most this
                    maximum: 599
                    minimum: 0
                    type: integer
                - description: Only exchanges the destination policy refused when true, or let through when false
                  in: query
                  name: blocked
                  schema:
                    description: Only exchanges the destination policy refused when true, or let through when false
                    type: boolean
                - description: asc returns the oldest matches first, for reading forward from a since bound; desc, the default, the newest first
                  in: query
                  name: order
                  schema:
                    default: desc
                    description: asc returns the oldest matches first, for reading forward from a since bound; desc, the default, the newest first
                    enum:
                        - asc
                        - desc
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListHTTPAuditBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List audited HTTP exchanges
            tags:
                - Pools
    /projects/{projectId}/pools/{poolId}/audit/http/{exchangeId}:
        get:
            description: One audited HTTP exchange in full, read from the pool that recorded it. The pool is in the path because an audit record ID is only unique within it. The bodies and any upgraded stream are read separately, through the recording route beside this one.

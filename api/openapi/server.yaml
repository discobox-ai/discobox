        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    $ref: '#/components/schemas/GitSourceCheckout'
                    description: Immutable checkout target and optional user-facing ref identity
                cacheKey:
                    description: The pool's Git cache this source is delivered into, set by the server for a cache-delivered source. It is the source's remote, normalized to host and path, or a key for the client's own directory when the source has no remote. Sources that share it share one object store on a pool, so a delivery sends only what the pool has not been sent before.
                    type: string
                delivery:
                    description: How the source reaches the sandbox, decided by the server and recorded at create. cache is every source created now. A client delivers it into a Git namespace of the pool's cache for the source's remote, and the sandbox clones it from the pool; the sandbox waits in the awaiting_source phase until the delivery is reported complete. clone and push are how earlier discoboxes were delivered and keep their meaning for them. clone means the sandbox fetched it from url, or from localDirectory through its pool. push means the client pushed it into a repository the pool made for that sandbox.
                    enum:
                        - clone
                        - push
                        - cache
                    type: string
                destination:
                    $ref: '#/components/schemas/GitSourceDestination'
                    description: Sandbox destination paths for this source
                kind:
                    description: Source kind. Currently only git is supported.
                    enum:
                        - git
                    type: string
                localDirectory:
                    description: Absolute local Git repository directory accessible to the worker
                    type: string
                noLocalCommits:
                    description: Whether the repository at localDirectory has no commits, so a clone of it yields nothing and the base commit this source was resolved against exists only as objects the client holds. The client can only deliver it by push, and can still deliver it later.
                    type: boolean
                noLocalGitDirectory:
                    description: Whether localDirectory has no Git directory of its own at localDirectory/.git — a linked worktree or submodule checkout, whose .git is a file naming a Git directory elsewhere — so there is nothing at that path a sandbox's origin can be bound to. The client can only deliver it by push, and can still deliver it later.
                    type: boolean
                noLocalRepository:
                    description: Whether localDirectory holds no Git repository at all, so nothing can be cloned from it however reachable it is. The client resolved this source from a repository of its own and can only deliver it by push. localDirectory still records the directory the source came from.
                    type: boolean
                purpose:
                    description: What the source is in the sandbox for. work, the default, is a source being worked on. skills is a repository whose skills the sandbox links into the harness's skill directories on its first launch, from the directories skillsSources names; it is never the primary source.
                    enum:
                        - work
                        - skills
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                upstreamUrl:
                    description: Network URL of a local source's remote on the client. It is the remote its checked-out branch tracks, else origin, else its only remote. A cache-delivered source has it as the sandbox's origin remote, and it names the pool cache the source is delivered into. A source delivered before that has it as a remote named upstream.
                    type: string
                url:
                    description: Remote Git source URL
                    format: uri
                    type: string
                workspace:
                    $ref: '#/components/schemas/GitSourceWorkspace'
                    description: Workspace materialization mode for this source
            required:
                - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    description: Immutable commit SHA to materialize
                    type: string
                refName:
                    description: User-facing branch, tag, or ref name to recreate in the sandbox
                    type: string
                refType:
                    description: User-facing ref type, such as branch, tag, or commit
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    description: Directory where this source should be placed inside the sandbox
                    type: string
                workingDirectory:
                    description: Working directory inside the sandbox for this source
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    description: Commit to checkout before applying dirty workspace snapshot changes
                    type: string
                mode:
                    default: clean
                    description: Whether to materialize a clean checkout or restore dirty workspace changes
                    enum:
                        - clean
                        - dirty
                    type: string
                snapshotRef:
                    description: Discobox-owned hidden Git ref containing dirty workspace snapshot data
                    type: string
            type: object
        AppliedSourceCommit:
            additionalProperties: false
            description: Records one successful discobox apply of a source's commits into a host working tree. Client-declared provenance, like Origin, since the server cannot observe host-side Git state.
            properties:
                appliedAt:
                    description: When this apply was recorded
                    format: date-time
                    type: string
                commit:
                    description: Newest sandbox-side commit SHA that was cherry-picked
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                hostCommit:
                    description: Resulting host-side commit SHA. A new object distinct from commit, since cherry-picking onto a different parent always produces a new SHA.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                hostId:
                    description: Stable host identity of the client that performed the apply
                    type: string
                hostPath:
                    description: Absolute path on that host the commits were applied into
                    type: string
                slug:
                    description: Slug of the GitSource these commits were applied from
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
            required:
                - slug
                - commit
                - hostCommit
                - hostId
                - hostPath
                - appliedAt
            type: object

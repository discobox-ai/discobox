                    description: Time the current or last attempt started
                    format: date-time
                    type: string
                completedAt:
                    description: Time the job reached a terminal state
                    format: date-time
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:

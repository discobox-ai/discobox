                name:
                    description: Display name
                    type: string
                provider:
                    description: Authentication provider
                    type: string
                subject:
                    description: Provider subject identifier
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - email
                - provider
                - subject
                - createdAt
                - updatedAt
            type: object
        CreateSSHKeyBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSSHKeyBody.json
                    format: uri
                    readOnly: true
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                publicKey:
                    description: An authorized_keys(5) public key line
                    type: string
            required:
                - publicKey
            type: object
        ListSSHKeysBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSSHKeysBody.json
                    format: uri
                    readOnly: true
                    type: string
                sshKeys:
                    items:
                        $ref: '#/components/schemas/SSHKey'
                    type: array
            required:
                - sshKeys
            type: object
        SSHKey:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHKey.json
                    format: uri
                    readOnly: true
                    type: string
                comment:
                    description: Trailing comment from the public key line
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    description: Principal ID that enrolled this key
                    type: string
                fingerprint:
                    description: SHA256 fingerprint of the public key
                    type: string
                id:
                    description: Stable SSH key ID
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                projectId:
                    description: Project ID
                    type: string
                publicKey:
                    description: Normalized authorized_keys(5) public key line (type and base64 blob only)
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - publicKey
                - fingerprint
                - createdAt
                - updatedAt
            type: object
        SSHIngress:
            additionalProperties: false
            description: How SSH clients reach this server's SSH ingress. Discovered rather than assumed, so a client never hard-codes a port and an operator can move the endpoint.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHIngress.json
                    format: uri
                    readOnly: true
                    type: string
                address:
                    description: 'The host:port SSH clients should dial, parseable by net.SplitHostPort. This is the advertised endpoint, not the bind address: it may name a load balancer, a port mapping, or a tunnel in front of the server. Absent when SSH is not enabled.'
                    type: string
                enabled:
                    description: Whether this server has an SSH ingress at all. It is opt-in, so false is a normal answer rather than an error.
                    type: boolean
                hostKey:
                    description: The server's SSH host public key as an authorized_keys(5)-shaped "type base64" line, for a known_hosts entry. Absent when SSH is not enabled.
                    type: string
            required:
                - enabled
            type: object
info:
    title: Discobox Sandbox Manager
    version: 0.1.0
openapi: 3.1.1
paths:
    /projects/{projectId}/jobs:
        get:
            operationId: list-jobs
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListJobsBody'
                    description: Jobs
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List jobs for a project
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}:
        get:
            operationId: get-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get a job
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}/force:
        post:
            operationId: force-job
            parameters:

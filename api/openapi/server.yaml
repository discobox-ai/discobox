                    type: object
                image:
                    description: The manifest file of the template with no image this sandbox runs, when its harness is one. Absent on a sandbox on a harness bundle, which runs its provider's image with its bundles applied and is pinned to no image.
                    type: string
                imageDigest:
                    description: Digest of the manifest file this sandbox is pinned to. Written at create and by an upgrade, never by a restart.
                    type: string
                bundle:
                    description: The harness bundle this sandbox is pinned to (ADR 26-10-16-423 §7). Written at create and by an upgrade, and for a stopped sandbox when its harness config's bundle moves.
                    type: string
                bundleDigest:
                    description: Manifest digest of the harness bundle this sandbox is pinned to.
                    type: string
                harnessManifestDigest:
                    description: Digest of the manifest composed from its harness bundle's labels on the platform's layer, which its container is built with. Pinned with the bundle; a moved one rebuilds the container as a moved bundle does.

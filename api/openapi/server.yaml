            type: object
        Pool:
            # Response fields may differ across releases selected by the CLI.
            # Leave unknown fields ignorable, including retired staging fields.
            properties:
                egress:
                    $ref: '#/components/schemas/EgressPolicy'
                    description: The pool's egress policy level (ADR 26-10-01-032). Its denyByDefault restricts every discobox in the pool; its allow list is added to each restricted one's.
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Pool.json
                    format: uri
                    readOnly: true
                    type: string
                cpuVcpus:
                    description: vCPUs for the pool's VM. Only a provider that sizes a VM per pool accepts it; zero leaves the size to the provider's configuration, then the host.
                    format: double
                    type: number
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                id:
                    description: Stable pool ID
                    type: string
                imageKind:
                    description: "The kind of image the pool runs: oci, or vm/<driver> for VM images of that driver. Declared by its agent; empty until the agent first reports."
                    type: string
                memoryBytes:
                    description: Memory for the pool's VM in bytes. Only a provider that sizes a VM per pool accepts it; zero leaves the size to the provider's configuration, then the host.
                    format: int64
                    type: integer
                name:
                    description: Pool display name
                    maxLength: 200
                    type: string
                platform:
                    description: The one platform the pool hosts, as os/arch, declared by its agent. Empty until the agent first reports.
                    pattern: ^[a-z0-9]+/[a-z0-9]+$
                    type: string
                projectId:
                    description: Project ID
                    type: string
                providerInstance:
                    $ref: '#/components/schemas/SandboxProviderInstance'
                    description: Backing sandbox provider instance
                providerInstanceId:
                    description: Backing sandbox provider instance ID. Immutable after create.
                    type: string
                storageBytes:
                    description: Storage for the pool in bytes. Only a provider that acts on it accepts it, and none does today; zero is unset.
                    format: int64
                    type: integer
                health:
                    description: Current agent health, derived from status reports received since this server started. Independent of runtime reconciliation. Defaults to unknown when omitted by an older server.
                    enum: [unknown, ready, not_ready, offline]
                    default: unknown
                    type: string
                ready:
                    description: Whether the pool host is alive and healthy
                    type: boolean
                schedulable:
                    description: Whether the pool accepts new sandboxes
                    type: boolean
                degraded:
                    description: Whether the pool should be used only as fallback capacity
                    type: boolean
                hostCredential:
                    $ref: '#/components/schemas/PoolHostCredential'
                provisionProgress:
                    $ref: '#/components/schemas/PoolProvisionProgress'
                provisionProgressAt:
                    description: When provisionProgress was observed
                    format: date-time
                    type: string
                availableCpuVcpus:
                    description: Agent-reported available CPU capacity in vCPUs
                    format: double
                    type: number
                availableMemoryBytes:
                    description: Agent-reported available memory capacity in bytes
                    format: int64
                    type: integer
                availableStorageBytes:
                    description: Agent-reported available storage capacity in bytes
                    format: int64
                    type: integer
                conditions:
                    description: Opaque agent-reported condition details for display
                resources:
                    additionalProperties: true
                    description: |
                        What this pool is consuming as of its last resource report (see
                        PoolResourceReport for the shape). Telemetry, not a scheduling input -
                        placement reads the available* fields above.

                        Carried as an open object on purpose. It is written by whatever agent
                        version a pool happens to be running, so a server that validated it
                        strictly would fail every read of the pool during a rolling upgrade,
                        for a field nothing schedules on. A reader decodes it into
                        PoolResourceReport and treats a decode failure as "not reported yet",
                        which the next report heals.
                    nullable: true
                    type: object
                resourcesReportedAt:
                    description: When resources was reported
                    format: date-time
                    type: string
                desiredState:
                    description: Requested existence, the same vocabulary every orchestrated resource uses
                    enum:
                        - present
                        - deleted
                    type: string
                state:
                    description: Observed pool state
                    enum:
                        - pending
                        - registering
                        - active
                        - offline
                        - failed
                        - deleted
                    type: string
                stateChangedAt:
                    description: When state last changed to its current value
                    format: date-time
                    type: string
                generation:
                    description: Latest spec generation
                    format: int64
                    type: integer
                observedGeneration:
                    description: Latest generation the reconciler has finished acting on
                    format: int64
                    type: integer
                errorMessage:
                    description: Latest error message
                    type: string
                keyType:
                    description: Pool agent key type
                    type: string
                publicKey:
                    description: Pool agent public key
                    type: string
                registeredAt:
                    description: Registration timestamp
                    format: date-time
                    type: string
                lastSeenAt:
                    description: Last heartbeat timestamp
                    format: date-time
                    type: string
                revokedAt:
                    description: Revocation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - providerInstanceId
                - cpuVcpus
                - memoryBytes
                - storageBytes
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
                - desiredState
                - state
                - generation
                - observedGeneration
                - createdAt
                - updatedAt
            type: object

    /projects/{projectId}/harness-configs/{harnessConfigId}/configure:
        post:
            description: |-
                Launch the harness's interactive configure flow and return the ephemeral sandbox running it.
                The caller attaches to the returned sandbox's primary terminal. The server watches that terminal:
                on exit 0 it reads /run/discobox/configure/harness-configure.json from the sandbox, applies the secrets and
                files it declares, and marks the harness configured; on a non-zero exit the harness is left
                unconfigured and configureError is set. The sandbox is deleted either way.
                Re-running configure on an already configured harness is allowed.
            operationId: configure-harness-config
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Harness config ID
                  in: path
                  name: harnessConfigId
                  required: true
                  schema:
                    description: Harness config ID
                    type: string
            responses:
                202:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Sandbox'
                    description: Accepted
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Run a harness config's configure flow
            tags:
                - Harness Configs
    /projects/{projectId}/harness-configs/{harnessConfigId}/configure/attach:
        post:
            description: |-
                Prepare the in-flight configure sandbox for attach, then attach to its primary terminal.
                This seeds the previous configuration into the sandbox at a well-known path so the harness's
                configure command may pre-fill from it; only the secrets a previous configure of this harness
                config created, bound on it, are included. The configure command is not launched until the primary terminal is attached, so
                seeding always precedes it. Call this before attaching to exec id "primary".
            operationId: attach-harness-config-configure
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Harness config ID
                  in: path
                  name: harnessConfigId
                  required: true
                  schema:
                    description: Harness config ID
                    type: string
            responses:
                204:
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Seed the configure sandbox before attaching
            tags:
                - Harness Configs
    /projects/{projectId}/harness-configs/{harnessConfigId}/configure/commit:
        post:
            description: |-
                Finish the in-flight configure flow. The server verifies the configure command exited 0, reads the
                result it wrote, applies the declared secrets and files to the harness config, and marks it
                configured. A non-zero exit leaves the harness unconfigured with configureError set. The ephemeral
                configure sandbox is deleted either way.
            operationId: commit-harness-config-configure
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Harness config ID
                  in: path
                  name: harnessConfigId
                  required: true
                  schema:
                    description: Harness config ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HarnessConfig'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Commit a harness config's configure flow
            tags:
                - Harness Configs
    /projects/{projectId}/harness-configs/{harnessConfigId}/deconfigure:
        post:
            description: |-
                Remove the assets the configure flow created for this harness — the secrets it created and their
                bindings, plus the files it wrote — and mark the harness unconfigured. The image-declared baseline
                is left intact.
            operationId: deconfigure-harness-config
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Harness config ID
                  in: path
                  name: harnessConfigId
                  required: true
                  schema:
                    description: Harness config ID
                    type: string
            responses:

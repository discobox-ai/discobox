                    type: string
                sentinel:
                    description: Stable sentinel bound to the sandbox. The pool agent translates its own ephemeral sentinels back to this one before resolving; it is never injected into the sandbox.
                    type: string
                uses:
                    description: Approved uses
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
            required:
                - name
                - envVar
                - host
                - secretId
                - grantId
                - sentinel
            type: object
        ListSandboxCredentialsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxCredentialsResponse.json
                    format: uri
                    readOnly: true
                    type: string
                credentials:
                    items:
                        $ref: '#/components/schemas/SandboxCredential'
                    type: array
            required:
                - credentials
            type: object
        CreateSandboxCredentialRequestBody:
            additionalProperties: false
            description: An agent's ask, relayed by the pool agent on behalf of one of its sandboxes.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxCredentialRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                envVar:
                    description: Environment variable the credential is wanted in
                    type: string
                host:
                    description: Destination host the credential will be sent to. Required, because approving this request may not mint a host-unscoped grant.
                    type: string
                justification:
                    description: Why the agent says it needs the credential
                    type: string
                name:
                    description: Credential name the agent asked for
                    type: string
                sandboxId:
                    description: Sandbox the agent is running in
                    type: string
                uses:
                    description: Uses the agent asks for
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    type: array
            required:
                - sandboxId
                - name
                - envVar
                - host
                - uses
            type: object
        SandboxCredentialRequestStatus:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxCredentialRequestStatus.json
                    format: uri
                    readOnly: true
                    type: string
                requestId:
                    description: Request ID to poll
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - granted
                        - denied
                    type: string
                uses:
                    description: Approved uses; present once granted, and authoritative over the requested ones
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
            required:
                - requestId
                - status
            type: object
        RecordCredentialVerdictBody:
            additionalProperties: false
            description: A judge's verdict about one command run under an agent credential use, relayed by the pool agent on behalf of one of its sandboxes (ADR 0091). Carried on the same call that takes a value, so a credential cannot be issued without a record of why; sent on its own when the judge refused and no value was ever taken.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/RecordCredentialVerdictBody.json
                    format: uri
                    readOnly: true
                    type: string
                command:
                    description: The argv the judge was shown
                    items:
                        type: string
                    type: array
                sandboxId:
                    description: Sandbox the command ran in
                    type: string
                useId:
                    description: Approved use the command was judged against
                    type: string
                verdict:
                    $ref: '#/components/schemas/AgentCredentialVerdict'
                volunteered:
                    description: True when the judge refused and this report is the only record of it, because the use call this would otherwise ride never happened
                    type: boolean
            required:
                - sandboxId
                - useId
                - verdict
                - volunteered
            type: object
        AgentCredentialVerdict:
            additionalProperties: false
            description: What a judge decided about one command, and what it was given to decide from.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AgentCredentialVerdict.json
                    format: uri
                    readOnly: true
                    type: string
                allow:
                    description: True if the judge allowed the command
                    type: boolean
                latencyMs:
                    description: How long the judge took to answer, in milliseconds
                    format: int64
                    type: integer
                prompt:
                    description: The exact prompt the judge was given, including the facts block
                    type: string
                reason:
                    description: The judge's own sentence, addressed to the agent that asked
                    type: string
                role:
                    description: The role discobox-prompt was asked for (e.g. "judge"), never a vendor model id
                    type: string
            required:
                - allow
                - role
                - prompt
            type: object
        ResolveSandboxSecretResponse:
            additionalProperties: false
            description: Result of resolving a sentinel. The value is present only when status is approved.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ResolveSandboxSecretResponse.json
                    format: uri
                    readOnly: true
                    type: string
                status:
                    description: Resolution status.
                    enum:
                        - approved
                        - pending
                        - denied
                    type: string
                value:
                    description: Real secret value; present only when status is approved.
                    type: string
                expiresAt:
                    description: Grant expiry time when approved.
                    format: date-time
                    type: string
            required:
                - status
            type: object
        SandboxUpgrade:
            additionalProperties: false
            description: |-
                Availability of a newer harness image for this sandbox. Derived at read time by
                comparing the sandbox's pinned image digest to its harness config's current one;
                it is never stored. Absent when the sandbox pins no digest (the default image, or
                a sandbox created before pinning existed).
            properties:
                available:
                    description: Whether the harness config now resolves to a different image than this sandbox is pinned to
                    type: boolean
                currentImage:
                    description: Image reference this sandbox is running
                    type: string
                currentImageDigest:
                    description: Config digest this sandbox is pinned to. Not a manifest digest; it matches what a local Docker daemon reports as an image ID.
                    type: string
                reason:
                    description: Why an upgrade is available
                    enum:
                        - imageDigestChanged
                    type: string
                targetImage:
                    description: Image reference this sandbox's harness config resolves to now
                    type: string
                targetImageDigest:
                    description: Config digest an upgrade would pin this sandbox to
                    type: string
            required:
                - available
            type: object
        SandboxRuntime:
            additionalProperties: false
            properties:
                agentStatus:
                    additionalProperties: true
                    description: Latest sandbox-agent-reported git/session/connection status, pushed periodically by the hosting pool-agent
                    nullable: true
                    type: object
                agentStatusObservedAt:
                    description: When agentStatus was observed by sandbox-agent
                    format: date-time
                    type: string
                resources:
                    additionalProperties: true
                    description: |
                        What this sandbox is consuming, computed by the hosting pool agent (see
                        SandboxResourceConsumption for the shape). Its cpu.vcpus is comparable
                        with the other sandboxes in the same pool, which were differenced over
                        the same tick, and only with those.

                        An open object for the same reason as Pool.resources: agent-written
                        telemetry must not be able to fail the read of the resource carrying it.
                    nullable: true
                    type: object
                resourcesObservedAt:
                    description: When resources was observed
                    format: date-time
                    type: string
                provisionProgress:
                    $ref: '#/components/schemas/SandboxProvisionProgress'
                provisionProgressAt:
                    description: When provisionProgress was observed
                    format: date-time
                    type: string
                appliedCommits:
                    description: History of successful discobox apply runs that landed this sandbox's commits on a host, most recent last. Client-reported; append-only.
                    items:
                        $ref: '#/components/schemas/AppliedSourceCommit'
                    nullable: true
                    type: array
                desiredState:
                    description: |-
                        Requested existence. Power state is not requested: whether a sandbox is running is
                        observed and reported by its runtime, never asked for by the control plane
                        (ADR 0017 §9). Archived is a third form of existence — as data, with no
                        container — not a power state (ADR 0022 §1).
                    enum:
                        - present
                        - archived
                        - deleted
                    type: string
                displayState:
                    description: |-
                        User-facing lifecycle state, composed from the existence state, the runtime state,
                        and whether the existence generations agree (ADR 0034 §5). This is the field
                        clients should read: it is the one answer to "what is this sandbox doing".
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                        - archiving
                        - archived
                        - deleting
                        - deleted
                        - error
                    readOnly: true
                    type: string
                errorMessage:
                    description: Error from the generation currently recorded in observedGeneration. Cleared by every accepted intent.
                    type: string
                generation:
                    description: Latest spec generation
                    format: int64
                    type: integer
                lastActiveAt:
                    description: Last observed activity timestamp
                    format: date-time
                    type: string
                observedGeneration:
                    description: Latest generation the reconciler has finished acting on
                    format: int64
                    type: integer
                runtimeState:
                    description: |-
                        Observed power state: what the container is doing, as reported by the pool agent
                        hosting it, which is the only component that can see it. Absent until an agent has
                        reported on this sandbox, which is not the same as `stopped` (ADR 0034 §2).
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                    type: string
                runtimeStateChangedAt:
                    description: When runtimeState last changed to its current value
                    format: date-time
                    type: string
                state:
                    description: |-
                        Existence state, written only by the reconciler: whether the sandbox's container has
                        been converged against its spec. `ready` means it has. What that container is doing
                        is a separate field, runtimeState (ADR 0034 §1).
                    enum:
                        - pending
                        - awaiting_source
                        - ready
                        - archived
                        - deleted
                        - failed
                    type: string
                stateChangedAt:
                    description: When state last changed to its current value
                    format: date-time
                    type: string
                stateReportedAt:
                    description: |-
                        When the hosting pool agent last reported this sandbox's runtime state. A runtime
                        state whose report is old is one nobody has confirmed recently.
                    format: date-time
                    type: string
                upgrade:
                    "$ref": "#/components/schemas/SandboxUpgrade"
            required:
                - desiredState
                - state
                - generation
                - observedGeneration
            type: object
        Sandbox:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Sandbox.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfig:
                    $ref: '#/components/schemas/HarnessConfig'
                    description: Harness config
                config:
                    $ref: '#/components/schemas/SandboxConfig'
                    description: Desired sandbox configuration.
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/User'
                    description: Creating user
                createdByUserId:
                    description: Creating user ID
                    type: string
                displayName:
                    description: |-
                        Name to show for this sandbox in a listing, computed by the server so every
                        client shows the same one: the window title the primary terminal last set,
                        the sandbox's configured name until one has, and the sandbox ID if it has
                        no name either. The title is what the harness says the work is about,
                        which tells two sandboxes apart better than two generated names do.
                    type: string
                id:
                    description: Stable sandbox ID
                    type: string
                origin:
                    $ref: '#/components/schemas/Origin'
                    description: Client host and project directory the sandbox was created from. Immutable after create.
                projectId:
                    description: Project ID
                    type: string
                pool:
                    $ref: '#/components/schemas/Pool'
                    description: Pool the sandbox is scheduled into
                poolId:
                    description: Pool the sandbox is scheduled into. Resolved at create, immutable after.
                    type: string
                runtime:
                    $ref: '#/components/schemas/SandboxRuntime'
                    description: Observed sandbox runtime state.
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - createdByUserId
                - displayName
                - config
                - runtime
                - createdAt
                - updatedAt
            type: object
        SandboxUser:
            additionalProperties: false
            description: |-
                Run identity and group membership. Every field is optional; omitting the
                whole object means the image's own user (ADR 0025 §5). On sandbox create
                this defines the sandbox.json default user, and on exec create it
                overrides that user for one exec — the same fields mean the same thing at
                both layers.
            properties:
                additionalGroups:
                    description: |-
                        Supplementary groups, each a group name or a numeric GID, resolved inside
                        the sandbox. All-or-nothing, never merged: omit to inherit the sandbox's
                        groups, or name any to run with exactly those (ADR 0025 §2).
                    items:
                        type: string
                    type: array
                gid:
                    description: Primary group ID to use inside the sandbox. Mutually exclusive with groupName.
                    format: int64
                    type: integer
                groupName:
                    description: |-
                        Primary group name to use inside the sandbox, resolved against the image's
                        /etc/group. Mutually exclusive with gid.
                    type: string
                homeDirectory:
                    description: User home directory to use inside the sandbox
                    type: string
                name:
                    description: Username to use inside the sandbox
                    type: string
                uid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
            type: object
        SandboxGitIdentity:
            additionalProperties: false
            description: |-
                Git authorship identity for work done inside the sandbox. Both fields are
                optional; omitting the whole object leaves the sandbox's git identity
                unconfigured, exactly as an image ships it (ADR 0042 §3).

                This is authorship, not run identity — see SandboxUser for the account a
                process runs as. The two are independent: a sandbox running as the image's
                own user still commits as the caller, and a sandbox with a named run user
                may have no git identity to give.

                Boot seeds each key into the sandbox user's ~/.gitconfig only where git
                resolves no value for it already, so an identity configured inside the
                sandbox is never overwritten and each key is decided independently
                (ADR 0042 §4).
            properties:
                userEmail:
                    description: Value for git's user.email inside the sandbox.
                    type: string
                userName:
                    description: Value for git's user.name inside the sandbox.
                    type: string
            type: object
        SandboxProviderCatalogItem:
            additionalProperties: false
            properties:
                capabilities:
                    $ref: '#/components/schemas/ProviderStatus'
                    description: Provider capabilities/status
                configFields:
                    description: Provider config fields
                    items:
                        $ref: '#/components/schemas/ProviderConfigField'
                    nullable: true
                    type: array
                description:
                    description: Provider description
                    type: string
                icon:
                    description: Provider icon
                    type: string
                id:
                    description: Provider type ID
                    type: string
                name:
                    description: Provider display name
                    type: string
            required:
                - id
                - name
                - capabilities
            type: object
        SandboxProviderInstance:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxProviderInstance.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                id:
                    description: Stable provider instance ID
                    type: string
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                pools:
                    description: Pools backed by this provider instance
                    items:
                        $ref: '#/components/schemas/Pool'
                    nullable: true
                    type: array
                type:
                    description: Provider type
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - type
                - name
                - disabled
                - createdAt
                - updatedAt
            type: object
        AssignSandboxHarnessSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AssignSandboxHarnessSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfigId:
                    description: Harness config whose bound secrets should be assigned to the sandbox for a per-invocation run.
                    type: string
            required:
                - harnessConfigId
            type: object
        SandboxHarnessSecretsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxHarnessSecretsResponse.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    additionalProperties:
                        type: string
                    description: Environment variable name to sentinel placeholder. Inject these into the exec/terminal environment; the proxy swaps them for real values on egress.
                    type: object
            required:
                - secrets
            type: object
        ApproveSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ApproveSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; overrides the secret's default
                    format: int64
                    type: integer
                host:
                    description: Host the minted grant is limited to. Defaults to the host the request named. Approving a protocol-originated request with no host at all is rejected; a wildcard grant stays an explicit administrative act.
                    type: string
                scope:
                    description: How widely the minted grant applies. Defaults to sandbox for sandbox-originated requests, otherwise project.
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                secretId:
                    description: Secret ID selected by the approver
                    type: string
                uses:
                    description: Approved uses for a protocol-originated request, replacing the ones the agent asked for. Omit to approve the requested uses as written. Use IDs are always minted here and any supplied ones are ignored.
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
            required:
                - secretId
            type: object
        CreateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                maxGrantTTLSeconds:
                    description: Longest a grant on this secret may live, in seconds; 0 allows grants that never expire
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                type:
                    description: Secret type
                    enum:
                        - token
                        - oauth
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            required:
                - name
                - type
                - value
            type: object
        CreateSecretGrantBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretGrantBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; defaults to the secret's default. 0 never expires.
                    format: int64
                    type: integer
                host:
                    description: Host the grant is limited to; empty matches any host and defaults to the secret's host
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against (sandbox ID or harness config ID). Defaults to the project ID for project scope.
                    type: string
                secretId:
                    description: Secret ID to grant
                    type: string
                envVar:
                    description: Environment variable an agent receives the credential in, for a grant carrying uses. Required with uses, and meaningless without them -- the credential is never injected, so this names the variable only for the process the CLI wraps.
                    type: string
                uses:
                    description: Approved uses, making this a credential only the agent credentials CLI can take, one use at a time. Sandbox scope only, a concrete host required, and use IDs are minted here -- a supplied one is ignored.
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
            required:
                - secretId
                - scope
            type: object
        CreateSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                host:
                    description: Optional host hint used to match a secret (e.g. github.com)
                    type: string
                type:
                    description: Secret type being requested
                    enum:
                        - token
                        - oauth
                    type: string
            required:
                - type
            type: object
        ListSecretRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretRequests:
                    items:
                        $ref: '#/components/schemas/SecretRequest'
                    type: array
            required:
                - secretRequests
            type: object
        ListSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    items:
                        $ref: '#/components/schemas/Secret'
                    type: array
            required:
                - secrets
            type: object
        Secret:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Secret.json
                    format: uri
                    readOnly: true
                    type: string
                anonymous:
                    description: Sandbox-managed secret created from an inline value; referenced only by ID
                    type: boolean
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                maxGrantTTLSeconds:
                    description: Longest a grant on this secret may live, in seconds; 0 allows grants that never expire
                    format: int64
                    type: integer
                format:
                    description: Generative format template describing the credential shape; used to mint sentinel placeholders
                    type: string
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                id:
                    description: Stable secret ID
                    type: string
                oauth:
                    "$ref": '#/components/schemas/SecretOAuth'
                name:
                    description: Secret name
                    type: string
                projectId:
                    description: Project ID
                    type: string
                type:
                    description: Secret type
                    enum:
                        - token
                        - oauth
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - type
                - maxGrantTTLSeconds
                - createdAt
                - updatedAt
            type: object
        SecretUse:
            additionalProperties: false
            description: One approved way a credential may be used. The ID is minted at approval, so a requesting agent cannot name the use it will later present.
            properties:
                description:
                    description: What the credential may be used for
                    type: string
                useId:
                    description: Stable use ID, minted at approval
                    type: string
            required:
                - description
            type: object
        SecretGrant:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretGrant.json
                    format: uri
                    readOnly: true
                    type: string
                envName:
                    description: Environment variable an agent receives the credential in; set on a grant that carries uses.
                    type: string
                uses:
                    description: Approved uses, confirmed or edited at approval time. Present on grants minted through the agent credentials flow.
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                expiresAt:
                    description: Expiry time; empty never expires
                    format: date-time
                    type: string
                grantedAt:
                    description: When the grant was created
                    format: date-time
                    type: string
                grantedBy:
                    description: Principal ID that created the grant
                    type: string
                host:
                    description: Host the grant is limited to; empty matches any host
                    type: string
                id:
                    description: Stable grant ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against
                    type: string
                secretId:
                    description: Granted secret ID
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - secretId
                - scope
                - scopeKey
                - grantedAt
                - createdAt
                - updatedAt
            type: object
        ListSecretGrantsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretGrantsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretGrants:
                    items:
                        $ref: '#/components/schemas/SecretGrant'
                    type: array
            required:
                - secretGrants
            type: object
        SecretRequest:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretRequest.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                envName:
                    description: Environment variable the credential is wanted in, for protocol-originated requests
                    type: string
                grantId:
                    description: Grant that satisfied this request; set when approved
                    type: string
                host:
                    description: Host hint provided at request time
                    type: string
                id:
                    description: Stable request ID
                    type: string
                justification:
                    description: Why the agent says it needs the credential
                    type: string
                name:
                    description: Credential name the agent asked for, for protocol-originated requests
                    type: string
                uses:
                    description: Uses the agent asked for. Their presence is what marks a request as protocol-originated rather than one the proxy minted on hitting an unresolvable sentinel.
                    items:
                        $ref: '#/components/schemas/SecretUse'
                    nullable: true
                    type: array
                projectId:
                    description: Project ID
                    type: string
                requestedBy:
                    description: Principal ID of the requestor
                    type: string
                sandboxId:
                    description: Sandbox that owns the sentinel, for sandbox-originated requests
                    type: string
                secretId:
                    description: Matched secret ID; set when approved
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - approved
                        - denied
                    type: string
                type:
                    description: Secret type requested
                    enum:
                        - token
                        - oauth
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - requestedBy
                - type
                - status
                - createdAt
                - updatedAt
            type: object
        SecretValue:
            additionalProperties: false
            description: A credential value. One opaque string, plus what an OAuth credential needs to be refreshed. Write-only -- no response ever carries it.
            properties:
                accessTokenExpiresAt:
                    description: When the access token goes stale, unix milliseconds. 0 or absent means unknown, and the credential is then refreshed only when an upstream rejects it.
                    format: int64
                    type: integer
                clientId:
                    description: OAuth client the grant belongs to (type=oauth)
                    type: string
                refreshToken:
                    description: OAuth refresh token, spent server-side to renew the access token (type=oauth). Never returned.
                    type: string
                scopes:
                    description: What the grant may do, as the authorization server returned it. Recorded rather than assumed -- a client may gate features on it.
                    items:
                        type: string
                    nullable: true
                    type: array
                subscriptionType:
                    description: The plan or account kind the grant belongs to, when the authorization server names one
                    type: string
                token:
                    description: The credential itself (type=token), or an OAuth access token
                    type: string
                tokenUrl:
                    description: Where the refresh token is exchanged for a new access token (type=oauth)
                    type: string
            type: object
        SecretOAuth:
            additionalProperties: false
            description: What an OAuth credential is, without being it. Never the access token and never the refresh token.
            properties:
                accessTokenExpiresAt:
                    description: When the current access token goes stale, unix milliseconds; absent when unknown
                    format: int64
                    type: integer
                clientId:
                    description: OAuth client the grant belongs to
                    type: string
                refreshable:
                    description: Whether the credential carries what it needs to renew itself
                    type: boolean
                scopes:
                    description: What the grant may do, as captured at login
                    items:
                        type: string
                    nullable: true
                    type: array
                subscriptionType:
                    description: The plan or account kind the grant belongs to
                    type: string
                tokenUrl:
                    description: Where the access token is renewed
                    type: string
            type: object
        UpdateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                maxGrantTTLSeconds:
                    description: Longest a grant on this secret may live, in seconds; 0 allows grants that never expire
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            type: object
        StartSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StartSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force start if the provider supports it
                    type: boolean
            type: object
        StopSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/StopSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force stop if the provider supports it
                    type: boolean
            type: object
        StreamErrorEvent:
            additionalProperties: false
            properties:
                error:
                    type: string
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
                - error
            type: object
        UpdateHarnessConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateHarnessConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                configuredFiles:
                    description: Configure-flow files to write into the harness's home directory, replacing the current set
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                files:
                    description: Files to write into the harness's home directory when the harness is installed
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                name:
                    description: Harness config name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxUpdateConfig'
                    description: Desired sandbox configuration changes.
            type: object
        SandboxUpdateConfig:
            additionalProperties: false
            properties:
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
            type: object
        UpdateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
            type: object
        UpdatePoolStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UpdatePoolStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                availableCpuVcpus:
                    format: double
                    type: number
                availableMemoryBytes:
                    format: int64
                    type: integer
                availableStorageBytes:
                    format: int64
                    type: integer
                conditions: {}
                degraded:
                    type: boolean
                ready:
                    type: boolean
                schedulable:
                    type: boolean
            required:
                - ready
                - schedulable
                - degraded
                - availableCpuVcpus
                - availableMemoryBytes
                - availableStorageBytes
            type: object
        ReportPoolSandboxStatesBody:
            additionalProperties: false
            description: |-
                A batch of sandbox state observations from the pool agent hosting them (ADR 0017 §10).
                State is reported, never requested: the control plane records what the agent saw and
                never asks it to make a sandbox running.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ReportPoolSandboxStatesBody.json
                    format: uri
                    readOnly: true
                    type: string
                bootId:
                    description: |-
                        Identifies this run of the pool agent. Sequence numbers are only comparable within
                        one boot, because a restarted agent counts from zero again.
                    type: string
                complete:
                    description: |-
                        True when the batch is the periodic full sync: the reports are every sandbox the
                        agent hosts, so a sandbox the control plane believes is on this pool and that the
                        batch omits no longer has a container. A batch that is not complete is a transition
                        delta and says nothing about sandboxes it does not mention.
                    type: boolean
                reportedAt:
                    description: When the agent observed these states
                    format: date-time
                    type: string
                sequence:
                    description: Monotonic counter within bootId, so a delayed delta cannot overwrite a newer sync
                    format: int64
                    type: integer
                progress:
                    description: |-
                        Provisioning progress on sandboxes this agent hosts: work that is underway and has
                        no state transition to announce it, an image pull above all (ADR 0032). It is
                        always a delta and is unaffected by `complete`, which describes `states` only.
                    items:
                        $ref: '#/components/schemas/PoolSandboxProgress'
                    type: array
                states:
                    description: The observed sandbox states
                    items:
                        $ref: '#/components/schemas/PoolSandboxState'
                    type: array
            required:
                - bootId
                - sequence
                - reportedAt
                - complete
                - states
            type: object
        SandboxProvisionPhase:
            description: |-
                What a provisioning sandbox is being made to do right now, named for a client that
                is waiting to attach and wants to know what it is waiting for (ADR 0060). It is an
                observation and never a state: it decides nothing, and it is history the moment the
                phase ends. pulling_image is the phase that carries pull byte counts; the rest are
                named work with no denominator to report.
            enum:
                - pulling_image
                - preparing_volumes
                - materializing_source
                - creating_container
                - starting_container
                - waiting_for_agent
            type: string
        SandboxProvisionProgress:
            additionalProperties: false
            description: |-
                Work underway on a sandbox that has no state transition to announce it, reported by
                the hosting pool-agent (ADR 0032). A client waiting to attach reads this to say what
                it is waiting for. The phase always says what is happening; pull refines the one
                phase that can report how far in it is, because an image pull is the longest thing
                an attach waits behind.
            properties:
                phase:
                    $ref: '#/components/schemas/SandboxProvisionPhase'
                pull:
                    $ref: '#/components/schemas/SandboxPullProgress'
            required:
                - phase
            type: object
        PoolImageState:
            description: |-
                How far staging a pool's images has got. It is a condition and never a health
                state: a pool whose images are not staged is active, healthy and schedulable,
                because a sandbox that wants an image the host does not have pulls it then.
            enum:
                - staging
                - ready
                - failed
            type: string
        PoolImageStage:
            additionalProperties: false
            description: |-
                What image staging is doing on one pool, for a client that launched the server and
                is waiting out a first run. Nothing schedules on it.
            properties:
                state:
                    $ref: '#/components/schemas/PoolImageState'
                image:
                    description: The reference being pulled, absent between images
                    type: string
                done:
                    description: Images finished
                    type: integer
                total:
                    description: Images in the set
                    type: integer
                current:
                    description: Bytes downloaded of the image named above
                    format: int64
                    type: integer
                size:
                    description: Total bytes of the layers whose size has been reported. Grows while the manifest is walked, so current/size is a ratio at a moment and never a bar.
                    format: int64
                    type: integer
                layers:
                    description: Layers heard about so far
                    type: integer
                layersComplete:
                    description: Layers fully pulled, including those already present
                    type: integer
                error:
                    description: Why the last attempt failed. Staging retries on its own.
                    type: string
            required:
                - state
                - done
                - total
            type: object
        PoolProvisionPhase:
            description: |-
                What a pool host is being made to do right now, named for a client whose sandbox is
                waiting for a pool to take it and wants to know what it is waiting for (ADR 0060).
                It is the pool-shaped twin of SandboxProvisionPhase: an observation, never a state,
                and history the moment the phase ends.

                The work is the driver's, so the phases are the driver's: a VM backend fetches a
                disk image and boots a machine before any of it can run containers, and those are
                the minutes a first pool start is actually spent in. The two image phases carry
                pull byte counts; the rest are named work with no denominator to report.
            enum:
                - fetching_vm_image
                - starting_vm
                - waiting_for_docker
                - pulling_pool_image
                - starting_pool_agent
                - waiting_for_pool_agent
                - preloading_images
            type: string
        PoolProvisionProgress:
            additionalProperties: false
            description: |-
                Work underway on a pool host that has no state transition to announce it, reported
                by the provider driver doing it. A client waiting for a pool to take its sandbox
                reads this to say what it is waiting for.

                pull is the same shape a sandbox reports, and deliberately the same schema: an image
                pull is an image pull, a client renders both on one line the same way, and two
                shapes for it would be two renderers that drift.
            properties:
                phase:
                    $ref: '#/components/schemas/PoolProvisionPhase'
                pull:
                    $ref: '#/components/schemas/SandboxPullProgress'
            required:
                - phase
            type: object
        SandboxPullProgress:
            additionalProperties: false
            description: |-
                An image pull as a status line wants it. Both totals grow while the manifest is
                walked, so current/total is a ratio at a moment rather than progress toward a fixed
                target: a client must not render it as a bar that can only move forward.
            properties:
                current:
                    description: Bytes downloaded so far, across the layers reported
                    format: int64
                    type: integer
                done:
                    description: True on the final report for a pull that finished
                    type: boolean
                image:
                    description: Image reference being pulled
                    type: string
                layers:
                    description: Layers heard about so far, which grows as the manifest is walked
                    type: integer
                layersComplete:
                    description: Layers fully pulled, including layers already present on the host
                    type: integer
                total:
                    description: Total bytes of the layers whose size has been reported
                    format: int64
                    type: integer
            required:
                - image
            type: object
        PoolSandboxProvisionPhase:
            description: |-
                What the pool agent is doing to a sandbox right now. It is the agent-facing twin of
                SandboxProvisionPhase and must carry the same values; the two are separate schemas
                because they are separate contracts, and a test pins them to each other.
            enum:
                - pulling_image
                - preparing_volumes
                - materializing_source
                - creating_container
                - starting_container
                - waiting_for_agent
            type: string
        PoolSandboxProgress:
            additionalProperties: false
            description: |-
                Progress on one sandbox that is being provisioned. It is deliberately not a
                PoolSandboxState: a state observation always carries an observed state, and progress
                has none to report.
            properties:
                phase:
                    $ref: '#/components/schemas/PoolSandboxProvisionPhase'
                pull:
                    $ref: '#/components/schemas/PoolSandboxPullProgress'
                sandboxId:
                    description: Sandbox the progress is about
                    type: string
            required:
                - sandboxId
                - phase
            type: object
        PoolSandboxPullProgress:
            additionalProperties: false
            description: |-
                An image pull as a status line wants it rather than as the daemon reports it. Both
                totals grow while the manifest is walked, so current/total is a ratio at a moment
                rather than progress toward a fixed target.
            properties:
                current:
                    description: Bytes downloaded so far, across the layers reported
                    format: int64
                    type: integer
                done:
                    description: True on the final report for a pull that finished
                    type: boolean
                image:
                    description: Image reference being pulled
                    type: string
                layers:
                    description: Layers heard about so far, which grows as the manifest is walked
                    type: integer
                layersComplete:
                    description: Layers fully pulled, including layers already present on the host
                    type: integer
                total:
                    description: Total bytes of the layers whose size has been reported
                    format: int64
                    type: integer
            required:
                - image
            type: object
        PoolSandboxState:
            additionalProperties: false
            properties:
                sandboxId:
                    description: Sandbox the observation is about
                    type: string
                state:
                    description: |-
                        Observed runtime state. There is no `failed` here: a container that has exited looks
                        the same whether it was stopped deliberately or died, so failure is a judgement about
                        an operation rather than something the runtime can observe (ADR 0017 §10). For the
                        same reason a report carries no error message — why an operation failed is the
                        reconciler's verdict, and it owns the field that records one (ADR 0034 §7).
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                    type: string
            required:
                - sandboxId
                - state
            type: object
        SandboxAgentStatusEntry:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                status:
                    additionalProperties: true
                    description: Opaque sandbox-agent status payload (see SandboxAgentStatusResponse), relayed unmodified by pool-agent.
                    type: object
                observedAt:
                    format: date-time
                    type: string
            required:
                - sandboxId
                - status
                - observedAt
            type: object
        ReportSandboxAgentStatusBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ReportSandboxAgentStatusBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    description: Status reports for sandboxes this pool agent successfully polled this tick. Sandboxes that failed to poll are omitted, not reported as stale.
                    items:
                        $ref: '#/components/schemas/SandboxAgentStatusEntry'
                    type: array
            required:
                - sandboxes
            type: object
        MintSandboxAgentStatusTokensBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/MintSandboxAgentStatusTokensBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxIds:
                    description: Sandbox IDs this pool agent currently hosts and wants a status-read token for
                    items:
                        type: string
                    type: array
            required:
                - sandboxIds
            type: object
        SandboxAgentStatusToken:
            additionalProperties: false
            properties:
                expiresAt:
                    description: When this token expires
                    format: date-time
                    type: string
                sandboxId:
                    type: string
                token:
                    description: Bearer token scoped to status:read only, for calling this sandbox's status endpoint
                    type: string
            required:
                - sandboxId
                - token
                - expiresAt
            type: object
        MintSandboxAgentStatusTokensResponseBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/MintSandboxAgentStatusTokensResponseBody.json
                    format: uri
                    readOnly: true
                    type: string
                tokens:
                    items:
                        $ref: '#/components/schemas/SandboxAgentStatusToken'
                    type: array
            required:
                - tokens
            type: object
        User:
            additionalProperties: false
            properties:
                avatarUrl:
                    description: Avatar image URL
                    format: uri
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                email:
                    description: User email address
                    format: email
                    type: string
                id:
                    description: Stable user ID
                    type: string
                name:
                    description: Display name
                    type: string
                provider:
                    description: Authentication provider
                    type: string
                subject:
                    description: Provider subject identifier
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - email
                - provider
                - subject
                - createdAt
                - updatedAt
            type: object
        CreateSSHKeyBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSSHKeyBody.json
                    format: uri
                    readOnly: true
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                publicKey:
                    description: An authorized_keys(5) public key line
                    type: string
            required:
                - publicKey
            type: object
        ListSSHKeysBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSSHKeysBody.json
                    format: uri
                    readOnly: true
                    type: string
                sshKeys:
                    items:
                        $ref: '#/components/schemas/SSHKey'
                    type: array
            required:
                - sshKeys
            type: object
        SSHKey:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHKey.json
                    format: uri
                    readOnly: true
                    type: string
                comment:
                    description: Trailing comment from the public key line
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    description: Principal ID that enrolled this key
                    type: string
                fingerprint:
                    description: SHA256 fingerprint of the public key
                    type: string
                id:
                    description: Stable SSH key ID
                    type: string
                name:
                    description: Optional label for the key
                    type: string
                projectId:
                    description: Project ID
                    type: string
                publicKey:
                    description: Normalized authorized_keys(5) public key line (type and base64 blob only)
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - publicKey
                - fingerprint
                - createdAt
                - updatedAt
            type: object
        SSHIngress:
            additionalProperties: false
            description: What an SSH client needs to verify this server. There is no address to discover; SSH reaches the server over the same endpoint every other request uses, so the host key is the whole document.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SSHIngress.json
                    format: uri
                    readOnly: true
                    type: string
                hostKey:
                    description: The server's SSH host public key as an authorized_keys(5)-shaped "type base64" line, for a known_hosts entry.
                    type: string
            required:
                - hostKey
            type: object
info:
    title: Discobox Sandbox Manager
    version: 0.1.0
openapi: 3.1.1
paths:
    /projects/{projectId}/jobs:
        get:
            operationId: list-jobs
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListJobsBody'
                    description: Jobs
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List jobs for a project
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}:
        get:
            operationId: get-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get a job
            tags:
                - jobs
    /projects/{projectId}/jobs/{jobId}/force:
        post:
            operationId: force-job
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Job ID
                  in: path
                  name: jobId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Job'
                    description: Job
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Force a pending, scheduled, or backoff job to run immediately
            tags:
                - jobs
    /api/pools/register:
        post:
            operationId: register-pool
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterPoolBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterPoolResponseBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Register a bootstrapped pool agent
            tags:
                - Pools
    /api/pools/{poolId}/status:
        post:
            operationId: update-pool-status
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePoolStatusBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pool'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Update pool status
            tags:
                - Pools

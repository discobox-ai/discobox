        CreateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                defaultGrantTTLSeconds:
                    description: Default grant duration in seconds
                    format: int64
                    type: integer
                host:
                    description: Optional host used to match requests (e.g. github.com)
                    type: string
                name:
                    description: Secret name
                    maxLength: 200
                    type: string
                type:
                    description: Secret type
                    enum:
                        - git
                        - ssh
                        - bearer
                    type: string
                value:
                    $ref: '#/components/schemas/SecretValue'
            required:
                - name
                - type
                - value
            type: object
        CreateSecretGrantBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretGrantBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; defaults to the secret's default. 0 never expires.
                    format: int64
                    type: integer
                host:
                    description: Host the grant is limited to; empty matches any host and defaults to the secret's host
                    type: string
                scope:
                    description: How widely the grant applies
                    enum:
                        - sandbox
                        - harnessConfig
                        - project
                    type: string
                scopeKey:
                    description: Identifier the scope resolves against (sandbox ID or harness config ID). Defaults to the project ID for project scope.
                    type: string

        AssignSandboxHarnessSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AssignSandboxHarnessSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfigId:
                    description: Harness config whose bound secrets should be assigned to the sandbox for a per-invocation run.
                    type: string
            required:
                - harnessConfigId
            type: object
        SandboxHarnessSecretsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxHarnessSecretsResponse.json
                    format: uri
                    readOnly: true
                    type: string
                secrets:
                    additionalProperties:
                        type: string
                    description: Environment variable name to sentinel placeholder. Inject these into the exec/terminal environment; the proxy swaps them for real values on egress.
                    type: object
            required:
                - secrets
            type: object
        ApproveSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ApproveSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                routes:
                    description: Routes the binding is approved for, narrowing the secret's; omitted takes the routes the request asked for
                    items:
                        $ref: '#/components/schemas/SecretRouteInput'
                    type: array
                secretId:
                    description: Secret ID selected by the approver. A person must name one. A discobox approver answers with the secret of a delegate binding covering it, and names one only to choose among the secrets it was delegated.
                    type: string
                ttlSeconds:
                    description: How long the binding lasts, in seconds; omitted takes what the request asked for, else an hour, within the secret's limit and, for a discobox approving, the delegation's
                    format: int64
                    minimum: 0
                    type: integer
            type: object
        CreateSecretBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretBody.json
                    format: uri
                    readOnly: true
                    type: string
                exchange:
                    "$ref": '#/components/schemas/ExchangeRecipe'
                format:

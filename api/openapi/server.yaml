            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePoolStatusBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pool'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Update pool status
            tags:
                - Pools
    /api/pools/{poolId}/sandbox-states:
        post:
            operationId: report-pool-sandbox-states
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReportPoolSandboxStatesBody'
                required: true
            responses:
                204:
                    description: State report accepted or superseded by a newer one
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Report observed sandbox states from the pool agent
            tags:
                - Pools
    /api/pools/{poolId}/sandbox-agent-status:
        post:
            operationId: report-sandbox-agent-status
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReportSandboxAgentStatusBody'
                required: true
            responses:
                204:
                    description: Status batch accepted (entries for sandboxes this pool does not host are silently skipped)
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Report polled sandbox-agent status for one or more hosted sandboxes
            tags:
                - Pools
    /api/pools/{poolId}/sandbox-agent-status-tokens:
        post:
            operationId: mint-sandbox-agent-status-tokens
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer pool agent assertion signed with the registered pool agent private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer pool agent assertion signed with the registered pool agent private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MintSandboxAgentStatusTokensBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MintSandboxAgentStatusTokensResponseBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Mint short-lived, status-read-only sandbox-agent tokens for sandboxes this pool hosts
            tags:
                - Pools
    /api/pools/{poolId}/resolve-sandbox-secret:
        post:
            operationId: resolve-sandbox-secret
            parameters:
                - description: Pool ID
                  in: path
                  name: poolId
                  required: true
                  schema:
                    description: Pool ID
                    type: string
                - description: Bearer worker assertion with the secret:resolve scope
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer worker assertion with the secret:resolve scope
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveSandboxSecretBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveSandboxSecretResponse'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Resolve a sandbox sentinel secret
            tags:
                - Pools
    /projects:
        get:
            operationId: list-projects
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListProjectsBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: List projects
            tags:
                - Projects
        post:
            operationId: create-project
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateProjectBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Project'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Create a project
            tags:
                - Projects
    /projects/{projectId}:
        delete:
            operationId: delete-project
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
            responses:
                204:
                    description: No Content
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Delete a project
            tags:
                - Projects
        get:
            operationId: get-project
            parameters:
                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Project'
                    description: OK

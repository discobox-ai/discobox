        CreateSandboxCredentialRequestBody:
            additionalProperties: false
            description: An agent's ask, relayed by the pool agent on behalf of one of its sandboxes.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxCredentialRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                envVar:
                    description: Environment variable the credential is wanted in. Required to use it; a request to delegate it names none, since a delegation delivers nothing to the asking sandbox.
                    type: string
                grantTTLSeconds:
                    description: How long the agent asks the binding to last, in seconds, up to thirty days. A suggestion the approver starts from, not a term. 0 or absent asks for nothing in particular; forever cannot be asked for, and neither can a span longer than the ceiling.
                    format: int64
                    maximum: 2592000
                    minimum: 0
                    type: integer
                hosts:
                    description: Destination hosts the credential will be sent to (ADR 26-10-02-393), each shorthand for a route to that exact host and no host beneath it. Hosts and routes together name at least one destination, and each becomes a route of the binding approving the request makes, unless the approver names others.
                    items:
                        type: string
                    type: array
                routes:
                    description: "Routes the credential will be sent on, each in the typed form `[METHODS ]HOSTS[PATHS][ graphql=OPS[:FIELDS]][ mcp=TOOLS][=blocked]` (ADR 26-10-27-880 §4), such as `GET api.github.com/repos/o/r/**` or `api.github.com/graphql graphql=query`. A route that does not parse refuses the request."
                    items:
                        type: string
                    type: array
                purpose:
                    description: What the agent asks the credential for, one or the other and never both. use (the default) asks to use it. delegate asks to delegate it to other discoboxes; approving it makes a delegate binding, which delivers nothing to the asking discobox.
                    enum:
                        - use
                        - delegate
                    type: string
                justification:
                    description: Why the agent says it needs the credential
                    type: string
                name:
                    description: Credential name the agent asked for
                    type: string
                sandboxId:
                    description: Sandbox the agent is running in
                    type: string
            required:
                - sandboxId
                - name
            type: object
        SandboxCredentialRequestStatus:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxCredentialRequestStatus.json
                    format: uri
                    readOnly: true
                    type: string
                envVar:
                    description: The variable the credential is delivered in, once granted; absent for a delegation
                    type: string
                expiresAt:
                    description: When the binding lapses, as the approver chose it rather than as it was asked. Absent on a pending or denied request, and on a granted one whose binding never lapses.
                    format: date-time
                    type: string
                hosts:
                    description: Where the credential may be sent, once granted, as the approver chose
                    items:
                        type: string
                    type: array
                name:
                    description: The credential, once granted
                    type: string
                purpose:
                    description: What the request asks the credential for. A delegate binding lets the sandbox give the credential to the discoboxes it creates, and delivers nothing to the sandbox itself.
                    enum:
                        - use
                        - delegate
                    type: string
                requestId:
                    description: Request ID to poll
                    type: string
                status:
                    description: Request status
                    enum:
                        - pending
                        - granted
                        - denied
                    type: string
            required:
                - requestId
                - status
                - purpose
            type: object
        HTTPAuditExchange:
            additionalProperties: false
            description: One HTTP exchange a pool proxy audited. The method, URL and host are what a sandbox sent; headers and bodies stay on the pool. Recorded by the pool proxy from what crossed the wire, so the sandbox cannot alter the row.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HTTPAuditExchange.json
                    format: uri
                    readOnly: true
                    type: string
                blocked:
                    description: True when the proxy refused the request itself and never sent it -- by its destination policy, by a credential's routes, at the discobox API's gate, or because the control plane could not resolve a credential it carries. blockedReason says which, and why.
                    type: boolean
                blockedReason:
                    description: Why the request was refused. It starts with what refused it -- "host denied" for the destination policy, "route:" for a credential whose routes do not allow the request, "gate:" for the discobox API's gate, "credential unavailable:" for a credential the control plane could not resolve, "gateway:" for a gateway that could not set its headers -- then the reason.
                    type: string
                cacheHit:
                    description: True when the response came from the pool's response cache
                    type: boolean
                createdAt:
                    description: When the exchange was recorded
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the exchange took, in milliseconds
                    format: int64
                    type: integer
                host:
                    description: Destination host
                    type: string
                id:
                    description: Audit record ID, written http_<row>, unique within its pool and ordered by write. Pass it to get-http-audit or to the recording route.
                    pattern: ^http_[0-9]+$
                    type: string
                method:
                    description: HTTP method
                    type: string
                poolId:
                    description: Pool whose proxy recorded the exchange
                    type: string
                requestBodyBytes:
                    description: Size of the recorded request body
                    format: int64
                    type: integer
                responseBytes:
                    description: Size of the response body
                    format: int64
                    type: integer
                sandboxId:
                    description: Sandbox whose client certificate made the request. It may no longer exist.
                    type: string
                status:
                    description: Response status; zero when no response was received
                    type: integer
                swappedSecretIds:
                    description: Secrets whose values were swapped into this request, by ID, whatever kind of sentinel stood in for them. It is optional because a pool agent older than ADR 26-10-01-240 does not send it, and absent means no secret was named.
                    items:
                        type: string
                    type: array
                upgrade:
                    description: True for an upgraded (e.g. WebSocket) connection
                    type: boolean
                upgradeType:
                    description: The upgrade protocol
                    type: string
                url:
                    description: Request URL, with any swapped query value left as its sentinel
                    type: string
            required:
                - poolId
                - id
                - createdAt
                - sandboxId
                - method
                - url
                - host
                - status
                - blocked
            type: object

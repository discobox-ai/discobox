                        Job lifecycle state. `scheduled` is a reconciler-armed timer (a
                        retention or park deadline) with nothing wrong; `backoff` is a
                        failed reconcile waiting to retry, with `error` saying why.
                    enum:
                        - pending
                        - scheduled
                        - backoff
                        - running
                        - completed
                        - failed
                        - canceled
                    type: string
                attempts:
                    description: Consecutive failed attempts since the last success
                    type: integer
                error:
                    description: Error of the latest failed attempt; cleared once an attempt succeeds
                    type: string
                message:
                    description: Human-readable execution result or operator note
                    type: string
                metadata:
                    description: Structured execution result metadata
                workerId:
                    description: Dispatcher worker that claimed the current or last attempt
                    type: string
                resourceType:
                    description: Resource type this job acts on
                    type: string
                resourceId:
                    description: Resource ID this job acts on
                    type: string
                scheduledAt:
                    description: Earliest time the job may run
                    format: date-time
                    type: string
                startedAt:
                    description: Time the current or last attempt started
                    format: date-time
                    type: string
                completedAt:
                    description: Time the job reached a terminal state
                    format: date-time
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - type
                - status
                - attempts
                - resourceType
                - resourceId
                - scheduledAt
                - createdAt
                - updatedAt
            type: object

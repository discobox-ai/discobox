                        $ref: '#/components/schemas/ProviderConfigField'
                    nullable: true
                    type: array
                description:
                    description: Provider description
                    type: string
                icon:
                    description: Provider icon
                    type: string
                id:
                    description: Provider type ID
                    type: string
                name:
                    description: Provider display name
                    type: string
            required:
                - id
                - name
                - capabilities
            type: object
        SandboxProviderInstance:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxProviderInstance.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                id:
                    description: Stable provider instance ID
                    type: string
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                pools:
                    description: Pools backed by this provider instance

                host:
                    description: Destination host that answered.
                    type: string
                outcome:
                    description: What happened. `rejected` is a 401 with nothing different to retry with; `rejected-after-retry` is a 401 on a second, different credential too; `accepted` retracts a rejection reported earlier.
                    enum:

                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Sandbox ID
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    description: Sandbox ID
                    type: string

    /api/projects/{projectId}/sandboxes/{sandboxId}/runtime-config:
        get:
            description: Returns the runtime-config document the sandbox last applied - what the pool has told it it is (ADR 0126 §3). Only a token carrying the pool-only runtime-config scope may read it.
            operationId: get-sandbox-runtime-config
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxRuntimeConfig'
                    description: The document the sandbox applied.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response. 404 when the sandbox has applied none.
            summary: Get the runtime-config document the sandbox has applied.
            tags:
                - Sandbox Runtime Config
            x-sandbox-agent: true
        put:
            description: Delivers the pool's whole view of the sandbox as one revisioned document, which the sandbox applies atomically and keeps (ADR 0126 §3). A newer revision is applied; an older one is ignored and the document the sandbox holds is returned; the same revision is a retry when the document matches and a 409 when it does not. A document that fails validation (422) or cannot be written whole changes nothing. The applied revision is also reported on the sandbox's status. Only a token carrying the pool-only runtime-config scope may deliver one.
            operationId: put-sandbox-runtime-config
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SandboxRuntimeConfig'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxRuntimeConfig'
                    description: The document the sandbox now holds, which is the one delivered unless that one was older.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Deliver the sandbox's runtime-config document.
            tags:
                - Sandbox Runtime Config
            x-sandbox-agent: true
    /api/projects/{projectId}/sandboxes/{sandboxId}/autostop/confirm:
        post:
            description: Confirms, against what the sandbox sees now, a power-down its pool is about to carry out under its per-sandbox power lock (ADR 26-10-16-337 §5). idle is confirmed only if the sandbox is idle now; sleep only if a sleep request is pending now, and confirming it consumes every pending request. The answer carries the sandbox's earliest pending wake. 409 refuses the power-down. Only a token carrying the pool-only autostop scope may call it.
            operationId: confirm-sandbox-autostop
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SandboxAutostopConfirmRequest'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxAutostopConfirmation'
                    description: The power-down is confirmed.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response. 409 when the sandbox does not confirm the power-down.
            summary: Confirm a power-down the pool is about to carry out.
            tags:
                - Sandbox Autostop
            x-sandbox-agent: true
    /api/projects/{projectId}/sandboxes/{sandboxId}/autostop/resumed:
        post:
            description: Tells the sandbox its pool has just thawed it from a suspend (ADR 26-10-16-420 §4). Nothing booted, so the sandbox moves the wakes now due into ~/.discobox/wake/.done/ as a boot does, and the wake that brought it back is not returned again by its next power-down's confirmation. Only a token carrying the pool-only autostop scope may call it.
            operationId: resume-sandbox-autostop
            parameters:
                - description: Project that owns the sandbox.
                  in: path
                  name: projectId
                  required: true
                  schema:
                    type: string
                - description: Sandbox resource ID.
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxAutostopResumption'
                    description: The resume is taken.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.
            summary: Tell the sandbox its pool thawed it.
            tags:
                - Sandbox Autostop
            x-sandbox-agent: true

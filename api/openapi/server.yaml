                  required: true
                  schema:
                    description: Pool whose proxy recorded the exchange
                    type: string
                - description: Audit record ID, as a list reports it
                  in: path
                  name: exchangeId
                  required: true
                  schema:
                    description: Audit record ID, as a list reports it
                    pattern: ^http_[0-9]+$
                    type: string
                - description: Only an exchange made by this sandbox, which need not still exist
                  in: query
                  name: sandboxId
                  schema:
                    description: Only an exchange made by this sandbox, which need not still exist
                    type: string
            responses:
                200:

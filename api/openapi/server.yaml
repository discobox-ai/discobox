        SandboxHarnessSecretsResponse:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxHarnessSecretsResponse.json
                    format: uri
                    readOnly: true
                    type: string

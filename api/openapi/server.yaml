                        type: string
                    type: array
                name:
                    description: Credential name
                    type: string
                purpose:
                    description: What the binding lets the sandbox do with the credential. use delivers it in envVar; delegate lets the sandbox give it to the discoboxes it creates and delivers nothing.
                    enum:

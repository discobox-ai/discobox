                            schema:
                                $ref: '#/components/schemas/HarnessConfig'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Re-snapshot a harness config from its image
            tags:
                - Harness Configs

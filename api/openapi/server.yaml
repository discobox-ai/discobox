                    type: object
                responseBodyError:
                    description: Why the response body was not recorded in full
                    type: string
                responseBodyFormat:
                    description: How the response body was spooled
                    type: string
                responseBodyRecorded:
                    description: True when a response body was spooled and can be read through the recording route
                    type: boolean
                responseBytes:
                    description: Size of the response body
                    format: int64
                    type: integer
                responseHeaders:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: Response headers as recorded
                    type: object
                sandboxId:
                    description: Sandbox whose client certificate made the request. It may no longer exist.
                    type: string
                status:
                    description: Response status; zero when no response was received
                    type: integer
                streamDroppedBytes:
                    description: Upgraded stream bytes the recorder dropped under load
                    format: int64
                    type: integer
                streamDroppedChunks:
                    description: Upgraded stream chunks the recorder dropped under load
                    format: int64
                    type: integer
                streamFormat:
                    description: How the upgraded stream was spooled
                    type: string
                streamRecorded:
                    description: True when an upgraded stream was spooled and can be read through the recording route
                    type: boolean
                streamSessionId:
                    description: The upgraded stream's session
                    type: string
                swappedSecretIds:
                    description: Secrets whose values were swapped into this request, by ID, whatever kind of sentinel stood in for them. It is optional because a pool agent older than ADR 26-10-01-240 does not send it, and absent means no secret was named.
                    items:
                        type: string
                    type: array
                upgrade:
                    description: True for an upgraded (e.g. WebSocket) connection
                    type: boolean
                upgradeC2sBytes:
                    description: Bytes the sandbox sent over the upgraded connection
                    format: int64
                    type: integer
                upgradeS2cBytes:
                    description: Bytes the upstream sent over the upgraded connection
                    format: int64
                    type: integer
                upgradeType:
                    description: The upgrade protocol
                    type: string
                url:
                    description: Request URL, with any swapped query value left as its sentinel
                    type: string
                writtenAt:
                    description: When the recorder wrote the row, which is when it became readable
                    format: date-time
                    type: string
            required:
                - poolId
                - id
                - createdAt
                - sandboxId
                - method
                - url
                - host
                - status
                - blocked
                - requestHeaders
                - responseHeaders
                - appliedHeaders
            type: object
        UnavailableAuditPool:
            additionalProperties: false
            description: A pool the read asked and could not hear from. Its exchanges are missing from the answer, and saying so is what keeps a partial trail from reading as a complete one.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/UnavailableAuditPool.json
                    format: uri
                    readOnly: true
                    type: string
                poolId:
                    description: The pool that did not answer
                    type: string
                reason:
                    description: Why it did not
                    type: string
            required:
                - poolId
                - reason
            type: object
        ListHTTPAuditBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListHTTPAuditBody.json
                    format: uri
                    readOnly: true
                    type: string
                exchanges:
                    description: Matching exchanges from every pool that answered, newest first
                    items:
                        $ref: '#/components/schemas/HTTPAuditExchange'
                    type: array
                unavailablePools:
                    description: Pools that were asked and did not answer. Non-empty means exchanges may be missing.
                    items:
                        $ref: '#/components/schemas/UnavailableAuditPool'
                    type: array
            required:
                - exchanges
                - unavailablePools
            type: object
        DNSAuditQuery:
            additionalProperties: false
            description: One DNS query a sandbox asked of its pool, which answered it over the sandbox's mTLS channel and audited it beside the sandbox's HTTP (ADR 0148). Recorded by the pool, so the sandbox cannot alter the row; the name is what the sandbox asked and is display data.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/DNSAuditQuery.json
                    format: uri
                    readOnly: true
                    type: string
                answers:
                    description: The answers' data -- addresses, and the names aliases and pointers lead to; free-text records are left out
                    items:
                        type: string
                    type: array
                createdAt:
                    description: When the query was asked
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the pool took to answer, in milliseconds
                    format: int64
                    type: integer
                error:
                    description: Why there was no answer, when there was none
                    type: string
                id:
                    description: Audit record ID, written dns_<row>, unique within its pool and ordered by write
                    pattern: ^dns_[0-9]+$
                    type: string
                name:
                    description: The name asked, lowercased and without the trailing dot
                    type: string
                poolId:
                    description: Pool that answered the query
                    type: string
                rcode:
                    description: The answer's response code as DNS tools print it (NOERROR, NXDOMAIN, SERVFAIL, ...); empty when there was no answer
                    type: string
                sandboxId:
                    description: Sandbox whose client certificate asked
                    type: string
                type:
                    description: The record type asked for (A, AAAA, ...)
                    type: string
            required:
                - poolId
                - id
                - createdAt
                - sandboxId
                - name
                - type
                - rcode
                - answers
            type: object
        ListDNSAuditBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListDNSAuditBody.json
                    format: uri
                    readOnly: true
                    type: string
                queries:
                    description: Matching queries from every pool that answered, newest first
                    items:
                        $ref: '#/components/schemas/DNSAuditQuery'
                    type: array
                unavailablePools:
                    description: Pools that were asked and did not answer. Non-empty means queries may be missing.
                    items:
                        $ref: '#/components/schemas/UnavailableAuditPool'
                    type: array
            required:
                - queries
                - unavailablePools
            type: object
        ResolveSandboxSecretResponse:
            additionalProperties: false
            description: Result of resolving a sentinel. The value is present only when status is approved.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ResolveSandboxSecretResponse.json
                    format: uri
                    readOnly: true
                    type: string
                status:
                    description: Resolution status.
                    enum:
                        - approved
                        - pending
                        - denied
                    type: string
                value:
                    description: Real secret value; present only when status is approved.
                    type: string
                expiresAt:
                    description: When the binding the value was handed out under lapses, capped by the token's own expiry; empty when neither lapses.
                    format: date-time
                    type: string
                secretId:
                    description: The secret the value is; present only when status is approved. The pool's proxy records it on the request the value is swapped into (ADR 26-10-01-240).
                    type: string
                reportScope:
                    description: Requests that answer for the credential, as the sandbox's harness declares them. The pool's proxy reports a refusal or an acceptance of one of them and no others; absent is every request (ADR 26-10-13-595).
                    items:
                        $ref: '#/components/schemas/SecretReportRule'
                    type: array
            required:
                - status
            type: object
        SecretReportRule:
            additionalProperties: false
            description: One host, and the paths on it, whose answer says whether a credential is alive (ADR 26-10-13-595).
            properties:
                host:
                    description: Host that answers for the credential, with the hosts beneath it.
                    type: string
                paths:
                    description: Path prefixes on a segment boundary; /v1/messages covers /v1/messages and /v1/messages/batches. Empty is every path on the host.
                    items:
                        type: string
                    type: array
            required:
                - host
            type: object
        SandboxAutomaticRepair:
            additionalProperties: false
            description: |-
                The last repair recorded for this sandbox without anybody asking for one: an
                action found it failed with no container on its pool, and it was rebuilt once.
                While displayState is repairing and generation is this record's, the repair is
                still running. It is kept after the repair lands, with landedAt set, because
                landing clears the failure it answered, and is replaced by the next one. A
                sandbox in error on this record's generation with no landedAt is one whose
                automatic repair failed, and it is not repaired automatically again until an
                explicit repair or upgrade.
            properties:
                generation:
                    description: Generation the repair was recorded as
                    format: int64
                    type: integer
                startedAt:
                    description: When the repair was recorded
                    format: date-time
                    type: string
                trigger:
                    description: The use of the sandbox that triggered the repair, such as "exec attach", "ssh" or "start"
                    type: string
                failure:
                    description: The failure the repair answers
                    type: string
                landedAt:
                    description: When the repair landed. Absent while it is running, and when it failed.
                    format: date-time
                    type: string
            required:
                - generation
                - startedAt
                - trigger
            type: object
        SandboxUpgrade:
            additionalProperties: false
            description: |-
                Availability of a newer harness bundle or manifest file, or platform bundle, for
                this sandbox. Derived at read time by comparing the sandbox's pins to its harness
                config's current ones and to the platform bundle its server's release last
                resolved to; it is never stored. Absent when the sandbox's harness config pins
                nothing to move to.
            properties:
                available:
                    description: Whether the harness config now resolves to a different bundle or manifest file, or the release to a different platform or agent bundle, than this sandbox is pinned to
                    type: boolean
                currentAgentBundleDigest:
                    description: Agent bundle digest this sandbox's pool places it with
                    type: string
                currentBundleDigest:
                    description: Harness bundle digest this sandbox is pinned to
                    type: string
                currentPlatformBundleDigest:
                    description: Platform bundle digest this sandbox is pinned to
                    type: string
                currentImage:
                    description: Manifest file of the template with no image this sandbox runs, when its harness is one
                    type: string
                currentImageDigest:
                    description: Manifest file digest this sandbox is pinned to
                    type: string
                reason:
                    description: Why an upgrade is available, the first pin that moved
                    enum:
                        - imageDigestChanged
                        - bundleDigestChanged
                        - manifestDigestChanged
                        - platformBundleDigestChanged
                        - agentBundleDigestChanged
                    type: string
                targetAgentBundleDigest:
                    description: Agent bundle digest an upgrade would pin this sandbox to
                    type: string
                targetBundleDigest:
                    description: Harness bundle digest an upgrade would pin this sandbox to
                    type: string
                targetImage:
                    description: Manifest file this sandbox's harness config resolves to now
                    type: string
                targetImageDigest:
                    description: Manifest file digest an upgrade would pin this sandbox to
                    type: string
                targetPlatformBundleDigest:
                    description: Platform bundle digest an upgrade would pin this sandbox to
                    type: string
            required:
                - available
            type: object
        SourceDelivery:
            additionalProperties: false
            type: object
            required: [status]
            properties:
                status:
                    type: string
                    description: delivered, needs_credential, missing_commit, or unreachable.
                protocol:
                    type: string
                host:
                    type: string
                path:
                    type: string
        SandboxRuntime:
            additionalProperties: false
            properties:
                sourceDeliveries:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/SourceDelivery'

                agentStatus:
                    additionalProperties: true
                    description: Latest sandbox-agent-reported git/session/connection status, pushed periodically by the hosting pool-agent
                    nullable: true
                    type: object
                agentStatusObservedAt:
                    description: When agentStatus was observed by sandbox-agent
                    format: date-time
                    type: string
                resources:
                    additionalProperties: true
                    description: |
                        What this sandbox is consuming, computed by the hosting pool agent (see
                        SandboxResourceConsumption for the shape). Its cpu.vcpus is comparable
                        with the other sandboxes in the same pool, which were differenced over
                        the same tick, and only with those.

                        An open object for the same reason as Pool.resources: agent-written
                        telemetry must not be able to fail the read of the resource carrying it.
                    nullable: true
                    type: object
                resourcesObservedAt:
                    description: When resources was observed
                    format: date-time
                    type: string
                provisionProgress:
                    $ref: '#/components/schemas/SandboxProvisionProgress'
                provisionProgressAt:
                    description: When provisionProgress was observed
                    format: date-time
                    type: string
                appliedCommits:
                    description: History of successful discobox apply runs that landed this sandbox's commits on a host, most recent last. Client-reported; append-only.
                    items:
                        $ref: '#/components/schemas/AppliedSourceCommit'
                    nullable: true
                    type: array
                desiredState:
                    description: |-
                        Requested existence. Power state is not requested: whether a sandbox is
                        running is observed and reported by its runtime, never asked for by the
                        control plane. Archived is a third form of existence — as data, with no
                        container — not a power state.
                    enum:
                        - present
                        - archived
                        - deleted
                    type: string
                displayState:
                    description: |-
                        User-facing lifecycle state, composed from the existence state, the runtime state,
                        and whether the existence generations agree. This is the field
                        clients should read: it is the one answer to "what is this sandbox doing".
                        repairing is a repair, typed or automatic, that has been recorded and has not
                        landed yet; automaticRepair says what triggered an automatic one.
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                        - suspended
                        - repairing
                        - archiving
                        - archived
                        - deleting
                        - deleted
                        - error
                    readOnly: true
                    type: string
                errorMessage:
                    description: Error from the generation currently recorded in observedGeneration. Cleared by every accepted intent.
                    type: string
                errorReason:
                    description: |-
                        Machine-readable reason for errorMessage, absent when the failure is unclassified. Set and
                        cleared with errorMessage. image_unavailable is a sandbox whose pool cannot obtain the image
                        it is pinned to: retrying does not help, and an upgrade to the harness's current image does
                        when upgrade.available says there is one.
                    enum:
                        - image_unavailable
                    type: string
                generation:
                    description: Latest spec generation
                    format: int64
                    type: integer
                lastActiveAt:
                    description: Last observed activity timestamp
                    format: date-time
                    type: string
                observedGeneration:
                    description: Latest generation the reconciler has finished acting on
                    format: int64
                    type: integer
                runtimeState:
                    description: |-
                        Observed power state: what the container is doing, as reported by the pool agent
                        hosting it, which is the only component that can see it. Absent until an agent has
                        reported on this sandbox, which is not the same as `stopped`. `suspended` is a
                        container frozen whole, its memory kept: any start, or any use, thaws it.
                    enum:
                        - starting
                        - running
                        - stopping
                        - stopped
                        - suspended
                    type: string
                runtimeStateChangedAt:
                    description: When runtimeState last changed to its current value
                    format: date-time
                    type: string
                state:
                    description: |-
                        Existence state, written only by the reconciler: whether the sandbox's container has
                        been converged against its spec. `ready` means it has. What that container is doing
                        is a separate field, runtimeState.
                    enum:
                        - pending
                        - awaiting_source
                        - ready
                        - archived
                        - deleted
                        - failed
                    type: string
                stateChangedAt:
                    description: When state last changed to its current value
                    format: date-time
                    type: string
                sourceDeliveredAt:
                    description: |-
                        When a client reported the sandbox's push-delivered sources complete. Absent while
                        nothing has reported them, which for a sandbox in awaiting_source means its delivery
                        is still owed; state stays awaiting_source until the reconciler acts on the report.
                    format: date-time
                    type: string
                stateReportedAt:
                    description: |-
                        When the hosting pool agent last reported this sandbox's runtime state. A runtime
                        state whose report is old is one nobody has confirmed recently.
                    format: date-time
                    type: string
                upgrade:
                    "$ref": "#/components/schemas/SandboxUpgrade"
                automaticRepair:
                    "$ref": "#/components/schemas/SandboxAutomaticRepair"
            required:
                - desiredState
                - state
                - generation
                - observedGeneration
            type: object
        Sandbox:
            additionalProperties: false
            properties:
                discoboxApi:
                    description: The discobox may call the discobox API through its pool, in the sandbox role, acting only on the discoboxes it created (ADR 26-10-27-880 §9).
                    type: boolean
                egress:
                    $ref: '#/components/schemas/EgressPolicy'
                    description: The discobox's own egress policy level (ADR 26-10-01-032). It is restricted when this or its project, pool, or harness level sets denyByDefault, and then reaches the union of their allow lists.
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Sandbox.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfig:
                    $ref: '#/components/schemas/HarnessConfig'
                    description: Harness config
                config:
                    $ref: '#/components/schemas/SandboxConfig'
                    description: Desired sandbox configuration.
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/User'
                    description: Creating user
                createdBySandboxId:
                    description: Sandbox that created this one, when a sandbox did (ADR 26-09-24-630). Immutable after create.
                    type: string
                createdByUserId:
                    description: Creating user ID
                    type: string
                displayName:
                    description: |-
                        Name to show for this sandbox in a listing, computed by the server so every
                        client shows the same one: the name in the sandbox's meta when one is set
                        (meta.name), then the window title the primary terminal last set, the
                        sandbox's configured name until one has, and the sandbox ID if it has no
                        name either. The title is what the harness says the work is about, which
                        tells two sandboxes apart better than two generated names do, and a set
                        name is what a person or the agent chose to call it instead.
                    type: string
                id:
                    description: Stable sandbox ID
                    type: string
                origin:
                    $ref: '#/components/schemas/Origin'
                    description: Client host the sandbox was created from. Immutable after create.
                originKey:
                    description: Where the sandbox belongs on the client that created it, and what listings filter on — the host and the primary source's root, or the host alone for a sandbox with no source. Absent for a sandbox created without an origin.
                    readOnly: true
                    type: string
                platform:
                    description: Platform the sandbox runs on, as os/arch — its pool's, which its harness's image is published for. Absent until its pool has declared one; immutable after.
                    pattern: ^[a-z0-9]+/[a-z0-9]+$
                    type: string
                projectId:
                    description: Project ID
                    type: string
                pool:
                    $ref: '#/components/schemas/Pool'
                    description: Pool the sandbox is scheduled into
                poolId:
                    description: Pool the sandbox is scheduled into. Resolved at create, immutable after.
                    type: string
                runtime:
                    $ref: '#/components/schemas/SandboxRuntime'
                    description: Observed sandbox runtime state.
                meta:
                    $ref: '#/components/schemas/SandboxMeta'
                    description: |-
                        The sandbox's name, description and tags. The sandbox holds them, in
                        ~/.discobox/meta.json, and this is the copy it last reported: what a
                        listing filters on, and what a stopped sandbox is read as. Change them with
                        update-sandbox-meta, or by editing that file inside the sandbox. Until the
                        sandbox has reported (metaObservedAt absent) it holds the description the
                        sandbox was created with, or for an imported one the name, description and tags it
                        was exported with.
                    readOnly: true
                metaObservedAt:
                    description: When the sandbox read or wrote the meta above, on its own clock. Absent until it has reported.
                    format: date-time
                    readOnly: true
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - createdByUserId
                - displayName
                - config
                - runtime
                - createdAt
                - updatedAt
            type: object
        SandboxUser:
            additionalProperties: false
            description: |-
                Run identity and group membership. Every field is optional; omitting the
                whole object means the image's own user. On sandbox create
                this defines the sandbox.json default user, and on exec create it
                overrides that user for one exec — the same fields mean the same thing at
                both layers.

                Sandbox create is stricter, because it names the account the sandbox
                creates: a user that gives name or homeDirectory must give uid, and uid
                and gid must each be 0 (root) or within 1000-60000, the range a Linux
                guest gives ordinary accounts. Anything else is refused with 400, never
                clamped (ADR 0141).
            properties:
                additionalGroups:
                    description: |-
                        Supplementary groups, each a group name or a numeric GID, resolved inside
                        the sandbox. All-or-nothing, never merged: omit to inherit the sandbox's
                        groups, or name any to run with exactly those.
                    items:
                        type: string
                    type: array
                gid:
                    description: Primary group ID to use inside the sandbox. Mutually exclusive with groupName.
                    format: int64
                    type: integer
                groupName:
                    description: |-
                        Primary group name to use inside the sandbox, resolved against the image's
                        /etc/group. Mutually exclusive with gid.
                    type: string
                homeDirectory:
                    description: User home directory to use inside the sandbox
                    type: string
                name:
                    description: Username to use inside the sandbox
                    type: string
                uid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
            type: object
        SandboxGitIdentity:
            additionalProperties: false
            description: |-
                Git authorship identity for work done inside the sandbox. Both fields are
                optional; omitting the whole object leaves the sandbox's git identity
                unconfigured, exactly as an image ships it.

                This is authorship, not run identity — see SandboxUser for the account a
                process runs as. The two are independent: a sandbox running as the image's
                own user still commits as the caller, and a sandbox with a named run user
                may have no git identity to give.

                Boot seeds each key into the sandbox user's ~/.gitconfig only where git
                resolves no value for it already, so an identity configured inside the
                sandbox is never overwritten and each key is decided independently.
            properties:
                userEmail:
                    description: Value for git's user.email inside the sandbox.
                    type: string
                userName:
                    description: Value for git's user.name inside the sandbox.
                    type: string
            type: object
        SandboxFeature:
            additionalProperties: false
            description: One of a repository's features, as its .discobox/settings.json sets it.
            properties:
                enabled:
                    description: Whether the sandbox provisions the feature. false turns it off.
                    type: boolean
            required:
                - enabled
            type: object
        SandboxSkillsSource:
            additionalProperties: false
            description: One directory of a skills source whose skills are linked into the harness's skill directories.
            properties:
                directory:
                    description: The directory inside the source's repository that holds the skills, relative and slash-separated, or . for the root. Each immediate subdirectory holding a SKILL.md is one skill.
                    maxLength: 1024
                    minLength: 1
                    type: string
                source:
                    description: The sourceCodeReferences key of the skills source.
                    minLength: 1
                    type: string
            required:
                - source
                - directory
            type: object
        SandboxSkill:
            additionalProperties: false
            description: One skill, by content. Its name is its key, one directory with no slash that does not start with a dot.
            properties:
                files:
                    description: The skill's files other than its SKILL.md.
                    items:
                        $ref: '#/components/schemas/SandboxSkillFile'
                    type: array
                skill:
                    description: The skill's SKILL.md.
                    type: string
            required:
                - skill
            type: object
        SandboxSkillFile:
            additionalProperties: false
            description: One file of a skill.
            properties:
                content:
                    description: The file's bytes.
                    format: byte
                    type: string
                executable:
                    description: Whether the file is installed executable, as a skill's helper script must be.
                    type: boolean
                path:
                    description: Path inside the skill's directory, slash-separated, clean, and relative; never SKILL.md, which is the skill's own text.
                    type: string
            required:
                - path
                - content
            type: object
        SandboxProviderCatalogItem:
            additionalProperties: false
            properties:
                capabilities:
                    $ref: '#/components/schemas/ProviderStatus'
                    description: Provider capabilities/status
                configFields:
                    description: Provider config fields

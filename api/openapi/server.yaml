components:
    schemas:
        HarnessConfig:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HarnessConfig.json
                    format: uri
                    readOnly: true
                    type: string
                builtIn:
                    description: True for the included harnesses seeded by the server. Built-in configs track their image and cannot be deleted.
                    type: boolean
                configureError:
                    description: Why the last configure attempt failed. Cleared when a configure starts or succeeds.
                    type: string
                configureSandboxId:
                    description: Sandbox running the configure flow, while one is in flight.
                    type: string
                configured:
                    description: True once the configure flow completed successfully. Only configured harnesses can be selected to run.
                    type: boolean
                configuredFiles:
                    description: Files written by the configure flow. These overlay the image-declared files when resolving a sandbox.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                files:
                    description: Non-secret files declared by the registered image label.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                id:
                    description: Stable harness config ID
                    type: string
                image:
                    description: Immutable harness sandbox image selected when this config was registered.
                    type: string
                imageDigest:
                    description: Content digest observed when the harness image metadata was registered.
                    type: string
                name:
                    description: Harness config name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                relaunchCommand:
                    description: Argv declared by the registered image to resume a previous harness session.
                    items:
                        type: string
                    nullable: true
                    type: array
                runCommand:
                    description: Argv declared by the registered image to run the harness.
                    items:
                        type: string
                    type: array
                secrets:
                    description: Environment-variable secrets declared by the registered image.
                    items:
                        $ref: '#/components/schemas/HarnessConfigSecret'
                    nullable: true
                    type: array
                slug:
                    description: Stable, URL-safe identifier used to select the harness config (e.g. codex). Unique within the project.
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - slug
                - name
                - builtIn
                - configured
                - runCommand
                - createdAt
                - updatedAt
            type: object
        HarnessConfigFile:
            additionalProperties: false
            description: A file to write into a harness's home directory when the harness is installed.
            properties:
                content:
                    description: File content to write
                    type: string
                path:
                    description: File path relative to the harness's home directory
                    type: string
                createOnly:
                    description: Do not overwrite this file if it already exists
                    type: boolean
                template:
                    description: Render file content against the public sandbox configuration before writing
                    type: boolean
            required:
                - path
                - content
            type: object
        HarnessConfigSecret:
            additionalProperties: false
            description: Declares an environment variable the harness expects, and whether it is required.
            properties:
                name:
                    description: Environment variable name the harness expects to be set.
                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                    type: string
                required:
                    description: Whether the secret must be set for the harness to run. Optional secrets are used when present but do not block the harness.
                    type: boolean
                oneOfGroup:
                    description: Groups a required secret with alternatives; the requirement is satisfied when at least one member of the group is present.
                    type: string
            required:
                - name
            type: object
        HarnessConfigSecretBinding:
            additionalProperties: false
            description: Binds one of a harness config's environment variables to a project secret.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HarnessConfigSecretBinding.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfigId:
                    description: Harness config the binding belongs to
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                envName:
                    description: Environment variable filled by the secret
                    type: string
                id:
                    description: Stable binding ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                secretId:
                    description: Bound secret ID
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - harnessConfigId
                - envName
                - secretId
                - createdAt
                - updatedAt
            type: object
        ListHarnessConfigSecretBindingsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListHarnessConfigSecretBindingsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretBindings:
                    items:
                        $ref: '#/components/schemas/HarnessConfigSecretBinding'
                    type: array
            required:
                - secretBindings
            type: object
        SetHarnessConfigSecretBindingBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SetHarnessConfigSecretBindingBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretId:
                    description: Secret ID to bind to the environment variable
                    type: string
            required:
                - secretId
            type: object
        CompleteEvent:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
            type: object
        ConnectedEvent:
            additionalProperties: false
            properties:
                projectId:
                    type: string
            required:
                - projectId
            type: object
        CreateHarnessConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateHarnessConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                files:
                    description: Optional non-secret configured file values to associate with the registered harness.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                image:
                    description: Harness sandbox image to register. The server validates its io.discobox.harness.v1 label and snapshots that metadata into the HarnessConfig.
                    type: string
                name:
                    description: Harness config name. Defaults to the name declared by the image label.
                    maxLength: 200
                    type: string
                slug:
                    description: Stable, URL-safe identifier used to select the harness config (e.g. codex). Defaults to the id declared by the image label, or a slug derived from name. Unique within the project.
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
            required:
                - image
            type: object
        CompleteSandboxSourcePushBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CompleteSandboxSourcePushBody.json
                    format: uri
                    readOnly: true
                    type: string
                commit:
                    description: Full 40-character SHA-1 of the commit the client pushed. Confirms the push delivered the source's checkout commit, which was fixed at create; a value that does not match it is rejected.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
            required:
                - commit
            type: object
        CreateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                harnessName:
                    description: Harness config name to resolve at create time
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxCreateConfig'
                    description: Desired sandbox configuration.
                origin:
                    $ref: '#/components/schemas/Origin'
                    description: Client host and project directory this sandbox is created from
                poolId:
                    description: Pool to schedule the sandbox into. Defaults to the project's default pool.
                    type: string
            required:
                - config
            type: object
        CreateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                type:
                    description: Provider type
                    type: string
            required:
                - type
                - name
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        HarnessHookLog:
            additionalProperties: false
            properties:
                id:
                    description: Hook log ID.
                    type: string
                terminalId:
                    description: Harness terminal runtime ID that emitted the hook.
                    type: string
                provider:
                    description: Harness hook provider.
                    type: string
                event:
                    description: Provider-specific hook event name.
                    type: string
                payload:
                    description: Raw provider hook payload.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - provider
                - event
                - payload
                - createdAt
            type: object
        HarnessHookLogsResponse:
            additionalProperties: false
            properties:
                hooks:
                    items:
                        $ref: '#/components/schemas/HarnessHookLog'
                    type: array
            required:
                - hooks
            type: object
        SandboxExec:
            additionalProperties: false
            properties:
                id:
                    description: Sandbox exec runtime ID.
                    type: string
                status:
                    description: |
                        Current observed exec runtime status. installing is a terminal-layer
                        phase: the exec record exists and its hooks/files are still being
                        prepared, before the harness process is launched (starting -> running).
                    enum:
                        - installing
                        - starting
                        - running
                        - exited
                        - failed
                        - lost
                    type: string
                command:
                    description: Command argv executed in the sandbox.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Whether the exec process was started with a PTY.
                    type: boolean
                unit:
                    description: Systemd unit or scope name when known.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                exitCode:
                    description: Process exit code when the exec has exited.
                    format: int64
                    type: integer
                error:
                    description: Runtime error detail when the exec failed.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                startedAt:
                    format: date-time
                    type: string
                exitedAt:
                    format: date-time
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied exec metadata.
                    type: object
                harnessId:
                    description: Harness this exec runs, when created in harness (terminal) mode.
                    type: string
                primary:
                    description: Whether this is the sandbox's primary harness terminal.
                    type: boolean
            required:
                - id
                - status
                - command
                - workdir
                - tty
                - createdAt
            type: object
        SandboxExecEvent:
            additionalProperties: false
            properties:
                id:
                    type: string
                execId:
                    type: string
                type:
                    type: string
                message:
                    type: string
                details:
                    description: Structured event detail payload.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - type
                - createdAt
            type: object
        SandboxExecEventsResponse:
            additionalProperties: false
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/SandboxExecEvent'
                    type: array
            required:
                - events
            type: object
        SandboxExecLogEntry:
            additionalProperties: false
            properties:
                timestamp:
                    description: Time this exec stream chunk was observed.
                    format: date-time
                    type: string
                stream:
                    description: Exec stream this chunk came from.
                    enum:
                        - input
                        - output
                        - stdout
                        - stderr
                    type: string
                data:
                    description: Base64-encoded raw stream bytes.
                    format: byte
                    type: string
            required:
                - timestamp
                - stream
                - data
            type: object
        SandboxExecLogsResponse:
            additionalProperties: false
            properties:
                entries:
                    items:
                        $ref: '#/components/schemas/SandboxExecLogEntry'
                    type: array
            required:
                - entries
            type: object
        SandboxExecsResponse:
            additionalProperties: false
            properties:
                execs:
                    items:
                        $ref: '#/components/schemas/SandboxExec'
                    type: array
            required:
                - execs
            type: object
        CreateSandboxExecRequest:
            additionalProperties: false
            description: Create an exec. Provide command for a plain exec, or harnessId (with optional args) to run a harness in terminal mode.
            properties:
                command:
                    description: Command argv to execute in the sandbox. Mutually exclusive with harnessId.
                    items:
                        type: string
                    type: array
                harnessId:
                    description: Harness CLI to start in terminal mode. Defaults to the sandbox configured harness when omitted. Mutually exclusive with command.
                    type: string
                args:
                    description: Additional command arguments appended to the resolved harness command in terminal mode.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Allocate a PTY for the exec process.
                    type: boolean
                cols:
                    description: Initial PTY columns when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                rows:
                    description: Initial PTY rows when a PTY is allocated.
                    maximum: 65535
                    minimum: 1
                    type: integer
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied metadata to associate with the exec.
                    type: object
            type: object
        CreateSandboxExecResponse:
            additionalProperties: false
            properties:
                exec:
                    $ref: '#/components/schemas/SandboxExec'
            required:
                - exec
            type: object
        ErrorResponse:
            additionalProperties: false
            properties:
                error:
                    description: Human-readable error message.
                    type: string
            required:
                - error
            type: object
        ResourceHistoryResponse:
            additionalProperties: false
            properties:
                snapshots:
                    items:
                        $ref: '#/components/schemas/ResourceSnapshot'
                    type: array
            required:
                - snapshots
            type: object
        ResourceSnapshot:
            additionalProperties: false
            properties:
                terminalId:
                    description: Harness terminal runtime ID.
                    type: string
                sampledAt:
                    description: Time when the snapshot was collected.
                    format: date-time
                    type: string
                source:
                    description: Resource collector source.
                    type: string
                data:
                    description: Opaque OS, cgroup, systemd, and process resource dump.
            required:
                - terminalId
                - sampledAt
                - source
                - data
            type: object
        GitSource:
            additionalProperties: false
            properties:
                checkout:
                    $ref: '#/components/schemas/GitSourceCheckout'
                    description: Immutable checkout target and optional user-facing ref identity
                delivery:
                    description: How the source reaches the sandbox. clone means the sandbox fetches it from url or localDirectory. push means the client pushes it into the sandbox's Git repository, for a local directory the provider cannot reach; the sandbox waits in the awaiting_source phase until the push is complete. Defaults to clone.
                    enum:
                        - clone
                        - push
                    type: string
                destination:
                    $ref: '#/components/schemas/GitSourceDestination'
                    description: Sandbox destination paths for this source
                kind:
                    description: Source kind. Currently only git is supported.
                    enum:
                        - git
                    type: string
                localDirectory:
                    description: Absolute local Git repository directory accessible to the worker
                    type: string
                slug:
                    description: Stable URL-safe source slug used to address the source as a sandbox Git repository
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                url:
                    description: Remote Git source URL
                    format: uri
                    type: string
                workspace:
                    $ref: '#/components/schemas/GitSourceWorkspace'
                    description: Workspace materialization mode for this source
            required:
                - kind
            type: object
        GitSourceCheckout:
            additionalProperties: false
            properties:
                commit:
                    description: Immutable commit SHA to materialize
                    type: string
                refName:
                    description: User-facing branch, tag, or ref name to recreate in the sandbox
                    type: string
                refType:
                    description: User-facing ref type, such as branch, tag, or commit
                    type: string
            type: object
        GitSourceDestination:
            additionalProperties: false
            properties:
                directory:
                    description: Directory where this source should be placed inside the sandbox
                    type: string
                workingDirectory:
                    description: Working directory inside the sandbox for this source
                    type: string
            type: object
        GitSourceWorkspace:
            additionalProperties: false
            properties:
                baseCommit:
                    description: Commit to checkout before applying dirty workspace snapshot changes
                    type: string
                mode:
                    default: clean
                    description: Whether to materialize a clean checkout or restore dirty workspace changes
                    enum:
                        - clean
                        - dirty
                    type: string
                snapshotRef:
                    description: Discobox-owned hidden Git ref containing dirty workspace snapshot data
                    type: string
            type: object
        ListHarnessConfigsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListHarnessConfigsBody.json
                    format: uri
                    readOnly: true
                    type: string
                harnessConfigs:
                    description: Harness configs
                    items:
                        $ref: '#/components/schemas/HarnessConfig'
                    nullable: true
                    type: array
            required:
                - harnessConfigs
            type: object
        ListProjectsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListProjectsBody.json
                    format: uri
                    readOnly: true
                    type: string
                projects:
                    description: Projects
                    items:
                        $ref: '#/components/schemas/Project'
                    nullable: true
                    type: array
            required:
                - projects
            type: object
        ListSandboxProviderCatalogBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderCatalogBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider catalog items
                    items:
                        $ref: '#/components/schemas/SandboxProviderCatalogItem'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxProviderInstancesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderInstancesBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider instances
                    items:
                        $ref: '#/components/schemas/SandboxProviderInstance'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxesBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    description: Sandboxes
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
            required:
                - sandboxes
            type: object
        Job:
            additionalProperties: false
            properties:
                id:
                    description: Stable job ID
                    type: string
                type:
                    description: Job executor type
                    type: string
                status:
                    description: Persisted job lifecycle state
                    enum:
                        - pending
                        - backoff
                        - running
                        - completed
                        - failed
                        - canceled
                    type: string
                attempts:
                    description: Number of execution attempts
                    type: integer
                maxAttempts:
                    description: Maximum execution attempts before failure
                    type: integer
                error:
                    description: Latest execution or dispatch error
                    type: string
                message:
                    description: Human-readable execution result or operator note
                    type: string
                metadata:
                    description: Structured execution result metadata
                workerId:
                    description: Dispatcher worker that claimed the current or last attempt
                    type: string
                resourceType:
                    description: Resource type this job acts on
                    type: string
                resourceId:
                    description: Resource ID this job acts on
                    type: string
                scheduledAt:
                    description: Earliest time the job may run
                    format: date-time
                    type: string
                startedAt:
                    description: Time the current or last attempt started
                    format: date-time
                    type: string
                completedAt:
                    description: Time the job reached a terminal state
                    format: date-time
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - type
                - status
                - attempts
                - maxAttempts
                - resourceType
                - resourceId
                - scheduledAt
                - createdAt
                - updatedAt
            type: object
        ListJobsBody:
            additionalProperties: false
            properties:
                jobs:
                    items:
                        $ref: '#/components/schemas/Job'
                    type: array
            required:
                - jobs
            type: object
        Origin:
            additionalProperties: false
            description: The client host and project directory a sandbox was created from. Client-declared provenance recorded verbatim; never used to materialize source.
            properties:
                hostId:
                    description: Stable generated identity of the client host, unique per user per machine
                    type: string
                hostname:
                    description: Client hostname, for display only. Not stable and not unique.
                    type: string
                projectPath:
                    description: Absolute path of the project root on the client host, which is the Git repository root, or the working directory outside a repository
                    type: string
                user:
                    description: Client OS username, for display only
                    type: string
            required:
                - hostId
                - projectPath
            type: object
        Pool:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Pool.json
                    format: uri
                    readOnly: true
                    type: string
                builtIn:
                    description: True for the default pool seeded by the server; built-in pools cannot be deleted
                    type: boolean
                cpuVcpus:
                    description: Total CPU capacity of the pool envelope in vCPUs. Zero sizes the envelope by the host.
                    format: double
                    type: number
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                id:
                    description: Stable pool ID
                    type: string
                memoryBytes:
                    description: Total memory capacity of the pool envelope in bytes. Zero sizes the envelope by the host.
                    format: int64
                    type: integer
                name:
                    description: Pool display name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                providerInstance:
                    $ref: '#/components/schemas/SandboxProviderInstance'
                    description: Backing sandbox provider instance
                providerInstanceId:
                    description: Backing sandbox provider instance ID. Immutable after create.
                    type: string
                storageBytes:
                    description: Total storage capacity of the pool envelope in bytes. Zero sizes the envelope by the host.
                    format: int64
                    type: integer
                ready:
                    description: Whether the pool host is alive and healthy
                    type: boolean
                schedulable:
                    description: Whether the pool accepts new sandboxes
                    type: boolean
                degraded:
                    description: Whether the pool should be used only as fallback capacity
                    type: boolean
                availableCpuVcpus:
                    description: Agent-reported available CPU capacity in vCPUs
                    format: double
                    type: number
                availableMemoryBytes:
                    description: Agent-reported available memory capacity in bytes
                    format: int64
                    type: integer
                availableStorageBytes:
                    description: Agent-reported available storage capacity in bytes
                    format: int64
                    type: integer
                conditions:
                    description: Opaque agent-reported condition details for display
                desiredState:

components:
    schemas:
        BoundSecret:
            additionalProperties: false
            description: 'One credential a target holds, resolved: the binding that applies (the narrowest per variable), and every route list a request carrying it is held to.'
            properties:
                bindingId:
                    description: The binding that applies
                    type: string
                delegate:
                    description: The target may give it to the discoboxes it creates
                    type: boolean
                envVar:
                    description: Variable it is delivered in, for a use binding
                    type: string
                expiresAt:
                    description: When it lapses, the earlier of the binding's and its parent's; absent never
                    format: date-time
                    type: string
                from:
                    description: The level the binding is on
                    enum:
                        - project
                        - harnessConfig
                        - sandbox
                    type: string
                fromId:
                    description: The project, harness config or discobox ID the binding is on
                    type: string
                routes:
                    description: "Every route list a request carrying it must be allowed by: the secret's, the binding's when it has any, and the parent's"
                    items:
                        items:
                            $ref: '#/components/schemas/SecretRoute'
                        type: array
                    type: array
                secretId:
                    description: Secret ID
                    type: string
                secretName:
                    description: Secret name
                    type: string
                use:
                    description: Delivered to the target in envVar
                    type: boolean
            required:
                - secretId
                - bindingId
                - from
                - fromId
                - use
                - delegate
                - routes
            type: object
        CreateSecretBindingBody:
            additionalProperties: false
            description: Bind a secret to a project, a harness config, or one discobox.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSecretBindingBody.json
                    format: uri
                    readOnly: true
                    type: string
                delegate:
                    description: Let a discobox the binding covers give the credential to the discoboxes it creates. Only a person binds with delegate.
                    type: boolean
                envVar:
                    description: Environment variable to deliver the credential's sentinel in; required with use
                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                    type: string
                routes:
                    description: Routes that narrow the secret's for this binding; omitted or empty inherits the secret's
                    items:
                        $ref: '#/components/schemas/SecretRouteInput'
                    type: array
                secret:
                    description: The secret, by name or ID
                    type: string
                target:
                    description: The harness config (slug, name or ID) or discobox (name or ID) to bind to; omitted for the project
                    type: string
                targetKind:
                    description: 'What the binding is for: every discobox of the project, every discobox on a harness config, or one discobox'
                    enum:
                        - project
                        - harnessConfig
                        - sandbox
                    type: string
                ttlSeconds:
                    description: How long the binding lasts, in seconds, within the secret's limit; 0 never lapses where the secret allows it. Omitted takes the secret's limit.
                    format: int64
                    minimum: 0
                    type: integer
                use:
                    description: Deliver the credential to the target in envVar. Defaults to true unless delegate is set.
                    type: boolean
            required:
                - secret
                - targetKind
            type: object
        DeleteSecretBindingResponse:
            additionalProperties: false
            description: 'What a delete removed: the binding, and every binding handed on under it.'
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/DeleteSecretBindingResponse.json
                    format: uri
                    readOnly: true
                    type: string
                deleted:
                    description: IDs of every binding removed, the one asked for first
                    items:
                        type: string
                    type: array
            required:
                - deleted
            type: object
        HarnessCaptureBaseline:
            additionalProperties: false
            properties:
                configRevision:
                    format: int64
                    type: integer
                files:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureFile'
                    nullable: true
                    type: array
                harnessConfigId:
                    type: string
                manifestDigest:
                    type: string
                projectFiles:
                    items:
                        type: string
                    nullable: true
                    type: array
                secretRevisions:
                    additionalProperties:
                        type: string
                    type: object
            required:
                - harnessConfigId
                - configRevision
                - manifestDigest
            type: object
        HarnessCaptureCredential:
            additionalProperties: false
            properties:
                account:
                    type: string
                envName:
                    type: string
                generation:
                    type: string
                keep:
                    type: boolean
                localId:
                    type: string
                provider:
                    type: string
                type:
                    type: string
                value:
                    additionalProperties: true
                    type: object
            required:
                - provider
                - envName
                - type
            type: object
        HarnessCaptureCredentialPreview:
            additionalProperties: false
            properties:
                account:
                    type: string
                envName:
                    type: string
                provider:
                    type: string
                type:
                    type: string
            required:
                - provider
                - envName
                - type
            type: object
        HarnessCaptureDiagnostic:
            additionalProperties: false
            properties:
                code:
                    type: string
                message:
                    type: string
                path:
                    type: string
            required:
                - code
                - message
            type: object
        HarnessCaptureFile:
            additionalProperties: false
            properties:
                content:
                    type: string
                createOnly:
                    type: boolean
                path:
                    type: string
                template:
                    type: boolean
            required:
                - path
                - content
            type: object
        HarnessCaptureFileChange:
            additionalProperties: false
            description: 'One file a candidate writes (file) or removes (remove). A sandbox never sends previous, nor file on a removal. On a preview the server serves, previous is the file a save replaces (the configured file over the bundle''s, at the current revision), and a removal''s file is the bundle''s own file it falls back to, when it ships one; both are for display and never applied.'
            properties:
                file:
                    $ref: '#/components/schemas/HarnessCaptureFile'
                path:
                    type: string
                previous:
                    $ref: '#/components/schemas/HarnessCaptureFile'
                remove:
                    type: boolean
            required:
                - path
            type: object
        HarnessCaptureOAuth:
            additionalProperties: false
            properties:
                clientId:
                    type: string
                encoding:
                    type: string
                tokenUrl:
                    type: string
            required:
                - tokenUrl
                - clientId
            type: object
        HarnessCaptureProvider:
            additionalProperties: false
            properties:
                envName:
                    type: string
                host:
                    type: string
                id:
                    type: string
                multipleAccounts:
                    type: boolean
                oauth:
                    $ref: '#/components/schemas/HarnessCaptureOAuth'
                routes:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureRoute'
                    nullable: true
                    type: array
                types:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
                - id
                - envName
                - types
            type: object
        HarnessCaptureRoute:
            additionalProperties: false
            description: A route a harness's captured secret is bound with, in SecretRoute's shape.
            properties:
                blocked:
                    description: Refuse every request this route is the most specific route for; a more specific route of the same list still answers for what it covers (ADR 26-10-27-880 §4)
                    type: boolean
                graphql:
                    $ref: '#/components/schemas/SecretRouteGraphQL'
                hosts:
                    description: "Hosts the route covers, each an exact name, `*.suffix` for every name strictly beneath suffix but not suffix itself, or `*` alone for any host (ADR 26-10-27-939). A :port is dropped, so a host is every port of it. A host covers no host beneath it; `*.h` says that."
                    items:
                        type: string
                    minItems: 1
                    type: array
                mcp:
                    $ref: '#/components/schemas/SecretRouteMCP'
                methods:
                    description: "HTTP methods the route covers, upper case; empty is any method. A request names its request line's method and every method it overrides it with: the X-HTTP-Method-Override, X-HTTP-Method and X-Method-Override headers, and _method in its URL, plus, on a POST only, _method in a URL-encoded form body, a body with no Content-Type (read as a form), or the top level of a JSON object body. An open route matches only when every one is among methods; of a POST body it ignores only a JSON body it could not read at all (too large, of undeclared length, in an unknown encoding) and a multipart body, and refuses a form or untyped body it could not read and any body it read but could not parse unambiguously. A blocked route matches when any one is among methods, or when a POST body that may name one cannot be read or parsed. So a _method hidden in an unreadable JSON or multipart POST is caught only by a blocked method route."
                    items:
                        type: string
                    type: array
                paths:
                    description: "Path patterns, each matched against the whole request path one segment at a time: `*` is exactly one segment, `**` as the last segment is zero or more, anything else is literal, compared ignoring case (so /repos/acme/** also allows /Repos/ACME/...). Empty is any path."
                    items:
                        type: string
                    type: array
            required:
                - hosts
            type: object
        HarnessCaptureSetting:
            additionalProperties: false
            properties:
                templateSuffix:
                    type: string
                createOnly:
                    type: boolean
                exclude:
                    type: array
                    items:
                        type: string
                    description: Known credential and local paths omitted from ordinary settings; * matches one object path segment and ** any depth.
                fields:
                    additionalProperties:
                        type: string
                    type: object
                format:
                    type: string
                path:
                    type: string
            required:
                - path
                - format
            type: object
        HarnessConfigAcknowledgment:
            additionalProperties: false
            properties:
                superseded:
                    type: boolean
                baseline:
                    $ref: '#/components/schemas/HarnessCaptureBaseline'
                candidateId:
                    type: string
                files:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureFile'
                    nullable: true
                    type: array
                sentinels:
                    additionalProperties:
                        type: string
                    type: object
            required:
                - candidateId
                - baseline
                - files
                - sentinels
            type: object
        HarnessConfigCandidate:
            additionalProperties: false
            properties:
                baseline:
                    $ref: '#/components/schemas/HarnessCaptureBaseline'
                credentials:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureCredential'
                    nullable: true
                    type: array
                diagnostics:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureDiagnostic'
                    nullable: true
                    type: array
                files:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureFileChange'
                    nullable: true
                    type: array
                id:
                    type: string
                secretRevisions:
                    additionalProperties:
                        type: string
                    type: object
                writeRevision:
                    format: int64
                    type: integer
            required:
                - id
                - baseline
                - writeRevision
                - files
                - credentials
            type: object
        HarnessConfigCandidateRequest:
            additionalProperties: false
            properties:
                candidateId:
                    type: string
            required:
                - candidateId
            type: object
        HarnessConfigChanges:
            additionalProperties: false
            properties:
                candidateId:
                    type: string
                configRevision:
                    format: int64
                    type: integer
                credentials:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureCredentialPreview'
                    nullable: true
                    type: array
                diagnostics:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureDiagnostic'
                    nullable: true
                    type: array
                files:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureFileChange'
                    nullable: true
                    type: array
                harnessConfigId:
                    type: string
                state:
                    type: string
            required:
                - harnessConfigId
                - configRevision
                - state
                - files
                - credentials
            type: object
        HarnessConfigReconsideration:
            additionalProperties: false
            properties:
                current:
                    $ref: '#/components/schemas/HarnessCaptureBaseline'
                selection:
                    $ref: '#/components/schemas/HarnessConfigSelection'
            required:
                - selection
                - current
            type: object
        HarnessConfigSaveBack:
            additionalProperties: false
            properties:
                credentialFiles:
                    items:
                        type: string
                    nullable: true
                    type: array
                credentialSettings:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureSetting'
                    nullable: true
                    type: array
                exportCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                handoffCommand:
                    items:
                        type: string
                    nullable: true
                    type: array
                providers:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureProvider'
                    nullable: true
                    type: array
                settings:
                    items:
                        $ref: '#/components/schemas/HarnessCaptureSetting'
                    nullable: true
                    type: array
                version:
                    format: int64
                    type: integer
                watch:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
                - version
                - watch
                - exportCommand
                - handoffCommand
                - providers
                - settings
            type: object
        HarnessConfigSaveResult:
            additionalProperties: false
            properties:
                candidateId:
                    type: string
                configRevision:
                    format: int64
                    type: integer
                harnessConfigId:
                    type: string
                state:
                    type: string
            required:
                - candidateId
                - harnessConfigId
                - configRevision
                - state
            type: object
        HarnessConfigSelection:
            additionalProperties: false
            properties:
                candidateId:
                    type: string
                keepFiles:
                    items:
                        type: string
                    nullable: true
                    type: array
                replaceCredentials:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
                - candidateId
                - keepFiles
                - replaceCredentials
            type: object
        HarnessConfig:
            additionalProperties: false
            properties:
                saveBack:
                    $ref: '#/components/schemas/HarnessConfigSaveBack'
                    readOnly: true
                revision:
                    type: integer
                    format: int64
                    readOnly: true
                egress:
                    $ref: '#/components/schemas/EgressPolicy'
                    description: The harness config's egress policy level, as a person set it (ADR 26-10-01-032). Its denyByDefault restricts every discobox on the harness; its allow list, with imageEgressHosts, is added to each restricted one's.
                imageEgressHosts:
                    description: Hosts the registered bundle declares it needs, snapshotted from its label. Part of the harness level's allow list; they never restrict anything by themselves.
                    items:
                        type: string
                    nullable: true
                    readOnly: true
                    type: array
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/HarnessConfig.json
                    format: uri
                    readOnly: true
                    type: string
                additionalGroups:
                    description: Supplementary OS groups (already present in the image, e.g. "docker") the sandbox user is added to at boot, declared by the registered image label.
                    items:
                        type: string
                    nullable: true
                    type: array
                boundSecrets:
                    description: How many of the harness's environment variables have a project secret bound. Zero on a harness with a configure command means every discobox on it runs without credentials until it is configured. Absent from servers that predate it.
                    format: int64
                    readOnly: true
                    type: integer
                builtIn:
                    description: True for the included harnesses seeded by the server. Built-in configs track their image and cannot be deleted.
                    type: boolean
                configCommand:
                    description: Argv declared by the registered image for its interactive configuration command, when it has one.
                    items:
                        type: string
                    nullable: true
                    type: array
                configReminder:
                    description: Reminder shown outside the interactive configuration terminal, declared by the registered image.
                    type: string
                configPorts:
                    description: Local ports the configure flow forwards into the configure sandbox at the same port number, declared by the registered image.
                    items:
                        $ref: '#/components/schemas/HarnessConfigPort'
                    nullable: true
                    type: array
                configureError:
                    description: Why the last configure attempt failed. Cleared when a configure starts or succeeds.
                    type: string
                configureSandboxId:
                    description: Sandbox running the configure flow, while one is in flight.
                    type: string
                configured:
                    description: True once the configure flow completed successfully. Only configured harnesses can be selected to run.
                    type: boolean
                configuredFiles:
                    description: Files written by the configure flow. These overlay the image-declared files when resolving a sandbox.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Default environment variables declared by the registered image label.
                    nullable: true
                    type: object
                files:
                    description: Non-secret files declared by the registered image label.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                id:
                    description: Stable harness config ID
                    type: string
                bundle:
                    description: The harness bundle its manifest is read from and every discobox on it applies, a FROM scratch OCI image of its features with its manifest in labels, composed on the server's platform bundle (ADR 26-10-16-423 §2). Absent on a harness registered before bundles, whose manifest is what its image's labels gave it and which runs nowhere until a bundle is registered for it, or one whose image is a manifest file.
                    type: string
                bundleDigest:
                    description: Content digest observed when the harness bundle was registered.
                    type: string
                manifestDigest:
                    description: Digest of the manifest composed from the harness bundle's labels on the platform's layer, which moves when either does. A sandbox pins it beside the bundle.
                    type: string
                image:
                    description: A file:// manifest file, the whole manifest of a template with no image. Absent on a harness registered by its bundle, which no discobox runs as an image.
                    type: string
                imageDigest:
                    description: Content digest observed when the manifest file was registered.
                    type: string
                imageKind:
                    description: "The kind of box the harness runs on: oci for a bundle, which a Docker pool's sandbox base image applies, or vm/<driver> for a manifest file's VM image built for that driver. A discobox on this harness is placed only on a pool that runs this kind. Empty on a manifest-file harness registered before image kinds, which runs on no pool until its file declares one and it is refreshed. Absent from a server from before image kinds, whose harnesses are all oci."
                    type: string
                name:
                    description: Harness config name
                    maxLength: 200
                    type: string
                platforms:
                    description: Platforms a manifest file's template runs on, as os/arch. A discobox on this harness runs on its pool's platform, and is placed only on a pool that hosts one of these. Absent on a bundle, whose steps select the platform they run on, which rules no pool out.
                    items:
                        pattern: ^[a-z0-9]+/[a-z0-9]+$
                        type: string
                    type: array
                projectId:
                    description: Project ID
                    type: string
                relaunchCommand:
                    description: Argv declared by the registered image to resume a previous harness session.
                    items:
                        type: string
                    nullable: true
                    type: array
                runCommand:
                    description: Argv declared by the registered image to run the harness. Absent for a harness whose image declares none, such as the built-in `shell`, where the sandbox resolves the run user's login shell instead.
                    items:
                        type: string
                    type: array
                secrets:
                    description: Environment-variable secrets declared by the registered image.
                    items:
                        $ref: '#/components/schemas/HarnessConfigSecret'
                    nullable: true
                    type: array
                slug:
                    description: Stable, URL-safe identifier used to select the harness config (e.g. codex). Unique within the project.
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                volumes:
                    description: Declarative volumes declared by the registered image label.
                    items:
                        $ref: '#/components/schemas/HarnessVolume'
                    nullable: true
                    type: array
            required:
                - id
                - projectId
                - slug
                - name
                - builtIn
                - configured
                - createdAt
                - updatedAt
            type: object
        HarnessVolume:
            additionalProperties: false
            description: An image-declared path the sandbox-agent wires from a primary volume during boot.
            properties:
                path:
                    description: Path to wire, may contain the %HOME% token.
                    type: string
                volume:
                    description: Which primary volume backs this path.
                    enum:
                        - data
                        - cache
                    type: string
                scope:
                    description: Who a cache path is shared with. Absent means the sandbox user, which is the safe default; shared puts every sandbox in the pool on one directory and is only valid for cache.
                    enum:
                        - user
                        - shared
                    type: string
                excludeFromExport:
                    description: The path's backing directory stays out of an export, for what was installed into a sandbox or can be rebuilt rather than the user's work. Absent means the path travels; only valid for data.
                    type: boolean
                uid:
                    description: Owner UID, as a decimal string or a %UID%/%GID% token.
                    type: string
                gid:
                    description: Owner GID, as a decimal string or a %UID%/%GID% token.
                    type: string
                mode:
                    description: Octal file mode string, e.g. "0755".
                    type: string
            required:
                - path
                - volume
            type: object
        EgressPolicy:
            additionalProperties: false
            description: |-
                One level's egress policy (ADR 26-10-01-032). A discobox is restricted when any
                of its levels — project, pool, harness config, or its own — sets denyByDefault,
                and then reaches only the union of every level's allow entries and its harness
                image's declared hosts. An allow list alone restricts nothing.
            properties:
                allow:
                    description: Destinations a restricted discobox may reach. Each is a host name ("github.com" is that host alone), a wildcard ("*.github.com" every name beneath it, "registry.*", or "*"), an IP, or a CIDR. Hosts only, never a port.
                    items:
                        type: string
                    nullable: true
                    type: array
                denyByDefault:
                    description: Restricts every discobox this level covers to the allow lists of its levels, even when they are empty.
                    type: boolean
            type: object
        HarnessConfigPort:
            additionalProperties: false
            description: A local port a harness's configure flow needs bound at the same number on the user's machine and forwarded into the configure sandbox, such as an OAuth callback its sign-in redirects to. An ephemeral entry names no number and stands for every TCP port the configure sandbox is found listening on.
            properties:
                ephemeral:
                    description: Forward each TCP port the configure sandbox is discovered listening on, at its own number, for a sign-in whose callback port changes every run. Port is 0 when set.
                    type: boolean
                port:
                    description: The port, bound locally at exactly this number or not at all. 0 for an ephemeral entry.
                    format: int64
                    type: integer
                unavailable:
                    description: What to tell the user when the port cannot be bound on their machine; empty falls back to naming the port. For an ephemeral entry it follows the client's own words naming the discovered port, and says what to do.
                    type: string
            required:
                - port
            type: object
        HarnessConfigFile:
            additionalProperties: false
            description: A file to write into a harness's home directory when the harness is installed.
            properties:
                content:
                    description: File content to write
                    type: string
                path:
                    description: File path relative to the harness's home directory
                    type: string
                createOnly:
                    description: Do not overwrite this file if it already exists
                    type: boolean
                template:
                    description: Render file content against the public sandbox configuration before writing
                    type: boolean
            required:
                - path
                - content
            type: object
        HarnessConfigSecret:
            additionalProperties: false
            description: Declares an environment variable the harness expects, and whether it is required.
            properties:
                name:
                    description: Environment variable name the harness expects to be set.
                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                    type: string
                required:
                    description: Whether the secret must be set for the harness to run. Optional secrets are used when present but do not block the harness.
                    type: boolean
                oneOfGroup:
                    description: Groups a required secret with alternatives; the requirement is satisfied when at least one member of the group is present.
                    type: string
                delivery:
                    description: How the credential reaches the harness. env (the default) exports the variable named by name; file withholds that export because the harness reads the credential from a file the harness config installs.
                    enum:
                        - env
                        - file
                    type: string
                rejectionScope:
                    description: Requests that answer for the credential. Only what an upstream makes of one of them is taken as a fact about it, a refusal and an acceptance alike; empty is every request (ADR 26-10-13-595).
                    items:
                        $ref: '#/components/schemas/SecretReportRule'
                    type: array
                routes:
                    description: Where the harness itself sends this credential, declared by its image (ADR 26-10-02-924). Configure writes them onto the secret it creates for it.
                    items:
                        $ref: '#/components/schemas/SecretRouteInput'
                    type: array
            required:
                - name
            type: object
        CompleteEvent:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
            type: object
        ConnectedEvent:
            additionalProperties: false
            properties:
                projectId:
                    type: string
            required:
                - projectId
            type: object
        CreateHarnessConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateHarnessConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                files:
                    description: Optional non-secret configured file values to associate with the registered harness.
                    items:
                        $ref: '#/components/schemas/HarnessConfigFile'
                    nullable: true
                    type: array
                bundle:
                    description: The harness bundle to register, required unless image is a manifest file. It is a FROM scratch OCI image built FROM nothing or FROM another harness's bundle, never the platform's. The server composes its io.discobox.image.v1 manifest labels on its platform bundle's and snapshots the result into the HarnessConfig.
                    type: string
                image:
                    description: A file:// manifest file in the server's overlay directory, the whole manifest of a template with no image, which takes no bundle. No harness is a runnable image, so nothing else is accepted here.
                    type: string
                name:
                    description: Harness config name. Defaults to the name declared by the bundle's label.
                    maxLength: 200
                    type: string
                slug:
                    description: Stable, URL-safe identifier used to select the harness config (e.g. codex). Defaults to the id declared by the bundle's label, or a slug derived from name. Unique within the project.
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
            type: object
        CompleteSandboxApplyBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CompleteSandboxApplyBody.json
                    format: uri
                    readOnly: true
                    type: string
                commit:
                    description: Full 40-character SHA-1 of the newest sandbox-side commit that was cherry-picked in this apply.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                hostCommit:
                    description: Full 40-character SHA-1 of the resulting host-side commit after the fast-forward. A new object distinct from commit, since cherry-picking onto a different parent always produces a new SHA.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                hostId:
                    description: Stable host identity of the client that performed the apply.
                    type: string
                hostPath:
                    description: Absolute path on that host the commits were applied into.
                    type: string
                slug:
                    description: Slug of the GitSource these commits were applied from.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
            required:
                - slug
                - commit
                - hostCommit
                - hostId
                - hostPath
            type: object
        ListBoundSecretsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListBoundSecretsBody.json
                    format: uri
                    readOnly: true
                    type: string
                boundSecrets:
                    items:
                        $ref: '#/components/schemas/BoundSecret'
                    type: array
            required:
                - boundSecrets
            type: object
        ListSecretBindingEventsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretBindingEventsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretBindingEvents:
                    items:
                        $ref: '#/components/schemas/SecretBindingEvent'
                    type: array
            required:
                - secretBindingEvents
            type: object
        ListSecretBindingsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretBindingsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretBindings:
                    items:
                        $ref: '#/components/schemas/SecretBinding'
                    type: array
            required:
                - secretBindings
            type: object
        ListSecretRefreshRequestsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSecretRefreshRequestsBody.json
                    format: uri
                    readOnly: true
                    type: string
                secretRefreshRequests:
                    items:
                        $ref: '#/components/schemas/SecretRefreshRequest'
                    type: array
            required:
                - secretRefreshRequests
            type: object
        PullSandboxSourceBody:
            additionalProperties: false
            type: object
            required: [username, password]
            properties:
                username:
                    type: string
                password:
                    type: string
                    writeOnly: true
        CompleteSandboxSourcePushBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CompleteSandboxSourcePushBody.json
                    format: uri
                    readOnly: true
                    type: string
                sources:
                    additionalProperties:
                        description: Full 40-character SHA-1 of the commit the client pushed for that source.
                        maxLength: 40
                        minLength: 40
                        pattern: ^[0-9a-f]{40}$
                        type: string
                    description: Commit the client pushed for each push-delivered source, keyed by source slug. Each reported commit confirms that source's checkout commit, which was fixed at create; a commit that does not match is rejected. Reports may cover a subset of sources. The sandbox resumes once all of them are delivered.
                    type: object
            required:
                - sources
            type: object
        CreateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                discoboxApi:
                    description: Let the new discobox call the discobox API through its pool, acting only on the discoboxes it creates (ADR 26-10-27-880 §9). A discobox creating one may set it only when it has it itself.
                    type: boolean
                harnessName:
                    description: Harness config to resolve at create time, by slug, name or ID
                    type: string
                config:
                    $ref: '#/components/schemas/SandboxCreateConfig'
                    description: Desired sandbox configuration.
                origin:
                    $ref: '#/components/schemas/Origin'
                    description: Client host and project directory this sandbox is created from
                poolId:
                    description: Pool to schedule the sandbox into. Defaults to the project's default pool.
                    type: string
                bindings:
                    description: Secrets to bind to the new discobox, made with it in one transaction, so a create that cannot make one creates nothing. A person may bind anything; a discobox creating one binds, to use, only what a delegate binding it holds covers (ADR 26-10-27-880 §5).
                    items:
                        $ref: '#/components/schemas/SandboxBindingInput'
                    type: array
            required:
                - config
            type: object
        CreateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                type:
                    description: Provider type
                    type: string
            required:
                - type
                - name
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        HarnessHookLog:
            additionalProperties: false
            properties:
                id:
                    description: Hook log ID.
                    type: string
                terminalId:
                    description: Harness terminal runtime ID that emitted the hook.
                    type: string
                provider:
                    description: Harness hook provider.
                    type: string
                event:
                    description: The hook event name as the harness emitted it, never rewritten.
                    type: string
                canonicalEvent:
                    description: Claude Code's name for the same event, absent when Claude Code has no name for it. Match on this to name an event the same way across harnesses.
                    type: string
                payload:
                    description: Raw provider hook payload.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - provider
                - event
                - payload
                - createdAt
            type: object
        SandboxBindingInput:
            additionalProperties: false
            description: A secret to bind to the new discobox, in the transaction that creates it.
            properties:
                delegate:
                    description: Let the new discobox give the credential to the discoboxes it creates. A discobox creating one may not set it.
                    type: boolean
                envVar:
                    description: Environment variable the credential's sentinel is delivered in; required with use
                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                    type: string
                routes:
                    description: Routes that narrow the secret's for this binding; omitted inherits them
                    items:
                        $ref: '#/components/schemas/SecretRouteInput'
                    type: array
                secret:
                    description: The secret, by name or ID
                    type: string
                ttlSeconds:
                    description: How long the binding lasts, in seconds, within the secret's limit and, for a discobox creating one, its delegation's
                    format: int64
                    minimum: 0
                    type: integer
                use:
                    description: Deliver the credential in envVar. Defaults to true unless delegate is set.
                    type: boolean
            required:
                - secret
            type: object
        SandboxFileType:
            description: What a path is. A symbolic link is reported as itself, never as what it points to.
            enum:
                - file
                - directory
                - symlink
                - other
            type: string
        SandboxFileStat:
            additionalProperties: false
            description: One path in a discobox, as its default user sees it.
            properties:
                path:
                    description: The absolute path, cleaned.
                    type: string
                name:
                    description: The last element of the path.
                    type: string
                type:
                    $ref: '#/components/schemas/SandboxFileType'
                size:
                    description: Size in bytes.
                    format: int64
                    type: integer
                mode:
                    description: The permission bits with setuid, setgid and sticky, as chmod takes them (0755 is 493).
                    format: int64
                    type: integer
                modifiedAt:
                    format: date-time
                    type: string
                version:
                    description: An opaque tag that changes whenever the content does. A write may name it to replace only what was read. A link's is the version of what it points to, which a read or a write of it reaches.
                    type: string
                linkTarget:
                    description: What a symbolic link points to, as written in it. Set only for a symlink.
                    type: string
            required:
                - path
                - name
                - type
                - size
                - mode
                - modifiedAt
                - version
            type: object
        SandboxFileList:
            additionalProperties: false
            properties:
                path:
                    description: The directory listed, absolute and cleaned.
                    type: string
                entries:
                    description: What the directory holds, by name.
                    items:
                        $ref: '#/components/schemas/SandboxFileStat'
                    type: array
            required:
                - path
                - entries
            type: object
        SandboxFileMkdirRequest:
            additionalProperties: false
            properties:
                path:
                    description: The directory to create. Absolute, or relative to the default user's home; a leading `~` is that home.
                    type: string
                parents:
                    description: Create missing parents too, and succeed when the directory already exists.
                    type: boolean
                mode:
                    description: Permission bits for a directory this creates, before the umask. Defaults to 0777 (511).
                    format: int64
                    maximum: 4095
                    minimum: 0
                    type: integer
            required:
                - path
            type: object
        SandboxFileRemoveRequest:
            additionalProperties: false
            properties:
                path:
                    description: The path to remove. Absolute, or relative to the default user's home; a leading `~` is that home.
                    type: string
                recursive:
                    description: Remove a directory with everything it holds. Without it a directory must be empty.
                    type: boolean
            required:
                - path
            type: object
        SandboxFileTransferRequest:
            additionalProperties: false
            description: A move or a copy from one path in the discobox to another.
            properties:
                from:
                    description: The source path. Absolute, or relative to the default user's home; a leading `~` is that home.
                    type: string
                to:
                    description: The destination path, the same way.
                    type: string
                replace:
                    description: Replace what is already at the destination. Without it a destination that exists is a 409.
                    type: boolean
            required:
                - from
                - to
            type: object
        SandboxExecScreen:
            additionalProperties: false
            description: A terminal's screen as a person looking at it would read it.
            properties:
                observedAt:
                    description: Set only when this was answered from the discobox's last inventory rather than by the discobox, which was not running - when the discobox posted it (ADR 26-10-11-657). Absent from a live answer.
                    format: date-time
                    type: string
                rows:
                    format: int64
                    type: integer
                cols:
                    format: int64
                    type: integer
                cursorRow:
                    description: Zero-based cursor row.
                    format: int64
                    type: integer
                cursorCol:
                    description: Zero-based cursor column.
                    format: int64
                    type: integer
                cursorVisible:
                    type: boolean
                title:
                    description: The window title the program last set.
                    type: string
                altScreen:
                    description: Whether the program is on the alternate screen, which has no scrollback.
                    type: boolean
                lines:
                    description: The visible screen, one string per row, trailing blanks trimmed.
                    items:
                        type: string
                    type: array
                scrollback:
                    description: Lines above the screen, oldest first.
                    items:
                        type: string
                    type: array
                outputAt:
                    description: When the program last wrote output.
                    format: date-time
                    type: string
                exited:
                    description: Whether the program has exited. Its last screen stays readable while the terminal lingers after exit.
                    type: boolean
            required:
                - rows
                - cols
                - cursorRow
                - cursorCol
                - cursorVisible
                - altScreen
                - lines
                - exited
            type: object
        SandboxExecInputBody:
            additionalProperties: false
            properties:
                input:
                    description: Parts written in order.
                    items:
                        $ref: '#/components/schemas/SandboxExecInputPart'
                    minItems: 1
                    type: array
            required:
                - input
            type: object
        SandboxExecInputPart:
            additionalProperties: false
            description: One piece of input, naming exactly one of text or key.
            properties:
                text:
                    description: Text, delivered as a bracketed paste when the program enabled one.
                    type: string
                key:
                    description: 'One named key: Enter, Tab, Escape, Backspace, Delete, Up, Down, Left, Right, Home, End, PageUp, PageDown, or C-a through C-z.'
                    type: string
            type: object
        SandboxExecWaitBody:
            additionalProperties: false
            properties:
                until:
                    $ref: '#/components/schemas/SandboxExecWaitUntil'
                timeoutSeconds:
                    description: How long to wait, at most 60 seconds.
                    format: int64
                    maximum: 60
                    minimum: 1
                    type: integer
            required:
                - until
                - timeoutSeconds
            type: object
        SandboxExecWaitUntil:
            additionalProperties: false
            description: The conditions a wait ends on; the first to hold ends it.
            properties:
                hookEvents:
                    description: Harness hook event names from this terminal, such as Stop and Notification. A name matches either the harness's own event or its canonical (Claude Code) name, so a caller need not know which harness the terminal runs.
                    items:
                        type: string
                    type: array
                after:
                    description: Only hooks recorded after this point count — the resumeAfter a previous wait or input answered with, passed back as given, so nothing recorded between two calls is missed. Absent, only hooks recorded after the wait began.
                    type: string
                quietSeconds:
                    description: Neither output nor input for this many seconds, counted from no earlier than the start of the wait.
                    format: int64
                    minimum: 1
                    type: integer
                exit:
                    description: The exec has ended.
                    type: boolean
            type: object
        SandboxExecWaitResult:
            additionalProperties: false
            properties:
                reason:
                    enum:
                        - hook
                        - quiet
                        - exit
                        - timeout
                    type: string
                hook:
                    $ref: '#/components/schemas/HarnessHookLog'
                    description: The hook that ended the wait, when one did.
                outputAt:
                    description: When the program last wrote output.
                    format: date-time
                    type: string
                resumeAfter:
                    description: Where the next wait resumes, to pass as until.after exactly as given. After a hook, just past that hook; otherwise the point this wait counted from, so a hook recorded while it returned is still found.
                    type: string
            required:
                - reason
                - resumeAfter
            type: object
        SandboxExecInputResult:
            additionalProperties: false
            properties:
                resumeAfter:
                    description: The point just before the input was delivered, for a wait on what it causes to pass as until.after exactly as given.
                    type: string
            required:
                - resumeAfter
            type: object
        HarnessHookLogsResponse:
            additionalProperties: false
            properties:
                hooks:
                    items:
                        $ref: '#/components/schemas/HarnessHookLog'
                    type: array
            required:
                - hooks
            type: object
        PoolResourceReport:
            additionalProperties: true
            description: |
                What a pool's own services are consuming, as of its last resource report: the
                pool agent, buildkitd, the registry and the proxy, from the pool container's
                cgroup. The sandboxes are not in it - they run under a nested runtime with its
                own cgroups - so the pool's total load is this plus the sum of the per-sandbox
                figures.
            properties:
                reportedAt:
                    format: date-time
                    type: string
                cpu:
                    $ref: '#/components/schemas/PoolCPUUsage'
                memory:
                    $ref: '#/components/schemas/PoolMemoryUsage'
                storage:
                    $ref: '#/components/schemas/PoolStorageUsage'
                total:
                    $ref: '#/components/schemas/PoolTotalUsage'
                    description: What Discobox as a whole is using here, services and sandboxes together, against what is dedicated to it.
            required:
                - reportedAt
                - cpu
                - memory
                - storage
            type: object
        PoolTotalUsage:
            additionalProperties: true
            description: |
                What Discobox as a whole is using on this host, and what it has to use:
                the pool's own services plus every sandbox on it, against the host's
                capacity.

                It is computed by the agent from one tick's samples rather than left to a
                consumer to add up, because the operands live on different rows - the
                services on the pool, each sandbox on its own - and a reader joining them
                can catch one refreshed and another not. Here they are always the same
                instant.
            properties:
                cpuVcpus:
                    description: CPU burned per second of wall clock across everything Discobox runs here, in whole-CPU units. Absent until there are two samples to difference.
                    format: double
                    type: number
                capacityVcpus:
                    description: The host's own CPU count, which is what the agent can measure. Where an operator set a smaller size on the pool, that size is what is really dedicated and a reader holding the pool record prefers it; a size of zero means "sized by the host".
                    format: double
                    type: number
                memoryBytes:
                    description: Memory charged across everything Discobox runs here.
                    format: int64
                    type: integer
                capacityBytes:
                    description: The host's own memory, read the same way as capacityVcpus.
                    format: int64
                    type: integer
                sandboxCount:
                    description: How many sandboxes the figures above cover.
                    format: int64
                    type: integer
            required:
                - capacityVcpus
                - memoryBytes
                - capacityBytes
                - sandboxCount
            type: object
        PoolCPUUsage:
            additionalProperties: true
            description: |
                What the pool's own services cost: the pool agent, the shared BuildKit
                builder, the pool registry and the proxy, measured from the pool container's
                own cgroup.

                This deliberately excludes the sandboxes. They run under a nested container
                runtime whose cgroups are not children of the pool container's, so the pool
                total is `vcpus` here PLUS the sum of the per-sandbox `vcpus` - an addition
                of two disjoint measurements, never a subtraction.
            properties:
                usageUsec:
                    description: Total CPU microseconds charged to the pool container's cgroup.
                    format: int64
                    type: integer
                userUsec:
                    format: int64
                    type: integer
                systemUsec:
                    format: int64
                    type: integer
                vcpus:
                    description: CPU burned per second of wall clock, in whole-CPU units - 1.0 is one core saturated. Absent when there was no previous sample to difference, which is the first report after the agent started. Absent is deliberately not zero, because "not measured yet" and "idle" are different claims.
                    format: double
                    type: number
                windowSeconds:
                    description: How far apart the two samples behind vcpus were. A missed report widens this rather than invalidating the rate.
                    format: double
                    type: number
                capacityVcpus:
                    description: How many CPUs the host has, so a rate has something to be read against.
                    format: double
                    type: number
            required:
                - usageUsec
                - userUsec
                - systemUsec
            type: object
        PoolMemoryUsage:
            additionalProperties: true
            description: What the pool's own services hold, from the pool container's own cgroup. Excludes the sandboxes, which are charged to their own cgroups outside this subtree.
            properties:
                currentBytes:
                    format: int64
                    type: integer
                peakBytes:
                    format: int64
                    type: integer
                limitBytes:
                    description: The cgroup's memory ceiling, absent when unlimited.
                    format: int64
                    type: integer
                availableBytes:
                    description: What the host still has free, which is what the pool is actually bounded by when the cgroup carries no limit.
                    format: int64
                    type: integer
                capacityBytes:
                    description: How much memory the host has, so a figure has something to be read against. The counterpart of cpu.capacityVcpus.
                    format: int64
                    type: integer
            required:
                - currentBytes
            type: object
        PoolFilesystemUsage:
            additionalProperties: true
            description: |
                The filesystem behind /var/lib/discobox, as statfs describes it. This measures
                the whole backing filesystem, which on most hosts holds more than Discobox:
                usedBytes is the filesystem's, not this pool's, and what Discobox holds is the
                walked totals elsewhere in the report. usedBytes plus freeBytes is less than
                totalBytes on a filesystem with reserved blocks, which are neither.
            properties:
                totalBytes:
                    format: int64
                    type: integer
                usedBytes:
                    format: int64
                    type: integer
                freeBytes:
                    description: What an unprivileged writer can still use.
                    format: int64
                    type: integer
            required:
                - totalBytes
                - usedBytes
                - freeBytes
            type: object
        SandboxStorageUsage:
            additionalProperties: true
            description: |
                One sandbox's durable footprint, by the tree that holds it, walked fresh.
                There is deliberately no cache figure: cache is one pool-shared tree keyed by
                the target path a harness declared rather than by which sandbox wrote it, so a
                per-sandbox cache size has no on-disk answer and is reported once at the pool
                instead.
            properties:
                sandboxId:
                    type: string
                dataBytes:
                    format: int64
                    type: integer
                configBytes:
                    format: int64
                    type: integer
                sourcesBytes:
                    format: int64
                    type: integer
                secretsBytes:
                    format: int64
                    type: integer
                originsBytes:
                    format: int64
                    type: integer
                totalBytes:
                    description: The five trees above, summed. Counted as allocated blocks rather than apparent size, so it is comparable with the filesystem's own used figure.
                    format: int64
                    type: integer
            required:
                - sandboxId
                - dataBytes
                - configBytes
                - sourcesBytes
                - secretsBytes
                - originsBytes
                - totalBytes
            type: object
        PoolStorageWalk:
            additionalProperties: true
            description: |
                One completed sweep of the pool's trees, with when it happened and when the
                next is due. The sweep costs one pass over every inode the pool owns, so it
                runs on its own adaptive schedule rather than on the reporting tick: the
                agent spends a fixed fraction of wall-clock time walking, which makes an
                expensive pool walked rarely and a cheap one often with nothing to tune per
                pool.

                These figures are therefore older than the rest of the report, and
                deliberately so. observedAt says how old, and nextScanAt says how old they
                are allowed to get.
            properties:
                observedAt:
                    description: When this sweep finished. The walked figures describe the pool as of this moment, not as of the report that carries them.
                    format: date-time
                    type: string
                durationMillis:
                    description: What this sweep cost. It is also the input to the next interval, so a reader can see why a pool is being walked as often as it is.
                    format: int64
                    type: integer
                intervalSeconds:
                    description: How long the agent will wait before the next sweep, derived from durationMillis and the agent's walking duty cycle.
                    format: double
                    type: number
                nextScanAt:
                    description: When the next sweep is due. A figure still unchanged well past this is a sweep that failed or an agent that stopped.
                    format: date-time
                    type: string
                dataBytes:
                    description: |
                        Every sandbox's durable tree on this pool, summed. Optional rather than
                        required: an agent that predates it writes a sweep without one, and a
                        missing field must cost that figure rather than the whole report, which
                        would read as a pool that has never been measured. It is the sandboxes'
                        own storage and nothing shared: each tree holds that sandbox's home, its
                        sources and its nested container store, which are genuinely its own
                        copies rather than links into anything.

                        Summed here rather than left to a reader because the parts land on
                        different rows - each sandbox's own - and a reader joining them can
                        catch one refreshed and another not.
                    format: int64
                    type: integer
                cacheBytes:
                    description: The pool's shared cache tree, counted once for the pool because that is exactly what it is - it is bind-mounted whole into every sandbox.
                    format: int64
                    type: integer
                buildBytes:
                    description: buildkitd's store and the pool registry's blobs, which no sandbox can reach and which no per-sandbox figure accounts for.
                    format: int64
                    type: integer
            required:
                - observedAt
                - durationMillis
                - intervalSeconds
                - nextScanAt
                - cacheBytes
                - buildBytes
            type: object
        PoolStorageUsage:
            additionalProperties: true
            description: |
                What this pool holds on disk, at two deliberately different freshnesses.
                filesystem is one statfs - taken on every report, and the figure that answers
                whether the disk is about to fill. walk is the per-tree attribution, which
                costs a pass over every inode and so runs on its own schedule. Reporting them
                as one would make the cheap number as stale as the expensive one, or the
                expensive one as frequent as the cheap one.
            properties:
                root:
                    description: The container path every tree below is rooted at.
                    type: string
                filesystem:
                    $ref: '#/components/schemas/PoolFilesystemUsage'
                walk:
                    $ref: '#/components/schemas/PoolStorageWalk'
                    description: The last completed sweep. Absent until the first one finishes, which is not the same as a pool holding nothing - a pool whose first sweep is still running has no attribution yet, and zeroes would claim it is empty.
            required:
                - root
                - filesystem
            type: object
        SandboxCPUConsumption:
            additionalProperties: true
            description: Both the cumulative counter and the rate - the counter so a consumer can difference across any two reports it kept, the rate so it does not have to.
            properties:
                usageUsec:
                    format: int64
                    type: integer
                userUsec:
                    format: int64
                    type: integer
                systemUsec:
                    format: int64
                    type: integer
                vcpus:
                    description: CPU burned per second of wall clock, in whole-CPU units. Additive across sandboxes and comparable between them, because every sandbox in the pool was differenced over the same tick by the one agent that polls all of them. Absent means not measured yet, never idle.
                    format: double
                    type: number
                windowSeconds:
                    format: double
                    type: number
                limitVcpus:
                    description: The sandbox cgroup's own CPU quota, absent when unlimited. Sandbox containers are created with no CPU limit today, so this is normally absent and a sandbox really can starve its pool.
                    format: double
                    type: number
            required:
                - usageUsec
                - userUsec
                - systemUsec
            type: object
        SandboxMemoryConsumption:
            additionalProperties: true
            description: |
                Two different true answers about the same sandbox. currentBytes
                is what the host charges it, including page cache and kernel memory.
                virtualBytes and residentBytes are what its own processes hold, summed, and so
                double-count every shared page: summed resident routinely exceeds
                currentBytes, which is expected rather than a defect.
            properties:
                currentBytes:
                    format: int64
                    type: integer
                peakBytes:
                    format: int64
                    type: integer
                anonBytes:
                    format: int64
                    type: integer
                fileBytes:
                    description: Page cache charged to the sandbox. Reclaimable under pressure, unlike anonymous memory.
                    format: int64
                    type: integer
                limitBytes:
                    format: int64
                    type: integer
                virtualBytes:
                    format: int64
                    type: integer
                residentBytes:
                    format: int64
                    type: integer
            required:
                - currentBytes
                - virtualBytes
                - residentBytes
            type: object
        ProcessConsumption:
            additionalProperties: true
            description: |
                One process inside a sandbox, ranked by what it is using now rather than by
                what it has used since it started. Ranking by the cumulative counter would put
                a language server that has been up for a day above a test run that started two
                minutes ago, which is not what anyone means by "what is using all the CPU".
            properties:
                pid:
                    format: int64
                    type: integer
                command:
                    type: string
                cmdline:
                    type: string
                cpuUsec:
                    description: Cumulative CPU microseconds this process has used since it started.
                    format: int64
                    type: integer
                vcpus:
                    description: This process's own rate. Absent when it was not present in the previous sample, which includes every process in the first report and any process that has just started.
                    format: double
                    type: number
                virtualBytes:
                    format: int64
                    type: integer
                residentBytes:
                    format: int64
                    type: integer
            required:
                - pid
                - command
                - cpuUsec
                - virtualBytes
                - residentBytes
            type: object
        SandboxResourceConsumption:
            additionalProperties: true
            description: One sandbox's consumption, as the pool agent computed it from the counters that sandbox reported.
            properties:
                sandboxId:
                    type: string
                observedAt:
                    description: When the sandbox took the sample behind these figures. Rates are computed against this rather than the reporting tick, so poll skew cannot distort one. Zero when the sandbox reported no counters at all, in which case only storage below is meaningful.
                    format: date-time
                    type: string
                source:
                    description: What the sandbox said its totals came from. cgroup is authoritative; machine means the sandbox is a whole machine and the totals are its kernel's own; proc means it could read neither and a per-process rollup stood in, which sees no page cache.
                    type: string
                cpu:
                    $ref: '#/components/schemas/SandboxCPUConsumption'
                memory:
                    $ref: '#/components/schemas/SandboxMemoryConsumption'
                processCount:
                    format: int64
                    type: integer
                processes:
                    description: The busiest by rate and the largest by resident size, deduplicated.
                    items:
                        $ref: '#/components/schemas/ProcessConsumption'
                    type: array
                storage:
                    $ref: '#/components/schemas/SandboxStorageUsage'
                    description: This sandbox's disk footprint, present whenever its tree was walked. A stopped sandbox uses no CPU but still holds its disk, so it is reported with storage alone rather than dropped.
            required:
                - sandboxId
            type: object
        ReportPoolResourcesBody:
            additionalProperties: false
            description: |
                One resource report: what this pool is using, and what each sandbox on it is
                using, in one delivery. Every rate was computed by the pool agent
                from cumulative counters over one tick, which is what makes the per-sandbox
                figures rankable - all of them were measured over the same window.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    readOnly: true
                    type: string
                report:
                    $ref: '#/components/schemas/PoolResourceReport'
                    description: The pool-wide half, stored verbatim on the pool. It is a field of this request rather than a set of fields copied out of it, so the stored shape and the reported shape cannot drift apart.
                sandboxes:
                    description: Every sandbox this pool hosts, running or not.
                    items:
                        $ref: '#/components/schemas/SandboxResourceConsumption'
                    type: array
            required:
                - report
                - sandboxes
            type: object
        SandboxAgentCPUUsage:
            additionalProperties: false
            description: |
                Cumulative CPU time charged to the sandbox. Never a rate: what "busy" means
                is the difference between two samples over the time between them, and the
                component holding two samples is the pool agent, which polls every sandbox
                in the pool on one tick and so measures them all over the same window.
            properties:
                usageUsec:
                    description: Total CPU microseconds charged to the sandbox's cgroup since it was created.
                    format: int64
                    type: integer
                userUsec:
                    description: CPU microseconds spent in user mode.
                    format: int64
                    type: integer
                systemUsec:
                    description: CPU microseconds spent in kernel mode.
                    format: int64
                    type: integer
                limitVcpus:
                    description: The cgroup's own CPU quota in whole-CPU units, absent when unlimited. Sandbox containers are created with no CPU limit today, so this is normally absent.
                    format: double
                    type: number
            required:
                - usageUsec
                - userUsec
                - systemUsec
            type: object
        SandboxAgentMemoryUsage:
            additionalProperties: false
            description: |
                Two different true answers about the same sandbox. currentBytes is
                what the host charges it - anonymous memory, page cache and kernel memory
                together. virtualBytes and residentBytes are what its own processes hold,
                summed, and so double-count every shared page: summed resident routinely
                exceeds currentBytes, which is expected rather than a defect.
            properties:
                currentBytes:
                    description: Memory the sandbox's cgroup is charged for, including page cache and kernel memory. Falls back to summed resident size when the cgroup is unreadable.
                    format: int64
                    type: integer
                peakBytes:
                    description: High-water mark of currentBytes over the cgroup's life.
                    format: int64
                    type: integer
                anonBytes:
                    description: Anonymous memory charged to the cgroup.
                    format: int64
                    type: integer
                fileBytes:
                    description: Page cache charged to the cgroup. Reclaimable under pressure, unlike anonymous memory.
                    format: int64
                    type: integer
                limitBytes:
                    description: The cgroup's memory ceiling, absent when unlimited. Sandbox containers are created with no memory limit today, so this is normally absent.
                    format: int64
                    type: integer
                virtualBytes:
                    description: Sum of every process's VmSize. Address space reserved, not memory held; a process that maps a large file inflates this without consuming anything.
                    format: int64
                    type: integer
                residentBytes:
                    description: Sum of every process's VmRSS. Double-counts pages shared between processes.
                    format: int64
                    type: integer
            required:
                - currentBytes
                - virtualBytes
                - residentBytes
            type: object
        SandboxAgentProcessUsage:
            additionalProperties: false
            description: |
                One candidate process, with cumulative counters for the same reason the
                sandbox totals carry them. This is a candidate list, not an answer: it is the
                union of the busiest by cumulative CPU and the largest by resident size, and
                whoever differences two samples ranks them by rate and keeps far fewer.
            properties:
                pid:
                    description: Sandbox-local process ID.
                    format: int64
                    type: integer
                command:
                    description: The process's own executable name, as the kernel reports it.
                    type: string
                cmdline:
                    description: Full argv, space-joined. Empty for a kernel thread.
                    type: string
                startTicks:
                    description: Process start time in kernel ticks since boot. Part of this process's identity rather than decoration - PIDs are reused, and differencing a recycled PID against its predecessor's counter would produce a nonsense spike.
                    format: int64
                    type: integer
                cpuUsec:
                    description: Cumulative CPU microseconds (user plus system) this process has used.
                    format: int64
                    type: integer
                virtualBytes:
                    description: This process's VmSize.
                    format: int64
                    type: integer
                residentBytes:
                    description: This process's VmRSS.
                    format: int64
                    type: integer
            required:
                - pid
                - command
                - startTicks
                - cpuUsec
                - virtualBytes
                - residentBytes
            type: object
        SandboxAgentResourceUsage:
            additionalProperties: false
            description: The sandbox's own resource consumption at one moment, as cumulative counters.
            properties:
                observedAt:
                    description: When this sample was taken. Rates are computed against this, never against the reporting tick's wall clock, so poll skew inside a tick cannot distort one.
                    format: date-time
                    type: string
                source:
                    description: Where the totals came from. cgroup is authoritative; machine means the sandbox is a whole machine and the totals are its kernel's own, page cache included, against the machine's size and CPUs; proc means neither could be read and a per-process rollup stood in, which sees no page cache and no kernel memory.
                    enum:
                        - cgroup
                        - machine
                        - proc
                    type: string
                cpu:
                    $ref: '#/components/schemas/SandboxAgentCPUUsage'
                memory:
                    $ref: '#/components/schemas/SandboxAgentMemoryUsage'
                processCount:
                    description: How many processes were running in the sandbox, counted over all of them rather than over the candidates below.
                    format: int64
                    type: integer
                processes:
                    description: Candidate processes - the union of the busiest by cumulative CPU and the largest by resident size.
                    items:
                        $ref: '#/components/schemas/SandboxAgentProcessUsage'
                    type: array
            required:
                - observedAt
                - source
                - cpu
                - memory
                - processCount
            type: object
        SandboxAgentListeningPort:
            additionalProperties: false
            properties:
                serviceId:
                    description: |-
                        Id of the declaration this port came from, absent for a port only discovery
                        found. Stable and matchable: `ai.discobox.desktop` is the sandbox's desktop
                        viewer, which a client is expected to recognize and give its own affordance
                        rather than list as an HTTP port. The `ai.discobox.` namespace is reserved
                        for declarations the image ships.
                    type: string
                serviceName:
                    description: Display name of the declaration this port came from, so a client can label it without a second request. Absent for a port only discovery found.
                    type: string
                port:
                    description: Port the sandbox serves - one its own processes were seen listening on or bound, one a service declares, or both. A TCP port and a UDP port with the same number are two entries, told apart by protocol.
                    format: int64
                    type: integer
                addresses:
                    description: Every local address bound to this port - a wildcard address for a wildcard bind, 127.0.0.1 for a loopback-only one. A port is reachable from inside the sandbox's network namespace either way, so this describes the bind rather than reachability. Absent for a declared port nothing observable is listening on.
                    items:
                        type: string
                    type: array
                declared:
                    description: |
                        True when a service under .discobox/services declares this port,
                        which puts it on the record whether or not anything observable is listening
                        on it. Discovery only sees sockets the sandbox user owns, so a port
                        published by a nested container or bound by a socket-activated unit - root's
                        socket either way - is reported only because it was declared.
                    type: boolean
                protocol:
                    description: |
                        What the port turned out to speak, established by probing it once when it
                        appeared. tcp means reached and not HTTP (a database, an SSH daemon, an
                        HTTP/2-only server); unknown means not classified yet or unreachable when
                        probed, and is retried. udp is a bound UDP socket, which is never probed;
                        it is the only value that is not a TCP port, so it is also what says which
                        transport a forward of this port has to carry.
                    enum:
                        - http
                        - https
                        - tcp
                        - udp
                        - unknown
                    type: string
                firstSeenAt:
                    description: When this port was first listed - first observed listening, or first declared. Survives a restart of whatever is behind it, as long as the port itself never went away in between.
                    format: date-time
                    type: string
            required:
                - port
                - protocol
                - firstSeenAt
            type: object
        SandboxAgentAutostopStatus:
            additionalProperties: false
            description: The sandbox's own idle-stop policy, as it sees the sandbox at observedAt. Until its pool hands its power to the control plane the sandbox powers itself off once nothing has happened in it for the idle timeout; after, it reports idle, sleep and its next wake and the control plane powers it (ADR 26-10-16-337). The next sandbox-directed request starts it again. Every string in it is text the sandbox chose.
            properties:
                idleTimeoutSeconds:
                    description: How long the sandbox runs with nothing happening in it before it powers itself off.
                    format: int64
                    type: integer
                lastActivityAt:
                    description: Latest activity of any kind - what a terminal shows changing (its text or title), a client connected or leaving, a keepalive lease, or the sandbox agent starting. A connected client makes it the observation time, and a lease dated in the future makes it that date.
                    format: date-time
                    type: string
                lastActivity:
                    description: What lastActivityAt was, for example "screen change on exec <id>" or "lease /run/discobox/keepalive/build". Text for a person reading it, not a value to branch on.
                    type: string
                stopsAt:
                    description: lastActivityAt plus the idle timeout - the earliest the sandbox powers itself off if nothing else happens.
                    format: date-time
                    type: string
                leaseUntil:
                    description: The latest keepalive lease's time, when one is in the future.
                    format: date-time
                    type: string
                controlPlanePower:
                    description: Always true from a sandbox agent that can hand its power to the control plane - report idle, sleep and wake rather than power itself off. The pool hands it over only to a sandbox that says so (ADR 26-10-16-337 §8).
                    type: boolean
                idle:
                    description: Present once the pool has handed the sandbox's power to the control plane, and true when the sandbox has been idle for its timeout - the point at which it used to power itself off. The control plane stops it after the sandbox confirms, fresh, that it still is.
                    type: boolean
                sleep:
                    $ref: '#/components/schemas/SandboxAgentAutostopSleep'
                wakeAt:
                    description: The earliest wake in the future, from ~/.discobox/wake. Present only once the pool has handed the sandbox's power to the control plane.
                    format: date-time
                    type: string
                wake:
                    description: The file name of the wake at wakeAt. Text the sandbox chose; escape it before printing it.
                    type: string
            required:
                - idleTimeoutSeconds
                - lastActivityAt
                - lastActivity
                - stopsAt
            type: object
        SandboxAgentAutostopSleep:
            additionalProperties: false
            description: A pending request to sleep - a file in /run/discobox/sleep. Present only once the pool has handed the sandbox's power to the control plane, which then powers the sandbox down - freezing it where its runtime can - after the sandbox confirms the request is still pending (ADR 26-10-16-337 §§1, 5).
            properties:
                requestedAt:
                    description: The latest pending request's modification time.
                    format: date-time
                    type: string
                request:
                    description: The latest pending request's file name. Text the sandbox chose; escape it before printing it.
                    type: string
            required:
                - requestedAt
                - request
            type: object
        SandboxAutostopConfirmRequest:
            additionalProperties: false
            description: Which power-down the pool is about to carry out, for the sandbox to confirm against what it sees now.
            properties:
                reason:
                    description: idle when the sandbox reported itself idle; sleep when it reported a pending sleep request.
                    enum:
                        - idle
                        - sleep
                    type: string
            required:
                - reason
            type: object
        SandboxAutostopConfirmation:
            additionalProperties: false
            description: The sandbox's confirmation of a power-down, carrying its earliest pending wake - one in the future, or one already due that no boot has yet handed to the harness.
            properties:
                wakeAt:
                    description: When the sandbox asks to be started again. Absent when it has no pending wake.
                    format: date-time
                    type: string
                wake:
                    description: The file name of that wake. Text the sandbox chose.
                    type: string
            type: object
        SandboxCacheClearance:
            additionalProperties: false
            description: What the sandbox emptied on its pool's word.
            properties:
                paths:
                    description: The cache paths whose contents were removed, each kept as an empty directory.
                    items:
                        type: string
                    type: array
            type: object
        SandboxAutostopResumption:
            additionalProperties: false
            description: What the sandbox did on being told it was thawed.
            properties:
                wakes:
                    description: Paths of the wakes that were due and were moved into ~/.discobox/wake/.done/, oldest first. Text the sandbox chose.
                    items:
                        type: string
                    type: array
            type: object
        SandboxAgentGitSourceStatus:
            additionalProperties: false
            properties:
                slug:
                    type: string
                target:
                    type: string
                clean:
                    type: boolean
                branch:
                    type: string
                headCommit:
                    type: string
                ahead:
                    format: int64
                    type: integer
                behind:
                    format: int64
                    type: integer
                diffBase:
                    description: Commit the diff stat is measured against - the commit the source was spawned at, forwarded to the merge base with the source's upstream tracking ref once the sandbox has fetched, so pulled commits do not count as the sandbox's changes. Absent when no base commit was recorded or the repository does not have it, in which case no diff stat is reported.
                    type: string
                diffFiles:
                    description: Files changed against diffBase, as git diff --shortstat counts them (tracked changes only, committed and uncommitted).
                    format: int64
                    type: integer
                diffAdded:
                    description: Lines added against diffBase.
                    format: int64
                    type: integer
                diffDeleted:
                    description: Lines deleted against diffBase.
                    format: int64
                    type: integer
                porcelain:
                    description: Bounded git status --porcelain=v2 output for this source.
                    type: string
                truncated:
                    description: Whether porcelain output was truncated to the capture limit.
                    type: boolean
                error:
                    description: Non-fatal error observing this source (e.g. missing directory, not a git repository).
                    type: string
                observedAt:
                    format: date-time
                    type: string
            required:
                - slug
                - target
                - clean
                - observedAt
            type: object
        SandboxAgentSessionStatus:
            additionalProperties: false
            properties:
                terminalId:
                    type: string
                currentHarnessId:
                    description: The sandbox's selected harness used for this terminal's current or next revival. The historical harnessId and creation metadata remain unchanged.
                    type: string
                harnessId:
                    type: string
                primary:
                    type: boolean
                title:
                    description: Window title the program in the session last set (OSC 0/2), read from its terminal emulator. Absent when the session never titled itself - the sandbox's name and prompt are already on the record, so nothing is backfilled here.
                    type: string
                lastAccessedAt:
                    description: Last time a client acted on this session - attached, typed, or is attached right now. Absent when no client ever has.
                    format: date-time
                    type: string
                startedAt:
                    format: date-time
                    type: string
                attacherCount:
                    description: Number of clients currently attached to this terminal.
                    format: int64
                    type: integer
                execStatus:
                    description: Underlying exec process status.
                    type: string
                programStatus:
                    $ref: '#/components/schemas/SandboxAgentProgramStatus'
                    description: What the program in the session last reported of itself over OSC 7501 (ADR 26-10-16-424). Where present it is the session's status, harness and all, and nothing is derived beside it. Absent when the program reported nothing it still stands by.
            required:
                - terminalId
                - primary
                - attacherCount
                - execStatus
            type: object
        SandboxAgentProgramStatus:
            additionalProperties: false
            description: One program's reported status (OSC 7501, the Program Status Protocol) - the terminal's root record, or with none the most pressing of its others.
            properties:
                state:
                    description: idle is waiting for the next instruction, working is busy, done is finished with a result not yet seen, blocked is waiting on a person, error is failed and stopped.
                    enum:
                        - idle
                        - working
                        - done
                        - blocked
                        - error
                    type: string
                kind:
                    description: What a blocked program needs from the person. Absent when the program did not say, and for every other state.
                    enum:
                        - permission
                        - question
                        - auth
                    type: string
                progress:
                    description: Percent complete, 0 to 100, of a working or blocked program that said. Absent when indeterminate.
                    format: int64
                    type: integer
                app:
                    description: The stable identifier of the program that reported, such as claude-code.
                    type: string
                title:
                    description: A short label the program gave the record. Control characters are never present.
                    type: string
                msg:
                    description: One line the program gave about what it is doing, waiting for, or produced. Control characters are never present.
                    type: string
                reportedAt:
                    description: When the terminal last took a report from the program.
                    format: date-time
                    type: string
            required:
                - state
                - reportedAt
            type: object
        SandboxAgentInventory:
            additionalProperties: false
            description: What a sandbox's list reads answer, posted so that they can be answered while it is not running (ADR 26-10-11-657). A part the sandbox cannot answer is absent, not empty.
            properties:
                observedAt:
                    description: When the sandbox agent took this inventory, on the sandbox's clock.
                    format: date-time
                    type: string
                digest:
                    description: Hash of execs, services, tools and screens, and of nothing else. Two inventories with one digest answer every read alike.
                    type: string
                unchanged:
                    description: True when the digest is the one the caller named as known. The parts are then omitted.
                    type: boolean
                execs:
                    description: What listing the sandbox's execs answers.
                    items:
                        $ref: '#/components/schemas/SandboxExec'
                    type: array
                services:
                    description: What listing the sandbox's services answers.
                    items:
                        $ref: '#/components/schemas/SandboxService'
                    type: array
                tools:
                    description: What listing the sandbox's tools answers.
                    items:
                        $ref: '#/components/schemas/SandboxTool'
                    type: array
                screens:
                    additionalProperties:
                        $ref: '#/components/schemas/SandboxExecScreen'
                    description: The visible screen of every exec that has one, by exec ID, with no scrollback.
                    type: object
            required:
                - observedAt
                - digest
            type: object
        SandboxAgentStatusResponse:
            additionalProperties: false
            properties:
                harnessConfigCandidate:
                    type: string
                harnessConfigState:
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/SandboxAgentGitSourceStatus'
                    type: array
                sessions:
                    description: Terminal sessions only, live and ended alike - every terminal a record still exists for, typically just the primary. One-shot execs are not sessions and never appear.
                    items:
                        $ref: '#/components/schemas/SandboxAgentSessionStatus'
                    type: array
                ports:
                    description: Ports the sandbox serves - the TCP ports its own processes were seen listening on and the UDP ports they have bound, plus those its services declare. Unlike sources and sessions this is a snapshot from a standing watcher rather than computed per request, since classifying a port means connecting to it; it can be up to one watcher interval stale.
                    items:
                        $ref: '#/components/schemas/SandboxAgentListeningPort'
                    type: array
                resources:
                    $ref: '#/components/schemas/SandboxAgentResourceUsage'
                    description: This sandbox's CPU and memory consumption as cumulative counters. Absent on a platform where neither the cgroup nor procfs could be read.
                autostop:
                    $ref: '#/components/schemas/SandboxAgentAutostopStatus'
                    description: The sandbox's idle-stop policy. Absent while the policy is not running, which in a configure-mode sandbox is always.
                meta:
                    $ref: '#/components/schemas/SandboxMeta'
                    description: The sandbox's name, description and tags, read from ~/.discobox/meta.json in the sandbox user's home, which is their system of record. Empty when there is no such file. Absent when the file could not be read or is not valid, in which case metaError says why.
                metaError:
                    description: Why the meta file could not be read. Present only when meta is absent.
                    type: string
                runtimeConfigRevision:
                    description: The revision of the runtime-config document the sandbox has applied (ADR 0126 §3). Absent while it has applied none.
                    format: int64
                    type: integer
                sourceStates:
                    description: How far the sandbox has converged each source the applied runtime-config document names (ADR 0126 §4). Absent while no document names a source.
                    items:
                        $ref: '#/components/schemas/SandboxAgentSourceState'
                    type: array
                provision:
                    $ref: '#/components/schemas/SandboxAgentProvisionStatus'
                    description: The sandbox's provisioning this boot, its /run/discobox/provision.json (ADR 26-10-16-423 §6). Absent from a sandbox agent that predates it.
                observedAt:
                    format: date-time
                    type: string
            required:
                - sources
                - sessions
                - ports
                - observedAt
            type: object
        SandboxAgentProvisionStatus:
            additionalProperties: false
            description: Where the sandbox's provisioning stands this boot (ADR 26-10-16-423 §6). Every string in it is text the sandbox wrote.
            properties:
                state:
                    description: pending - not started; provisioning - a feature is still being provisioned; ready - every feature is; failed - all are done, and one failed or readiness did.
                    enum:
                        - pending
                        - provisioning
                        - ready
                        - failed
                    type: string
                ready:
                    description: Whether what the sandbox waits for before it launches anything is in place - core, what the harness requires, and every feature's wiring. Features provisioned in the background may still be provisioning.
                    type: boolean
                error:
                    description: Why readiness failed, or why provisioning could not start.
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                features:
                    additionalProperties:
                        $ref: '#/components/schemas/SandboxAgentProvisionFeature'
                    description: Each feature the sandbox provisions, by name. A tool the sandbox's image came with is not one.
                    type: object
            required:
                - state
                - ready
                - updatedAt
                - features
            type: object
        SandboxAgentProvisionFeature:
            additionalProperties: false
            description: One feature's provisioning.
            properties:
                state:
                    description: pending, provisioning, ready, failed, or off - the project turned it off, and it is not to be installed by hand.
                    enum:
                        - pending
                        - provisioning
                        - ready
                        - failed
                        - "off"
                    type: string
                how:
                    description: Where a ready feature came from. installed - this boot installed or wired some of it; adopted - the sandbox's own copy was usable and is wired; snapshot - all of it was already in place.
                    enum:
                        - installed
                        - adopted
                        - snapshot
                    type: string
                version:
                    description: The version the adopted copy reported.
                    type: string
                async:
                    description: Whether the feature is provisioned in the background, after the sandbox is ready.
                    type: boolean
                step:
                    description: The step being applied now.
                    type: string
                log:
                    description: The feature's log inside the sandbox.
                    type: string
                reason:
                    description: Why the feature is off.
                    type: string
                error:
                    description: Why the feature failed.
                    type: string
            required:
                - state
            type: object
        SandboxAgentSourceState:
            additionalProperties: false
            description: One source's convergence onto its target. A materialized source is not by itself ready - the pool still settles the sandbox's spec on it and says so with the document's delivered (ADR 0055).
            properties:
                slug:
                    type: string
                state:
                    description: waiting - nothing to clone yet (no origin, or an origin with no commits); cloning - being materialized now; materialized - cloned, checked out and its workspace restored, once; failed - the last attempt failed, see error, and it is retried.
                    enum:
                        - waiting
                        - cloning
                        - materialized
                        - failed
                    type: string
                commit:
                    description: The commit the source was materialized at, as its materialized marker records it - not where the sandbox has moved it since. Absent for a source a pool materialized, whose marker records none.
                    type: string
                error:
                    description: Why the last attempt failed. Present only when state is failed.
                    type: string
                revision:
                    description: The runtime-config revision this state was reached under.
                    format: int64
                    type: integer
                progress:
                    $ref: '#/components/schemas/SandboxAgentCloneProgress'
                    description: How far the clone has got, as git reports it. Present only while state is cloning and git has said something; a source resuming from a clone already in place fetches with no progress to report.
                updatedAt:
                    format: date-time
                    type: string
            required:
                - slug
                - state
                - revision
                - updatedAt
            type: object
        SandboxAgentCloneProgress:
            additionalProperties: false
            description: |-
                A source's clone as git's progress output reports it, parsed for a status line. Each
                stage counts against its own total, which git knows before the stage starts, so
                objects/objectsTotal is progress toward a fixed target within a stage; bytes carries
                over from receiving into resolving.
            properties:
                stage:
                    $ref: '#/components/schemas/CloneProgressStage'
                objects:
                    description: Objects (deltas, when resolving) done so far in this stage
                    format: int64
                    type: integer
                objectsTotal:
                    description: Objects (deltas, when resolving) this stage has to do, zero while the remote has not said
                    format: int64
                    type: integer
                bytes:
                    description: Bytes received so far, as git counts them
                    format: int64
                    type: integer
            required:
                - stage
            type: object
        CloneProgressStage:
            description: |-
                Where a git clone is. counting - the remote is enumerating, counting and compressing
                what it will send, and nothing has arrived yet; receiving - objects are arriving;
                resolving - every object has arrived and git is resolving deltas.
            enum:
                - counting
                - receiving
                - resolving
            type: string
        SandboxSourceStates:
            additionalProperties: false
            description: Each source's convergence onto its target, as the sandbox reports it.
            properties:
                sources:
                    items:
                        $ref: '#/components/schemas/SandboxAgentSourceState'
                    type: array
            required:
                - sources
            type: object
        SandboxSourceProjectLayer:
            additionalProperties: false
            description: A materialized source's project layer, its settings file in its working tree (.discobox/settings.json, or .discobox/project.json in a repository without one), as the sandbox read it.
            properties:
                slug:
                    type: string
                commit:
                    description: The commit checked out in the source when it was read.
                    type: string
                projectLayer:
                    additionalProperties: true
                    description: The project layer the settings file sets. Absent when the source sets none.
                    type: object
            required:
                - slug
                - commit
            type: object
        SandboxRuntimeConfig:
            additionalProperties: false
            description: The pool's whole view of a running sandbox, delivered as one document with a revision (ADR 0126 §3) - everything about it that can change while it exists. What cannot is the static bootstrap, sandbox.json (ADR 26-10-08-127). Whole rather than incremental - a field that is absent is something the sandbox no longer has. The Go type is sandboxconfig.RuntimeConfig.
            properties:
                revision:
                    description: Orders documents, from 1. A sandbox applies a newer revision than it holds and ignores an older one. A newer document under a revision below 1 is refused as invalid (422) - the sandbox validates it, not the schema, so every invalid document is answered alike.
                    format: int64
                    type: integer
                agent:
                    $ref: '#/components/schemas/SandboxRuntimeConfigAgent'
                secretEnv:
                    additionalProperties:
                        type: string
                    description: The sandbox's secret-bound environment, env name to sentinel. Sentinels only; a resolved value never reaches a sandbox.
                    type: object
                proxy:
                    $ref: '#/components/schemas/SandboxRuntimeConfigProxy'
                    description: Material for the sandbox's hop to its pool. Absent when it has none.
                sources:
                    items:
                        $ref: '#/components/schemas/SandboxRuntimeConfigSource'
                    type: array
            required:
                - revision
                - agent
            type: object
        SandboxRuntimeConfigAgent:
            additionalProperties: false
            description: The sandbox-agent configuration the pool may change while the sandbox exists, applied to the running agent.
            properties:
                idleTimeout:
                    description: The pool's idle timeout as a Go duration. Empty leaves the sandbox on its default. Takes effect when applied.
                    type: string
                controlPlanePower:
                    description: True when the control plane powers the sandbox - it reports idle, sleep and wake rather than powering itself off (ADR 26-10-16-337 §8). Sent only to a sandbox whose status advertised controlPlanePower, because an older agent refuses the whole document over a field it does not know.
                    type: boolean
            type: object
        SandboxRuntimeConfigProxy:
            additionalProperties: false
            description: The credential and trust for the sandbox's hop to its pool. Where the pool is comes from the sandbox's bootstrap and where it listens is its own; the sandbox renders its bridge configs from the three and starts the units that read them.
            properties:
                mtlsCa:
                    description: PEM CA the pool's mTLS endpoints present certificates from.
                    type: string
                mitmCa:
                    description: PEM CA the egress proxy signs intercepted connections with.
                    type: string
                clientCert:
                    description: This sandbox's PEM client certificate.
                    type: string
                clientKey:
                    description: This sandbox's PEM client private key. Required on delivery; never returned, so a document read back omits it.
                    type: string
            required:
                - mtlsCa
                - mitmCa
                - clientCert
            type: object
        SandboxRuntimeConfigSource:
            additionalProperties: false
            description: One of the sandbox's sources as the pool sees it. The sandbox clones each source that has an origin onto its target and reports how far it got on its status (sourceStates); how it is checked out is the create-time placement in sandbox.json (ADR 0126 §4).
            properties:
                slug:
                    type: string
                target:
                    description: The absolute in-sandbox path the source's checkout lives at. Required with originUrl.
                    type: string
                originUrl:
                    description: Where the source's origin is served, when it has one. The sandbox clones from it and keeps it as the checkout's origin remote.
                    type: string
                originToken:
                    description: The bearer token originUrl takes, when it takes one - the pool's sandbox token, scope origin:fetch. The sandbox's git reads it through the agent's credential helper, so it is never written into the checkout.
                    type: string
                commit:
                    description: The commit the source is pinned to.
                    type: string
                delivered:
                    description: The source is in place and the pool has settled the sandbox's spec on it. The sandbox's readiness gate clears once every source is delivered.
                    type: boolean
            required:
                - slug
            type: object
        SandboxMeta:
            additionalProperties: false
            description: A sandbox's name, description and tags, as the file inside it that holds them says. Each is optional, and an absent one is unset.
            properties:
                name:
                    description: What a person or the agent calls the sandbox, on one line. When set it is the sandbox's displayName, in place of the title its harness set. It identifies nothing, and two sandboxes may share one.
                    type: string
                description:
                    description: What the sandbox is for, in the words of whoever wrote it. May run to several lines; a listing shows the first.
                    type: string
                tags:
                    additionalProperties:
                        type: string
                    description: Tags labeling the sandbox, key to value. A tag with an empty value is a plain label.
                    type: object
            type: object
        SandboxAgentMeta:
            additionalProperties: false
            description: A sandbox's meta as its meta file holds it after a write.
            properties:
                meta:
                    $ref: '#/components/schemas/SandboxMeta'
                    description: Everything the file now holds.
                observedAt:
                    description: When the sandbox wrote the file, on the sandbox's own clock - the same clock its status reports are stamped with, so the two can be ordered. Written to the nanosecond, since the control plane records a write only when it is newer than the last, and two writes inside one second would otherwise tie.
                    format: date-time
                    type: string
                    x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
            required:
                - meta
                - observedAt
            type: object
        SecretBinding:
            additionalProperties: false
            description: "A secret made available to a target (ADR 26-10-27-880 §1): existing and unexpired, it is the whole of the permission. Use delivers the credential's sentinel in envVar; delegate lets a discobox the binding covers give the credential to the discoboxes it creates."
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretBinding.json
                    format: uri
                    readOnly: true
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    description: 'Principal that made the binding: a person, or the discobox that handed it on'
                    type: string
                delegate:
                    description: A discobox the binding covers may give the credential, to use, to the discoboxes it creates (ADR 26-10-27-880 §3)
                    type: boolean
                envVar:
                    description: Environment variable the credential's sentinel is delivered in; set when use is
                    type: string
                expiresAt:
                    description: When the binding lapses; absent never
                    format: date-time
                    type: string
                id:
                    description: Stable binding ID
                    type: string
                parentId:
                    description: The delegate binding this one was handed on under, when a discobox gave it; deleting that one deletes this
                    type: string
                projectId:
                    description: Project ID
                    type: string
                requestId:
                    description: The request this binding answered, when one did
                    type: string
                routes:
                    description: Routes that narrow the secret's for this binding; empty inherits the secret's. A request must be allowed by the secret's routes, these, and the parent's (ADR 26-10-27-880 §4).
                    items:
                        $ref: '#/components/schemas/SecretRoute'
                    type: array
                secretId:
                    description: Bound secret ID
                    type: string
                secretName:
                    description: Bound secret's name
                    type: string
                targetId:
                    description: The project, harness config or discobox ID the binding is for
                    type: string
                targetKind:
                    description: 'What the binding is for: every discobox of the project, every discobox on a harness config, or one discobox'
                    enum:
                        - project
                        - harnessConfig
                        - sandbox
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                use:
                    description: 'The target may send the credential: it is delivered in envVar'
                    type: boolean
            required:
                - id
                - projectId
                - secretId
                - targetKind
                - targetId
                - use
                - delegate
                - createdAt
                - updatedAt
            type: object
        SecretBindingEvent:
            additionalProperties: false
            description: One change to a binding, as the append-only history records it (ADR 26-10-27-880 §6).
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretBindingEvent.json
                    format: uri
                    readOnly: true
                    type: string
                actor:
                    description: "Who did it: a person's or a discobox's principal, or system for a cascade or an expiry"
                    type: string
                at:
                    description: When it happened
                    format: date-time
                    type: string
                binding:
                    $ref: '#/components/schemas/SecretBinding'
                    description: The binding after the change; before it, for a delete or an expiry
                bindingId:
                    description: The binding changed
                    type: string
                cause:
                    description: 'Why, when something caused it: the request it answered, or the parent binding whose removal took it'
                    type: string
                event:
                    description: What happened
                    enum:
                        - created
                        - updated
                        - deleted
                        - expired
                    type: string
                id:
                    description: Event ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
            required:
                - id
                - projectId
                - bindingId
                - event
                - actor
                - binding
                - at
            type: object
        SecretRefreshRequest:
            additionalProperties: false
            description: An ask for a new value of a token that went stale or was refused (ADR 26-09-25-122 §4). It is answered by writing a value, never by approving.
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SecretRefreshRequest.json
                    format: uri
                    readOnly: true
                    type: string
                answer:
                    $ref: '#/components/schemas/SecretRefreshAnswer'
                    description: How it was answered, once it was
                cause:
                    description: What opened the request
                    enum:
                        - stale
                        - rejected
                    type: string
                closedAt:
                    description: When it was answered or dismissed
                    format: date-time
                    type: string
                createdAt:
                    description: When it was asked
                    format: date-time
                    type: string
                id:
                    description: Refresh request ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                sandboxId:
                    description: The discobox that most recently needed the value
                    type: string
                secretId:
                    description: The secret a new value is asked for
                    type: string
                secretName:
                    description: Its name
                    type: string
                status:
                    description: Whether it is still asked
                    enum:
                        - pending
                        - answered
                        - dismissed
                    type: string
            required:
                - id
                - projectId
                - secretId
                - cause
                - status
                - createdAt
            type: object
        UpdateSandboxMetaBody:
            additionalProperties: false
            description: A change to a sandbox's meta, applied to the meta file in the sandbox. What the change does not name is left as it is, including what the sandbox wrote itself.
            properties:
                name:
                    description: Replaces the name, with the space around it trimmed and any other kind of space in it made a plain one. An empty string clears it, and the sandbox is listed by its harness's title again; omit it to leave the name alone. A name is one line of printable characters, at most 128 bytes.
                    type: string
                description:
                    description: Replaces the description. An empty string clears it; omit it to leave the description alone.
                    type: string
                setTags:
                    additionalProperties:
                        type: string
                    description: Tags to add or overwrite, key to value. An empty value makes a plain label. A key is printable, has no whitespace, and contains neither = nor ,; a value is one line with no ,.
                    type: object
                removeTags:
                    description: Tag keys to delete. Naming a key the sandbox does not have is not an error. A key may not be both set and removed.
                    items:
                        type: string
                    type: array
            type: object
        SandboxExec:
            additionalProperties: false
            properties:
                observedAt:
                    description: Set only when this was answered from the discobox's last inventory rather than by the discobox, which was not running - when the discobox posted it (ADR 26-10-11-657). Absent from a live answer.
                    format: date-time
                    type: string
                id:
                    description: Sandbox exec runtime ID.
                    type: string
                status:
                    description: |
                        Current observed exec runtime status. installing is a terminal-layer
                        phase: the exec record exists and its hooks/files are still being
                        prepared, before the harness process is launched (starting -> running).
                    enum:
                        - installing
                        - starting
                        - running
                        - exited
                        - failed
                        - lost
                    type: string
                command:
                    description: Command argv executed in the sandbox.
                    items:
                        type: string
                    type: array
                startupCommand:
                    description: |
                        Harness terminal mode only: the command typed into the shell (command
                        above) once it starts, as if the caller had typed it themselves. This is
                        what is actually running in the foreground, and what gives it real job
                        control (Ctrl-Z, fg, bg) — see command for what process is literally
                        executed.
                    items:
                        type: string
                    type: array
                workdir:
                    description: Working directory for the exec process. Defaults to the sandbox's primary source directory. A leading `~` or `~/` is expanded against the run user's home directory inside the sandbox.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Additional environment variables for the exec process.
                    type: object
                user:
                    $ref: '#/components/schemas/SandboxUser'
                    description: User identity used to run the exec process.
                tty:
                    description: Whether the exec process was started with a PTY.
                    type: boolean
                unit:
                    description: Systemd unit or scope name when known.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                exitCode:
                    description: Process exit code when the exec has exited.
                    format: int64
                    type: integer
                error:
                    description: Runtime error detail when the exec failed.
                    type: string
                stopped:
                    description: Whether this run ended because it was asked to stop rather than on its own. It cannot be inferred after the fact - a stopped process and one killed by a signal it did not choose leave the same record - so it is recorded when the stop is requested and cleared by the next run.
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                startedAt:
                    format: date-time
                    type: string
                exitedAt:
                    format: date-time
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: Caller-supplied exec metadata.
                    type: object
                currentHarnessId:
                    description: The sandbox's selected harness used for this terminal's current or next revival. The historical harnessId and creation metadata remain unchanged.
                    type: string
                harnessId:
                    description: Harness this exec runs, when created in harness (terminal) mode.
                    type: string
                primary:
                    description: Whether this is the sandbox's primary harness terminal.
                    type: boolean
            required:
                - id
                - status
                - command
                - workdir
                - tty
                - createdAt
            type: object
        SandboxExecEvent:
            additionalProperties: false
            properties:
                id:
                    type: string
                execId:
                    type: string
                type:
                    type: string
                message:
                    type: string
                details:
                    description: Structured event detail payload.
                createdAt:
                    format: date-time
                    type: string
            required:
                - id
                - type
                - createdAt
            type: object
        SandboxExecEventsResponse:
            additionalProperties: false
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/SandboxExecEvent'
                    type: array
            required:
                - events
            type: object
        SandboxExecLogEntry:
            additionalProperties: false
            properties:
                timestamp:
                    description: Time this exec stream chunk was observed.
                    format: date-time
                    type: string
                stream:
                    description: Exec stream this chunk came from. A TTY exec merges its output at the PTY and reports it all as stdout.
                    enum:
                        - input
                        - stdout
                        - stderr
                    type: string
                data:
                    description: Base64-encoded raw stream bytes.
                    format: byte
                    type: string
            required:
                - timestamp
                - stream
                - data
            type: object
        SandboxExecLogsResponse:
            additionalProperties: false
            properties:
                entries:
                    items:
                        $ref: '#/components/schemas/SandboxExecLogEntry'
                    type: array
            required:
                - entries
            type: object
        SandboxExecsResponse:
            additionalProperties: false
            properties:
                observedAt:
                    description: Set only when this was answered from the discobox's last inventory rather than by the discobox, which was not running - when the discobox posted it (ADR 26-10-11-657). Absent from a live answer.
                    format: date-time
                    type: string
                execs:
                    items:
                        $ref: '#/components/schemas/SandboxExec'
                    type: array
            required:
                - execs
            type: object
        SandboxService:
            additionalProperties: false
            description: A service the sandbox's primary source declares under .discobox/services, together with the state of the exec running it.
            properties:
                observedAt:
                    description: Set only when this was answered from the discobox's last inventory rather than by the discobox, which was not running - when the discobox posted it (ADR 26-10-11-657). Absent from a live answer.
                    format: date-time
                    type: string
                id:
                    description: Stable filename-derived service ID, with any numeric ordering prefix and known extension removed - 10-discobox-api.sh is discobox-api.
                    type: string
                name:
                    description: Display name from the declaration's front matter, defaulted from the filename.
                    type: string
                description:
                    description: What the service is for, from the declaration's front matter.
                    type: string
                path:
                    description: Absolute path to the declaring script inside the sandbox.
                    type: string
                fileName:
                    description: The declaring file's own name. It orders the listing, which is what the numeric prefix stripped from the ID is for.
                    type: string
                ports:
                    description: Ports the declaration says this service serves, in the order it names them - TCP ports, or UDP ones when the declaration states the udp protocol. A declared port is reported and forwarded whether or not anything observable is listening on it - it exists for the ports discovery cannot find, published by a nested container or bound by a socket-activated unit, since discovery only sees sockets the sandbox user owns.
                    items:
                        format: int64
                        type: integer
                    type: array
                problem:
                    description: Why this declaration cannot run - a missing shebang, a missing executable bit, a duplicate ID. A service with a problem is listed rather than dropped, because one that silently fails to appear is indistinguishable from one nobody declared.
                    type: string
                status:
                    description: |
                        Service state, derived from the exec running it. stopped covers both a
                        service that has never run and one stopped on request; exited is a
                        process that ended by itself successfully. Nothing is restarted
                        automatically.
                    enum:
                        - stopped
                        - starting
                        - running
                        - exited
                        - failed
                    type: string
                execId:
                    description: Exec running this service, absent when none ever has. It is durable across restarts, so a client keyed on it keeps its place when the service is restarted.
                    type: string
                pid:
                    description: Sandbox-local process ID when known.
                    format: int64
                    type: integer
                exitCode:
                    description: Exit code of the last run when it has ended.
                    format: int64
                    type: integer
                startedAt:
                    format: date-time
                    type: string
                exitedAt:
                    format: date-time
                    type: string
                error:
                    description: Why the last run failed, when it did.
                    type: string
            required:
                - id
                - name
                - status
            type: object
        SandboxServicesResponse:
            additionalProperties: false
            properties:
                observedAt:
                    description: Set only when this was answered from the discobox's last inventory rather than by the discobox, which was not running - when the discobox posted it (ADR 26-10-11-657). Absent from a live answer.
                    format: date-time
                    type: string
                services:
                    items:
                        $ref: '#/components/schemas/SandboxService'
                    type: array
            required:
                - services
            type: object
        SandboxTool:
            additionalProperties: false
            description: A tool declared by the sandbox's image under /usr/local/share/discobox/tools or by its primary source under .discobox/tools. The client merges these with the tools it declares itself and runs the result; the sandbox only lists them.
            properties:
                id:
                    description: Stable filename-derived tool ID, with any numeric ordering prefix and known extension removed - 20-fresh.yaml is fresh - unless the declaration states one.
                    type: string
                name:
                    description: Display name from the declaration, defaulted from the filename.
                    type: string
                description:
                    description: What the tool is for.
                    type: string
                key:
                    description: The single key the tool asks to answer to in a picker.
                    type: string
                runs:
                    description: Where the tool runs. A host tool declared by a sandbox is always listed with a problem, because only the client's own layers may put a program on the client's machine.
                    enum:
                        - sandbox
                        - host
                    type: string
                layer:
                    description: Which of the sandbox's directories declared it.
                    enum:
                        - image
                        - source
                    type: string
                fileName:
                    description: The declaring file's own name, which orders the listing.
                    type: string
                path:
                    description: Absolute path to the declaring file inside the sandbox. For a script tool it is what runs.
                    type: string
                script:
                    description: True when the declaring file is a script and is itself what runs; false for a .yaml declaration, which runs program.
                    type: boolean
                program:
                    description: The program a .yaml declaration runs.
                    items:
                        type: string
                    type: array
                args:
                    description: Arguments that follow the program or the script.
                    items:
                        type: string
                    type: array
                env:
                    description: Environment added to the tool's, in NAME=value form.
                    items:
                        type: string
                    type: array
                files:
                    description: Files the tool carries into the sandbox, each copied under the run user's home only where nothing is there already.
                    items:
                        $ref: '#/components/schemas/SandboxToolFile'
                    type: array
                problem:
                    description: Why this declaration cannot run. A tool with a problem is listed rather than dropped.
                    type: string
            required:
                - id
                - name
                - runs
                - layer
                - fileName
                - script
            type: object
        SandboxToolFile:
            additionalProperties: false
            description: One file a tool carries into the sandbox.
            properties:
                name:
                    description: The file's name, and the name of its local copy on the client.
                    type: string
                home:
                    description: Where it lands, relative to the run user's home.
                    type: string
                default:
                    description: What the client's local copy starts as, from the file of this name beside the declaration.
                    type: string
            required:

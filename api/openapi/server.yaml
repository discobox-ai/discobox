                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxAgentInventory'
                    description: The sandbox's inventory.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Error response.

                    description: Agent config definition ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentConfigDefinition'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get an agent config definition
            tags:
                - Agent Configs
    /api/workers/register:
        post:
            operationId: register-worker
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterWorkerBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterWorkerResponseBody'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Register a bootstrapped worker
            tags:
                - Workers
    /api/workers/{workerId}/status:
        post:
            operationId: update-worker-status
            parameters:
                - description: Worker ID
                  in: path
                  name: workerId
                  required: true
                  schema:
                    description: Worker ID
                    type: string
                - description: Bearer worker assertion signed with the registered worker private key
                  in: header
                  name: Authorization
                  schema:
                    description: Bearer worker assertion signed with the registered worker private key
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWorkerStatusBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Worker'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Update worker status
            tags:
                - Workers
    /projects:
        get:
            operationId: list-projects
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListProjectsBody'
                    description: OK
                default:
                    content:

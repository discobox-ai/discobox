                    description: Environment variable name to sentinel placeholder. Inject these into the exec/terminal environment; the proxy swaps them for real values on egress.
                    type: object
            required:
                - secrets
            type: object
        ApproveSecretRequestBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ApproveSecretRequestBody.json
                    format: uri
                    readOnly: true
                    type: string
                grantTTLSeconds:
                    description: Grant duration in seconds; overrides the secret's default
                    format: int64
                    type: integer
                scope:
                    description: How widely the minted grant applies. Defaults to sandbox for sandbox-originated requests, otherwise project.
                    enum:
                        - sandbox

                blocked:
                    description: True when the proxy refused the request itself and never sent it -- by its destination policy, by a credential's routes, at the discobox API's gate, or because the control plane could not resolve a credential it carries. blockedReason says which, and why.
                    type: boolean
                blockedReason:
                    description: Why the request was refused. It starts with what refused it -- "host denied" for the destination policy, "route:" for a credential whose routes do not allow the request, "gate:" for the discobox API's gate, "credential unavailable:" for a credential the control plane could not resolve, "gateway:" for a gateway that could not set its headers -- then the reason.
                    type: string
                cacheError:
                    description: Why the response cache could not be used
                    type: string
                cacheHit:
                    description: True when the response came from the pool's response cache
                    type: boolean
                cacheKey:
                    description: Key the response cache stored or looked up under
                    type: string
                cacheStored:
                    description: True when the response was written to the cache
                    type: boolean
                createdAt:
                    description: When the exchange happened, stamped as it ended
                    format: date-time
                    type: string
                durationMillis:
                    description: How long the exchange took, in milliseconds
                    format: int64
                    type: integer
                enqueuedAt:
                    description: When the recorder queued the row; its distance from createdAt is the recorder's lag
                    format: date-time
                    type: string
                host:
                    description: Destination host
                    type: string
                id:
                    description: Audit record ID, written http_<row>, unique within its pool and ordered by write
                    pattern: ^http_[0-9]+$
                    type: string
                method:
                    description: HTTP method
                    type: string
                poolId:
                    description: Pool whose proxy recorded the exchange
                    type: string
                requestBodyBytes:
                    description: Size of the recorded request body
                    format: int64
                    type: integer
                requestBodyError:
                    description: Why the request body was not recorded in full
                    type: string
                requestBodyFormat:
                    description: How the request body was spooled
                    type: string
                requestBodyRecorded:
                    description: True when a request body was spooled and can be read through the recording route
                    type: boolean
                requestHeaders:

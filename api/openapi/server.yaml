                - description: Provider instance ID
                  in: path
                  name: providerId
                  required: true
                  schema:
                    description: Provider instance ID
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateSandboxProviderInstanceBody'
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SandboxProviderInstance'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'

                - description: Project ID
                  in: path
                  name: projectId
                  required: true
                  schema:
                    default: default
                    description: Project ID
                    type: string
                - description: Sandbox ID
                  in: path
                  name: sandboxId
                  required: true
                  schema:
                    description: Sandbox ID
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Sandbox'
                    description: Repaired and starting
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Repair a sandbox
            tags:
                - Sandboxes

        SecretValue:
            additionalProperties: false
            description: A credential value. One opaque string, plus what an OAuth credential needs to be refreshed. Write-only -- no response ever carries it.
            properties:
                accessTokenExpiresAt:
                    description: When the access token goes stale, unix milliseconds. 0 or absent means unknown, and the credential is then refreshed only when an upstream rejects it.

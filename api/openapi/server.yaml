components:
    schemas:
        AgentConfig:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AgentConfig.json
                    format: uri
                    readOnly: true
                    type: string
                capabilities:
                    description: Agent capabilities or feature metadata
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                id:
                    description: Stable agent config ID
                    type: string
                installCommand:
                    description: Command used to install the agent
                    type: string
                name:
                    description: Agent config name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                runCommand:
                    description: Command used to run the agent
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - runCommand
                - createdAt
                - updatedAt
            type: object
        AgentConfigDefinition:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/AgentConfigDefinition.json
                    format: uri
                    readOnly: true
                    type: string
                capabilities:
                    description: Agent capabilities or feature metadata
                description:
                    description: Agent config definition description
                    type: string
                id:
                    description: Stable definition ID
                    type: string
                installCommand:
                    description: Command used to install the agent
                    type: string
                name:
                    description: Agent config definition name
                    maxLength: 200
                    type: string
                runCommand:
                    description: Command used to run the agent
                    type: string
            required:
                - id
                - name
                - runCommand
            type: object
        CompleteEvent:
            additionalProperties: false
            properties:
                sandboxId:
                    type: string
                stream:
                    type: string
            required:
                - stream
            type: object
        ConnectedEvent:
            additionalProperties: false
            properties:
                projectId:
                    type: string
            required:
                - projectId
            type: object
        CreateAgentConfigBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateAgentConfigBody.json
                    format: uri
                    readOnly: true
                    type: string
                capabilities:
                    description: Agent capabilities or feature metadata
                definitionId:
                    description: Agent config definition ID to use as defaults
                    type: string
                installCommand:
                    description: Command used to install the agent
                    type: string
                name:
                    description: Agent config name. Defaults to the definition name when definitionId is provided.
                    maxLength: 200
                    type: string
                runCommand:
                    description: Command used to run the agent. Defaults to the definition run command when definitionId is provided.
                    type: string
            type: object
        CreateSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigId:
                    description: Agent config ID
                    type: string
                agentModel:
                    description: Model the agent should use
                    type: string
                agentModelReasoningLevel:
                    description: Model reasoning level the agent should use
                    type: string
                agentModelServiceTier:
                    description: Model service tier the agent should use
                    type: string
                agentName:
                    description: Agent config name to resolve at create time
                    type: string
                cpuVcpus:
                    description: Requested CPU capacity in vCPUs
                    format: double
                    type: number
                description:
                    description: Sandbox description
                    type: string
                memoryBytes:
                    description: Requested memory capacity in bytes
                    format: int64
                    type: integer
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
                prompt:
                    description: Prompt the agent should run
                    type: string
                providerInstanceId:
                    description: Sandbox provider instance ID
                    type: string
                runtimeState:
                    description: Initial non-secret provider runtime state
                sourceCodeReferences:
                    additionalProperties:
                        $ref: '#/components/schemas/GitSourceReference'
                    description: Map of sandbox directories to additional source code Git references
                    type: object
                sourceDirectory:
                    description: Directory where the main source should be placed inside the sandbox
                    type: string
                sourceRef:
                    description: Git source branch, tag, or commit
                    type: string
                sourceRefType:
                    description: Git source ref type, such as branch, tag, or commit
                    type: string
                sourceUrl:
                    description: Git source URL
                    format: uri
                    type: string
                storageBytes:
                    description: Requested storage capacity in bytes
                    format: int64
                    type: integer
                userGid:
                    description: GID to use inside the sandbox
                    format: int64
                    type: integer
                userUid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
                workingDirectory:
                    description: Working directory inside the sandbox
                    type: string
            required:
                - name
            type: object
        CreateSandboxProviderInstanceBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/CreateSandboxProviderInstanceBody.json
                    format: uri
                    readOnly: true
                    type: string
                config:
                    description: Non-secret provider configuration
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                type:
                    description: Provider type
                    type: string
            required:
                - type
                - name
            type: object
        ErrorDetail:
            additionalProperties: false
            properties:
                location:
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                    type: string
                message:
                    description: Error message text
                    type: string
                value:
                    description: The value at the given location
            type: object
        ErrorModel:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ErrorModel.json
                    format: uri
                    readOnly: true
                    type: string
                detail:
                    description: A human-readable explanation specific to this occurrence of the problem.
                    example: Property foo is required but is missing.
                    type: string
                errors:
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    nullable: true
                    type: array
                instance:
                    description: A URI reference that identifies the specific occurrence of the problem.
                    example: https://example.com/error-log/abc123
                    format: uri
                    type: string
                status:
                    description: HTTP status code
                    example: 400
                    format: int64
                    type: integer
                title:
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    example: Bad Request
                    type: string
                type:
                    default: about:blank
                    description: A URI reference to human-readable documentation for the error.
                    example: https://example.com/errors/example
                    format: uri
                    type: string
            type: object
        GitSourceReference:
            additionalProperties: false
            properties:
                directory:
                    description: Directory where this source should be placed inside the sandbox
                    type: string
                ref:
                    description: Git source branch, tag, or commit
                    type: string
                refType:
                    description: Git source ref type, such as branch, tag, or commit
                    type: string
                url:
                    description: Git source URL
                    format: uri
                    type: string
            required:
                - url
                - directory
            type: object
        ListAgentConfigDefinitionsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListAgentConfigDefinitionsBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigDefinitions:
                    description: Agent config definitions
                    items:
                        $ref: '#/components/schemas/AgentConfigDefinition'
                    nullable: true
                    type: array
            required:
                - agentConfigDefinitions
            type: object
        ListAgentConfigsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListAgentConfigsBody.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    description: Agent configs
                    items:
                        $ref: '#/components/schemas/AgentConfig'
                    nullable: true
                    type: array
            required:
                - agentConfigs
            type: object
        ListProjectsBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListProjectsBody.json
                    format: uri
                    readOnly: true
                    type: string
                projects:
                    description: Projects
                    items:
                        $ref: '#/components/schemas/Project'
                    nullable: true
                    type: array
            required:
                - projects
            type: object
        ListSandboxProviderCatalogBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderCatalogBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider catalog items
                    items:
                        $ref: '#/components/schemas/SandboxProviderCatalogItem'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxProviderInstancesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxProviderInstancesBody.json
                    format: uri
                    readOnly: true
                    type: string
                providers:
                    description: Provider instances
                    items:
                        $ref: '#/components/schemas/SandboxProviderInstance'
                    nullable: true
                    type: array
            required:
                - providers
            type: object
        ListSandboxesBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListSandboxesBody.json
                    format: uri
                    readOnly: true
                    type: string
                sandboxes:
                    description: Sandboxes
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
            required:
                - sandboxes
            type: object
        ListWorkersBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/ListWorkersBody.json
                    format: uri
                    readOnly: true
                    type: string
                workers:
                    description: Workers
                    items:
                        $ref: '#/components/schemas/Worker'
                    nullable: true
                    type: array
            required:
                - workers
            type: object
        Job:
            additionalProperties: false
            properties:
                id:
                    description: Stable job ID
                    type: string
                type:
                    description: Job executor type
                    type: string
                status:
                    description: Persisted job lifecycle state
                    enum:
                        - pending
                        - backoff
                        - running
                        - completed
                        - failed
                        - canceled
                    type: string
                attempts:
                    description: Number of execution attempts
                    type: integer
                maxAttempts:
                    description: Maximum execution attempts before failure
                    type: integer
                error:
                    description: Latest execution or dispatch error
                    type: string
                workerId:
                    description: Dispatcher worker that claimed the current or last attempt
                    type: string
                resourceType:
                    description: Resource type this job acts on
                    type: string
                resourceId:
                    description: Resource ID this job acts on
                    type: string
                scheduledAt:
                    description: Earliest time the job may run
                    format: date-time
                    type: string
                startedAt:
                    description: Time the current or last attempt started
                    format: date-time
                    type: string
                completedAt:
                    description: Time the job reached a terminal state
                    format: date-time
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - type
                - status
                - attempts
                - maxAttempts
                - resourceType
                - resourceId
                - scheduledAt
                - createdAt
                - updatedAt
            type: object
        ListJobsBody:
            additionalProperties: false
            properties:
                jobs:
                    items:
                        $ref: '#/components/schemas/Job'
                    type: array
            required:
                - jobs
            type: object
        Project:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Project.json
                    format: uri
                    readOnly: true
                    type: string
                agentConfigs:
                    description: Agent configurations
                    items:
                        $ref: '#/components/schemas/AgentConfig'
                    nullable: true
                    type: array
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                default:
                    description: Whether this is the user's default project
                    type: boolean
                defaultSandboxProviderId:
                    description: Default sandbox provider instance ID
                    type: string
                id:
                    description: Stable project ID
                    type: string
                members:
                    description: Project members
                    items:
                        $ref: '#/components/schemas/ProjectMember'
                    nullable: true
                    type: array
                name:
                    description: Project display name
                    maxLength: 200
                    type: string
                owner:
                    $ref: '#/components/schemas/User'
                    description: Project owner
                ownerUserId:
                    description: Owning user ID
                    type: string
                sandboxProviderInstances:
                    description: Sandbox provider instances
                    items:
                        $ref: '#/components/schemas/SandboxProviderInstance'
                    nullable: true
                    type: array
                sandboxes:
                    description: Project sandboxes
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
                slug:
                    description: URL-safe project slug
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
            required:
                - id
                - ownerUserId
                - name
                - slug
                - default
                - createdAt
                - updatedAt
            type: object
        ProjectMember:
            additionalProperties: false
            properties:
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                projectId:
                    description: Project ID
                    type: string
                role:
                    description: Project role
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                userId:
                    description: User ID
                    type: string
            required:
                - projectId
                - userId
                - role
                - createdAt
                - updatedAt
            type: object
        ProviderConfigField:
            additionalProperties: false
            properties:
                advanced:
                    type: boolean
                credentialAuthType:
                    type: string
                credentialProvider:
                    type: string
                description:
                    type: string
                key:
                    type: string
                label:
                    type: string
                placeholder:
                    type: string
                required:
                    type: boolean
                type:
                    type: string
            required:
                - key
                - label
                - type
            type: object
        ProviderStatus:
            additionalProperties: false
            properties:
                available:
                    type: boolean
                details: {}
                message:
                    type: string
                state:
                    type: string
                supportsClearCache:
                    type: boolean
                supportsImages:
                    type: boolean
                supportsInspection:
                    type: boolean
                supportsResources:
                    type: boolean
            required:
                - available
                - state
                - supportsResources
                - supportsInspection
                - supportsClearCache
                - supportsImages
            type: object
        RegisterWorkerBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/RegisterWorkerBody.json
                    format: uri
                    readOnly: true
                    type: string
                bootstrapToken:
                    type: string
                keyType:
                    type: string
                projectId:
                    type: string
                publicKey:
                    type: string
                sandboxId:
                    type: string
            required:
                - projectId
                - sandboxId
                - bootstrapToken
                - publicKey
            type: object
        RegisterWorkerResponseBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/RegisterWorkerResponseBody.json
                    format: uri
                    readOnly: true
                    type: string
                authToken:
                    type: string
            required:
                - authToken
            type: object
        ResourceChangedEvent:
            additionalProperties: false
            properties:
                action:
                    description: Change action
                    enum:
                        - created
                        - updated
                        - deleted
                        - listed
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                data:
                    description: Event payload
                id:
                    description: Event record ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                resourceId:
                    description: Changed resource ID
                    type: string
                resourceType:
                    description: Changed resource type
                    type: string
                seq:
                    description: Global event sequence
                    format: int64
                    minimum: 0
                    type: integer
                type:
                    description: Event type
                    type: string
            required:
                - id
                - seq
                - projectId
                - type
                - resourceType
                - resourceId
                - action
                - data
                - createdAt
            type: object
        ResourceListFinishEvent:
            additionalProperties: false
            properties:
                finishedAt:
                    format: date-time
                    type: string
                projectId:
                    type: string
                resources:
                    items:
                        type: string
                    nullable: true
                    type: array
                seq:
                    format: int64
                    type: integer
            required:
                - projectId
                - resources
                - seq
                - finishedAt
            type: object
        ResourceListStartEvent:
            additionalProperties: false
            properties:
                projectId:
                    type: string
                resources:
                    items:
                        type: string
                    nullable: true
                    type: array
                seq:
                    format: int64
                    type: integer
                startedAt:
                    format: date-time
                    type: string
            required:
                - projectId
                - resources
                - seq
                - startedAt
            type: object
        ResourceListedEvent:
            additionalProperties: false
            properties:
                action:
                    description: Change action
                    enum:
                        - created
                        - updated
                        - deleted
                        - listed
                    type: string
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                data:
                    description: Event payload
                id:
                    description: Event record ID
                    type: string
                projectId:
                    description: Project ID
                    type: string
                resourceId:
                    description: Changed resource ID
                    type: string
                resourceType:
                    description: Changed resource type
                    type: string
                seq:
                    description: Global event sequence
                    format: int64
                    minimum: 0
                    type: integer
                type:
                    description: Event type
                    type: string
            required:
                - id
                - seq
                - projectId
                - type
                - resourceType
                - resourceId
                - action
                - data
                - createdAt
            type: object
        RestartSandboxBody:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/RestartSandboxBody.json
                    format: uri
                    readOnly: true
                    type: string
                force:
                    description: Force restart if the provider supports it
                    type: boolean
            type: object
        Sandbox:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/Sandbox.json
                    format: uri
                    readOnly: true
                    type: string
                activeOperation:
                    description: Current queued or running operation
                    enum:
                        - create
                        - start
                        - stop
                        - restart
                        - delete
                    type: string
                agentConfig:
                    $ref: '#/components/schemas/AgentConfig'
                    description: Agent config
                agentConfigId:
                    description: Agent config ID
                    type: string
                agentModel:
                    description: Model the agent should use
                    type: string
                agentModelReasoningLevel:
                    description: Model reasoning level the agent should use
                    type: string
                agentModelServiceTier:
                    description: Model service tier the agent should use
                    type: string
                cpuVcpus:
                    description: Requested CPU capacity in vCPUs
                    format: double
                    type: number
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/User'
                    description: Creating user
                createdByUserId:
                    description: Creating user ID
                    type: string
                description:
                    description: Sandbox description
                    type: string
                desiredState:
                    description: Requested steady state for reconciliation
                    enum:
                        - running
                        - stopped
                        - deleted
                    type: string
                errorMessage:
                    description: Latest error message
                    type: string
                generation:
                    description: Latest desired-state generation
                    format: int64
                    type: integer
                id:
                    description: Stable sandbox ID
                    type: string
                lastActiveAt:
                    description: Last observed activity timestamp
                    format: date-time
                    type: string
                lastJobId:
                    description: Most recent lifecycle job ID
                    type: string
                lastOperationStatus:
                    description: Status of the most recent operation
                    enum:
                        - pending
                        - running
                        - success
                        - failed
                    type: string
                memoryBytes:
                    description: Requested memory capacity in bytes
                    format: int64
                    type: integer
                name:
                    description: Sandbox name
                    maxLength: 200
                    type: string
                observedGeneration:
                    description: Latest generation fully observed by reconciliation
                    format: int64
                    type: integer
                phase:
                    description: Observed lifecycle phase
                    enum:
                        - pending
                        - provisioning
                        - starting
                        - running
                        - stopping
                        - stopped
                        - deleting
                        - deleted
                        - failed
                    type: string
                projectId:
                    description: Project ID
                    type: string
                prompt:
                    description: Prompt the agent should run
                    type: string
                providerInstance:
                    $ref: '#/components/schemas/SandboxProviderInstance'
                    description: Sandbox provider instance
                providerInstanceId:
                    description: Sandbox provider instance ID
                    type: string
                restartGeneration:
                    description: Requested restart generation
                    format: int64
                    type: integer
                restartedGeneration:
                    description: Last restart generation completed by reconciliation
                    format: int64
                    type: integer
                runtimeState:
                    description: Non-secret provider runtime state
                sourceCodeReferences:
                    additionalProperties:
                        $ref: '#/components/schemas/GitSourceReference'
                    description: Map of sandbox directories to additional source code Git references
                    type: object
                sourceDirectory:
                    description: Directory where the main source should be placed inside the sandbox
                    type: string
                sourceRef:
                    description: Git source branch, tag, or commit
                    type: string
                sourceRefType:
                    description: Git source ref type, such as branch, tag, or commit
                    type: string
                sourceUrl:
                    description: Git source URL
                    format: uri
                    type: string
                statusMessage:
                    description: Human-readable status detail
                    type: string
                storageBytes:
                    description: Requested storage capacity in bytes
                    format: int64
                    type: integer
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                userGid:
                    description: GID to use inside the sandbox
                    format: int64
                    type: integer
                userUid:
                    description: UID to use inside the sandbox
                    format: int64
                    type: integer
                workerId:
                    description: Assigned worker ID, when scheduled through a worker-backed provider
                    type: string
                workingDirectory:
                    description: Working directory inside the sandbox
                    type: string
            required:
                - id
                - projectId
                - createdByUserId
                - name
                - restartGeneration
                - restartedGeneration
                - cpuVcpus
                - memoryBytes
                - storageBytes
                - createdAt
                - updatedAt
                - desiredState
                - phase
                - lastOperationStatus
                - generation
                - observedGeneration
            type: object
        SandboxProviderCatalogItem:
            additionalProperties: false
            properties:
                available:
                    description: Whether provider is available
                    type: boolean
                builtIn:
                    description: Whether provider is built in
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/ProviderStatus'
                    description: Provider capabilities/status
                configFields:
                    description: Provider config fields
                    items:
                        $ref: '#/components/schemas/ProviderConfigField'
                    nullable: true
                    type: array
                description:
                    description: Provider description
                    type: string
                icon:
                    description: Provider icon
                    type: string
                id:
                    description: Provider type ID
                    type: string
                name:
                    description: Provider display name
                    type: string
            required:
                - id
                - name
                - available
                - builtIn
                - capabilities
            type: object
        SandboxProviderInstance:
            additionalProperties: false
            properties:
                $schema:
                    description: A URL to the JSON Schema for this object.
                    example: https://example.com/schemas/SandboxProviderInstance.json
                    format: uri
                    readOnly: true
                    type: string
                builtIn:
                    description: Whether this provider is built in
                    type: boolean
                config:
                    description: Non-secret provider configuration
                createdAt:
                    description: Creation timestamp
                    format: date-time
                    type: string
                disabled:
                    description: Whether this provider is disabled
                    type: boolean
                id:
                    description: Stable provider instance ID
                    type: string
                name:
                    description: Provider display name
                    maxLength: 200
                    type: string
                projectId:
                    description: Project ID
                    type: string
                sandboxes:
                    description: Sandboxes using this provider
                    items:
                        $ref: '#/components/schemas/Sandbox'
                    nullable: true
                    type: array
                status:
                    $ref: '#/components/schemas/SandboxProviderInstanceStatus'
                    description: Observed provider status derived from persisted worker state
                type:
                    description: Provider type
                    type: string
                updatedAt:
                    description: Last update timestamp
                    format: date-time
                    type: string
                workers:
                    description: Workers using this provider
                    items:
                        $ref: '#/components/schemas/Worker'
                    nullable: true
                    type: array
            required:
                - id

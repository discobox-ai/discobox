                            schema:
                                $ref: '#/components/schemas/AgentConfig'
                    description: OK
                default:
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
                    description: Error
            summary: Get an agent config
            tags:

                harnessConfigId:
                    description: Harness config ID
                    type: string
                harnessMode:
                    description: 'What the sandbox exists for: run works in it, and config runs the image-owned interactive configuration command once.'
                    enum:
                        - run
                        - config
                    type: string
                model:
                    description: Model the harness should use
                    type: string
                modelReasoningLevel:
                    description: Model reasoning level the harness should use
                    type: string
                modelServiceTier:
                    description: Model service tier the harness should use
                    type: string
                description:
                    description: The sandbox's first description. It seeds the meta file inside the sandbox, which holds the description from then on; read the current one from the sandbox's meta.
                    type: string
                env:
                    additionalProperties:
                        type: string
                    description: Environment variables available to sandbox-harness terminals and execs by default.
                    type: object
                git:
                    $ref: '#/components/schemas/SandboxGitIdentity'
                    description: Git authorship identity to seed the sandbox user's ~/.gitconfig with
                skills:
                    additionalProperties:
                        $ref: '#/components/schemas/SandboxSkill'
